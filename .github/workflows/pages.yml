# Publishes the game on GitHub Pages and generates assets.json (the offline-package list) on every push.
# Setup once: Settings > Pages > Build and deployment > Source: "GitHub Actions".
name: Deploy site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Assemble the site
        run: |
          mkdir _site
          for f in index.html sw.js manifest.webmanifest favicon.ico icons ui fonts abilities illustrations comics sounds docs; do
            [ -e "$f" ] && cp -r "$f" _site/ || true
          done
          node tools/make-manifest.mjs _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
