  dbgEl("dbgIcon").hidden = false; dbgEl("dbgIcon").addEventListener("click", () => { if (debugMode) dbgSetMode(false); });

  /* ---- micro-boutons ---- */
  function dbgForceEnd(winner) {
    if (!state || state.winner) return;
    pendingTarget = null;
    state.players[opponentOf(winner)].hp = 0;
    endGame(winner);
  }
  function dbgReshuffleHand() {
    if (!state || state.winner || pendingTarget) return;
    const p = state.players.player;
    p.deck = shuffle(p.deck.concat(p.hand));
    p.hand = [];
    drawUpTo(p, handCapOf(p));
    state.ui.selectedHandIndex = null;
    saveGame(); render();
  }
  dbgEl("dbgWin").addEventListener("click", () => dbgForceEnd("player"));
  dbgEl("dbgLose").addEventListener("click", () => dbgForceEnd("ai"));
  dbgEl("dbgShuffle").addEventListener("click", dbgReshuffleHand);

  /* ---- appui long sur une carte ---- */
  const DBG_LONGPRESS_MS = 550, DBG_MOVE_TOL = 10;
  let dbgPress = null, dbgSwallowClick = false;
  function dbgTargetFromEvent(e) {
    const el = e.target;
    if (!el || !el.closest) return null;
    const cell = el.closest(".cell[data-owner]");
    if (cell) {
      const owner = cell.dataset.owner, index = Number(cell.dataset.index);
      const c = state.players[owner].grid[index];
      return c && !c.ruin ? { kind: "cell", owner, index } : null;
    }
    const hc = el.closest(".hand-card");
    if (hc) {
      const index = Array.prototype.indexOf.call(hc.parentElement.children, hc);
      return state.players.player.hand[index] ? { kind: "hand", owner: "player", index } : null;
    }
    return null;
  }
  function dbgCancelPress() { if (dbgPress) { clearTimeout(dbgPress.timer); dbgPress = null; } }
  document.addEventListener("pointerdown", (e) => {
    if (!debugMode || !state) return;
    if (e.target.closest && e.target.closest("#dbgMenu, #dbgSwapOverlay, #dbgEdOverlay")) return;
    dbgCloseMenu();
    if (e.pointerType === "mouse" && e.button !== 0) return;
    if (pendingTarget || state.winner || state.active !== "player") return;
    const target = dbgTargetFromEvent(e);
    if (!target) return;
    dbgPress = { target, x: e.clientX, y: e.clientY, timer: setTimeout(dbgFireLongPress, DBG_LONGPRESS_MS) };
  }, true);
  document.addEventListener("pointermove", (e) => {
    if (dbgPress && Math.hypot(e.clientX - dbgPress.x, e.clientY - dbgPress.y) > DBG_MOVE_TOL) dbgCancelPress();
  }, true);
  ["pointerup", "pointercancel"].forEach((ev) => document.addEventListener(ev, () => {
    dbgCancelPress();
    if (dbgSwallowClick) setTimeout(() => { dbgSwallowClick = false; }, 600);
  }, true));
  // Le clic qui suit un appui long ne doit ni sélectionner la carte ni cibler la case.
  document.addEventListener("click", (e) => {
    if (!dbgSwallowClick) return;
    dbgSwallowClick = false;
    e.stopImmediatePropagation(); e.preventDefault();
  }, true);
  document.addEventListener("contextmenu", (e) => {
    if (debugMode && e.target.closest && (e.target.closest(".cell") || e.target.closest(".hand-card"))) e.preventDefault();
  });
  function dbgFireLongPress() {
    if (!dbgPress) return;
    const { target, x, y } = dbgPress;
    dbgPress = null;
    endDrag(); hideDetail();         // abandonne un éventuel glisser de la main + masque le panneau d'inspection
    dbgSwallowClick = true;
    dbgOpenMenu(target, x, y);
  }

  /* ---- mini menu (icônes seules) ---- */
  const DBG_ACTIONS = [
    { id: "destroy", icon: "💥", titleKey: "dbgActDestroy" },
    { id: "deck",    icon: "↩️", titleKey: "dbgActDeck" },
    { id: "links",   icon: "🔗", titleKey: "dbgActLinks" },
    { id: "atk3",    icon: "⚔️", titleKey: "dbgActAtk3" },
    { id: "shield3", icon: "🛡️", titleKey: "dbgActShield3" },
    { id: "revive3", icon: "♻️", titleKey: "dbgActRevive3" },
    { id: "swap",    icon: "🔄", titleKey: "dbgActSwap" },
  ];
  function dbgCard(tg) { return tg.kind === "cell" ? state.players[tg.owner].grid[tg.index] : state.players.player.hand[tg.index]; }
  function dbgOpenMenu(target, x, y) {
    dbg.menuTarget = target;
    const m = dbgEl("dbgMenu");
    m.innerHTML = DBG_ACTIONS.map((a) => `<button data-act="${a.id}" title="${esc(t(a.titleKey))}" aria-label="${esc(t(a.titleKey))}">${a.icon}</button>`).join("");
    m.hidden = false;
    const r = m.getBoundingClientRect();
    m.style.left = Math.min(Math.max(8, x - r.width / 2), window.innerWidth - r.width - 8) + "px";
    m.style.top = Math.min(Math.max(8, y - r.height - 18), window.innerHeight - r.height - 8) + "px";
  }
  function dbgCloseMenu() { const m = dbgEl("dbgMenu"); if (m) m.hidden = true; dbg.menuTarget = null; }
  dbgEl("dbgMenu").addEventListener("click", (e) => {
    const b = e.target.closest("button[data-act]");
    if (b) dbgRun(b.dataset.act);
  });
  function dbgRun(act) {
    const tg = dbg.menuTarget;
    const card = tg && dbgCard(tg);
    if (!card) { dbgCloseMenu(); return; }
    const p = state.players[tg.owner];
    const take = () => { if (tg.kind === "cell") p.grid[tg.index] = null; else p.hand.splice(tg.index, 1); };
    const setSymbols = (k) => { card.symbols = { atk: 0, shield: 0, revive: 0, neutral: 0, [k]: 3 }; };
    switch (act) {
      case "destroy": take(); p.graveyard.push(card.templateId); break;
      case "deck": {
        take();
        card.disabled = false;
        const tpl = templateOf(card);
        if (tpl && card.charges != null) card.charges = tpl.charges;
        p.deck.push(card);            // dessus de pioche
        break;
      }
      case "links": card.dirs = DIRS.slice(); break;
      case "atk3": setSymbols("atk"); break;
      case "shield3": setSymbols("shield"); break;
      case "revive3": setSymbols("revive"); break;
      case "swap": dbg.swapTarget = tg; dbgCloseMenu(); dbgOpenSwap(); return;
    }
    dbgCloseMenu();
    state.ui.selectedHandIndex = null;
    saveGame(); render();
  }

  /* ---- grand panneau de swap : tous les templates, non instanciés ---- */
  function dbgPseudoInstance(tpl) {
    return {
      templateId: tpl.id, dirs: [], symbols: { ...tpl.symbols }, trigger: tpl.trigger,
      effect: { ...tpl.effect }, target: { ...tpl.target }, disabled: false,
      lockOnPlacement: !!tpl.lockOnPlacement, comboAbility: !!tpl.comboAbility, charges: null,
    };
  }
  // Descriptif identique à celui du panneau d'inspection (la phrase déclencheur / effet / cible).
  function dbgSentenceHtml(inst) {
    const box = document.createElement("div");
    box.innerHTML = cardDetailHtml(inst, false);
    const sentence = box.querySelector(".cd-sentence");
    return sentence ? sentence.outerHTML : "";
  }
  // N liens « haut » superposés sur la facette du haut (recouvrement partiel quand N > 1).
  function dbgTemplateTile(tpl) {
    const item = document.createElement("div");
    item.className = "dbg-item";
    item.dataset.id = tpl.id;
    item.dataset.rar = tpl.rarity || "common";
    item.dataset.sym = ["atk", "shield", "revive", "neutral"].filter((k) => tpl.symbols[k] > 0).join(" ");
    item.dataset.links = String(tpl.linkCount);
    item.dataset.crafted = tpl.crafted ? "1" : "0";
    const inst = dbgPseudoInstance(tpl);
    const n = tpl.linkCount;
    const off = (i, step) => ((i - (n - 1) / 2) * step).toFixed(1);
    const tileBox = document.createElement("div");
    tileBox.className = "dbg-tile";
    if (skinEnabled) {
      tileBox.innerHTML = renderCardVisual(inst, {});
      let html = "";
      for (let i = 0; i < n; i++) html += `<div class="skin-anchor facet skin-a-n" style="margin-left:${off(i, 11)}%"><img src="${SKIN_ARROW_OFF_SRC}" alt=""></div>`;
      tileBox.querySelector(".skin-card").insertAdjacentHTML("beforeend", html);
    } else {
      const tile = document.createElement("div");
      tile.className = "tile " + cardRootClasses(inst);
      tile.innerHTML = renderCardVisual(inst, {});
      let html = "";
      for (let i = 0; i < n; i++) html += `<span class="arrow arrow-N" style="margin-left:${off(i, 14)}px"></span>`;
      tile.insertAdjacentHTML("beforeend", html);
      tileBox.appendChild(tile);
    }
    item.appendChild(tileBox);
    const info = document.createElement("div");
    info.className = "dbg-info";
    const badges = (tpl.trigger === TRIGGERS.START_OF_TURN && tpl.charges != null ? ` · <span title="${esc(t("dbgCharges"))}">🔋${tpl.charges}</span>` : "")
      + (tpl.lockOnPlacement ? ` · <span title="${esc(t("dbgLocks"))}">🔒</span>` : "");
    info.innerHTML = `<span class="dbg-id">${tpl.crafted ? craftBaseOf(tpl.id) + "+" : tpl.id} · ${esc(t(rarityLabelKey(tpl.rarity)))}${badges}</span>${dbgSentenceHtml(inst)}`;
    if (DBG_EDITS[tpl.id] !== undefined) item.classList.add("mod");
    item.appendChild(info);
    return item;
  }

  const DBG_RARITY_ORDER = [RARITIES.COMMON, RARITIES.UNCOMMON, RARITIES.RARE, RARITIES.UNIQUE];
  const DBG_RARITY_COLOR = { common: "#9aa4b8", uncommon: "#22c55e", rare: "#3b82f6", unique: "#ff8a1f" };
  const DBG_SYMS = [["atk", "⚔️"], ["shield", "🛡️"], ["revive", "♻️"], ["neutral", "⚪"]];
  const dbgFilter = { rar: new Set(), sym: new Set() };  // vide = pas de filtre ; OU dans un groupe, ET entre les groupes

  function dbgBuildChips() {
    const mk = (box, items, set, cls) => {
      box.innerHTML = items.map(([key, label, color]) =>
        `<button class="dbg-chip ${cls}${set.has(key) ? " on" : ""}" data-key="${key}" style="${color ? "--chip:" + color : ""}" title="${key}">${label}</button>`).join("");
    };
    mk(dbgEl("dbgRarChips"), DBG_RARITY_ORDER.map((r) => [r, t(rarityLabelKey(r)), DBG_RARITY_COLOR[r]]), dbgFilter.rar, "rar");
    mk(dbgEl("dbgSymChips"), DBG_SYMS.map(([k, e]) => [k, e]), dbgFilter.sym, "sym");
  }
  function dbgApplyFilter() {
    const items = dbgEl("dbgSwapList").children;
    let shown = 0;
    for (const it of items) {
      const okR = !dbgFilter.rar.size || dbgFilter.rar.has(it.dataset.rar);
      const syms = it.dataset.sym ? it.dataset.sym.split(" ") : [];
      const okS = !dbgFilter.sym.size || syms.some((k) => dbgFilter.sym.has(k));
      it.hidden = !(okR && okS);
      if (!it.hidden) shown++;
    }
    dbgEl("dbgCount").textContent = shown + "/" + items.length;
    dbgEl("dbgSwapList").scrollTop = 0;
  }
  [["dbgRarChips", "rar"], ["dbgSymChips", "sym"]].forEach(([id, grp]) => {
    dbgEl(id).addEventListener("click", (e) => {
      const b = e.target.closest(".dbg-chip");
      if (!b) return;
      const set = dbgFilter[grp];
      if (set.has(b.dataset.key)) set.delete(b.dataset.key); else set.add(b.dataset.key);
      b.classList.toggle("on", set.has(b.dataset.key));
      dbgApplyFilter();
    });
  });

  /* ---- Modifications manuelles de cartes (rareté, liens, trigger, cible, ability) — persistées + log de débug ----
     Les modifications s'appliquent EN DIRECT au template ET aux exemplaires déjà en jeu / en main / en pioche, et sont rechargées
     au démarrage. Le log liste les écarts nets par rapport aux valeurs codées en dur. */
  const DBG_EDIT_KEY = "ccn_debug_cards_v2", DBG_RAR_KEY_V1 = "ccn_debug_rarity_v1";
  const dbgClone = (o) => JSON.parse(JSON.stringify(o));
  // Champs éditables d'un template (forme canonique, comparable).
  function dbgSnapshot(tpl) {
    const eff = { type: tpl.effect.type, magnitude: tpl.effect.magnitude };
    if (tpl.effect.symbol) eff.symbol = tpl.effect.symbol;
    const sy = tpl.symbols || {};
    return {
      rarity: tpl.rarity, linkCount: tpl.linkCount,
      symbols: { atk: sy.atk || 0, shield: sy.shield || 0, revive: sy.revive || 0, neutral: sy.neutral || 0 },
      trigger: tpl.trigger, effect: eff,
      target: { scope: tpl.target.scope, mode: tpl.target.mode },
      charges: tpl.charges == null ? null : tpl.charges, lockOnPlacement: !!tpl.lockOnPlacement,
    };
  }
  // Forme canonique d'un snapshot sauvegardé (anciens logs sans `symbols` : on reprend ceux d'origine).
  function dbgCanon(sp, orig) {
    return dbgSnapshot({ ...sp, symbols: sp.symbols || orig.symbols, charges: sp.charges, lockOnPlacement: sp.lockOnPlacement });
  }
  const DBG_ORIG = {};                           // snapshot d'origine (codé en dur) par id, pris avant tout override
  CARDS.forEach((c) => { DBG_ORIG[c.id] = dbgSnapshot(c); });
  const DBG_EDITS = {};                          // id -> snapshot complet modifié (uniquement si ≠ origine)
  function DBG_RARITY_VALID(r) { return r === "common" || r === "uncommon" || r === "rare" || r === "unique"; }
  function dbgWriteSnapshot(tpl, sp) {             // écrit un snapshot dans un template (mutation en place)
    tpl.rarity = sp.rarity; tpl.linkCount = sp.linkCount; tpl.trigger = sp.trigger;
    tpl.symbols = { ...(sp.symbols || tpl.symbols) };
    tpl.effect = dbgClone(sp.effect); tpl.target = dbgClone(sp.target);
    if (sp.charges == null) delete tpl.charges; else tpl.charges = sp.charges;
    tpl.lockOnPlacement = !!sp.lockOnPlacement;
  }
  try {
    const saved = JSON.parse(localStorage.getItem(DBG_EDIT_KEY) || "{}");
    // Migration : anciens overrides de rareté seule (v1).
    const old = JSON.parse(localStorage.getItem(DBG_RAR_KEY_V1) || "{}");
    Object.keys(old).forEach((id) => { if (!saved[id] && CARDS_BY_ID[id] && DBG_RARITY_VALID(old[id]) && old[id] !== DBG_ORIG[id].rarity) saved[id] = { ...dbgClone(DBG_ORIG[id]), rarity: old[id] }; });
    Object.keys(saved).forEach((id) => {
      if (!CARDS_BY_ID[id]) return;
      const sp = dbgCanon(saved[id], DBG_ORIG[id]);
      if (JSON.stringify(sp) === JSON.stringify(DBG_ORIG[id])) return;     // identique au codé en dur : ignoré
      DBG_EDITS[id] = sp; dbgWriteSnapshot(CARDS_BY_ID[id], sp);
    });
  } catch (e) { /* stockage indisponible */ }
  function dbgSaveOverrides() { try { localStorage.setItem(DBG_EDIT_KEY, JSON.stringify(DBG_EDITS)); localStorage.removeItem(DBG_RAR_KEY_V1); } catch (e) { /* ignore */ } }

  const dbgSymStr = (sy) => { const o = ["atk", "shield", "revive", "neutral"].filter((k) => sy[k] > 0).map((k) => k + sy[k]).join(" "); return o || "none"; };
  const dbgEffStr = (e) => e.type + ":" + e.magnitude + (e.symbol ? ":" + e.symbol : "");
  const dbgTgtStr = (t) => t.scope + "/" + t.mode;
  function dbgDiffLines(id) {
    const o = DBG_ORIG[id], n = DBG_EDITS[id], out = [];
    if (o.rarity !== n.rarity) out.push(`rarity ${o.rarity} -> ${n.rarity === "unique" ? "unique (ultra-rare)" : n.rarity}`);
    if (o.linkCount !== n.linkCount) out.push(`links ${o.linkCount} -> ${n.linkCount}`);
    if (dbgSymStr(o.symbols) !== dbgSymStr(n.symbols)) out.push(`symbols ${dbgSymStr(o.symbols)} -> ${dbgSymStr(n.symbols)}`);
    if (o.trigger !== n.trigger) out.push(`trigger ${o.trigger} -> ${n.trigger}`);
    if (dbgEffStr(o.effect) !== dbgEffStr(n.effect)) out.push(`effect ${dbgEffStr(o.effect)} -> ${dbgEffStr(n.effect)}`);
    if (dbgTgtStr(o.target) !== dbgTgtStr(n.target)) out.push(`target ${dbgTgtStr(o.target)} -> ${dbgTgtStr(n.target)}`);
    if (o.charges !== n.charges) out.push(`charges ${o.charges} -> ${n.charges}`);
    if (o.lockOnPlacement !== n.lockOnPlacement) out.push(`lockOnPlacement ${o.lockOnPlacement} -> ${n.lockOnPlacement}`);
    return out;
  }
  function dbgLogText() {
    const ids = Object.keys(DBG_EDITS).sort((a, b) => parseInt(a.slice(1), 10) - parseInt(b.slice(1), 10));
    const head = `CARD OVERRIDES — ${new Date().toISOString().slice(0, 16).replace("T", " ")} — ${ids.length} card(s) changed vs hardcoded`;
    if (!ids.length) return head + "\n(none)";
    return head + "\n" + ids.map((id) => `${id}: ` + dbgDiffLines(id).join("; ")).join("\n") + "\nJSON: " + JSON.stringify(DBG_EDITS);
  }
  function dbgRefreshLog() {
    dbgEl("dbgLogText").value = dbgLogText();
    const n = Object.keys(DBG_EDITS).length;
    dbgEl("dbgLogN").textContent = n ? String(n) : "";
  }
  // Applique un snapshot complet à un template + à tous ses exemplaires vivants (grilles, mains, pioches).
  function dbgApplySnapshot(id, sp) {
    const tpl = CARDS_BY_ID[id];
    if (!tpl) return;
    const oldSym = { ...tpl.symbols };
    dbgWriteSnapshot(tpl, sp);
    if (JSON.stringify(dbgSnapshot(tpl)) === JSON.stringify(DBG_ORIG[id])) delete DBG_EDITS[id]; else DBG_EDITS[id] = dbgSnapshot(tpl);
    if (state) {
      const fix = (c) => {
        if (!c || c.templateId !== id) return;
        c.trigger = tpl.trigger; c.effect = dbgClone(tpl.effect); c.target = dbgClone(tpl.target);
        c.lockOnPlacement = !!tpl.lockOnPlacement;
        ["atk", "shield", "revive", "neutral"].forEach((k) => { c.symbols[k] = Math.max(0, (c.symbols[k] || 0) + ((tpl.symbols[k] || 0) - (oldSym[k] || 0))); });
        c.charges = tpl.trigger === TRIGGERS.START_OF_TURN ? (tpl.charges == null ? 1 : tpl.charges) : null;
        if (c.dirs.length > tpl.linkCount) c.dirs = c.dirs.slice(0, tpl.linkCount);
        while (c.dirs.length < tpl.linkCount) {
          const free = DIRS.filter((d) => !c.dirs.includes(d));
          c.dirs.push(free[Math.floor(Math.random() * free.length)]);
        }
      };
      ["player", "ai"].forEach((o) => { const pl = state.players[o]; pl.grid.forEach(fix); pl.hand.forEach(fix); pl.deck.forEach(fix); });
      saveGame();
    }
    dbgSaveOverrides();
    dbgRefreshLog();
    dbgRefreshTile(id);
    if (state) render();                    // glow / inspection des cartes en jeu et en main
  }
  function dbgRefreshTile(id) {             // remplace la tuile du panneau de swap (même position / sélection / filtre)
    const old = dbgEl("dbgSwapList").querySelector(`.dbg-item[data-id="${id}"]`);
    if (!old) return;
    const neu = dbgTemplateTile(CARDS_BY_ID[id]);
    neu.hidden = old.hidden;
    if (old.classList.contains("sel")) neu.classList.add("sel");
    old.replaceWith(neu);
  }
  function dbgSetRarity(id, rarity) {
    if (!CARDS_BY_ID[id] || !DBG_RARITY_VALID(rarity)) return;
    dbgApplySnapshot(id, { ...dbgSnapshot(CARDS_BY_ID[id]), rarity });
  }
  function dbgFlashMsg(txt) { const m = dbgEl("dbgLogMsg"); m.textContent = txt; setTimeout(() => { if (m.textContent === txt) m.textContent = ""; }, 2000); }
  dbgEl("dbgLogBtn").addEventListener("click", () => {
    const v = dbgEl("dbgLogView"); v.hidden = !v.hidden;
    if (!v.hidden) dbgRefreshLog();
  });
  dbgEl("dbgLogCopy").addEventListener("click", async () => {
    const ta = dbgEl("dbgLogText"), txt = ta.value;
    let ok = false;
    try { if (navigator.clipboard && window.isSecureContext) { await navigator.clipboard.writeText(txt); ok = true; } } catch (e) { /* repli */ }
    if (!ok) { try { ta.focus(); ta.select(); ta.setSelectionRange(0, txt.length); ok = document.execCommand("copy"); } catch (e) { ok = false; } }
    dbgFlashMsg(ok ? t("dbgCopied") : t("dbgCopyManual"));
  });
  dbgEl("dbgLogReset").addEventListener("click", () => {
    if (!Object.keys(DBG_EDITS).length) return;
    if (!window.confirm(t("dbgConfirmReset"))) return;
    Object.keys(DBG_EDITS).slice().forEach((id) => dbgApplySnapshot(id, DBG_ORIG[id]));
    dbgSaveOverrides(); dbgRefreshLog(); dbgOpenSwap(); if (state) render();
  });

  /* appui long sur une tuile du panneau => mini-menu de rareté (icônes seules) */
  const DBG_RAR_ICONS = { common: "⚪", uncommon: "🟢", rare: "🔵", unique: "🟠" };
  let dbgRarPress = null, dbgRarTarget = null, dbgSwapSwallow = false;
  function dbgCloseRarMenu() { dbgEl("dbgRarMenu").hidden = true; dbgRarTarget = null; }
  function dbgOpenRarMenu(id, x, y) {
    dbgRarTarget = id;
    const cur = CARDS_BY_ID[id].rarity, m = dbgEl("dbgRarMenu");
    m.innerHTML = DBG_RARITY_ORDER.map((r) => `<button data-rar="${r}" class="${r === cur ? "on" : ""}" title="${esc(t(rarityLabelKey(r)))}" aria-label="${esc(t(rarityLabelKey(r)))}">${DBG_RAR_ICONS[r]}</button>`).join("")
      + `<button data-rar="__orig" title="${esc(t("dbgOriginal"))}" aria-label="${esc(t("dbgOriginal"))}">↺</button>`
      + `<button data-rar="__edit" title="${esc(t("dbgEditor"))}" aria-label="${esc(t("dbgEditor"))}">✏️</button>`;
    m.hidden = false;
    const r = m.getBoundingClientRect();
    m.style.left = Math.min(Math.max(8, x - r.width / 2), window.innerWidth - r.width - 8) + "px";
    m.style.top = Math.min(Math.max(8, y - r.height - 18), window.innerHeight - r.height - 8) + "px";
  }
  dbgEl("dbgRarMenu").addEventListener("click", (e) => {
    const b = e.target.closest("button[data-rar]");
    if (!b || !dbgRarTarget) return;
    const id = dbgRarTarget;
    if (b.dataset.rar === "__edit") { dbgCloseRarMenu(); dbgOpenEditor(id); return; }
    if (b.dataset.rar === "__orig") dbgApplySnapshot(id, DBG_ORIG[id]); else dbgSetRarity(id, b.dataset.rar);
    dbgCloseRarMenu();
  });
  const dbgSwapListEl = dbgEl("dbgSwapList");
  dbgSwapListEl.addEventListener("pointerdown", (e) => {
    dbgCloseRarMenu();
    if (e.pointerType === "mouse" && e.button !== 0) return;
    const it = e.target.closest(".dbg-item");
    if (!it) return;
    clearTimeout(dbgRarPress && dbgRarPress.timer);
    dbgRarPress = { x: e.clientX, y: e.clientY, timer: setTimeout(() => {
      dbgRarPress = null; dbgSwapSwallow = true;
      dbgOpenRarMenu(it.dataset.id, e.clientX, e.clientY);
    }, DBG_LONGPRESS_MS) };
  });
  dbgSwapListEl.addEventListener("pointermove", (e) => {
    if (dbgRarPress && Math.hypot(e.clientX - dbgRarPress.x, e.clientY - dbgRarPress.y) > DBG_MOVE_TOL) { clearTimeout(dbgRarPress.timer); dbgRarPress = null; }
  });
  dbgSwapListEl.addEventListener("scroll", () => { if (dbgRarPress) { clearTimeout(dbgRarPress.timer); dbgRarPress = null; } });
  // Capture : le pointerup / click qui suit un appui long ne doit ni sélectionner ni compter pour un double-tap d'échange.
  ["pointerup", "click"].forEach((ev) => dbgSwapListEl.addEventListener(ev, (e) => {
    if (ev === "pointerup" && dbgRarPress) { clearTimeout(dbgRarPress.timer); dbgRarPress = null; }
    if (dbgSwapSwallow) {
      e.stopImmediatePropagation(); e.preventDefault();
      if (ev === "click") dbgSwapSwallow = false;
      else setTimeout(() => { dbgSwapSwallow = false; }, 450);   // tactile : le click peut ne jamais arriver
    }
  }, true));
  dbgSwapListEl.addEventListener("pointercancel", () => { if (dbgRarPress) { clearTimeout(dbgRarPress.timer); dbgRarPress = null; } });
  dbgSwapListEl.addEventListener("contextmenu", (e) => e.preventDefault());

  /* ======================= ÉDITEUR VISUEL DE CARTE (debug) =======================
     Édite le TEMPLATE de la carte visée (liens, rareté, trigger, cible, ability) ; propage aux exemplaires vivants ;
     consigne l'écart dans le log de débug. Validation en direct par les règles du jeu (validateTemplate / validateCardPool). */
  const DBG_TRIGGER_OPTS = [TRIGGERS.NONE, TRIGGERS.ON_PLACEMENT, TRIGGERS.START_OF_TURN, TRIGGERS.ON_ACTIVATION, TRIGGERS.ON_COMBO_ATK, TRIGGERS.ON_COMBO_SHIELD, TRIGGERS.ON_COMBO_REVIVE];
  const DBG_EFFECT_OPTS = Object.values(EFFECT_TYPES);
  // Effets pour lesquels la magnitude change réellement quelque chose (les autres l'ignorent : sélecteur masqué).
  const DBG_MAGNITUDE_EFFECTS = new Set([EFFECT_TYPES.DAMAGE, EFFECT_TYPES.HEAL, EFFECT_TYPES.ACTIVATE, EFFECT_TYPES.ADD_LINK, EFFECT_TYPES.SYMBOL_BONUS, EFFECT_TYPES.HAND_TO_DECK, EFFECT_TYPES.DESTROY_CARD, EFFECT_TYPES.REMOVE_LINK]);
  const DBG_MAGNITUDE_RANDOM_ONLY = new Set([EFFECT_TYPES.ACTIVATE, EFFECT_TYPES.DESTROY_CARD]);   // magnitude > 1 : mode random seulement
  // Portées LÉGALES d'un effet = celles de la table de signes du moteur (aucune combinaison « sans sémantique »).
  function dbgLegalScopes(effectType) {
    if (effectType === EFFECT_TYPES.NONE) return [TARGET_SCOPES.SELF_CARD];
    return Object.keys(EFFECT_SIGN_BY_SCOPE[effectType] || {});
  }
  function dbgLegalModes(scope, effectType) {
    if (SINGLE_TARGET_SCOPES.includes(scope)) return [TARGET_MODES.FIXED];
    if (effectType === EFFECT_TYPES.DESTROY_CELL || scope === TARGET_SCOPES.ENEMY_CELL) return [TARGET_MODES.RANDOM];
    return [TARGET_MODES.CHOSEN, TARGET_MODES.RANDOM];
  }
  // Cible préférée par effet (première portée légale sinon).
  const DBG_PREFERRED_SCOPE = {
    [EFFECT_TYPES.DAMAGE]: TARGET_SCOPES.OPPONENT_PLAYER, [EFFECT_TYPES.HEAL]: TARGET_SCOPES.SELF_PLAYER,
    [EFFECT_TYPES.DISCARD]: TARGET_SCOPES.OPPONENT_PLAYER, [EFFECT_TYPES.HAND_TO_DECK]: TARGET_SCOPES.OPPONENT_PLAYER,
    [EFFECT_TYPES.CONVERT_SYMBOLS]: TARGET_SCOPES.SELF_PLAYER, [EFFECT_TYPES.DISABLE]: TARGET_SCOPES.ENEMY_CARD,
    [EFFECT_TYPES.SWAP_CARD]: TARGET_SCOPES.ENEMY_CARD, [EFFECT_TYPES.DESTROY_CARD]: TARGET_SCOPES.ENEMY_CARD,
    [EFFECT_TYPES.DESTROY_CELL]: TARGET_SCOPES.ENEMY_CELL, [EFFECT_TYPES.RETURN_TO_DECK]: TARGET_SCOPES.OWN_CARD,
    [EFFECT_TYPES.ROTATE_180]: TARGET_SCOPES.ENEMY_CARD, [EFFECT_TYPES.REMOVE_LINK]: TARGET_SCOPES.ENEMY_CARD, [EFFECT_TYPES.DESTROY_SLOT]: TARGET_SCOPES.ENEMY_CARD,
  };
  function dbgDefaultTarget(effectType) {
    const legal = dbgLegalScopes(effectType);
    const scope = legal.includes(DBG_PREFERRED_SCOPE[effectType]) ? DBG_PREFERRED_SCOPE[effectType] : (legal.includes(TARGET_SCOPES.OWN_CARD) ? TARGET_SCOPES.OWN_CARD : legal[0]);
    const modes = dbgLegalModes(scope, effectType);
    const mode = modes.includes(TARGET_MODES.CHOSEN) && effectType !== EFFECT_TYPES.ADD_LINK ? TARGET_MODES.CHOSEN : modes[0];
    return [scope, mode];
  }
  const dbgEd = { id: null, draft: null };
  const edEl = (id) => document.getElementById(id);

  function dbgOpenEditor(templateId) {
    if (!CARDS_BY_ID[templateId]) return;
    dbgEd.id = templateId;
    dbgEd.draft = dbgClone(dbgSnapshot(CARDS_BY_ID[templateId]));
    edEl("dbgEdTitle").textContent = "✏️ " + templateId;
    dbgEdBuildForm();
    dbgEdRefresh();
    edEl("dbgEdOverlay").hidden = false;
  }
  function dbgCloseEditor() { edEl("dbgEdOverlay").hidden = true; dbgEd.id = null; dbgEd.draft = null; }

  const optHtml = (vals, cur) => vals.map((v) => `<option value="${v}"${String(v) === String(cur) ? " selected" : ""}>${v}</option>`).join("");
  function dbgEdBuildForm() {
    const d = dbgEd.draft;
    const row = (key, label, sel) => `<span data-row="${key}">${label}</span><div data-row="${key}">${sel}</div>`;
    edEl("dbgEdForm").innerHTML =
        row("linkCount", t("edLinks"), `<select data-f="linkCount">${optHtml([1, 2, 3, 4], d.linkCount)}</select>`)
      + row("symbols", t("edSymbols"), `<div class="symrow">${["atk", "shield", "revive", "neutral"].map((k) => {
          const others = ["atk", "shield", "revive", "neutral"].reduce((n, o) => n + (o === k ? 0 : d.symbols[o]), 0);
          const opts = [0, 1, 2, 3].filter((n) => n <= 3 - others).map((n) => `<option value="${k}:${n}"${n === d.symbols[k] ? " selected" : ""}>${n}</option>`).join("");
          return `<label title="${k}">${{ atk: "⚔️", shield: "🛡️", revive: "♻️", neutral: "⚪" }[k]}<select data-f="sym">${opts}</select></label>`;
        }).join("")}</div>`)
      + row("rarity", t("edRarity"), `<select data-f="rarity">${optHtml(DBG_RARITY_ORDER, d.rarity)}</select>`)
      + row("trigger", t("edTrigger"), `<select data-f="trigger">${optHtml(DBG_TRIGGER_OPTS, d.trigger)}</select>`)
      + row("charges", t("edCharges"), `<select data-f="charges">${optHtml([1, 2, 3], d.charges == null ? 1 : d.charges)}</select>`)
      + row("effectType", t("edEffect"), `<select data-f="effectType">${optHtml(DBG_EFFECT_OPTS, d.effect.type)}</select>`)
      + row("magnitude", DBG_MAGNITUDE_RANDOM_ONLY.has(d.effect.type) ? t("edMagRandom") : t("edMagnitude"), `<select data-f="magnitude">${optHtml([1, 2, 3, 4], d.effect.magnitude || 1)}</select>`)
      + row("symbol", t("edSymbol"), `<select data-f="symbol">${optHtml(["atk", "shield", "revive", "neutral"], d.effect.symbol || "atk")}</select>`)
      + row("scope", t("edTarget"), `<select data-f="scope">${optHtml(dbgLegalScopes(d.effect.type), d.target.scope)}</select>`)
      + row("mode", t("edMode"), `<select data-f="mode">${optHtml(dbgLegalModes(d.target.scope, d.effect.type), d.target.mode)}</select>`)
      + `<label class="chk" data-row="lock"><input type="checkbox" data-f="lock"${d.lockOnPlacement ? " checked" : ""}> ${esc(t("edLock"))}</label>`;
  }
  function dbgEdOnChange(f, val, checked) {
    const d = dbgEd.draft;
    switch (f) {
      case "linkCount": d.linkCount = Number(val); break;
      case "rarity": d.rarity = val; break;
      case "trigger":
        d.trigger = val;
        if (val === TRIGGERS.NONE) { d.effect = { type: EFFECT_TYPES.NONE, magnitude: 0 }; d.target = { scope: TARGET_SCOPES.SELF_CARD, mode: TARGET_MODES.FIXED }; d.charges = null; d.lockOnPlacement = false; }
        else {
          if (d.effect.type === EFFECT_TYPES.NONE) {   // sort de « none » : effet natif du combo, sinon dégâts
            const nat = COMBO_NATIVE_EFFECT[comboTypeOfTrigger(val)] || EFFECT_TYPES.DAMAGE;
            d.effect = { type: nat, magnitude: 1 }; const t = dbgDefaultTarget(nat);
            const base = COMBO_BASE_TARGET[comboTypeOfTrigger(val)];
            d.target = base ? { scope: base.scope, mode: base.mode } : { scope: t[0], mode: t[1] };
          }
          d.charges = val === TRIGGERS.START_OF_TURN ? (d.charges == null ? 1 : d.charges) : null;
          if (val !== TRIGGERS.ON_ACTIVATION) d.lockOnPlacement = false;
        }
        break;
      case "charges": d.charges = Number(val); break;
      case "effectType": {
        const type = val, prev = d.effect.magnitude;
        d.effect = type === EFFECT_TYPES.NONE ? { type, magnitude: 0 } : { type, magnitude: DBG_MAGNITUDE_EFFECTS.has(type) && prev > 0 ? prev : 1 };
        if (type === EFFECT_TYPES.SYMBOL_BONUS) d.effect.symbol = "atk";
        if (type === EFFECT_TYPES.CONVERT_SYMBOLS) d.effect.symbol = "shield";
        // on garde la cible actuelle si elle reste légale pour ce nouvel effet, sinon cible par défaut cohérente
        const legalNow = dbgLegalScopes(type).includes(d.target.scope);
        if (!legalNow) { const dt = dbgDefaultTarget(type); d.target = { scope: dt[0], mode: dt[1] }; }
        else if (!dbgLegalModes(d.target.scope, type).includes(d.target.mode)) d.target.mode = dbgLegalModes(d.target.scope, type)[0];
        break;
      }
      case "magnitude": d.effect.magnitude = Number(val); break;
      case "symbol": d.effect.symbol = val; break;
      case "scope": d.target.scope = val; if (!dbgLegalModes(val, d.effect.type).includes(d.target.mode)) d.target.mode = dbgLegalModes(val, d.effect.type)[0]; break;
      case "mode": d.target.mode = val; break;
      case "sym": {
        const [k, n] = val.split(":");
        d.symbols[k] = Number(n);
        break;
      }
      case "lock": d.lockOnPlacement = !!checked; break;
    }
    dbgEdBuildForm();
    dbgEdRefresh();
  }
  edEl("dbgEdForm").addEventListener("change", (e) => {
    const el = e.target.closest("[data-f]");
    if (el) dbgEdOnChange(el.dataset.f, el.value, el.checked);
  });

  function dbgEdDraftTemplate() {
    const base = CARDS_BY_ID[dbgEd.id], d = dbgEd.draft;
    const t = { ...base, rarity: d.rarity, linkCount: d.linkCount, symbols: { ...d.symbols }, trigger: d.trigger, effect: dbgClone(d.effect), target: dbgClone(d.target), lockOnPlacement: !!d.lockOnPlacement };
    if (d.charges == null || d.trigger !== TRIGGERS.START_OF_TURN) delete t.charges; else t.charges = d.charges;
    return t;
  }
  function dbgEdRefresh() {
    const d = dbgEd.draft, t = dbgEdDraftTemplate();
    // visibilité des lignes selon le contexte
    const show = (key, on) => edEl("dbgEdForm").querySelectorAll(`[data-row="${key}"]`).forEach((n) => n.classList.toggle("row-off", !on));
    const none = d.effect.type === EFFECT_TYPES.NONE;
    show("charges", d.trigger === TRIGGERS.START_OF_TURN);
    show("magnitude", !none && DBG_MAGNITUDE_EFFECTS.has(d.effect.type));
    show("symbol", d.effect.type === EFFECT_TYPES.SYMBOL_BONUS || d.effect.type === EFFECT_TYPES.CONVERT_SYMBOLS);
    show("lock", d.trigger === TRIGGERS.ON_ACTIVATION);
    // aperçu (rareté du brouillon appliquée à la classe du cadre)
    const pv = edEl("dbgEdPreview"); pv.innerHTML = "";
    const item = dbgTemplateTile(t); item.classList.remove("mod");
    const card = item.querySelector(".skin-card, .tile");
    if (card) { card.className = card.className.replace(/rarity-\w+/g, "").trim() + " " + rarityClass(t.rarity); }
    pv.appendChild(item);
    // validation : règles de conception (bloquantes) / règles de rareté (avertissements) / doublon
    const errs = [], warns = [];
    if (!(d.symbols.atk + d.symbols.shield + d.symbols.revive + d.symbols.neutral >= 1)) errs.push(t("edErrSymbol"));
    if (d.effect.magnitude > 1 && DBG_MAGNITUDE_RANDOM_ONLY.has(d.effect.type) && d.target.mode !== TARGET_MODES.RANDOM) warns.push(t("edWarnMag"));
    const all = validateCardPool(CARDS.map((c) => c.id === t.id ? t : c)).filter((m) => m.startsWith(`[${t.id}]`));
    all.forEach((m) => (/rareté/.test(m) ? warns : errs).push(m.replace(`[${t.id}] `, "")));
    const k = (c) => JSON.stringify([c.linkCount, c.symbols, c.trigger, c.effect, c.target, !!c.lockOnPlacement, c.charges == null ? null : c.charges]);
    const dup = CARDS.find((c) => c.id !== t.id && k(c) === k(t));
    if (dup) warns.push(t("edWarnDup", dup.id));
    const ms = dbgMinRarity(t);
    if (DBG_RARITY_ORDER.indexOf(t.rarity) < ms) warns.push(t("edWarnRarity", DBG_RARITY_ORDER[ms]));
    edEl("dbgEdMsg").innerHTML = errs.map((m) => `<div class="err">⛔ ${esc(m)}</div>`).join("") + warns.map((m) => `<div class="warn">⚠ ${esc(m)}</div>`).join("")
      + (!errs.length && !warns.length ? `<div class="ok">✓ ${esc(t("edValid"))}</div>` : "");
    edEl("dbgEdApply").disabled = errs.length > 0;
  }
  // Règles de base de rareté : 3+ dégâts/soins (symboles + ability), blocage adverse, swap => rare ou plus.
  function dbgMinRarity(c) {
    const mult = c.charges != null ? c.charges : 1;
    let dmg = c.symbols.atk, heal = c.symbols.shield;
    if (c.trigger !== TRIGGERS.NONE) {
      if (c.effect.type === EFFECT_TYPES.DAMAGE && c.target.scope === TARGET_SCOPES.OPPONENT_PLAYER) dmg += c.effect.magnitude * mult;
      if (c.effect.type === EFFECT_TYPES.HEAL && c.target.scope === TARGET_SCOPES.SELF_PLAYER) heal += c.effect.magnitude * mult;
    }
    let r = 0;
    if (dmg >= 3 || heal >= 3) r = 2;
    if (c.effect.type === EFFECT_TYPES.DISABLE && c.target.scope === TARGET_SCOPES.ENEMY_CARD) r = 2;
    if (c.effect.type === EFFECT_TYPES.SWAP_CARD) r = 2;
    return r;
  }
  edEl("dbgEdApply").addEventListener("click", () => {

  /* ======================= Éditeur de deck (debug) =======================
     Colonne gauche : deck COMPLET du joueur (pioche + main + plateau + défausse ; seules les cartes de la pioche sont modifiables, les autres
     sont grisées/verrouillées). Colonne droite : collection (compteur restantes / max). Glisser-déposer (ou double tap) pour ajouter / retirer.
     Taille du deck fixe. OK applique à la pioche de la partie en cours, Annuler jette le brouillon. */
  const dk = { entries: [], size: 0, filter: { rar: new Set(), sym: new Set(), links: new Set(), craft: new Set(), deck: new Set() }, drag: null, camp: false };
  const dkEl = (id) => document.getElementById(id);
  const dkMax = (id) => { if (dk.camp) return (campaign && campaign.collection[id]) || 0; const c = state.collection && state.collection.player; return c && c[id] != null ? c[id] : collectionCopiesFor((CARDS_BY_ID[id] || {}).rarity); };
  const dkUsed = (id) => dk.entries.reduce((n, e) => n + (e.tid === id ? 1 : 0), 0);
  const dkRank = (id) => Math.max(0, DBG_RARITY_ORDER.indexOf((CARDS_BY_ID[id] || {}).rarity || RARITIES.COMMON));
  const dkOrder = (id) => CARDS.findIndex((c) => c.id === craftBaseOf(id));

  function dkOpen() { if (state && !pendingTarget) loadAssets(iconAssets().concat(CARDS.map((c) => illusUrl(c.id))), dkOpenNow); }
  function dkOpenNow() {
    if (!state || pendingTarget) return;
    dk.camp = false;
    const p = state.players.player;
    dk.entries = [];
    p.deck.forEach((c) => dk.entries.push({ tid: c.templateId, st: "deck", inst: c }));
    p.hand.forEach((c) => dk.entries.push({ tid: c.templateId, st: "hand" }));
    p.grid.forEach((c) => { if (c) dk.entries.push({ tid: c.templateId, st: "board" }); });
    p.graveyard.forEach((id) => dk.entries.push({ tid: id, st: "gy" }));
    dk.size = dk.entries.length;
    fltClear(dk.filter);
    dk.coll = CARDS.map((tpl, i) => ({ tpl, i })).sort((a, b) => dkRank(a.tpl.id) - dkRank(b.tpl.id) || a.i - b.i).map((x) => x.tpl);

  // Écran Deck du mode campaign : même éditeur, mais deck = deck de campagne, collection = cartes possédées. Taille de deck fixe.
  function dkOpenCampaign() { campEnsure(); loadAssets(iconAssets().concat(Object.keys(campaign.collection).filter((id) => campaign.collection[id] > 0).concat(campaign.deckIds).map(illusUrl)), dkOpenCampaignNow); }
  function dkOpenCampaignNow() {
    sfx("windowOpen");
    campEnsure();
    dk.camp = true;
    dk.entries = campaign.deckIds.map((tid) => ({ tid, st: "deck", inst: null }));
    dk.size = dk.entries.length;
    fltClear(dk.filter);
    dk.coll = Object.keys(campaign.collection).filter((id) => campaign.collection[id] > 0).map((id) => craftTemplate(id)).filter(Boolean)
      .sort((a, b) => dkRank(a.id) - dkRank(b.id) || dkOrder(a.id) - dkOrder(b.id) || (a.id < b.id ? -1 : 1));
    dkResetColl();
    dkBuildChips();
    dkRender();
    dkEl("dkOverlay").hidden = false;
    dkFillColl();
  }
  function dkClose() { const o = dkEl("dkOverlay"); if (o) o.hidden = true; dkEndDrag(); }

  /* Filtres partagés (éditeur de deck + atelier) : rareté, symboles, nombre de liens, cartes craftées, (atelier) dans / hors deck. */
  const fltNew = () => ({ rar: new Set(), sym: new Set(), links: new Set(), craft: new Set(), deck: new Set() });
  const fltClear = (f) => { for (const k of Object.keys(f)) f[k].clear(); };
  // Icônes du jeu (symboles + flèche de lien) ; repli sur l'émoji si l'image est absente.
  const FLT_EMOJI = { atk: "⚔️", shield: "🛡️", revive: "♻️", neutral: "⚪", link: "🔗" };
  function fltIco(k, extra) {
    const src = k === "link" ? SKIN_ARROW_SRC : SKIN_TYPE_ICON_SRC[k];
    return `<img class="flt-ico${extra ? " " + extra : ""}" src="${src}" alt="" onerror="this.replaceWith(document.createTextNode('${FLT_EMOJI[k]}'))">`;
  }
  function fltGroups(withDeck) {
    const g = [
      ["rar", DBG_RARITY_ORDER.map((r) => [r, t(rarityLabelKey(r)), DBG_RARITY_COLOR[r]]), ""],
      ["sym", DBG_SYMS.map(([k]) => [k, fltIco(k)]), "sym"],
      ["links", [1, 2, 3, 4].map((n) => [String(n), `${n}${fltIco("link")}`]), ""],
      ["craft", [["crafted", t("fltCrafted")], ["base", t("fltBase")]], ""],
    ];
    if (withDeck) g.push(["deck", [["in", t("fltInDeck")], ["out", t("fltOutDeck")]], ""]);
    return g;
  }
  function fltBuild(box, f, withDeck, onChange) {
    box.innerHTML = fltGroups(withDeck).map(([grp, items, cls]) => `<div class="dbg-chips" data-grp="${grp}">`
      + items.map(([key, label, color]) => `<button class="dbg-chip ${cls}${f[grp].has(key) ? " on" : ""}" data-key="${key}" style="${color ? "--chip:" + color : ""}">${label}</button>`).join("") + `</div>`).join("");
    if (box._fltBound) { box._fltF = f; box._fltCb = onChange; return; }
    box._fltBound = true; box._fltF = f; box._fltCb = onChange;
    box.addEventListener("click", (e) => {
      const b = e.target.closest(".dbg-chip"); if (!b) return;
      const set = box._fltF[b.parentNode.dataset.grp];
      if (set.has(b.dataset.key)) set.delete(b.dataset.key); else set.add(b.dataset.key);
      b.classList.toggle("on", set.has(b.dataset.key));
      box._fltCb();
    });
  }
  // it : { rar, sym (chaîne), links, crafted (bool), inDeck (bool|undefined) }
  function fltPass(f, it) {
    const syms = it.sym ? it.sym.split(" ") : [];
    return (!f.rar.size || f.rar.has(it.rar))
      && (!f.sym.size || syms.some((k) => f.sym.has(k)))
      && (!f.links.size || f.links.has(String(it.links)))
      && (!f.craft.size || f.craft.has(it.crafted ? "crafted" : "base"))
      && (!f.deck.size || it.inDeck === undefined || f.deck.has(it.inDeck ? "in" : "out"));
  }
  const fltOfEl = (el) => ({ rar: el.dataset.rar, sym: el.dataset.sym, links: el.dataset.links, crafted: el.dataset.crafted === "1" });
  const fltOfTpl = (tpl) => ({ rar: tpl.rarity || "common", sym: ["atk", "shield", "revive", "neutral"].filter((k) => tpl.symbols[k] > 0).join(" "), links: tpl.linkCount, crafted: !!tpl.crafted });
  function dkBuildChips() { fltBuild(dkEl("dkFilters"), dk.filter, false, dkApplyFilter); }
  const dkPass = (it) => fltPass(dk.filter, it);
  function dkApplyFilter() {
    for (const it of dkEl("dkDeckList").children) it.hidden = !dkPass(fltOfEl(it));   // deck : petit, on masque
    dkResetColl();                                                                                        // collection : reconstruite par blocs
  }
  // Collection paginée : blocs de DK_PAGE tuiles, le bloc suivant est ajouté quand on approche du bas de la liste.
  const DK_PAGE = 16;
  function dkCollItems() { return dk.coll.filter((tpl) => dkPass(fltOfTpl(tpl))); }
  function dkAppendBlock() {
    const list = dkEl("dkCollList"), items = dk.collItems;
    if (!items || dk.collShown >= items.length) return;
    const frag = document.createDocumentFragment();
    items.slice(dk.collShown, dk.collShown + DK_PAGE).forEach((tpl) => {
      const it = dbgTemplateTile(tpl);
      it.querySelector(".dbg-tile").insertAdjacentHTML("beforeend", `<span class="dk-badge"></span><span class="dk-lock" aria-hidden="true">🔒</span>`);
      dkUpdateTile(it);
      frag.appendChild(it);
    });
    dk.collShown = Math.min(items.length, dk.collShown + DK_PAGE);
    list.appendChild(frag);
  }
  function dkResetColl() {
    const list = dkEl("dkCollList");
    list.innerHTML = ""; list.scrollTop = 0;
    dk.collItems = dkCollItems(); dk.collShown = 0;
    dkAppendBlock();
    dkFillColl();
  }
  function dkFillColl() { const l = dkEl("dkCollList"); if (!l.clientHeight) return; let g = 0; while (g++ < 4 && l.scrollHeight <= l.clientHeight + 40 && dk.collShown < dk.collItems.length) dkAppendBlock(); }
  dkEl("dkCollList").addEventListener("scroll", () => {
    const l = dkEl("dkCollList");
    if (l.scrollTop + l.clientHeight > l.scrollHeight - 240) dkAppendBlock();
  }, { passive: true });
  function dkUpdateTile(it) {
    const max = dkMax(it.dataset.id), rem = Math.max(0, max - dkUsed(it.dataset.id));
    it.querySelector(".dk-badge").textContent = rem + "/" + max;
    it.classList.toggle("depleted", rem <= 0);
    it.classList.toggle("full", rem > 0 && dk.entries.length >= dk.size);
  }
  function dkFlashFull() {
    for (const id of ["dkDeckHead", "dkMsg"]) { const el = dkEl(id); el.classList.remove("dk-flash"); void el.offsetWidth; el.classList.add("dk-flash"); }
  }

  function dkRender() {
    // colonne deck : reconstruite (≤ ~30 tuiles), triée par rareté puis carte ; modifiables d'abord à égalité
    const list = dkEl("dkDeckList"); list.innerHTML = "";
    const frag = document.createDocumentFragment();
    const stLabel = { hand: t("dkHand"), board: t("dkBoard"), gy: t("dkDiscard") };
    dk.entries.map((e, i) => ({ e, i })).sort((a, b) => dkRank(a.e.tid) - dkRank(b.e.tid) || dkOrder(a.e.tid) - dkOrder(b.e.tid) || (a.e.st === "deck" ? -1 : 1) - (b.e.st === "deck" ? -1 : 1))
      .forEach(({ e, i }) => {
        const it = dbgTemplateTile(CARDS_BY_ID[e.tid]);
        it.dataset.ei = String(i);
        if (e.st !== "deck") {
          it.classList.add("locked");
          it.querySelector(".dbg-tile").insertAdjacentHTML("beforeend", `<span class="dk-badge">${esc(stLabel[e.st])}</span>`);
        }
        frag.appendChild(it);
      });
    list.appendChild(frag);
    // colonne collection : compteurs restantes / max
    for (const it of dkEl("dkCollList").children) dkUpdateTile(it);
    dkEl("dkDeckHead").textContent = `${t("dkDeck")} ${dk.entries.length}/${dk.size}`;
    dkEl("dkCollHead").textContent = t("dkCollection");
    const okSize = dk.entries.length === dk.size;
    dkEl("dkOk").disabled = !okSize;
    dkEl("dkMsg").textContent = okSize ? t("dkMsgOk") : t("dkMsgFull", dk.entries.length, dk.size);
    for (const it of dkEl("dkDeckList").children) it.hidden = !dkPass(fltOfEl(it));
  }

  function dkAdd(id) {
    if (dk.entries.length >= dk.size) { dkFlashFull(); return false; }
    if (dkUsed(id) >= dkMax(id)) return false;
    dk.entries.push({ tid: id, st: "deck", inst: null });
    dkRender(); return true;
  }
  function dkRemove(ei) {
    const e = dk.entries[ei];
    if (!e || e.st !== "deck") return false;
    dk.entries.splice(ei, 1);

  }

  // Glisser-déposer par pointer events (le DnD HTML5 est peu fiable au doigt sur iPad). Les tuiles sont en touch-action:pan-y :
  // un geste vertical fait défiler la liste, un geste plutôt horizontal démarre le glissement.
  function dkEndDrag() {
    if (dk.drag) { if (dk.drag.ghost) dk.drag.ghost.remove(); dk.drag.it.classList.remove("dragging"); }
    document.querySelectorAll(".dk-col.drop").forEach((c) => c.classList.remove("drop"));
    dk.drag = null;
  }
  function dkColAt(x, y) { const el = document.elementFromPoint(x, y); return el && el.closest ? el.closest(".dk-col") : null; }
  dkEl("dkOverlay").addEventListener("pointerdown", (e) => {
    const it = e.target.closest && e.target.closest(".dk-list .dbg-item");
    if (!it || it.classList.contains("locked") || it.classList.contains("depleted")) return;
    if (e.pointerType === "mouse" && e.button !== 0) return;
    const cols = [...document.querySelectorAll("#dkOverlay .dk-col")].map((c) => ({ c, r: c.getBoundingClientRect() }));   // rectangles mesurés une fois
    dk.drag = { it, x: e.clientX, y: e.clientY, ghost: null, src: it.closest(".dk-col").dataset.col, mouse: e.pointerType === "mouse", cols, over: null };
  });
  window.addEventListener("pointermove", (e) => {
    const d = dk.drag; if (!d) return;
    const dx = e.clientX - d.x, dy = e.clientY - d.y;
    if (!d.ghost) {
      const go = d.mouse ? Math.hypot(dx, dy) > 6 : (Math.abs(dx) > 10 && Math.abs(dx) > Math.abs(dy));
      if (!go) return;
      // fantôme léger : une simple pastille (pas de clone du DOM de la carte, trop lourd à animer)
      d.ghost = document.createElement("div");
      d.ghost.className = "dk-ghost";
      d.ghost.textContent = (CARDS_BY_ID[d.it.dataset.id] ? d.it.dataset.id : "");
      document.body.appendChild(d.ghost);
      d.it.classList.add("dragging");
    }
    d.ghost.style.transform = `translate3d(${e.clientX}px,${e.clientY}px,0) translate(-50%,-120%)`;
    const hit = d.cols.find((o) => e.clientX >= o.r.left && e.clientX <= o.r.right && e.clientY >= o.r.top && e.clientY <= o.r.bottom);
    const col = hit ? hit.c : null;
    if (col !== d.over) { d.over = col; d.cols.forEach((o) => o.c.classList.toggle("drop", o.c === col && col.dataset.col !== d.src)); }
    e.preventDefault();
  }, { passive: false });
  window.addEventListener("pointerup", (e) => {
    const d = dk.drag; if (!d) return;
    const moved = !!d.ghost;
    const col = moved ? d.over : null;
    const src = d.src, it = d.it;
    dkEnd: {
      dkEndDrag();
      if (!col || col.dataset.col === src) break dkEnd;

    if (it.closest(".dk-col").dataset.col === "coll") dkAdd(it.dataset.id); else dkRemove(+it.dataset.ei);
  });

  function dkApply() {
    if (dk.entries.length !== dk.size) return;
    if (dk.camp) {
      campaign.deckIds = dk.entries.map((e) => e.tid);
      campSave();
      dkClose();
      renderCamp();
      return;
    }
    const p = state.players.player;
    const kept = new Set(dk.entries.filter((e) => e.st === "deck" && e.inst).map((e) => e.inst));
    const deck = p.deck.filter((c) => kept.has(c));
    dk.entries.filter((e) => e.st === "deck" && !e.inst).forEach((e) => {
      deck.splice(Math.floor(Math.random() * (deck.length + 1)), 0, instantiateCard(CARDS_BY_ID[e.tid]));
    });

    saveGame(); render();
  }
  dkEl("dkOk").addEventListener("click", dkApply);
  dkEl("dkCancel").addEventListener("click", dkClose);
  dkEl("dkOverlay").addEventListener("click", (e) => { if (e.target === dkEl("dkOverlay")) dkClose(); });

  function dbgOpenSwap() {

  dbgEl("dbgSwapClose").addEventListener("click", dbgCloseSwap);

  /* ======================= INIT ======================= */

  function campBackup(raw, why) {
    if (!raw) return;
    let info = null; try { info = JSON.parse(raw); } catch (e) { /* illisible : on garde quand même */ }
    const wins = info && typeof info.wins === "number" ? info.wins : 0;
    const tok = info && info.tokens ? Object.values(info.tokens).reduce((a, b) => a + (+b || 0), 0) : 0;

  function showRules() { sfx("windowOpen"); renderRules(); campEl("rulesOverlay").hidden = false; campEl("rulesScroll").scrollTop = 0; queueFitSkinButtons(); }

  /* ======================= TUTORIEL GUIDÉ =======================
     Mini-partie SCRIPTÉE jouée sur le vrai plateau (state.mode === "tutorial", jamais sauvegardée : saveGame / saveLog
     l'ignorent). Un voile sombre « troué » (clip-path) met en lumière les éléments d'UI réels ; une bulle explique.
     Le moteur du jeu n'est touché que par de petits crochets : tutBlocked (select / place), tutAfterRender, tutTurnEnded
     (appelé par endPlayerTurn à la place du tour de l'IA) et tutOnDetail (panneau d'inspection ouvert).
     Chaque étape : { id, holes(), allow:{select,place}, until(), wait:"turnEnd"|"detail"|"rival", extra(), onEnter() }.
     Les cartes jouées sont repérées par `tutKey` (A, B, C côté joueur ; R1, R2 côté rival). */
  var tutOn = false, tut = null;
  const TUT_SEEN_KEY = "ccn_tutorial_seen_v1";
  const tutQ = (sel) => document.querySelector(sel);
  const tutHandIdx = (key) => state.players.player.hand.findIndex((c) => c.tutKey === key);
  const tutHandEl = (key) => { const i = tutHandIdx(key); return i < 0 ? null : tutQ("#playerHand").children[i] || null; };
  const tutCellEl = (owner, i) => tutQ(`#${owner === "ai" ? "aiGrid" : "playerGrid"} .cell[data-index="${i}"]`);

  function tutCard(id, dirs, key) { const c = instantiateCard(CARDS_BY_ID[id], defaultRng, dirs); if (key) c.tutKey = key; return c; }
  function tutBuildState() {
    const filler = (ids) => ids.map((id) => tutCard(id));

      mode: "tutorial", turn: 1, active: "player", winner: null, lastAction: null,
      collection: { player: {} },
      players: {
        player: {
          hp: MAX_HP, grid: emptyGrid(), graveyard: [], handCap: HAND_SIZE,
          // Main : D (bouclier), A (attaque →), E (rare), B (attaque ←→), C (bouclier ←, 3e symbole d'une autre famille). pop() = fin du tableau.
          hand: [tutCard("C10", ["S"], "D"), tutCard("C1", ["E"], "A"), tutCard("C14", ["N", "S"], "E"), tutCard("C2", ["W", "E"], "B"), tutCard("C10", ["W"], "C")],
          deck: filler(["C11", "C12", "C13", "C16", "C3", "C22", "C23", "C6", "C17", "C11", "C12", "C13"]),
        },
        ai: {
          hp: MAX_HP, grid: emptyGrid(), graveyard: [], handCap: HAND_SIZE,
          hand: [tutCard("C16", ["N", "E", "S"], "R1"), tutCard("C12", ["S", "E", "W"], "R2"), tutCard("C3"), tutCard("C11"), tutCard("C13")],
          deck: filler(["C1", "C2", "C3", "C10", "C11", "C12", "C13", "C16", "C22", "C23"]),

      },
      ui: { selectedHandIndex: null },
