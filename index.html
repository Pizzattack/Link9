<!DOCTYPE html>
<!--
  ############################################################################################
  ##  RÈGLE OBLIGATOIRE POUR TOUT ASSISTANT (Claude ou autre) QUI MODIFIE CE FICHIER          ##
  ##                                                                                          ##
  ##  À CHAQUE BUILD LIVRÉ (même pour un correctif d'une ligne), INCRÉMENTER DE 1 la          ##
  ##  constante  BUILD_NUMBER  (cherchez « BUILD_NUMBER » dans le <script> ; une seule         ##
  ##  occurrence à modifier). Elle s'affiche en bas de l'écran d'accueil (« Build N ») et      ##
  ##  permet à l'utilisateur de vérifier qu'il teste bien la dernière version.                 ##
  ##                                                                                          ##
  ##  - Ne jamais livrer deux builds avec le même numéro, ne jamais le faire redescendre.      ##
  ##  - Un redémarrage à froid / un nouveau chat doit d'abord LIRE la valeur actuelle de       ##
  ##    BUILD_NUMBER dans le fichier fourni, puis livrer BUILD_NUMBER + 1.                     ##
  ##  - Avant de livrer, vérifier que le numéro a bien changé (grep BUILD_NUMBER).             ##
  ############################################################################################
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>LINK//9 — Grid Protocol</title>
<meta name="description" content="Free netrunner card game: link programs on a 3×3 grid, chain combos, crash the rival.">
<meta name="theme-color" content="#0b0c0e">
<link rel="icon" href="./favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="./icons/favicon-16.png">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<link rel="manifest" href="./manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="LINK//9">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<style>
  :root{
    /* Halo orangé du logo (écran d'accueil + en-tête de combat). Posé en `filter: drop-shadow` sur l'<img> elle-même :
       Halo = pseudo-élément en dégradé radial DERRIÈRE le logo (et non `filter: drop-shadow` sur l'<img>, qui est rogné au
       rectangle de l'image par certains navigateurs / par un PNG à fond opaque). Il déborde de la boîte du logo ; aucun
       ancêtre ne doit avoir d'`overflow` autre que visible (cf. .topbar / .brand-wrap / .brand / .home-inner). */
    --logo-halo: radial-gradient(ellipse closest-side, rgba(255,160,50,.75) 0%, rgba(255,130,30,.45) 45%, rgba(255,110,20,.16) 75%, rgba(255,100,20,0) 100%);
    --bg: #1a1b1c;
    --panel: #1f2022;
    --panel-2: #2b2c2e;
    --line: #4a4d50;
    --text: #efefee;
    --muted: #a3a5a8;
    --atk: #ff5c72;
    --shield: #4fa8ff;
    --revive: #5fe0a0;
    --neutral: #f5c542;
    --accent: #ff8a2a;
    --accent-2: #ff9f45;
    --select: #ff9a2e;            /* orange : sélection de carte / drag'n'drop */
    --select-rgb: 255,154,46;
    --good: #5fe0a0;
    --bad: #ff5c72;
    --arrow-glow: #ffa640; /* teinte de la flèche image (ui045.webp), pour le glow de connexion active */
  }
  *{
    box-sizing:border-box; -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none; -webkit-user-select: none; user-select: none;
  }
  html,body{
    margin:0; padding:0; height:100%;
    background: radial-gradient(1200px 800px at 50% -10%, #2d2e30 0%, var(--bg) 55%);
    color: var(--text);
    font-family: Saira, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    overflow:hidden;
  }
  #app{
    height:100%;
    display:flex;
    flex-direction:column;
    max-width:720px;
    margin:0 auto;
    padding: 10px 10px calc(10px + env(safe-area-inset-bottom));
  }

  /* ---------- Header ---------- */
  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding: 4px 4px 8px;
  }
  .brand{
    font-size: 13px; font-weight: 800; letter-spacing: 0.04em;
    color: var(--accent-2);
  }
  .brand small{ display:block; font-size:9px; color:var(--muted); font-weight:600; letter-spacing:0.08em;}
  .topbar-actions{ display:flex; align-items:center; gap:10px; }
  .skin-toggle{
    display:flex; align-items:center; gap:6px; font-size:11px;
    color: var(--muted); font-weight:700; cursor:pointer;
  }
  .switch{ position:relative; width:34px; height:19px; display:inline-block; flex-shrink:0; }
  .switch input{ position:absolute; inset:0; opacity:0; margin:0; cursor:pointer; z-index:1; }
  .switch-track{
    position:absolute; inset:0; background:var(--panel-2); border:1px solid var(--line);
    border-radius:999px; transition:background .15s;
  }
  .switch-track::after{
    content:""; position:absolute; top:2px; left:2px; width:13px; height:13px;
    background:#fff; border-radius:50%; transition:transform .15s;
  }
  .switch input:checked + .switch-track{ background: var(--accent-2); }
  .switch input:checked + .switch-track::after{ transform: translateX(15px); }

  .newgame-btn{
    background: var(--panel-2); color: var(--text); border:1px solid var(--line);
    border-radius: 10px; padding: 7px 12px; font-size:12px; font-weight:700;
  }
  .newgame-btn:active{ background: var(--line); }

  /* ---------- HP rows ----------
     Par défaut (portrait, téléphone et iPad) : barre VERTICALE, couplée à sa
     grille dans `.side` (voir plus bas) — nom en haut, jauge qui se remplit
     du bas vers le haut au milieu, valeur en bas. Le mode paysage restaure
     l'orientation horizontale (voir media query dédiée), qui reste la mieux
     adaptée quand la largeur ne manque pas.
     La jauge elle-même ne connaît qu'un ratio (--hp-ratio, posé par le JS,
     0 à 1) : c'est la seule variable qui change entre les deux orientations,
     jamais une largeur/hauteur calculée côté JS. */
  :root{ --hpbar-thickness: 24px; } /* doublé (était 12px) */
  .hprow{
    display:flex; flex-direction:column; align-items:center; justify-content:space-between;
    gap:5px; padding: 3px 2px; width: var(--hpbar-thickness); flex-shrink:0;
  }
  @keyframes hp-pulse-3{ 0%,100%{ filter:none; } 50%{ filter:drop-shadow(0 0 4px rgba(255,90,60,.55)); } }
  @keyframes hp-pulse-2{ 0%,100%{ filter:none; } 50%{ filter:drop-shadow(0 0 8px rgba(255,70,50,.85)) brightness(1.12); } }
  @keyframes hp-pulse-1{ 0%,100%{ filter:none; transform:scale(1); } 50%{ filter:drop-shadow(0 0 12px rgba(255,40,40,1)) brightness(1.3); transform:scale(1.045); } }
  .hprow[data-low="3"] .hpbar, .hprow[data-low="3"] .hpval{ animation:hp-pulse-3 2.4s ease-in-out infinite; }
  .hprow[data-low="2"] .hpbar, .hprow[data-low="2"] .hpval{ animation:hp-pulse-2 1.4s ease-in-out infinite; }
  .hprow[data-low="1"] .hpbar, .hprow[data-low="1"] .hpval{ animation:hp-pulse-1 .75s ease-in-out infinite; }
  .hprow[data-low="1"] .hpval{ color:#ff6a5a; }
  @media (prefers-reduced-motion: reduce){ .hprow[data-low] .hpbar, .hprow[data-low] .hpval{ animation-duration:3s; } }
  .hprow .name{ font-size:9px; font-weight:700; color:var(--muted); writing-mode: horizontal-tb; }
  .hpbar{
    flex:1; width: var(--hpbar-thickness); min-height:24px; border-radius:6px; background:var(--panel-2);
    border:1px solid var(--line); overflow:hidden; position:relative;
  }
  .hpbar-fill{
    position:absolute; left:0; bottom:0; width:100%;
    height: calc(var(--hp-ratio, 1) * 100%);
    background: linear-gradient(0deg, var(--bad), var(--accent));
    transition: height .3s;
  }
  .hprow.player .hpbar-fill{ background: linear-gradient(0deg, var(--accent-2), var(--good)); }
  .hpval{ font-size:10px; font-weight:800; }
  .hprow.targetable .hpbar{
    box-shadow: 0 0 0 2px var(--atk), 0 0 10px 2px var(--atk);
    cursor:pointer;
  }
  .hprow.targetable .name{ color: var(--atk); }

  /* ---------- Grids ---------- */
  /* BUG CORRIGÉ : la grille utilisait `flex:1` (grandir pour remplir l'espace
     dispo dans `.side`) + `max-width` (plafond) + `margin:0 auto`. Comme le
     plafond (borné en vh) est presque toujours plus petit que la largeur
     réellement disponible en portrait, la grille restait petite ET se
     centrait dans TOUT l'espace restant de `.side` — créant un grand vide
     entre la barre de PV (collée à gauche) et la grille (centrée plus loin),
     et gâchant l'essentiel de l'écran. Remplacé par une taille EXPLICITE et
     déterministe (`flex:0 0 auto; width:min(...)`), avec `.side` réduit à sa
     taille de contenu (`width:fit-content`) et `.arenas` qui centre ce bloc
     compact — la grille colle maintenant directement sa barre de PV, et le
     plafond en vh a été remonté pour utiliser davantage l'espace vertical
     dispo (deux grilles empilées + le reste de l'interface tiennent quand
     même sans déborder). */
  :root{ --grid-max: 300px; }
  .main-row{ display:flex; flex-direction:row; flex:1; min-height:0; gap:8px; }
  .boards{ display:flex; flex-direction:column; gap:6px; flex:1; min-width:0; min-height:0; justify-content:center;}
  .arenas{ display:flex; flex-direction:column; gap:16px; align-items:center; } /* padding entre les 2 arènes */
  .side{ display:flex; flex-direction:row; align-items:stretch; gap:8px; width:fit-content; }
  .grid{
    display:grid; grid-template-columns: repeat(3, 1fr); gap: 14px; /* élargi : les flèches image débordent légèrement, plus de marge limite les superpositions */
    flex:0 0 auto; width: min(var(--grid-max), 40vh); aspect-ratio: 1/1; margin: 0;
  }
  .cell{
    position:relative; border-radius: 10px;
    background: var(--panel);
    border: 1.5px dashed var(--line);
  }
  .cell.placeable{
    border: 1.5px solid var(--select);
    box-shadow: 0 0 10px rgba(var(--select-rgb),0.35) inset;
  }
  .cell.targetable-card{
    border: 1.5px solid var(--atk);
    box-shadow: 0 0 10px rgba(255,92,114,0.45) inset;
  }
  .cell.targetable-revive{
    border: 1.5px solid var(--revive);
    box-shadow: 0 0 10px rgba(95,224,160,0.45) inset;
  }
  .cell.drag-over{
    border: 1.5px solid var(--select);
    box-shadow: 0 0 16px 3px rgba(var(--select-rgb),0.55) inset;
    transform: scale(1.03);
  }

  /* ---------- Drag'n'drop (fantôme flottant, en plus du clic carte + clic arène) ---------- */
  /* BUG CORRIGÉ : cette règle était déclarée AVANT `.hand-card` dans le fichier ;
     comme le fantôme cumule les deux classes ("hand-card drag-ghost") avec la
     MÊME spécificité (une classe chacune), c'est la règle la plus tardive dans
     le fichier qui gagnait la cascade — donc `.hand-card{position:relative}`
     écrasait silencieusement `position:fixed` ici, et le fantôme se retrouvait
     positionné dans le flux normal du document plutôt que collé au doigt
     (invisible en pratique, hors de l'écran ou coupé par overflow:hidden).
     `!important` sur `position` seul (pas toute la règle) rend ce point
     robuste à tout futur réordonnancement du CSS. */
  .drag-ghost{
    position: fixed !important; z-index: 9999; pointer-events: none;
    opacity: 0; transform: scale(1.08) rotate(-2deg);
    box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    transition: opacity .08s ease-out;
  }

  /* ---------- Tile ---------- */
  .tile{
    position:absolute; inset:0; border-radius:9px;
    background: var(--tile-bg, linear-gradient(145deg,#303234,#1c1d1f));
    border: 1.5px solid var(--line);
    display:flex; align-items:center; justify-content:center;
    overflow: visible;
    --arrow-side: 21px;
    --arrow-len: 35px;
    --arrow-edge: -18px;
    --arrow-corner: -8px;
  }
  .ruin-cell{ pointer-events:none; }
  .ruin-cell{ background:#0b0c10; border:1.5px solid #14161c; border-radius:10px; box-shadow:none; opacity:.9; }
  .tile.disabled{ filter: grayscale(0.9) brightness(0.55); }
  .tile.disabled::after{
    content:"⏸"; position:absolute; font-size:16px; color:#fff; opacity:0.8;
  }
  .tile.chain-glow{
    box-shadow: 0 0 0 2px #fff, 0 0 14px 3px #fff;
  }
  .tile.tile-linked{
    box-shadow: 0 0 0 1.5px var(--accent-2), 0 0 6px rgba(255,154,61,0.25);
  }
  .arrow{
    position:absolute; width:0; height:0;
    border-left: var(--arrow-side, 21px) solid transparent;
    border-right: var(--arrow-side, 21px) solid transparent;
    border-bottom: var(--arrow-len, 35px) solid var(--muted);
    opacity:0.4; filter: drop-shadow(0 0 2px rgba(0,0,0,0.6));
    transition: opacity .2s, border-bottom-color .2s, filter .2s;
  }
  .arrow.linked{
    border-bottom-color: var(--accent-2);
    opacity:1;
    filter: drop-shadow(0 0 5px var(--accent-2));
  }
  .arrow-N{ top: var(--arrow-edge, -18px); left:50%; transform:translateX(-50%) rotate(0deg); }
  .arrow-S{ bottom: var(--arrow-edge, -18px); left:50%; transform:translateX(-50%) rotate(180deg); }
  .arrow-E{ right: var(--arrow-edge, -18px); top:50%; transform:translateY(-50%) rotate(90deg); }
  .arrow-W{ left: var(--arrow-edge, -18px); top:50%; transform:translateY(-50%) rotate(-90deg); }
  .arrow-NE{ top: var(--arrow-corner, -8px); right: var(--arrow-corner, -8px); transform:rotate(45deg); }
  .arrow-NW{ top: var(--arrow-corner, -8px); left: var(--arrow-corner, -8px); transform:rotate(-45deg); }
  .arrow-SE{ bottom: var(--arrow-corner, -8px); right: var(--arrow-corner, -8px); transform:rotate(135deg); }
  .arrow-SW{ bottom: var(--arrow-corner, -8px); left: var(--arrow-corner, -8px); transform:rotate(-135deg); }

  .symbols{
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center; gap:4px;
  }
  .sym{
    font-size:13px; width:19px; height:19px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    color:#0f0f10; font-weight:900;
  }
  .sym.atk{ background: var(--atk); }
  .sym.shield{ background: var(--shield); }
  .sym.revive{ background: var(--revive); }
  .sym.neutral{ background: var(--neutral); }

  /* =====================================================================
     SKIN GRAPHIQUE (toggle) — remplace entièrement .tile/.arrow/.symbols
     par le système image du prototype fourni (cadre + illustration +
     icônes de type + flèches image), quand le toggle est ON. Adapté pour
     se dimensionner en % du conteneur (cellule de grille ou carte en main)
     plutôt qu'en vmin global comme dans le prototype d'origine (qui
     n'affichait qu'une seule carte à la fois) — ce qui le rend
     automatiquement correct quelle que soit la taille de cellule calculée
     ailleurs (JS pour la main, flex/vh pour les grilles), sans mesure JS
     supplémentaire ici. Formules de positionnement des flèches (dx/dy/rot
     par direction, distances d'ancrage --hf/--hd) reprises à l'identique
     du prototype ; seule l'unité de référence change.
     Valeurs par défaut = celles du prototype : taille flèche 30%,
     ancrage facet(N/E/S/W) 65%, ancrage diag(NE/SE/SW/NW) 55%,
     illustration 90%, icônes de type 20% (haut 9%, droite 11%, gap 1%).
     Chemins relatifs (pas de base64) : le fichier HTML est destiné à être
     placé dans le même dossier que les répertoires ./ui/, ./illustrations/
     et ./abilities/ du prototype d'origine. */
  .skin-card{
    position:absolute; inset:0;
    --hf: 65%; --hd: 55%; --arrow-w: 30; /* --arrow-w en nombre sans unité, pour calc() */
  }
  .skin-card.disabled{ filter: grayscale(0.9) brightness(0.55); }
  .skin-card.disabled::after{
    content:"⏸"; position:absolute; inset:0; z-index:3;
    display:flex; align-items:center; justify-content:center;
    font-size:min(30%, 24px); color:#fff; opacity:0.85; pointer-events:none;
  }
  .skin-card .skin-illus{
    position:absolute; left:50%; top:50%; width:90%; height:90%;
    transform:translate(-50%,-50%); object-fit:contain; z-index:0;
    border-radius: 8%; pointer-events:none;
  }
  .skin-card .skin-frame{
    position:absolute; inset:0; z-index:1; width:100%; height:100%;
    display:block; pointer-events:none;
  }
  /* BUG CORRIGÉ : .skin-types n'avait pas de largeur propre (positionné par
     top/right seulement, largeur "auto" = calée sur son contenu), et
     `img{width:20%}` résolvait alors ce pourcentage contre CETTE largeur
     indéterminée plutôt que contre la carte — référence circulaire que les
     navigateurs retombent en général sur la taille INTRINSÈQUE (pleine
     résolution) de l'image, bien plus grande que prévu. Comme ce bloc
     surdimensionné se positionnait ensuite via son bord droit (right:11%),
     son bord gauche débordait loin vers la gauche de la carte — donnant
     l'impression que les icônes étaient "en haut à gauche" alors qu'elles
     étaient bien ancrées à droite, juste bien trop grosses.
     Correction : .skin-types couvre maintenant TOUTE la carte (inset:0, une
     taille définie, non circulaire), et c'est le flex (justify-content:
     flex-end + align-items:flex-start) + un padding qui replacent le
     groupe d'icônes en haut à droite — `img{width:20%}` résolvant
     désormais bien contre la largeur de la carte, comme voulu. */
  .skin-card .skin-types{
    position:absolute; inset:0; z-index:2;
    display:flex; align-items:flex-start; justify-content:flex-end;
    padding: 9% 11% 0 0; gap:1%; pointer-events:none;
  }
  .skin-card .skin-types img{ display:block; width:20%; height:auto; flex-shrink:0; }
  /* Icône de trigger (bas droite) — position reprise à l'identique du
     prototype fourni (test_8.html : --j-bottom 11%, --j-right 11%,
     --j-size 30%). Le contenu est une image numérotée du dossier
     ./abilities/ (cf. TRIGGER_ICON_FILE plus bas dans le script), exactement
     comme l'icône .ability-bottom du prototype — pas un glyphe CSS. */
  .skin-card .skin-ability{
    position:absolute; z-index:2; bottom:11%; right:11%;
    width:30%; pointer-events:none;
  }
  /* Une icône par tour d'activation restant (startOfTurn) : empilées, chacune légèrement décalée (vers le centre
     de la carte) et superposée aux précédentes. Le conteneur est carré ; toutes les icônes sont ancrées dedans. */
  .skin-card .skin-ability{ aspect-ratio:1/1; }
  .skin-card .skin-ability img{
    position:absolute; left:0; top:0; display:block; width:100%; height:100%; object-fit:contain;
    transform: translate(calc(var(--i, 0) * -34%), calc(var(--i, 0) * -14%)); z-index:calc(var(--i, 0) + 1);
  }

  /* ---------------------------------------------------------------------
     Icône de trigger (bas droite, les deux modes de rendu) — CSS/texte
     uniquement, aucun asset dessiné requis : un disque de couleur + un
     glyphe, une couleur par catégorie de déclenchement.
     --------------------------------------------------------------------- */
  .trigger-badge{
    display:flex; align-items:center; justify-content:center;
    border-radius:50%; color:#fff; font-weight:700;
    box-shadow: 0 1px 3px rgba(0,0,0,.5);
    line-height:1; pointer-events:none;
  }
  .skin-card .skin-ability .trigger-badge{ width:100%; aspect-ratio:1/1; font-size:min(4.5vw,15px); }
  .trigger-badge.trigger-badge-plain{
    transform: translate(calc(var(--i, 0) * -62%), calc(var(--i, 0) * -22%)); z-index:calc(var(--i, 0) + 3) !important;
    position:absolute; z-index:3; bottom:6%; right:6%;
    width:24%; aspect-ratio:1/1; font-size:min(2.6vw,13px);
  }
  .tb-placement{ background:#64748b; }       /* onPlacement : gris-bleu, déclenchement ponctuel */
  .tb-startofturn{ background:#d97706; }     /* startOfTurn : ambre, récurrent */
  .tb-combo-atk{ background:#dc2626; }       /* onCombo:atk : rouge, cohérent avec --atk */
  .tb-combo-shield{ background:#2563eb; }    /* onCombo:shield : bleu, cohérent avec --shield */
  .tb-combo-revive{ background:#16a34a; }    /* onCombo:revive : vert, cohérent avec --revive */
  .tb-activation{ background:#7c3aed; }      /* onActivation : violet, "déverrouillage" */
  .tb-disable{ background:#334155; }         /* onDisable : abandonné en conception, gardé par complétude */

  /* ---------------------------------------------------------------------
     Indicateur de rareté — un GLOW sur la TUILE elle-même (la carte posée / en main), ni sur la
     case (.cell, le slot), ni sur le cadre PNG (.skin-frame) : en mode skin il habille
     l'illustration (.skin-illus, sous le cadre) via drop-shadow ; sans skin il habille .tile
     (halo flou, sans filet plein). vert = uncommon, bleu = rare, orange = ultra-rare ("unique"),
     rouge = crafted (prévu, pas encore utilisé). Commune : aucun glow.
     --------------------------------------------------------------------- */
  /* Intensité par rareté : uncommon = référence (x1) ; rare x1.3 ; ultra-rare x1.5 (rayons et opacité, opacité plafonnée à 1). */
  :root{ --rar-uncommon:rgba(34,197,94,.75); --rar-rare:rgba(59,130,246,.975); --rar-epic:rgba(255,138,31,1); --rar-crafted:rgba(239,68,68,.75); }
  /* Halo de rareté en mode skin : box-shadow sur un PSEUDO-ÉLÉMENT calé sur l'illustration (et non drop-shadow empilé sur l'<img>,
     que Safari/iPad tronque en rectangle et décale d'un seul côté). Rapport d'intensité par rareté conservé (x1 / x1.3 / x1.5), puis DOUBLÉ globalement (couches dupliquées, halo 1.6x plus étendu). */
  .skin-card::before{ content:""; position:absolute; left:50%; top:50%; width:90%; height:90%; transform:translate(-50%,-50%);
    border-radius:8%; pointer-events:none; z-index:0; }
  .skin-card.rarity-uncommon::before{ box-shadow: 0 0 8px 1.6px rgba(34,197,94,0.75), 0 0 8px 1.6px rgba(34,197,94,0.75), 0 0 17.6px 4px rgba(34,197,94,0.64), 0 0 17.6px 4px rgba(34,197,94,0.64); }
  .skin-card.rarity-rare::before{ box-shadow: 0 0 10.4px 2.08px rgba(59,130,246,0.975), 0 0 10.4px 2.08px rgba(59,130,246,0.975), 0 0 22.88px 5.2px rgba(59,130,246,0.832), 0 0 22.88px 5.2px rgba(59,130,246,0.832); }
  .skin-card.rarity-unique::before{ box-shadow: 0 0 12px 2.4px rgba(255,138,31,1), 0 0 12px 2.4px rgba(255,138,31,1), 0 0 26.4px 6px rgba(255,138,31,0.96), 0 0 26.4px 6px rgba(255,138,31,0.96); }
  .skin-card.rarity-crafted::before{ box-shadow: 0 0 8px 1.6px rgba(239,68,68,0.75), 0 0 8px 1.6px rgba(239,68,68,0.75), 0 0 17.6px 4px rgba(239,68,68,0.64), 0 0 17.6px 4px rgba(239,68,68,0.64); }
  .tile.rarity-uncommon, .hand-card.rarity-uncommon .tile{ box-shadow: 0 0 5px 1px rgba(34,197,94,0.75), 0 0 11px 2.5px rgba(34,197,94,0.64); }
  .tile.rarity-rare, .hand-card.rarity-rare .tile{ box-shadow: 0 0 6.5px 1.3px rgba(59,130,246,0.975), 0 0 14.3px 3.25px rgba(59,130,246,0.832); }
  .tile.rarity-unique, .hand-card.rarity-unique .tile{ box-shadow: 0 0 7.5px 1.5px rgba(255,138,31,1), 0 0 16.5px 3.75px rgba(255,138,31,0.96); }
  .tile.rarity-crafted, .hand-card.rarity-crafted .tile{ box-shadow: 0 0 5px 1px rgba(239,68,68,0.75), 0 0 11px 2.5px rgba(239,68,68,0.64); }

  /* ---------------------------------------------------------------------
     Panneau flottant d'inspection d'une carte — ouvert dès qu'on touche la
     tuile (tactile, y compris pendant le glisser-déposer) ou qu'on la
     survole (souris). Positionné en JS AUTOUR de la tuile (au-dessus, en
     dessous ou sur le côté) sans jamais recouvrir ni la tuile ni ses
     flèches de lien ; semi-transparent ; se déplie depuis le centre de la
     tuile (scale 0 -> 1, 0,1 s, transform-origin posé en JS). Purement
     informatif : pointer-events:none, n'intercepte jamais un clic/drag.
     --------------------------------------------------------------------- */
  .card-detail-panel{
    position:fixed; left:0; top:0; z-index:10000; pointer-events:none;
    width:max-content; max-width:min(250px, 66vw); box-sizing:border-box;
    padding:9px 12px 10px; border-radius:12px;
    background:rgba(26,27,28,.72); border:1px solid rgba(255,255,255,.16);
    box-shadow:0 6px 24px rgba(0,0,0,.4);
    -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px);
    color:#eeeeee; font:13px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
    opacity:0; visibility:hidden; transform:scale(0); transform-origin:50% 50%;
    transition: transform .1s ease-out, opacity .1s ease-out, visibility 0s linear .1s;
  }
  .card-detail-panel.open{
    opacity:1; visibility:visible; transform:scale(1);
    transition: transform .1s ease-out, opacity .1s ease-out, visibility 0s;
  }
  body.ui-skin .card-detail-panel{ background:rgba(16,16,17,.72); border-color:rgba(255,140,50,.45); }
  .cd-head{ display:flex; align-items:center; gap:8px; margin-bottom:3px; }
  .cd-name{ font-size:14px; font-weight:800; }
  .cd-rarity{ font-size:9.5px; font-weight:700; text-transform:uppercase; letter-spacing:.06em;
    padding:1px 7px; border-radius:999px; background:rgba(55,65,81,.8); color:#d1d5db; }
  .cd-rarity.rarity-uncommon{ background:rgba(20,83,45,.85); color:#86efac; }
  .cd-rarity.rarity-rare{ background:rgba(30,58,138,.85); color:#93c5fd; }
  .cd-rarity.rarity-unique{ background:rgba(120,53,15,.85); color:#fcd34d; }
  .cd-sentence{ margin:0; }
  .cd-trigger{ color:#bbbdc0; }
  .cd-effect{ font-weight:700; color:#fff; }
  .cd-target{ color:var(--accent-2); }
  .cd-none{ color:#bbbdc0; }
  .cd-meta{ margin-top:4px; font-size:11px; color:#9a95b8; }
  /* Ancre de flèche : largeur réelle = --arrow-w% (pas 0), décalée de la
     moitié de sa propre largeur pour que son bord SUPÉRIEUR (pas un coin)
     soit centré exactement sur le point d'ancrage — évite le piège d'un
     pourcentage résolu contre un parent de largeur nulle, et évite aussi
     tout souci d'ordre de composition entre translate et rotate (seule la
     rotation est un transform ici, le centrage se fait en position pure). */
  .skin-card .skin-anchor{
    position:absolute; height:0; z-index:2;
    width: calc(var(--arrow-w) * 1%);
    left: calc(50% + var(--dx) * var(--h) - var(--arrow-w) * 0.5%);
    top:  calc(50% + var(--dy) * var(--h));
  }
  .skin-card .skin-anchor.facet{ --h: var(--hf); }
  .skin-card .skin-anchor.diag{ --h: var(--hd); }
  .skin-card .skin-anchor img{
    position:absolute; left:0; top:0; width:100%; height:auto;
    transform-origin:50% 0%; transform: rotate(var(--rot));
    /* Opaque dans les deux cas : l'état (allumé/éteint) est porté par
       l'image elle-même (ui045.webp vs ui045c.webp), pas par une opacité
       CSS artificielle. */
    transition: filter .2s;
  }
  .skin-card .skin-anchor.linked img{
    filter: drop-shadow(0 0 6px var(--arrow-glow)) drop-shadow(0 0 2px var(--arrow-glow));
  }
  .skin-a-n  { --dx:  0; --dy: -1; --rot:   0deg; }
  .skin-a-ne { --dx:  1; --dy: -1; --rot:  45deg; }
  .skin-a-e  { --dx:  1; --dy:  0; --rot:  90deg; }
  .skin-a-se { --dx:  1; --dy:  1; --rot: 135deg; }
  .skin-a-s  { --dx:  0; --dy:  1; --rot: 180deg; }
  .skin-a-sw { --dx: -1; --dy:  1; --rot: 225deg; }
  .skin-a-w  { --dx: -1; --dy:  0; --rot: 270deg; }
  .skin-a-nw { --dx: -1; --dy: -1; --rot: 315deg; }

  /* =====================================================================
     ANIMATION DE COMBO — fonctionne identiquement en skin ON/OFF (le
     contenu de .combo-flash est soit une image d'icône de type, soit un
     .sym CSS, cf comboFlashIconHtml en JS). Phase 1 : le reste de la carte
     s'efface (.combo-fade-out) pendant que le symbole grossit sur place
     (.combo-flash -> .active). Phase 2 : un clone flottant (.combo-flash-
     floating, position:fixed, ajouté/positionné/animé en JS car sa
     trajectoire dépend de positions connues seulement à l'exécution)
     voyage en arc jusqu'à la cible puis disparaît.
     ===================================================================== */
  .combo-fade-out{ transition: opacity .3s ease; opacity: 0 !important; }
  /* Zoom-in de la carte qui déclenche un effet (avant l'animation du symbole) */
  body .cell.effect-zoom{ transform: scale(1.35) !important; z-index: 30; transition: transform .25s cubic-bezier(.2,.8,.3,1); }
  .combo-flash{
    position:absolute; inset:0; z-index:15;
    display:flex; align-items:center; justify-content:center;
    pointer-events:none;
    opacity:0; transform:scale(0.35);
    transition: opacity .3s ease, transform .3s cubic-bezier(.34,1.56,.64,1);
  }
  .combo-flash.active{ opacity:1; transform:scale(1); }
  .combo-flash img{ width:55%; height:auto; filter: drop-shadow(0 0 12px rgba(255,255,255,0.65)); }
  .combo-flash .sym{
    width:60%; height:60%; font-size:min(9vw,52px);
    box-shadow: 0 0 18px 4px rgba(255,255,255,0.35);
  }
  .combo-flash-floating{
    position:fixed; z-index:9999; pointer-events:none;
    display:flex; align-items:center; justify-content:center;
    left:0; top:0; /* repositionné image par image en JS */
  }
  .combo-flash-floating img{ width:100%; height:auto; filter: drop-shadow(0 0 12px rgba(255,255,255,0.65)); }
  .combo-flash-floating .sym{
    width:100%; height:100%; font-size:min(9vw,52px);
    box-shadow: 0 0 18px 4px rgba(255,255,255,0.35);
  }

  /* ---------- Hand ---------- */
  /* Le carré parfait des cartes est calculé en JS (sizeHandCards, dans
     game-ui.js) plutôt qu'en CSS pur : l'interaction flexbox + aspect-ratio
     s'est révélée peu fiable pour "N cartes qui se partagent l'espace
     disponible en restant carrées, quelle que soit l'orientation". Le CSS
     ne fait ici que centrer les cartes ; leur width/height exacts en px
     sont posés directement en style inline par le JS, recalculés à chaque
     rendu de la main ET au resize/changement d'orientation. */
  :root{ --hand-col-width: 92px; --hand-card-max: 118px; }
  .hand-wrap{ flex:0 0 auto; width: var(--hand-col-width); height:100%; display:flex; touch-action:none; }
  .hand{
    display:flex; flex-direction:column; flex-wrap:nowrap;
    justify-content:center; align-items:center;
    gap: 20px; padding: 8px 4px; width:100%; height:100%; overflow:visible;
    touch-action:none;
  }
  .hand-card{
    position:relative; flex: 0 0 auto;
    border-radius:13px; background: linear-gradient(145deg,#303234,#1c1d1f);
    border: 1.5px solid var(--line);
    touch-action: none; /* laisse le pointeur piloter le drag plutôt que le scroll natif */
    --arrow-side: 13px;
    --arrow-len: 21px;
    --arrow-edge: -10px;
    --arrow-corner: -5px;
  }
  .hand-card .sym{ width:18px; height:18px; font-size:12px; }
  .hand-card .arrow{ opacity:0.75; border-bottom-color: var(--muted); }
  .hand-card.skinned{
    background:none; border:none; border-radius:0; /* le cadre image est la seule décoration */
  }
  .hand-card .lock-badge{ position:absolute; top:3px; left:3px; font-size:14px; line-height:1; pointer-events:none; z-index:5; filter:drop-shadow(0 1px 1px rgba(0,0,0,.6)); }
  .hand-card.selected{
    border-color: var(--select);
    box-shadow: 0 0 0 2px var(--select), 0 0 10px rgba(var(--select-rgb),0.5);
    transform: translateY(-4px);
  }

  /* ---------- Log / status ---------- */
  .status{
    text-align:center; font-size:12px; color:var(--muted); min-height:16px; padding: 2px 8px;
  }
  /* Le jeu attend la sélection d'une cible : la raison + la consigne passent en grand et pulsent franchement. */
  @keyframes target-prompt-pulse{
    0%,100%{ transform:scale(1);    opacity:.72; text-shadow:0 0 0 rgba(255,63,164,0); }
    50%    { transform:scale(1.09); opacity:1;   text-shadow:0 0 14px var(--accent), 0 0 28px var(--accent); }
  }
  .status.target-prompt{
    font-size:19px; font-weight:800; line-height:1.25; color:#fff; min-height:48px; padding:6px 10px;
    animation: target-prompt-pulse .8s ease-in-out infinite; transform-origin:50% 50%;
  }
  @media (prefers-reduced-motion: reduce){ .status.target-prompt{ animation-duration:1.6s; } }

  /* ---------- Modal ---------- */
  .overlay{
    position:fixed; inset:0; background:rgba(8,6,16,0.72);
    display:flex; align-items:center; justify-content:center; z-index:50;
    padding:20px;
  }
  .modal{
    background: none; border:1px solid var(--line); border-radius:16px;
    padding:20px; width:100%; max-width:340px; text-align:center;
  }
  .modal h2{ margin:0 0 6px; font-size:17px; }
  .modal p{ margin:0 0 16px; font-size:13px; color:var(--muted); }
  .choice-row{ display:flex; gap:8px; justify-content:center; }
  .choice-btn{
    flex:1; padding:12px 6px; border-radius:12px; border:1.5px solid var(--line);
    background: var(--panel-2); color:var(--text); font-size:20px; font-weight:800;
  }
  .choice-btn.atk{ border-color: var(--atk); }
  .choice-btn.shield{ border-color: var(--shield); }
  .choice-btn.revive{ border-color: var(--revive); }
  .choice-btn small{ display:block; font-size:10px; margin-top:4px; color:var(--muted); }
  .primary-btn{
    margin-top: 14px; width:100%; padding:12px; border-radius:12px; border:none;
    background: var(--accent); color:#fff; font-size:14px; font-weight:800;
  }


  /* ---------- Écran de fin (victoire / défaite) : DÉRIVÉ du panneau de log ----------
     Mêmes classes que le log (.log-overlay / .log-panel / .log-head) => même cadre, même skin 9-slice ;
     on ne change que la hauteur (auto), le titre (néon) et l'apparition (animation). */
  .end-overlay{ z-index:55; animation: end-backdrop .45s ease-out both; }  /* sous le log (60) : le log s'ouvre par-dessus */
  .end-overlay.win { --na: 255,150,40; --nb: 255,206,110; }   /* néon cyan + magenta */
  .end-overlay.lose{ --na: 255,42,85;  --nb: 255,110,40; }   /* néon rouge + violet */
  .end-overlay.draw{ --na: 255,196,61; --nb: 255,255,255; }   /* néon ambre + blanc */
  .end-overlay.draw .end-panel{ animation: end-pop .75s cubic-bezier(.2,1.35,.4,1) .08s both; }
  /* .log-panel.end-panel : spécificité > .log-panel (déclaré plus bas), sinon sa hauteur 86vh l'emporte. */
  .log-panel.end-panel{
    height:auto; width:min(400px, 100%); text-align:center; position:relative;
    /* Glow par drop-shadow (suit la FORME de l'image du cadre, coins chanfreinés inclus) et non box-shadow (rectangle du conteneur). */
    box-shadow:none;
    filter: drop-shadow(0 0 10px rgba(var(--na),.55)) drop-shadow(0 0 34px rgba(var(--nb),.38));
  }
  .end-overlay.win  .end-panel{ animation: end-pop .75s cubic-bezier(.2,1.35,.4,1) .08s both; }
  .end-overlay.lose .end-panel{ animation: end-drop .7s cubic-bezier(.22,.9,.3,1) .08s both, end-shake .5s ease-in-out .78s both; }
  /* Skin : l'image du cadre (tile.webp, 9-slice avec `fill`) EST le fond ; on supprime l'aplat sombre du panneau de log. */
  body.ui-skin .log-panel.end-panel{ background:none; }
  body.ui-skin .log-panel.end-panel::before{ border-image: url(./ui/skin/tile.webp) 82 fill / 30px stretch; }
  .end-panel .log-head{ justify-content:center; padding: 6px 4px 4px; }
  .end-panel .log-head h2,
  body.ui-skin .end-panel .log-head h2{
    font-size:34px; font-weight:900; letter-spacing:.12em; color:#fff;
    text-shadow: 0 0 4px #fff, 0 0 10px rgb(var(--na)), 0 0 22px rgb(var(--na)), 0 0 44px rgb(var(--na)), 0 0 80px rgb(var(--nb));
    animation: end-rise .55s ease-out .45s both, end-neon-pulse 2.6s ease-in-out 1.1s infinite;
  }
  .end-overlay.lose .end-panel .log-head h2{ animation: end-rise .55s ease-out .45s both, end-neon-flicker 3.2s linear 1.1s infinite; }
  .end-text{
    margin:2px 0 16px; font-size:14px; font-weight:600; letter-spacing:.04em; color: rgb(var(--na));
    text-shadow: 0 0 6px rgba(var(--na),.9), 0 0 16px rgba(var(--na),.55);
    animation: end-rise .5s ease-out .65s both;
  }
  .end-tenacity{ display:flex; align-items:center; justify-content:center; gap:12px; margin:0 0 16px; font-size:14px; font-weight:700; letter-spacing:.04em; color:#fff; animation: end-rise .5s ease-out .75s both; }
  .end-tenacity[hidden]{ display:none; }
  .end-tenacity .tok-ico{ width:56px; height:56px; }
  .end-actions{ display:flex; flex-direction:column; align-items:center; gap:14px; padding:0 4px 8px; animation: end-rise .5s ease-out .85s both; }
  /* Bouton Log : le .newgame-btn du jeu, agrandi de 50 % (12px -> 18px ; les paddings/bordures du skin sont en em, ils suivent). */
  .end-panel #endLogBtn{ font-size:18px; padding:10.5px 18px; border-radius:15px; }
  body.ui-skin .end-panel #endLogBtn{ padding:.1em .6em; border-radius:0; }
  /* Bouton Nouvelle partie : dérivé du même bouton, en plus grand ; en skin, sprite de la plus grande variante (cf. data-skin-variant). */
  .end-panel .newgame-btn.end-new-btn{ align-self:stretch; font-size:20px; padding:15px 12px; border-radius:12px; letter-spacing:.06em; }
  body.ui-skin .end-panel .newgame-btn.end-new-btn{ font-size:24px; padding:.3em .6em; border-radius:0; }

  .end-fx{ position:absolute; inset:0; overflow:hidden; pointer-events:none; z-index:0; }
  .end-panel{ z-index:1; }
  /* Voxels : cubes 3D (6 faces) à bordures orange et faces orange translucides */
  .end-fx{ perspective: 700px; }
  .vox{ position:absolute; top:-8vh; left:var(--x); width:var(--s); height:var(--s); transform-style:preserve-3d; opacity:0;
    animation: end-vox-fall var(--d) cubic-bezier(.3,.6,.5,1) var(--delay) both; }
  .vox-cube{ position:absolute; inset:0; transform-style:preserve-3d; animation: end-vox-spin var(--spin) linear var(--delay) infinite; }
  .vox-cube b{ position:absolute; inset:0; box-sizing:border-box; border:1.5px solid #ff8a1f; background: rgba(255,138,31,.22);
    box-shadow: 0 0 6px rgba(255,138,31,.7), inset 0 0 6px rgba(255,138,31,.45); }
  .vox-cube b:nth-child(1){ transform: translateZ(calc(var(--s) / 2)); }
  .vox-cube b:nth-child(2){ transform: rotateY(180deg) translateZ(calc(var(--s) / 2)); }
  .vox-cube b:nth-child(3){ transform: rotateY(90deg) translateZ(calc(var(--s) / 2)); }
  .vox-cube b:nth-child(4){ transform: rotateY(-90deg) translateZ(calc(var(--s) / 2)); }
  .vox-cube b:nth-child(5){ transform: rotateX(90deg) translateZ(calc(var(--s) / 2)); }
  .vox-cube b:nth-child(6){ transform: rotateX(-90deg) translateZ(calc(var(--s) / 2)); }
  @keyframes end-backdrop{ from{ opacity:0; backdrop-filter: blur(0); } to{ opacity:1; backdrop-filter: blur(3px); } }
  @keyframes end-pop{ 0%{ opacity:0; transform: scale(.55) rotate(-3deg); } 60%{ opacity:1; transform: scale(1.07) rotate(.6deg); } 100%{ opacity:1; transform: scale(1) rotate(0); } }
  @keyframes end-drop{ 0%{ opacity:0; transform: translateY(-60px) scale(.96); } 100%{ opacity:1; transform: translateY(0) scale(1); } }
  @keyframes end-shake{ 0%,100%{ transform: translateX(0); } 20%{ transform: translateX(-7px); } 40%{ transform: translateX(6px); } 60%{ transform: translateX(-4px); } 80%{ transform: translateX(2px); } }
  @keyframes end-rise{ from{ opacity:0; transform: translateY(14px); } to{ opacity:1; transform: translateY(0); } }
  @keyframes end-neon-pulse{
    0%,100%{ text-shadow: 0 0 4px #fff, 0 0 10px rgb(var(--na)), 0 0 22px rgb(var(--na)), 0 0 44px rgb(var(--na)), 0 0 80px rgb(var(--nb)); }
    50%{ text-shadow: 0 0 3px #fff, 0 0 7px rgb(var(--na)), 0 0 14px rgb(var(--na)), 0 0 28px rgb(var(--na)), 0 0 50px rgb(var(--nb)); }
  }
  @keyframes end-neon-flicker{
    0%,18%,22%,25%,53%,57%,100%{ opacity:1; text-shadow: 0 0 4px #fff, 0 0 10px rgb(var(--na)), 0 0 22px rgb(var(--na)), 0 0 44px rgb(var(--na)), 0 0 80px rgb(var(--nb)); }
    20%,24%,55%{ opacity:.55; text-shadow: none; }
  }
  @keyframes end-vox-fall{
    0%{ opacity:0; transform: translate3d(0,0,0); }
    8%{ opacity:1; }
    100%{ opacity:.95; transform: translate3d(var(--drift),112vh,0); }
  }
  @keyframes end-vox-spin{
    from{ transform: rotate3d(var(--ax), var(--ay), 0.4, 0deg); }
    to{ transform: rotate3d(var(--ax), var(--ay), 0.4, 360deg); }
  }
  @media (prefers-reduced-motion: reduce){
    .end-overlay, .end-panel, .end-panel .log-head h2, .end-text, .end-actions{ animation-duration:.01s !important; animation-delay:0s !important; animation-iteration-count:1 !important; }
    .end-fx{ display:none; }
  }

  /* =====================================================================
     RESPONSIVE — 3 modes : téléphone (défaut ci-dessus, portrait), iPad
     portrait (même structure, agrandie), iPad paysage (structure différente,
     restaurée explicitement ci-dessous). Mobile-first : le défaut EST le
     mode portrait vertical ; le paysage est l'exception qui réécrit la
     disposition, pas l'inverse.
     ===================================================================== */

  /* ---------- iPad portrait (et plus large, toujours portrait) ---------- */
  /* Même disposition que le téléphone (barres verticales couplées à leur
     grille, main en colonne à droite) : on a juste plus d'espace, donc tout
     grandit et le rythme se resserre pour combler le vide. */
  @media (min-width: 700px) and (orientation: portrait){
    #app{ max-width: 1100px; padding: 14px 20px calc(14px + env(safe-area-inset-bottom)); }
    :root{
      --grid-max: 460px; --hpbar-thickness: 40px; /* doublé (était 20px) */
      --hand-col-width: 190px; --hand-card-max: 200px;
    }
    .brand{ font-size:16px; }
    .brand small{ font-size:11px; }
    .hprow .name{ font-size:12px; }
    .hpval{ font-size:13px; }
    .status:not(.target-prompt){ font-size:14px; }
    .sym{ width:24px; height:24px; font-size:16px; }
    .arenas{ gap:28px; } /* padding entre les 2 arènes */
    .side{ gap:14px; } /* barre de PV collée à la grille, juste un peu d'air */
    .boards{ gap:14px; }
    .main-row{ gap:18px; }
    .hand{ gap:28px; } /* padding entre les cartes de la main */
    .hand-card .sym{ width:22px; height:22px; font-size:15px; }
  }

  /* ---------- iPad paysage (et plus large en orientation paysage) ---------- */
  /* La largeur dépasse largement la hauteur : on restaure ici l'orientation
     HORIZONTALE (barres au-dessus de chaque grille, main en bande sous les
     deux arènes) — c'est la disposition validée en playtest pour ce format.
     Les deux arènes passent côte à côte ; la taille des grilles reste bornée
     par vh en plus de vw pour ne jamais déborder d'un écran court. */
  @media (min-width: 900px) and (orientation: landscape){
    #app{ max-width: 1400px; padding: 10px 28px calc(10px + env(safe-area-inset-bottom)); }
    :root{ --grid-size: min(34vw, 58vh, 420px); --hand-max-width: 720px; }

    .main-row{ flex-direction: column; gap:0; }
    .arenas{ flex-direction: row; justify-content:center; align-items:flex-start; gap: 28px; }
    .side{ flex-direction:column; align-items:stretch; width:auto; flex: 0 1 auto; gap:6px; }
    .boards{ gap:6px; }
    .status:not(.target-prompt){ font-size:13px; padding:2px 12px; }

    /* Barre de PV horizontale, au-dessus de sa grille */
    .hprow{ flex-direction:row; align-items:center; justify-content:flex-start; width:auto; padding:4px 6px; gap:8px; }
    .hprow .name{ font-size:13px; width:56px; flex-shrink:0; }
    .hpbar{ width:auto; height:12px; min-height:0; }
    .hpbar-fill{ position:static; width: calc(var(--hp-ratio,1)*100%); height:100%; background: linear-gradient(90deg, var(--bad), var(--accent)); }
    .hprow.player .hpbar-fill{ background: linear-gradient(90deg, var(--accent-2), var(--good)); }
    .hpval{ font-size:13px; width:36px; text-align:right; }

    /* Grille en taille explicite (vw/vh), plus de flex:1 partagé avec une barre latérale */
    .grid{ flex:0 0 auto; width:var(--grid-size); max-width:none; margin:0 auto; }

    /* Main en bande horizontale sous les deux arènes. Le carré des cartes
       est toujours calculé en JS (sizeHandCards) — ce bloc ne fait que
       poser le sens (row) et les bornes max, que le JS lit dynamiquement. */
    /* BUG CORRIGÉ : `height:auto` ici créait une référence circulaire avec
       sizeHandCards() (game-ui.js), qui MESURE .hand-wrap pour calculer la
       taille de chaque carte — mais tant qu'aucune carte n'a de taille, le
       contenu est vide et la hauteur "auto" s'effondre à quasi 0, plafonnant
       toute carte à une taille microscopique. Hauteur EXPLICITE (non
       circulaire) = le plafond de carte + le padding vertical de .hand. */
    .hand-wrap{ width:100%; height: calc(var(--hand-card-max) + 16px); --hand-card-max: 130px; }
    .hand{
      flex-direction:row; flex-wrap:nowrap; align-items:center; justify-content:center;
      gap: min(2.5vw, 18px); max-width: var(--hand-max-width); width:100%; height:auto;
      margin: 6px auto 0; overflow:visible;
    }
    .hand-card{ flex: 0 0 auto; }

    .sym{ width:22px; height:22px; font-size:15px; }
  }

  /* Paysage encore plus large (iPad Pro, desktop) : un peu plus d'air. */
  @media (min-width: 1200px) and (orientation: landscape){
    :root{ --grid-size: min(30vw, 60vh, 460px); }
    .arenas{ gap: 48px; }
  }

  /* =====================================================================
     SKIN UI (toggle unique, classe body.ui-skin) — fond, logo, tuiles
     vides, barres de PV, boutons. Tout est en images PNG/JPG relatives
     (./ui/skin/), jamais de base64. Seuls les halos de ciblage restent en
     CSS (drop-shadow qui épouse la forme de l'image).
     ===================================================================== */
  .brand{ display:flex; align-items:center; }
  .brand-logo{ display:none; }
  body.ui-skin .brand-logo{ display:block; height:46px; width:auto; position:relative; }
  body.ui-skin .brand{ position:relative; isolation:isolate; }
  body.ui-skin .brand::before{ content:""; position:absolute; z-index:-1; inset:-45% -22%; background:var(--logo-halo); pointer-events:none; }
  body.ui-skin .brand-text{ display:none; }
  /* Fond d'écran commun (combat, accueil, campaign, marchand, deck...) : bg.webp désaturé de moitié, sans voile ni changement de luminosité. */
  body.ui-skin::before{ content:""; position:fixed; inset:0; z-index:-1; pointer-events:none;
    background: url(./ui/skin/bg.webp) center / cover no-repeat;
    filter: grayscale(.5); }

  body.ui-skin{
    background: transparent;   /* l'image de fond est dessinée par body.ui-skin::before (désaturée), visible sur TOUS les écrans */
    --hpbar-thickness: 30px;
    --hp-t: var(--hpbar-thickness);              /* épaisseur de la barre (px) */
    --hp-cap: calc(var(--hp-t) * 40 / 79);       /* embout non étiré (tranche 40px de la source 79px) */
    --hp-inner: calc(var(--hp-t) * 26 / 79);     /* marge entre bord du sprite et début de la jauge */
    --hp-empty: url(./ui/skin/bar-v-empty.webp);
    --hp-fill-ai: url(./ui/skin/bar-v-red.webp);
    --hp-fill-player: url(./ui/skin/bar-v-green.webp);
  }

  /* ---- Tuiles vides de l'arène ---- */
  body.ui-skin .cell{ background:none; border:0; border-radius:0; box-shadow:none; transform:none; }
  body.ui-skin .cell::before{
    content:""; position:absolute; inset:0; pointer-events:none;
    background: url(./ui/skin/tile.webp) center / 100% 100% no-repeat;
    transition: filter .15s, transform .15s; filter: grayscale(1);
  }
  body.ui-skin .cell.placeable::before{ filter: grayscale(1) drop-shadow(0 0 3px var(--select)) drop-shadow(0 0 9px var(--select)); }
  body.ui-skin .cell.drag-over::before{ filter: grayscale(1) drop-shadow(0 0 4px #fff) drop-shadow(0 0 14px var(--select)); transform: scale(1.04); }
  body.ui-skin .cell.targetable-card::before{ filter: grayscale(1) drop-shadow(0 0 3px var(--atk)) drop-shadow(0 0 9px var(--atk)); }
  body.ui-skin .cell.targetable-revive::before{ filter: grayscale(1) drop-shadow(0 0 3px var(--revive)) drop-shadow(0 0 9px var(--revive)); }
  /* Case occupée : le halo passe sur la carte elle-même (la tuile est cachée dessous) */
  body.ui-skin .cell.targetable-card .skin-card{ filter: drop-shadow(0 0 3px var(--atk)) drop-shadow(0 0 9px var(--atk)); }
  body.ui-skin .cell.targetable-revive .skin-card{ filter: drop-shadow(0 0 3px var(--revive)) drop-shadow(0 0 9px var(--revive)); }
  body.ui-skin .cell.targetable-card .skin-card.disabled,
  body.ui-skin .cell.targetable-revive .skin-card.disabled{ filter: grayscale(.9) brightness(.55) drop-shadow(0 0 9px var(--revive)); }

  /* ---- Barres de PV : version verticale (portrait) = sprites horizontaux pivotés de 90° ---- */
  body.ui-skin .hpbar{ background:none; border:0; border-radius:0; overflow:visible; box-shadow:none; }
  body.ui-skin .hpbar::before,
  body.ui-skin .hpbar-fill{
    content:""; position:absolute; inset:0; width:auto; height:auto; background:none;
    border-style:solid; border-color:transparent; border-width: var(--hp-cap) 0;
    border-image-slice: 40 0 40 0 fill; border-image-width: 1; border-image-repeat: stretch;
    box-sizing:border-box; pointer-events:none;
  }
  body.ui-skin .hpbar::before{ border-image-source: var(--hp-empty); }
  body.ui-skin .hprow .hpbar-fill, body.ui-skin .hprow.player .hpbar-fill{ background:none; }
  body.ui-skin .hprow .hpbar-fill{ border-image-source: var(--hp-fill-ai); }
  body.ui-skin .hprow.player .hpbar-fill{ border-image-source: var(--hp-fill-player); }
  body.ui-skin .hpbar-fill{
    /* portrait : la jauge se vide de haut en bas (le bas = début de la barre) */
    clip-path: inset(calc(100% - var(--hp-inner) - var(--hp-ratio, 1) * (100% - 2 * var(--hp-inner))) 0 0 0);
    transition: clip-path .3s;
  }
  body.ui-skin .hprow.targetable .hpbar{ box-shadow:none; filter: drop-shadow(0 0 3px var(--atk)) drop-shadow(0 0 9px var(--atk)); }
  body.ui-skin .hprow .name, body.ui-skin .hprow .hpval{ text-shadow: 0 1px 3px #000, 0 0 6px #000; color:#ececec; }
  body.ui-skin .hprow.targetable .name{ color: var(--atk); }

  /* ---- Boutons : 9-slice (coins fixes, centre étiré). La bordure est proportionnelle
         à la police (em) donc la hauteur suit la taille du texte ; le JS (fitSkinButtons)
         choisit le sprite dont les proportions collent le mieux à la boîte du bouton, donc
         à la longueur du texte. ---- */
  body.ui-skin :is(.newgame-btn, .choice-btn, .primary-btn){
    --sb: url(./ui/skin/btn-3.webp); --sb-on: url(./ui/skin/btn-3-on.webp);
    background:none; border-radius:0; border-style:solid; border-color:transparent;
    border-width: .8em;
    border-image: var(--sb) 26 fill / 1 / 0 stretch;
    padding: .1em .6em; color:#efefef; text-shadow: 0 1px 2px #000; cursor:pointer;
    white-space:nowrap; transition: filter .12s;
    filter: grayscale(1) brightness(1.05);   /* sprites de bouton ramenés au gris du cadre de tuile */
  }
  body.ui-skin :is(.newgame-btn, .choice-btn, .primary-btn):hover{ filter: grayscale(1) brightness(1.2) drop-shadow(0 0 5px rgba(255,138,31,.8)); }
  body.ui-skin :is(.newgame-btn, .choice-btn, .primary-btn):active{ border-image-source: var(--sb-on); filter: grayscale(1) brightness(1.35) drop-shadow(0 0 9px rgba(255,138,31,1)); }
  body.ui-skin .choice-btn.atk{ filter: grayscale(1) drop-shadow(0 0 4px var(--atk)); }
  body.ui-skin .choice-btn.shield{ filter: grayscale(1) drop-shadow(0 0 4px var(--shield)); }
  body.ui-skin .choice-btn.revive{ filter: grayscale(1) drop-shadow(0 0 4px var(--revive)); }
  body.ui-skin .choice-btn small{ color:#b4b6b9; }
  body.ui-skin .primary-btn{ font-size:15px; }
  body.ui-skin .modal{ background: rgba(16,16,17,.92); border:1px solid #5a5d60; box-shadow: 0 0 30px rgba(0,0,0,.7); }

  @media (min-width: 700px) and (orientation: portrait){
    body.ui-skin{ --hpbar-thickness: 44px; }
    body.ui-skin .brand-logo{ height:68px; }
  }

  /* ---- Paysage : barres horizontales, sprites non pivotés ---- */
  @media (min-width: 900px) and (orientation: landscape){
    body.ui-skin{
      --hp-t: 30px;
      --hp-empty: url(./ui/skin/bar-h-empty.webp);
      --hp-fill-ai: url(./ui/skin/bar-h-red.webp);
      --hp-fill-player: url(./ui/skin/bar-h-green.webp);
    }
    body.ui-skin .brand-logo{ height:60px; }
    body.ui-skin .hpbar{ height: var(--hp-t); }
    body.ui-skin .hpbar::before,
    body.ui-skin .hpbar-fill{
      border-width: 0 var(--hp-cap); border-image-slice: 0 40 0 40 fill;
    }
    body.ui-skin .hpbar-fill{
      clip-path: inset(0 calc(100% - var(--hp-inner) - var(--hp-ratio, 1) * (100% - 2 * var(--hp-inner))) 0 0);
    }
  }
  /* Ruines (nouveau build) : pas de tuile de skin sous une case détruite */
  body.ui-skin .ruin-cell{ background:none; border:0; border-radius:0; opacity:1; }
  body.ui-skin .ruin-cell::before{ filter: grayscale(1) brightness(.22) contrast(.9); }
  /* =====================================================================
     PANNEAU DE LOG + miniatures d'arène
     ===================================================================== */
  .log-overlay{
    position:fixed; inset:0; z-index:60; display:flex; align-items:center; justify-content:center;
    background: rgba(8,8,9,.62); padding: 14px;
  }
  .log-panel{
    width: min(560px, 100%); height: min(86vh, 860px); display:flex; flex-direction:column;
    background: none; border:1px solid var(--line); border-radius:16px; padding:14px; box-sizing:border-box;
  }
  .log-head{ display:flex; align-items:center; justify-content:space-between; gap:10px; padding: 2px 4px 10px; flex:0 0 auto; }
  .log-head h2{ margin:0; font-size:17px; letter-spacing:.06em; text-transform:uppercase; }
  .log-list{ flex:1 1 auto; min-height:0; overflow-y:auto; display:flex; flex-direction:column; gap:8px; padding: 2px 4px; overscroll-behavior:contain; }
  .log-empty{ margin:auto; color:var(--muted); font-size:13px; }
  .log-entry{
    display:flex; gap:12px; align-items:center; padding:8px 10px; border-radius:10px;
    background: rgba(255,255,255,.04); border-left: 3px solid var(--accent-2);
  }
  .log-entry.ai{ border-left-color: var(--atk); }
  .log-entry .log-meta{ font-size:11px; font-weight:800; letter-spacing:.08em; color: var(--accent-2); margin-bottom:3px; }
  .log-entry.ai .log-meta{ color: var(--atk); }
  .log-entry .log-text{ font-size:13px; line-height:1.35; color: var(--text); min-width:0; }
  .log-entry .log-text b{ font-weight:800; }
  .log-entry .log-text .log-effect{ display:block; margin-top:2px; color: var(--muted); }
  .log-entry .log-text .sym{ width:16px; height:16px; font-size:10px; vertical-align:-3px; display:inline-flex; }
  .log-entry .log-text img{ width:18px; height:18px; vertical-align:-4px; }

  .mini-arena{ flex:0 0 auto; width:135px; display:grid; grid-template-columns:repeat(3,1fr); gap:4px; aspect-ratio:1/1; }
  .mini-cell{ position:relative; border-radius:3px; background: var(--panel-2); border:1px dashed var(--line); }
  .mini-cell.src::after, .mini-cell.tgt::after{
    /* z-index 1 : SOUS les liens de tuiles (flèches .arrow, ancres .skin-anchor : z-index 2) -> les liens passent au-dessus des cadres. */
    content:""; position:absolute; inset:-2px; border-radius:4px; pointer-events:none; z-index:1;
    border:2px solid var(--accent-2); box-shadow: 0 0 6px var(--accent-2);
  }
  .mini-cell.tgt::after{ border-color: var(--atk); box-shadow: 0 0 6px var(--atk); }
  .mini-cell .tile{ border-radius:3px; border-width:1px; --arrow-side:8px; --arrow-len:12px; --arrow-edge:-6.5px; --arrow-corner:-4px; }
  .mini-cell .sym{ width:10px; height:10px; font-size:0; }
  .mini-cell .arrow{ z-index:2; }
  /* Miniatures du log : AUCUN glow de rareté (le liseré de lien actif, lui, est conservé). */
  .mini-cell .skin-card .skin-illus{ filter:none; }
  .mini-cell .skin-card::before{ box-shadow:none !important; }
  .mini-cell .tile:not(.tile-linked){ box-shadow:none; }
  .mini-cell .tile.tile-linked{ box-shadow: 0 0 0 1.5px var(--accent-2), 0 0 6px rgba(255,154,61,0.25); }
  /* Carte désactivée (filter => contexte d'empilement propre) : on la relève au-dessus du cadre pour que ses liens le restent aussi. */
  .mini-cell .skin-card.disabled{ z-index:2; }

  body.ui-skin .log-overlay{ background: rgba(7,7,8,.7); }
  body.ui-skin .log-panel{
    position:relative; isolation:isolate;
    background: none; border-radius:0; border-style:solid; border-color:transparent; border-width:30px; padding:6px 10px;
    border-image:none;
  }
  /* Cadre 9-slice en pseudo-élément : seul le cadre (tile.webp, bleu) est désaturé, pas le contenu. */
  body.ui-skin .log-panel::before{ content:""; position:absolute; inset:-30px; z-index:-1; pointer-events:none;
    border:30px solid transparent; border-image: url(./ui/skin/tile.webp) 82 / 30px stretch; filter: grayscale(1) brightness(.95); }
  body.ui-skin .log-entry{ background: rgba(44,46,48,.55); border-radius:0; }
  body.ui-skin .mini-cell{ border:0; border-radius:0; background: url(./ui/skin/tile.webp) center / 100% 100% no-repeat; }
  body.ui-skin .mini-cell .tile{ border-radius:0; }
  body.ui-skin .mini-cell.src::after, body.ui-skin .mini-cell.tgt::after{ inset:-1px; border-radius:2px; }
  body.ui-skin .log-head h2{ text-shadow: 0 0 10px rgba(255,150,60,.6); }
  /* Ruines dans la miniature du log */
  .mini-cell.ruin-mini{ background:#0b0c10; border:1px solid #14161c; }

  /* ---------- Mode debug caché ---------- */
  .brand-wrap{ display:flex; align-items:center; gap:8px; overflow:visible; }
  /* Le halo du logo déborde de la barre : on garde l'en-tête au-dessus du reste et sans rognage. */
  .topbar{ position:relative; z-index:3; overflow:visible; }
  .brand, .brand-logo{ overflow:visible; }
  .home-screen, .home-inner{ overflow:visible; }
  .home-build{ position:fixed; left:0; right:0; bottom:calc(10px + env(safe-area-inset-bottom)); text-align:center; font-size:12px; letter-spacing:.18em;
    text-transform:uppercase; color:var(--muted); opacity:.8; pointer-events:none; z-index:171; }
  body:not(.home-open) .home-build{ display:none; }
  .brand{ -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none; touch-action:manipulation; }
  .dbg-bar{ display:flex; gap:4px; }
  .dbg-bar button{ width:26px; height:26px; padding:0; font-size:14px; line-height:1; border-radius:6px; border:1px solid var(--line);
    background:rgba(10,14,28,.7); cursor:pointer; touch-action:manipulation; }
  .dbg-bar[hidden], .dbg-menu[hidden], .dbg-swap-overlay[hidden], #dkOverlay[hidden]{ display:none !important; }
  #dbgSecret{ position:fixed; left:0; bottom:0; width:56px; height:56px; padding:0; border:0; background:transparent; opacity:0;
    z-index:90; pointer-events:none; touch-action:manipulation; }
  #dbgSecret.armed{ pointer-events:auto; }
  body.dbg-on .cell, body.dbg-on .hand-card{ -webkit-touch-callout:none; -webkit-user-select:none; user-select:none; }
  .dbg-menu{ position:fixed; z-index:95; display:flex; flex-wrap:wrap; gap:6px; padding:8px; max-width:min(92vw, 360px);
    background:rgba(14,14,15,.96); border:1px solid var(--accent-2); border-radius:12px; box-shadow:0 6px 24px rgba(0,0,0,.6); }
  .dbg-menu button{ width:40px; height:40px; padding:0; font-size:20px; line-height:1; border-radius:8px; border:1px solid var(--line);
    background:var(--panel-2); cursor:pointer; touch-action:manipulation; }
  .dbg-menu button:active{ background:var(--accent-2); }
  .dbg-swap-overlay{ position:fixed; inset:0; z-index:100; display:flex; align-items:center; justify-content:center; padding:10px;
    background:rgba(7,7,8,.74); }
  .dbg-swap-panel{ width:min(100%, 780px); height:min(90vh, 900px); display:flex; flex-direction:column; overflow:hidden;
    background:rgba(14,14,15,.97); border:2px solid var(--accent-2); border-radius:14px; box-shadow:0 10px 40px rgba(0,0,0,.7); }
  .dbg-swap-head{ display:flex; align-items:center; gap:10px; padding:8px 12px; font-size:20px; border-bottom:1px solid var(--line); }
  .dbg-swap-head > button{ flex:none; width:34px; height:34px; padding:0; font-size:16px; border-radius:8px; border:1px solid var(--line); background:var(--panel-2); cursor:pointer; }
  .dbg-filters{ flex:1; display:flex; flex-wrap:wrap; gap:6px 14px; min-width:0; }
  .dbg-chips{ display:flex; flex-wrap:wrap; gap:5px; }
  .dbg-chip{ padding:4px 9px; min-height:30px; font-size:12px; font-weight:700; line-height:1; border-radius:999px; border:1.5px solid var(--line);
    background:var(--panel-2); color:var(--muted); cursor:pointer; touch-action:manipulation; white-space:nowrap; }
  .dbg-chip.on{ color:#fff; background:rgba(255,154,61,.16); border-color:var(--chip, var(--accent-2)); box-shadow:0 0 6px var(--chip, var(--accent-2)); }
  .dbg-chip.sym{ font-size:16px; padding:3px 9px; }
  .dbg-count{ flex:none; font-size:11px; color:var(--muted); font-weight:700; }
  .dbg-swap-list{ flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; touch-action:pan-y; padding:14px 14px 20px;
    display:grid; grid-template-columns:repeat(auto-fill, minmax(124px, 1fr)); gap:18px 18px; align-content:start; align-items:stretch; }
  /* Une tuile = zone carte (carrée) + zone texte de même emplacement/gabarit pour toutes ; la rangée prend la hauteur du texte le plus long. */
  .dbg-item{ display:flex; flex-direction:column; gap:7px; cursor:pointer; user-select:none; -webkit-user-select:none; touch-action:manipulation; }
  .dbg-item[hidden]{ display:none !important; }
  .dbg-tile{ position:relative; width:100%; aspect-ratio:1/1; flex:none; }
  .dbg-item.sel .dbg-tile{ outline:2px solid var(--accent-2); outline-offset:5px; border-radius:6px; }
  .dbg-info{ flex:1; min-height:5.6em; padding:0 2px; font-size:10.5px; line-height:1.35; text-align:center; color:#d6d2ea; }
  .dbg-info .dbg-id{ display:block; margin-bottom:2px; font-size:9px; letter-spacing:.06em; color:var(--muted); }
  .dbg-info .cd-sentence{ margin:0; }

  /* Éditeur de rareté (panneau de swap) + log de débug */
  .dbg-rar-menu{ z-index:120; }
  .dbg-rar-menu button.on{ outline:2px solid #fff; outline-offset:1px; }
  .dbg-swap-head > button sup{ font-size:9px; margin-left:1px; color:var(--accent-2); }
  /* Éditeur de deck (debug) : deux colonnes deck / collection, glisser-déposer */
  .dk-panel{ width:min(100%, 1040px); }
  /* Gestionnaire de deck : plein écran (plus de panneau flottant) */
  #dkOverlay{ padding:0; background:rgba(0,0,0,.6); -webkit-backdrop-filter:blur(9px); backdrop-filter:blur(9px); }
  #dkOverlay .dk-panel{ width:100%; max-width:none; height:100%; border:0; border-radius:0; box-shadow:none; background:transparent;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); box-sizing:border-box; }
  .dk-cols{ flex:1; min-height:0; display:flex; gap:10px; padding:10px; }
  .dk-col{ flex:1; min-width:0; display:flex; flex-direction:column; border:1px solid var(--line); border-radius:10px; background:rgba(0,0,0,.22); transition:box-shadow .12s, border-color .12s; }
  .dk-col.drop{ border-color:var(--accent-2); box-shadow:0 0 14px var(--accent-2); }
  .dk-col h3{ margin:0; padding:7px 10px; font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); border-bottom:1px solid var(--line); }
  .dk-list{ flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:30px 20px 24px; display:grid; align-content:start; align-items:stretch;
    grid-template-columns:repeat(auto-fill, minmax(96px, 1fr)); gap:30px 22px; }
  .dk-list .dbg-item{ touch-action:pan-y; cursor:grab; }
  .dk-list .dbg-info{ font-size:9px; min-height:4.8em; }
  .dk-list .dbg-item.locked{ opacity:.38; filter:grayscale(.8); cursor:not-allowed; }
  .dk-list .dbg-item.depleted{ opacity:.3; filter:grayscale(.9); cursor:not-allowed; }
  .dk-list .dbg-item.dragging{ opacity:.35; }
  .dk-badge{ position:absolute; left:50%; bottom:-6px; transform:translateX(-50%); z-index:6; padding:1px 7px; border-radius:999px; font-size:10px; font-weight:800;
    background:#101112; border:1px solid var(--accent-2); color:#fff; white-space:nowrap; pointer-events:none; }
  .dk-ghost{ position:fixed; left:0; top:0; z-index:300; padding:6px 12px; border-radius:8px; pointer-events:none; will-change:transform;
    font-size:13px; font-weight:800; color:#fff; background:#101112; border:2px solid var(--accent-2); box-shadow:0 4px 14px rgba(0,0,0,.7); }
  .dk-list .dbg-item{ contain:layout style; }   /* pas de "paint" : il rognerait les flèches de liens et le glow de rareté qui dépassent de la carte */
  .dk-lock{ display:none; position:absolute; right:-6px; top:-6px; z-index:7; width:26px; height:26px; border-radius:50%; align-items:center; justify-content:center;
    font-size:15px; background:#ff3b5c; border:2px solid #fff; box-shadow:0 0 10px rgba(255,59,92,.9); pointer-events:none; }
  .dk-list .dbg-item.full .dk-lock{ display:flex; }
  .dk-col h3.dk-flash, #dkMsg.dk-flash{ animation:dk-flash .9s ease-out; }
  @keyframes dk-flash{ 0%{ color:#fff; text-shadow:0 0 0 #ff3b5c; transform:scale(1); } 15%{ color:#ff3b5c; text-shadow:0 0 14px #ff3b5c; transform:scale(1.25); } 40%{ transform:scale(1.1); color:#ff3b5c; } 100%{ transform:scale(1); } }
  .dk-col h3{ transform-origin:left center; }
  .dk-actions{ display:flex; align-items:center; justify-content:flex-end; gap:10px; padding:8px 12px; border-top:1px solid var(--line); }
  .dk-actions #dkMsg{ flex:1; font-size:12px; color:var(--muted); }
  .dk-actions button{ min-width:92px; min-height:38px; padding:0 14px; font-weight:800; border-radius:8px; border:1px solid var(--line); background:var(--panel-2); color:#fff; cursor:pointer; }
  .dk-actions #dkOk{ border-color:var(--accent-2); background:rgba(255,154,61,.18); }
  .dk-actions #dkOk:disabled{ opacity:.4; cursor:not-allowed; }
  .dbg-item.mod .dbg-tile::after{ content:"✎"; position:absolute; top:-6px; right:-6px; z-index:5; width:18px; height:18px; border-radius:50%;
    display:flex; align-items:center; justify-content:center; font-size:11px; background:#ff8a1f; color:#111; pointer-events:none; }
  .dbg-log{ flex:none; padding:8px 12px; border-bottom:1px solid var(--line); background:rgba(0,0,0,.25); }
  .dbg-log[hidden]{ display:none !important; }
  .dbg-log textarea{ width:100%; height:min(26vh, 220px); resize:vertical; box-sizing:border-box; padding:8px; font:11px/1.4 ui-monospace, Menlo, monospace;
    color:#d6f5ee; background:#070b16; border:1px solid var(--line); border-radius:8px; -webkit-user-select:text; user-select:text; }
  .dbg-log-actions{ display:flex; align-items:center; gap:8px; margin-top:6px; font-size:12px; color:var(--accent-2); }
  .dbg-log-actions button{ min-height:32px; padding:4px 12px; font-size:12px; font-weight:700; border-radius:8px; border:1px solid var(--line); background:var(--panel-2); color:#fff; cursor:pointer; touch-action:manipulation; }

  /* Éditeur visuel de carte (debug) */
  .dbg-ed-overlay{ position:fixed; inset:0; z-index:105; display:flex; align-items:center; justify-content:center; padding:10px; background:rgba(7,7,8,.55); }
  .dbg-ed-overlay[hidden]{ display:none !important; }
  .dbg-ed-panel{ width:min(100%, 560px); max-height:92vh; display:flex; flex-direction:column; overflow:hidden;
    background:rgba(14,14,15,.98); border:2px solid var(--accent-2); border-radius:14px; box-shadow:0 10px 40px rgba(0,0,0,.7); }
  .dbg-ed-head{ display:flex; justify-content:space-between; align-items:center; padding:8px 14px; font-size:15px; font-weight:800; border-bottom:1px solid var(--line); }
  .dbg-ed-head button{ width:34px; height:34px; padding:0; font-size:16px; border-radius:8px; border:1px solid var(--line); background:var(--panel-2); cursor:pointer; }
  .dbg-ed-body{ flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; display:flex; gap:14px; padding:12px 14px; flex-wrap:wrap; }
  .dbg-ed-preview{ flex:0 0 130px; width:130px; display:flex; flex-direction:column; align-items:center; }
  .dbg-ed-preview .dbg-item{ width:112px; cursor:default; }
  .dbg-ed-form{ flex:1; min-width:230px; display:grid; grid-template-columns:auto 1fr; gap:7px 10px; align-items:center; font-size:12px; color:var(--muted); font-weight:700; }
  .dbg-ed-form select{ width:100%; min-height:36px; padding:4px 8px; font-size:14px; color:#fff; background:var(--panel-2); border:1px solid var(--line); border-radius:8px; }
  .dbg-ed-form label.chk{ grid-column:1 / -1; display:flex; align-items:center; gap:8px; font-size:13px; color:#fff; }
  .dbg-ed-form .row-off{ display:none; }
  .dbg-ed-msg{ min-height:1.2em; padding:0 14px 6px; font-size:11.5px; line-height:1.4; }
  .dbg-ed-msg .err{ color:#ff6b7a; } .dbg-ed-msg .warn{ color:#ffb347; } .dbg-ed-msg .ok{ color:var(--accent-2); }
  .dbg-ed-actions{ display:flex; gap:8px; padding:8px 14px 12px; border-top:1px solid var(--line); }
  .dbg-ed-actions button{ min-height:38px; padding:6px 16px; font-size:13px; font-weight:800; border-radius:8px; border:1px solid var(--line); background:var(--panel-2); color:#fff; cursor:pointer; touch-action:manipulation; }
  .dbg-ed-actions button#dbgEdApply{ border-color:var(--accent-2); }
  .dbg-ed-actions button:disabled{ opacity:.4; cursor:not-allowed; }

  .dbg-ed-form .symrow{ display:flex; flex-wrap:wrap; gap:6px; }
  .dbg-ed-form .symrow label{ display:flex; align-items:center; gap:3px; font-size:15px; }
  .dbg-ed-form .symrow select{ width:auto; min-width:48px; }

  /* Plafond de PV : boucliers excédentaires perdus */
  .shield-lost{ position:fixed; z-index:210; width:26px; height:26px; margin:-13px 0 0 -13px; pointer-events:none; opacity:0;
    animation: shield-lost .95s ease-in both; }
  .shield-lost img{ width:100%; height:auto; filter: drop-shadow(0 0 6px rgba(255,70,70,.9)); }
  .shield-lost .sym{ font-size:22px; line-height:1; filter: drop-shadow(0 0 6px rgba(255,70,70,.9)); }
  @keyframes shield-lost{
    0%{ opacity:0; transform: translate(0,0) scale(.6); }
    14%{ opacity:1; transform: translate(0,-8px) scale(1.25); }
    32%{ transform: translate(3px,-8px) rotate(-10deg) scale(1.25); }
    42%{ transform: translate(-3px,-8px) rotate(9deg) scale(1.2); filter: grayscale(.4) brightness(1.3); }
    100%{ opacity:0; transform: translate(var(--dx), var(--dy)) rotate(var(--rot)) scale(.45); filter: grayscale(1); }
  }
  .hp-capped{ animation: hp-capped .7s ease-out; }
  @keyframes hp-capped{
    0%{ box-shadow:0 0 0 rgba(255,60,60,0); } 20%{ box-shadow:0 0 18px rgba(255,60,60,.95); transform: translateX(-2px); }
    40%{ transform: translateX(2px); } 60%{ transform: translateX(-1px); } 100%{ box-shadow:0 0 0 rgba(255,60,60,0); transform:none; }
  }
  .hp-max-tag{ position:fixed; z-index:211; transform:translateX(-50%); pointer-events:none; font-weight:900; font-size:15px; letter-spacing:.14em;
    color:#fff; text-shadow:0 0 6px #ff3b3b, 0 0 14px #ff3b3b; animation: hp-max-tag 1.2s ease-out both; }
  @keyframes hp-max-tag{ 0%{ opacity:0; transform:translate(-50%,6px) scale(.8); } 18%{ opacity:1; transform:translate(-50%,-6px) scale(1.15); } 100%{ opacity:0; transform:translate(-50%,-26px) scale(1); } }
  @media (prefers-reduced-motion: reduce){ .shield-lost, .hp-capped, .hp-max-tag{ animation-duration:.01s; } }

  /* =====================================================================
     LAYOUT v2 — barres de PV, bande de main (pioche / défausse / main adverse), texte sous les cartes
     Deux dispositions :
       H (défaut : portrait, petits écrans) : arènes empilées, barres HORIZONTALES — rival au-dessus, joueur en dessous ;
                                              main en COLONNE à droite, zones empilées dans la colonne.
       V (paysage large, >= 900px)          : arènes côte à côte, barres VERTICALES — rival à gauche, joueur à droite ;
                                              main en BANDE sous les arènes, zones de part et d'autre.
     ===================================================================== */
  :root{ --hand-cap-h: 0px; --hbar-h: 16px; --vbar-w: 30px; --chrome-v: 270px;
    /* côté d'une grille = (hauteur - tout ce qui n'est pas grille) / 2, borné aussi par la largeur restante à gauche de la colonne de main */
    --gw: min(var(--grid-max), calc((100vh - var(--chrome-v)) / 2), calc(100vw - var(--hand-col-width) - 44px)); }
  @media (min-width: 700px) and (orientation: portrait){ :root{ --hbar-h: 22px; --chrome-v: 350px; } }
  /* Écran « assez grand » (pas un téléphone) : le JS pose body.hand-captions (voir applyCaptionMode) -> texte de l'ability sous les cartes */
  body.hand-captions{ --hand-cap-h: 48px; }

  /* ----- H : barres horizontales (dessus rival / dessous joueur) ----- */
  .arenas{ flex-direction:column; align-items:center; justify-content:center; gap:30px; }
  .side{ flex-direction:column; align-items:center; width:auto; flex:0 0 auto; gap:10px; }
  .side-player .hprow{ order:2; }
  .grid{ width:var(--gw); }
  .hprow{ flex-direction:row; align-items:center; justify-content:flex-start; width:var(--gw); height:auto; padding:2px 4px; gap:8px; }
  .hprow .name{ width:48px; flex-shrink:0; font-size:11px; }
  .hpbar{ flex:1; width:auto; height:var(--hbar-h); min-height:0; }
  .hpbar-fill{ position:absolute; left:0; top:0; bottom:auto; height:100%; width:calc(var(--hp-ratio, 1) * 100%);
    background: linear-gradient(90deg, var(--bad), var(--accent)); transition: width .3s; }
  .hprow.player .hpbar-fill{ background: linear-gradient(90deg, var(--accent-2), var(--good)); }
  .hpval{ width:30px; text-align:right; font-size:12px; }
  body.ui-skin{ --hp-t: 28px; --hp-empty: url(./ui/skin/bar-h-empty.webp); --hp-fill-ai: url(./ui/skin/bar-h-red.webp); --hp-fill-player: url(./ui/skin/bar-h-green.webp); }
  body.ui-skin .hpbar{ height: var(--hp-t); width:auto; }
  body.ui-skin .hpbar::before, body.ui-skin .hpbar-fill{ border-width: 0 var(--hp-cap); border-image-slice: 0 40 0 40 fill; }
  body.ui-skin .hpbar-fill{
    clip-path: inset(0 calc(100% - var(--hp-inner) - var(--hp-ratio, 1) * (100% - 2 * var(--hp-inner))) 0 0); transition: clip-path .3s;
  }

  /* Bande de main : uniquement les cartes (les zones pioche / défausse / main sont auprès des barres de PV, côté de chaque joueur) */
  .hand-wrap{ display:flex; flex-direction:column; align-items:center; justify-content:flex-start; }
  .hand-wrap .hand{ flex:1 1 0; min-height:0; width:100%; height:auto; }
  /* Zones d'un joueur : H = rangée au-dessus (rival) / au-dessous (joueur) de la barre de PV ; V = colonne à l'extérieur de la barre */
  .piles{ display:flex; flex-direction:row; justify-content:space-between; gap:6px; width:var(--gw); }
  .side-ai .piles{ order:-1; } .side-player .piles{ order:3; }
  .pile{
    position:relative; flex:1 1 0; min-width:0; display:flex; flex-direction:row; align-items:center; justify-content:center; gap:6px;
    box-sizing:border-box; padding:5px 6px; border:1px dashed var(--line); border-radius:12px;
    background:rgba(10,14,28,.5); color:#ececec; font-weight:800; user-select:none; -webkit-user-select:none; pointer-events:none;
  }
  /* Pile = pile de cartes dessinée : une couche par tranche de cartes restantes (le JS pose les <i>), donc la TAILLE se lit d'un coup d'œil */
  .pile-art{ position:relative; width:22px; height:30px; flex:none; margin:2px 4px 2px 0; }
  .pile-art i{ position:absolute; inset:0; border-radius:4px; border:1.5px solid #6fb3ff;
    background: radial-gradient(circle at 50% 45%, #35588c 0, #14233f 62%, #0b1426 100%);
    box-shadow: inset 0 0 5px rgba(111,179,255,.55), 0 1px 2px rgba(0,0,0,.6);
    transform: translate(calc(var(--k, 0) * 2px), calc(var(--k, 0) * -2px)); }
  .pile-art i::after{ content:""; position:absolute; left:50%; top:50%; width:46%; aspect-ratio:1/1; transform:translate(-50%,-50%) rotate(45deg);
    border:1.5px solid rgba(160,205,255,.75); border-radius:2px; }
  .pile-art.empty{ border:1.5px dashed rgba(255,255,255,.28); border-radius:4px; opacity:.6; }
  .pile-discard .pile-art i{ border-color:#c06a6a; filter:grayscale(.45) brightness(.8); }
  .pile-rival .pile-art i{ border-color:#ff7a8a; }
  .pile-n{ font-size:17px; line-height:1; min-width:1.1em; text-align:center; }
  .pile-n.bump{ animation: pile-bump .45s ease-out; }
  .pile-label{ display:none; font-size:9px; opacity:.72; text-transform:uppercase; letter-spacing:.08em; }
  @keyframes pile-bump{ 0%{ transform:scale(1); } 35%{ transform:scale(1.5); color:#fff; text-shadow:0 0 8px var(--accent-2); } 100%{ transform:scale(1); } }
  body.ui-skin .pile{ border-color:#5a5d60; background:rgba(16,16,17,.55); }

  @media (min-width: 700px) and (min-height: 600px){
    .pile{ padding:5px 8px; gap:8px; }
    .pile-art{ width:24px; height:34px; }
    .pile-n{ font-size:20px; }
    .pile-label{ display:block; }
  }
  /* Main avec légendes : lignes qui s'enroulent, centrées dans toute la place disponible ; le JS choisit le nombre de colonnes et règle les écarts. */
  body.hand-captions .hand{ flex-direction:row; flex-wrap:wrap; justify-content:center; align-content:center; align-items:flex-start; gap:16px 18px; }
  /* iPad portrait : colonne de main plus large, cartes plus grandes (la place perdue entre la grille et la colonne leur revient) */
  @media (min-width: 700px) and (orientation: portrait){
    :root{ --hand-col-width: clamp(190px, 42vw, 400px); --hand-card-max: clamp(200px, 42vw, 300px); }
    body.hand-captions{ --hand-cap-h: 46px; }
  }
  /* Téléphone : zones minuscules (icône + nombre) pour ne pas voler de hauteur aux cartes */
  @media (max-width: 699px){
    .piles{ gap:3px; }
    .pile{ padding:3px 1px 2px; gap:1px; border-radius:8px; }
    .pile-art{ width:12px; height:17px; margin:0 2px 0 0; }
    .pile-n{ font-size:12px; }
  }

  /* Texte de l'ability sous la carte (écran assez grand) — porté par la carte, il la suit pendant un glisser */
  body.hand-captions .hand-desc{ display:block; }
  .hand-desc{ display:none; position:absolute; top:calc(100% * 1.2); left:0; width:100%; margin-top:0; font-size:10.5px; line-height:1.25; text-align:center;
    color:#cfd8ee; pointer-events:none; text-shadow:0 1px 2px #000; overflow:hidden; max-height:calc(var(--hand-cap-h) - 4px); }

  /* Cartes fantômes : retour vers la défausse */
  .card-ghost{ position:fixed !important; z-index:150; pointer-events:none; margin:0 !important; transform-origin:50% 50%; }

  /* ----- V : paysage large, barres verticales rival gauche / joueur droite, main en bande ----- */
  @media (min-width: 900px) and (orientation: landscape){
    :root{ --grid-size: min(31vw, calc(56vh - 40px), 420px); }
    .arenas{ flex-direction:row; align-items:flex-start; justify-content:center; gap:72px; }
    .side{ flex-direction:row; align-items:stretch; width:auto; flex:0 1 auto; gap:22px; }
    .grid{ width:var(--grid-size); }
    .hprow{ flex-direction:column; align-items:center; justify-content:space-between; width:var(--vbar-w); height:auto; padding:3px 2px; gap:5px; }
    .hprow .name{ width:auto; font-size:11px; }
    .hpbar{ flex:1; width:var(--vbar-w); height:auto; min-height:60px; }
    .hpbar-fill{ position:absolute; left:0; right:auto; top:auto; bottom:0; width:100%; height:calc(var(--hp-ratio, 1) * 100%);
      background: linear-gradient(0deg, var(--bad), var(--accent)); transition: height .3s; }
    .hprow.player .hpbar-fill{ background: linear-gradient(0deg, var(--accent-2), var(--good)); }
    .hpval{ width:auto; text-align:center; font-size:13px; }
    body.ui-skin{ --vbar-w: 44px; --hp-t: 44px; --hp-empty: url(./ui/skin/bar-v-empty.webp); --hp-fill-ai: url(./ui/skin/bar-v-red.webp); --hp-fill-player: url(./ui/skin/bar-v-green.webp); }
    body.ui-skin .hpbar{ width: var(--hp-t); height:auto; }
    body.ui-skin .hpbar::before, body.ui-skin .hpbar-fill{ border-width: var(--hp-cap) 0; border-image-slice: 40 0 40 0 fill; }
    body.ui-skin .hpbar-fill{
      clip-path: inset(calc(100% - var(--hp-inner) - var(--hp-ratio, 1) * (100% - 2 * var(--hp-inner))) 0 0 0); transition: clip-path .3s;
    }

    /* La bande de main prend TOUT l'espace vertical restant sous les arènes (plus de marge morte) ; les cartes grandissent en conséquence. */
    :root{ --hand-max-width: 1000px; }
    .boards{ flex:0 0 auto; }
    .hand-wrap{ display:flex; flex-direction:row; align-items:stretch; justify-content:center; gap:18px; width:100%; --hand-card-max:240px;
      flex:1 1 0; min-height: calc(120px + var(--hand-cap-h) + 16px); height:auto; }
    .hand-wrap .hand{ flex:0 1 var(--hand-max-width); width:auto; max-width:var(--hand-max-width); height:auto; margin:0; order:2; align-items:flex-start; }
    .piles{ flex-direction:column; width:84px; flex:0 0 auto; justify-content:center; align-self:stretch; gap:8px; }
    .pile{ flex:0 0 auto; width:100%; flex-direction:column; padding:7px 4px 5px; gap:3px; justify-content:center; }
    .pile-art{ margin:2px 4px 4px 0; }
  }

  /* ---------- Écran d'accueil ---------- */
  body.home-open #app{ visibility:hidden; }
