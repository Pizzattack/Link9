  }

  // Tour du rival scripté : pose R? sur la case donnée, puis le joueur repioche.
  function tutRivalTurn(key, cell, done) {
    state.active = "ai"; state.ui.selectedHandIndex = null;
    setStatus(t("statusRivalTurn")); render();
    setTimeout(() => {
      if (!tutOn) return;
      const ai = state.players.ai, k = ai.hand.findIndex((c) => c.tutKey === key);
      if (k >= 0) { const card = ai.hand.splice(k, 1)[0]; ai.grid[cell] = card; arriveOnGrid(card); }
      drawUpTo(ai, handCapOf(ai));
      render();
      setTimeout(() => {
        if (!tutOn) return;
        state.active = "player"; drawWithPenalty("player");
        setStatus(t("statusYourTurn")); render(); done();
      }, 1000);
    }, 900);
  }

  // Texte riche des bulles : {ic:atk|shield|revive|neutral} = icône de symbole, {tr:atk|shield|revive} = icône d'ability de combo (repli sur le glyphe si l'image manque).
  const TUT_GLYPH = { atk: "⚔", shield: "🛡", revive: "✚", neutral: "●" };
  function tutIcon(kind, key) {
    const src = kind === "tr" ? triggerIconSrc("onCombo:" + key) : SKIN_TYPE_ICON_SRC[key];
    const g = TUT_GLYPH[key] || "●";
    return src ? `<img class="tut-ico" src="${src}" alt="${g}" onerror="this.replaceWith(document.createTextNode('${g}'))">` : g;
  }
  const tutRich = (txt) => esc(txt).replace(/\{(ic|tr):(\w+)\}/g, (m, kind, key) => tutIcon(kind, key));
  const tutImg = (src) => `<img src="${src}" alt="" onerror="this.remove()">`;
  function tutAnatomyExtra() {
    const inst = state.players.player.hand.find((c) => c.tutKey === "A");
    const box = document.createElement("div"); box.className = "tut-anat";
    const zoom = document.createElement("div"); zoom.className = "tut-zoom";
    zoom.innerHTML = renderCardVisual(inst, {}) + `<span class="tut-pin" style="top:-8px;right:-8px">1</span><span class="tut-pin" style="top:calc(50% - 10px);right:-30px">2</span><span class="tut-pin" style="bottom:-6px;right:-6px">3</span><span class="tut-pin" style="top:-8px;left:-12px">4</span>`;
    const ol = document.createElement("ol"); ol.className = "tut-legend";
    const syms = ["atk", "shield", "revive", "neutral"].map((k) => tutImg(SKIN_TYPE_ICON_SRC[k])).join("");
    [["tutLegSym", `<span class="tut-syms">${syms}</span> `], ["tutLegArrow", ""], ["tutLegAbility", ""], ["tutLegRarity", ""]].forEach(([k, pre], i) => {
      const li = document.createElement("li");
      li.innerHTML = `<span class="tut-pin">${i + 1}</span><span>${pre}${tutRich(t(k))}</span>`;
      ol.appendChild(li);
    });
    box.appendChild(zoom); box.appendChild(ol);
    return box;
  }

  function tutSymbolsExtra() {
    const box = document.createElement("div"); box.className = "tut-sym-demo";
    box.innerHTML = ["atk", "shield", "revive", "neutral"].map((k) => `<span class="tut-sym-chip">${tutIcon("ic", k)}</span>`).join("");
    return box;
  }

  function tutSteps() {
    const P = () => ({ hp: MAX_HP, cap: HP_CAP, hand: HAND_SIZE });
    const hpRows = () => [tutQ("#aiHpRow"), tutQ("#playerHpRow")];
    const move = (key, cell, extra) => ({ allow: { select: key, place: cell }, wait: "turnEnd", holes: () => [tutHandEl(key), tutCellEl("player", cell)], ...extra });
    const row = () => [3, 4, 5].map((i) => tutCellEl("player", i));
    const all = [
      { id: "welcome", holes: () => [] },
      { id: "board", holes: () => [...hpRows(), tutQ("#aiGrid"), tutQ("#playerGrid")] },
      { id: "cards", holes: () => [tutQ("#aiPiles"), tutQ("#playerPiles"), tutQ("#playerHand")] },
      { id: "anatomy", holes: () => [tutHandEl("A")], extra: tutAnatomyExtra },
      { id: "combos", holes: () => [tutQ("#playerGrid")] },
      { id: "symbols", holes: () => [tutQ("#playerGrid")], extra: tutSymbolsExtra },
      { id: "move1", ...move("A", 3) },
      { id: "rival1", wait: "rival", holes: () => [tutQ("#aiGrid")], onEnter: () => tutRivalTurn("R1", 4, () => tutReady()) },
      { id: "inspect", wait: "detail", skippable: true, allow: {}, holes: () => [tutCellEl("player", 3), tutQ("#playerHand")] },
      { id: "move2", ...move("B", 4) },
      { id: "linked", wait: "rival", holes: () => [[tutCellEl("player", 3), tutCellEl("player", 4)], tutQ("#aiGrid")], onEnter: () => tutRivalTurn("R2", 1, () => tutReady()) },
      { id: "move3", ...move("C", 5, { holes: () => [tutHandEl("C"), row()], onEnter: () => { tut.hpBefore = state.players.ai.hp; } }) },
      { id: "result", holes: () => [tutQ("#aiHpRow"), tutQ("#playerPiles")], params: () => ({ n: tut.hpBefore - state.players.ai.hp }) },
      { id: "end", holes: () => [tutQ(".topbar-actions")], last: true },
    ];
    // Grands écrans : le texte des capacités est affiché en permanence (pas de survol) → l'étape « lire un programme » n'a pas de sens.
    return all.filter((st) => !(st.id === "inspect" && captionsOn()));
  }

  /* ---------- Mise en page : voile troué + anneaux + bulle ---------- */
  function tutRRPath(x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    return `M${x + r} ${y}H${x + w - r}A${r} ${r} 0 0 1 ${x + w} ${y + r}V${y + h - r}A${r} ${r} 0 0 1 ${x + w - r} ${y + h}H${x + r}A${r} ${r} 0 0 1 ${x} ${y + h - r}V${y + r}A${r} ${r} 0 0 1 ${x + r} ${y}Z`;
  }
  function tutHoleRects() {
    const vw = document.documentElement.clientWidth, vh = document.documentElement.clientHeight, pad = 6;
    // Un « trou » peut être un élément ou un tableau d'éléments (→ un seul rectangle englobant).
    let rects = ((tut.step && tut.step.holes) ? tut.step.holes() : []).map((h) => [].concat(h).filter(Boolean)).filter((g) => g.length).map((g) => {
      let l = Infinity, t0 = Infinity, r = -Infinity, b = -Infinity;
      g.forEach((el) => { const u = detailUnionRect(el); l = Math.min(l, u.l); t0 = Math.min(t0, u.t); r = Math.max(r, u.r); b = Math.max(b, u.b); });
      const x = Math.max(2, l - pad), y = Math.max(2, t0 - pad);
      return { x, y, w: Math.min(vw - 2, r + pad) - x, h: Math.min(vh - 2, b + pad) - y };
    }).filter((r) => r.w > 4 && r.h > 4);
    // Deux trous qui se chevauchent s'annuleraient (evenodd) : on les fusionne en un seul rectangle.
    for (let merged = true; merged;) {
      merged = false;
      outer: for (let i = 0; i < rects.length; i++) for (let j = i + 1; j < rects.length; j++) {
        const a = rects[i], c = rects[j];
        if (a.x < c.x + c.w && c.x < a.x + a.w && a.y < c.y + c.h && c.y < a.y + a.h) {
          const x = Math.min(a.x, c.x), y = Math.min(a.y, c.y);
          rects.splice(j, 1); rects[i] = { x, y, w: Math.max(a.x + a.w, c.x + c.w) - x, h: Math.max(a.y + a.h, c.y + c.h) - y };
          merged = true; break outer;
        }
      }
    }
    return rects;
  }
  const tutOverlap = (a, b) => Math.max(0, Math.min(a.x + a.w, b.x + b.w) - Math.max(a.x, b.x)) * Math.max(0, Math.min(a.y + a.h, b.y + b.h) - Math.max(a.y, b.y));
  function tutPlaceBubble(rects) {
    const b = tut.bubble, M = 8;
    const vw = document.documentElement.clientWidth, vh = document.documentElement.clientHeight;
    const w = b.offsetWidth, h = b.offsetHeight;
    const cx = Math.max(M, (vw - w) / 2), cy = Math.max(M, (vh - h) / 2), R = Math.max(M, vw - w - M), Bt = Math.max(M, vh - h - M);
    const lowerHoles = rects.length && rects.reduce((s, r) => s + r.y + r.h / 2, 0) / rects.length > vh / 2;
    const top = { x: cx, y: M }, bottom = { x: cx, y: Bt };
    const cands = [...(lowerHoles ? [top, bottom] : [bottom, top]), { x: M, y: cy }, { x: R, y: cy }, { x: M, y: M }, { x: R, y: M }, { x: M, y: Bt }, { x: R, y: Bt }, { x: cx, y: cy }];
    let best = cands[0], bestO = Infinity;
    for (const c of cands) {
      const box = { x: c.x - 8, y: c.y - 8, w: w + 16, h: h + 16 };
      const o = rects.reduce((s, r) => s + tutOverlap(box, r), 0);
      if (o < bestO - 1) { bestO = o; best = c; }
      if (o === 0) break;
    }
    b.style.left = Math.round(best.x) + "px"; b.style.top = Math.round(best.y) + "px";
  }
  function tutLayout(force) {
    if (!tutOn || !tut.step) return;
    const rects = tutHoleRects();
    const sig = JSON.stringify(rects.map((r) => [r.x, r.y, r.w, r.h].map(Math.round))) + document.documentElement.clientWidth + "x" + document.documentElement.clientHeight + tut.bubble.offsetHeight;
    if (!force && sig === tut.sig) return;
    tut.sig = sig;
    const vw = document.documentElement.clientWidth, vh = document.documentElement.clientHeight;
    const holes = rects.map((r) => tutRRPath(r.x, r.y, r.w, r.h, 12)).join("");
    const clip = rects.length ? `path(evenodd,"M0 0H${vw}V${vh}H0Z${holes}")` : "none";
    tut.dim.style.clipPath = clip; tut.dim.style.webkitClipPath = clip;
    const interactive = ((!!tut.step.wait && tut.step.wait !== "rival") || !!tut.step.until) && rects.length > 0;
    tut.block.style.clipPath = interactive ? clip : "none"; tut.block.style.webkitClipPath = tut.block.style.clipPath;
    while (tut.rings.length < rects.length) { const d = document.createElement("div"); d.className = "tut-ring"; tut.root.insertBefore(d, tut.bubble); tut.rings.push(d); }
    tut.rings.forEach((d, i) => {
      const r = rects[i]; d.style.display = r ? "" : "none";
      if (r) { d.style.left = r.x + "px"; d.style.top = r.y + "px"; d.style.width = r.w + "px"; d.style.height = r.h + "px"; }
    });
    tutPlaceBubble(rects);
  }

  /* ---------- Bulle ---------- */
  function tutRenderBubble() {
    const s = tut.step, i = tut.i, n = tut.steps.length, b = tut.bubble;
    const p = Object.assign(P_DEFAULT(), s.params ? s.params() : {});
    b.querySelector(".tut-title").textContent = t("tutT_" + s.id, p);
    b.querySelector(".tut-count").textContent = `${i + 1} / ${n}`;
    b.querySelector(".tut-text").innerHTML = tutRich(t("tutX_" + s.id, p));
    const ex = b.querySelector(".tut-extra"); ex.innerHTML = ""; if (s.extra) ex.appendChild(s.extra());
    const btns = b.querySelector(".tut-btns"); btns.innerHTML = "";
    const mk = (label, fn, dis) => { const x = document.createElement("button"); x.className = "newgame-btn"; x.setAttribute("data-skin-variant", "2"); x.textContent = label; x.disabled = !!dis; x.addEventListener("click", fn); btns.appendChild(x); return x; };
    if (s.last) {
      mk(t("homeBtn"), () => { tutExit(); });
      mk(t("homeRandom"), () => { tutExit(); document.getElementById("homeRandom").click(); });
    } else if (s.wait === "rival") {
      tut.nextBtn = mk(tut.ready ? t("tutNext") : t("tutWait"), () => tutAdvance(), !tut.ready);
    } else if (!s.wait) {
      mk(t("tutNext"), () => tutAdvance());
    } else if (s.skippable) {
      mk(t("tutSkip"), () => tutAdvance());
    }
    b.querySelector(".tut-quit").textContent = t("tutQuit");
    b.querySelector(".tut-quit").style.visibility = s.last ? "hidden" : "";
    queueFitSkinButtons();
  }
  const P_DEFAULT = () => ({ hp: MAX_HP, cap: HP_CAP, hand: HAND_SIZE });
  function tutReady() { if (!tutOn) return; tut.ready = true; if (tut.nextBtn) { tut.nextBtn.disabled = false; tut.nextBtn.textContent = t("tutNext"); } }

  /* ---------- Déroulé ---------- */
  function tutGo(i) {
    tut.i = i; tut.step = tut.steps[i]; tut.ready = false; tut.sig = null; tut.advancing = false;
    hideDetail();
    if (i > 0) sfx("effect");
    if (tut.step.onEnter) tut.step.onEnter();
    tutRenderBubble();
    tutLayout(true);
    setTimeout(() => tutLayout(true), 60);
    tutCheck();
  }
  function tutAdvance() {
    if (!tutOn || tut.advancing) return;
    tut.advancing = true;
    if (tut.i + 1 < tut.steps.length) tutGo(tut.i + 1);
  }
  function tutCheck() { if (tutOn && tut.step && tut.step.until && !tut.advancing && tut.step.until()) { tut.advancing = true; setTimeout(() => { if (tutOn) { tut.advancing = false; tutAdvance(); } }, 250); } }
  function tutAfterRender() { if (!tutOn) return; tutLayout(); tutCheck(); }
  function tutTurnEnded() { if (tutOn && tut.step && tut.step.wait === "turnEnd") tutAdvance(); }
  function tutOnDetail() { if (tutOn && tut.step && tut.step.wait === "detail") setTimeout(() => { if (tutOn && tut.step.wait === "detail") tutAdvance(); }, 700); }
  // Le tutoriel décide ce que le joueur a le droit de faire à chaque étape.
  function tutBlocked(kind, arg) {
    if (!tutOn) return false;
    const a = tut.step && tut.step.allow;
    if (!a) return true;
    if (kind === "select") return !(a.select && tutHandIdx(a.select) === arg);
    if (kind === "place") return !(a.place === arg);
    return true;
  }

  function tutStart() { loadAssets(stateAssets(tutBuildState()), tutStartNow); }
  function tutStartNow() {
    sfx("enter");
    hideHome(); closeEndScreen(); hideDetail();
    state = tutBuildState(); gameLog = []; pendingTarget = null;
    setStatus(t("statusYourTurn")); render();
    const root = document.getElementById("tutRoot");
    tut = { root, dim: root.querySelector(".tut-dim"), block: root.querySelector(".tut-block"), bubble: root.querySelector(".tut-bubble"), rings: [], steps: tutSteps(), i: 0 };
    root.querySelectorAll(".tut-ring").forEach((r) => r.remove());
    root.hidden = false; tutOn = true;
    document.body.classList.add("tut-on");
    tut.timer = setInterval(() => tutLayout(), 120);
    try { localStorage.setItem(TUT_SEEN_KEY, "1"); } catch (e) { /* ignoré */ }
    document.getElementById("homeTutorial").classList.remove("home-tut-new");
    tutGo(0);
  }
  function tutExit() {
    if (!tutOn) return;
    tutOn = false; clearInterval(tut.timer);
    tut.root.hidden = true; document.body.classList.remove("tut-on");
    hideDetail(); state.ui.selectedHandIndex = null; pendingTarget = null;
    showHome();
  }
  document.getElementById("homeTutorial").addEventListener("click", tutStart);
  document.querySelector("#tutRoot .tut-quit").addEventListener("click", tutExit);
  document.addEventListener("keydown", (e) => { if (e.key === "Escape" && tutOn) tutExit(); });
  window.addEventListener("resize", () => { if (tutOn) tutLayout(true); });
  (function tutBadge() { let seen = false; try { seen = !!localStorage.getItem(TUT_SEEN_KEY); } catch (e) { /* ignoré */ } if (!seen) document.getElementById("homeTutorial").classList.add("home-tut-new"); })();


  /* ======================= MODE CAMPAIGN =======================
     Cloisonné du mode random : sauvegarde propre (CAMP_KEY pour la progression, CAMP_GAME_KEY pour le combat en cours,
     CAMP_LOG pour le log). Rien n'est partagé avec les parties random.
     - 4 monnaies (tokens), une par rareté ; deck de départ = 25 communes ; collection = cartes possédées (au départ = le deck).
     - Combat gagné : 3 cartes tirées (60 / 28 / 10 / 2 %), le joueur en garde 1, les 2 autres deviennent des tokens de leur rareté.
     - Marchand : cartes aléatoires contre tokens, et change entre tokens.
     - Adversaire : deck aléatoire avec le même nombre de cartes de chaque rareté que le deck du joueur. */
  const CAMP_KEY = "ccn_campaign_v1";
  const CAMP_DECK_SIZE = 25;
  const CAMP_RARITIES = [RARITIES.COMMON, RARITIES.UNCOMMON, RARITIES.RARE, RARITIES.UNIQUE];
  const CAMP_DROP_RATES = Object.freeze({ [RARITIES.COMMON]: 60, [RARITIES.UNCOMMON]: 28, [RARITIES.RARE]: 10, [RARITIES.UNIQUE]: 2 });   // en %
  const CAMP_REWARD_CHOICES = 3;
  // Pity timer DUR : après N tirages consécutifs SANS une rareté, le tirage suivant en contient forcément une. Un compteur par rareté (reset à l'apparition
  // exacte de cette rareté, tirée ou forcée) et par source : butin de victoire (campaign.pity.loot, +1 par victoire) et jeton de ténacité (campaign.pity.tenacity,
  // +1 par défaite sans abandon). Priorité si plusieurs sont dus : ultra-rare > rare > peu commune (le butin les honore tous, 3 cartes ; la ténacité un par défaite).
  const CAMP_PITY = Object.freeze({ [RARITIES.UNIQUE]: 30, [RARITIES.RARE]: 8, [RARITIES.UNCOMMON]: 3 });
  const CAMP_PITY_ORDER = [RARITIES.UNIQUE, RARITIES.RARE, RARITIES.UNCOMMON];
  const campPityFresh = () => ({ loot: { unique: 0, rare: 0, uncommon: 0 }, tenacity: { unique: 0, rare: 0, uncommon: 0 } });
  const CAMP_CARD_PRICE = 2;   // tokens de la rareté considérée pour une carte aléatoire de cette rareté
  const CAMP_PICK_PRICE = 3;   // « choix parmi 5 » : ancien prix d'une carte aléatoire (la carte aléatoire simple a baissé d'un token)
  const CAMP_PICK_COUNT = 5;   // nombre de cartes proposées (les autres sont perdues, sans token)
  // Change : 1 token de `to` contre `cost` tokens de `from`.
  const CAMP_EXCHANGES = [
    { from: RARITIES.COMMON, to: RARITIES.UNCOMMON, cost: 2 },
    { from: RARITIES.UNCOMMON, to: RARITIES.RARE, cost: 3 },
    { from: RARITIES.RARE, to: RARITIES.UNIQUE, cost: 4 },
  ];
  const CAMP_TOKEN_COLOR = { common: "#9aa4b8", uncommon: "#22c55e", rare: "#3b82f6", unique: "#ff8a1f" };
  const CAMP_TOKEN_FILE = { common: "common", uncommon: "uncommon", rare: "rare", unique: "ultrarare" };   // ./ui/token_xxx.webp
  let campaign = null;   // { collection:{id:n}, deckIds:[id], tokens:{rarity:n}, wins, reward:null|{offers:[id]} }

  const campRarityLabel = (r) => t(rarityLabelKey(r));
  const campPool = (r) => CARDS.filter((c) => (c.rarity || RARITIES.COMMON) === r);
  const campShuffle = (a) => { const b = a.slice(); for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; } return b; };
  const campCountIds = (ids) => { const c = {}; ids.forEach((id) => { c[id] = (c[id] || 0) + 1; }); return c; };

  // Deck de départ : 25 cartes réparties par TYPE de symbole (cartes à symbole unique) : 10 attaque / 8 défense / 5 neutre / 2 revive.
  // 18 communes + 4 uncommon + 2 rares + 1 ultra-rare (les 7 « améliorées » tombent sur des types tirés au hasard, dans la limite des cartes disponibles).
  const CAMP_START_MIX = Object.freeze({ atk: 10, shield: 8, neutral: 5, revive: 2 });
  const CAMP_START_RARITIES = [RARITIES.UNCOMMON, RARITIES.UNCOMMON, RARITIES.UNCOMMON, RARITIES.UNCOMMON, RARITIES.RARE, RARITIES.RARE, RARITIES.UNIQUE];   // le reste du deck est commun
  function campSymKind(c) { const ks = SYMBOL_KEYS.filter((k) => c.symbols[k] > 0); return ks.length === 1 ? ks[0] : null; }
  function campNew() {
    const slots = [];
    for (const k of Object.keys(CAMP_START_MIX)) for (let i = 0; i < CAMP_START_MIX[k]; i++) slots.push(k);
    const poolOf = (kind, r) => CARDS.filter((c) => (c.rarity || RARITIES.COMMON) === r && campSymKind(c) === kind);
    let picked = null;
    for (let attempt = 0; attempt < 300 && !picked; attempt++) {
      const order = campShuffle(slots);
      const rars = order.map((_, i) => (i < CAMP_START_RARITIES.length ? CAMP_START_RARITIES[i] : RARITIES.COMMON));
      const need = {};
      order.forEach((k, i) => { const key = k + "|" + rars[i]; need[key] = (need[key] || 0) + 1; });
      if (!Object.keys(need).every((key) => { const [k, r] = key.split("|"); return poolOf(k, r).length >= need[key]; })) continue;   // pas assez de cartes distinctes : retirage
      const used = {};
      picked = order.map((k, i) => { const key = k + "|" + rars[i]; used[key] = used[key] || campShuffle(poolOf(k, rars[i])); return used[key].pop(); });
    }
    if (!picked) {   // filet de sécurité (pool exotique) : 25 communes distinctes, comme avant
      picked = campShuffle(campPool(RARITIES.COMMON)).slice(0, CAMP_DECK_SIZE);
      for (let i = 0; picked.length < CAMP_DECK_SIZE; i++) picked.push(picked[i % picked.length]);
    }
    const deckIds = picked.map((c) => c.id);
    return { collection: campCountIds(deckIds), deckIds, tokens: { common: 0, uncommon: 0, rare: 0, unique: 0 }, wins: 0, reward: null };
  }
  let campPending = false, campConflictShown = false;   // campPending : la campagne stockée est illisible => on n'écrit RIEN tant que le joueur n'a pas accepté (fenêtre danger)
  function campConflict() {
    if (campConflictShown) return; campConflictShown = true;
    dangerConfirm({ text: t("dgConflict"), ok: t("dgReload"), onOk: () => location.reload(), onCancel: () => { campConflictShown = false; } });
  }
  function campSave() {
    if (campPending) return;
    try {
      const raw = localStorage.getItem(CAMP_KEY);
      if (raw) {
        let st = null; try { st = JSON.parse(raw); } catch (e) { /* ignoré */ }
        if (st && typeof st.rev === "number" && st.rev > (campaign.rev || 0)) { campConflict(); return; }   // modifiée ailleurs entre-temps : on n'écrase pas
        if (st && typeof st.wins === "number" && st.wins > (campaign.wins || 0)) campBackup(raw, "regress");   // régression de victoires : copie avant d'écraser
      }
      campaign.rev = (campaign.rev || 0) + 1;
      localStorage.setItem(CAMP_KEY, JSON.stringify(campaign));
    } catch (e) { /* stockage indisponible */ }
    idbMirrorSoon();
  }
  /** Répare une campagne dont certains ids ont disparu / dont le deck est incomplet. Renvoie l'objet réparé ou null. */
  function campRepair(c) {
    if (!c || typeof c !== "object" || !c.collection || typeof c.collection !== "object" || !Array.isArray(c.deckIds)) return null;
    const f = JSON.parse(JSON.stringify(c)); f.tokens = f.tokens && typeof f.tokens === "object" ? f.tokens : {};
    Object.keys(f.collection).forEach((id) => { if (!CARDS_BY_ID[id] || !(f.collection[id] > 0)) delete f.collection[id]; });
    const used = {}; f.deckIds = f.deckIds.filter((id) => { if (!f.collection[id] || (used[id] || 0) >= f.collection[id]) return false; used[id] = (used[id] || 0) + 1; return true; }).slice(0, CAMP_DECK_SIZE);
    for (const id of Object.keys(f.collection)) while (f.deckIds.length < CAMP_DECK_SIZE && (used[id] || 0) < f.collection[id]) { f.deckIds.push(id); used[id] = (used[id] || 0) + 1; }
    return campValid(f) ? f : null;
  }
  function campValid(c) {
    if (!c || typeof c !== "object" || !c.collection || !Array.isArray(c.deckIds) || !c.tokens) return false;
    if (c.deckIds.length !== CAMP_DECK_SIZE) return false;
    const need = campCountIds(c.deckIds);
    return Object.keys(need).every((id) => CARDS_BY_ID[id] && (c.collection[id] || 0) >= need[id]);
  }
  function campEnsure() {
    if (campaign) return campaign;
    let raw = null; try { raw = localStorage.getItem(CAMP_KEY); } catch (e) { /* ignoré */ }
    if (raw) {
      let c = null; try { c = JSON.parse(raw); craftRegisterAll(c); } catch (e) { /* ignoré */ }
      if (campValid(c)) campaign = c;
      else {
        const fixed = campRepair(c);
        if (fixed) { campBackup(raw, "repaired"); campaign = fixed; campSave(); }
        else { campBackup(raw, "unreadable"); campPending = true; }     // jamais d'écrasement silencieux : le joueur doit accepter (showCampaign)
      }
    }
    if (!campaign) { campaign = campNew(); campSave(); }
    for (const r of CAMP_RARITIES) if (typeof campaign.tokens[r] !== "number") campaign.tokens[r] = 0;
    if (typeof campaign.wins !== "number") campaign.wins = 0;
    const pf = campPityFresh();
    if (!campaign.pity || typeof campaign.pity !== "object") campaign.pity = pf;
    for (const src of ["loot", "tenacity"]) {
      if (!campaign.pity[src] || typeof campaign.pity[src] !== "object") campaign.pity[src] = pf[src];
      for (const r of CAMP_PITY_ORDER) if (!(campaign.pity[src][r] >= 0)) campaign.pity[src][r] = 0;
    }
    if (campaign.reward && !(Array.isArray(campaign.reward.offers) && campaign.reward.offers.every((id) => CARDS_BY_ID[id]))) campaign.reward = null;
    if (campaign.merchPick && !(CAMP_RARITIES.includes(campaign.merchPick.r) && Array.isArray(campaign.merchPick.offers) && campaign.merchPick.offers.length && campaign.merchPick.offers.every((id) => CARDS_BY_ID[id]))) campaign.merchPick = null;
    return campaign;
  }

  // --- Decks de combat ---
  function buildCampaignPlayerDeck() {
    campEnsure();
    return buildBalancedDeck(campCountIds(campaign.deckIds), CARDS_BY_ID, Math.random);
  }
  /** Deck adverse : nombre de cartes de chaque rareté du deck du joueur, moins CAMP_OPPONENT_LESS (remplacées par des communes), puis règles standard du mode random
   *  (cf. buildRandomComposition) : tirage sans remise tant que le pool suffit, et EXACTEMENT REVIVE_CARDS_PER_DECK cartes revive,
   *  réparties au hasard entre les raretés et comptées dans leur quota. */
  const CAMP_OPPONENT_LESS = Object.freeze({ [RARITIES.UNCOMMON]: 2, [RARITIES.RARE]: 1, [RARITIES.UNIQUE]: 1 });
  /** Améliorations adverses : mêmes upgrades (liens, atk, shield, revive, neutre) que le deck du joueur, MOINS 1 unité par catégorie, appliquées
   *  (une par carte, cartes « crafted ») sur le deck adverse ; avant cela, les cartes de base sont permutées (même rareté, même statut revive)
   *  pour que les totaux de symboles atk / shield / revive du deck final restent proches de ceux du joueur. comp : {id: quantité} -> idem avec variantes. */
  const CAMP_OPP_UPGRADE_LESS = 1;
  function campOpponentUpgrade(comp) {
    const KS = ["atk", "shield", "revive"];
    const up = { link: 0, atk: 0, shield: 0, revive: 0, neutral: 0 }, pTot = { atk: 0, shield: 0, revive: 0 };
    for (const id of campaign.deckIds) {
      const p = craftParse(id), tpl = craftTemplate(id);
      if (!tpl) continue;
      up.link += p.dl; for (const k of ["atk", "shield", "revive", "neutral"]) up[k] += p.sym[k];
      for (const k of KS) pTot[k] += tpl.symbols[k] || 0;
    }
    for (const k of Object.keys(up)) up[k] = Math.max(0, up[k] - CAMP_OPP_UPGRADE_LESS);
    const list = [];
    for (const id of Object.keys(comp)) for (let i = 0; i < comp[id]; i++) list.push(id);
    // 1) équilibrage des symboles de base (le reste sera apporté par les améliorations)
    const target = Object.fromEntries(KS.map((k) => [k, pTot[k] - up[k]]));
    const tot = Object.fromEntries(KS.map((k) => [k, list.reduce((n, id) => n + (CARDS_BY_ID[id].symbols[k] || 0), 0)]));
    const dist = (t) => KS.reduce((n, k) => n + Math.abs(t[k] - target[k]), 0);
    const isRev = (c) => c.trigger === TRIGGERS.ON_COMBO_REVIVE;
    const cnt = {}; list.forEach((id) => { cnt[id] = (cnt[id] || 0) + 1; });
    for (let it = 0; it < 2000 && dist(tot) > 1; it++) {
      const i = Math.floor(Math.random() * list.length), cur = CARDS_BY_ID[list[i]];
      const pool = campPool(cur.rarity || RARITIES.COMMON).filter((c) => isRev(c) === isRev(cur) && c.id !== cur.id && (cnt[c.id] || 0) < 1);
      if (!pool.length) continue;
      const nw = pool[Math.floor(Math.random() * pool.length)], t2 = { ...tot };
      for (const k of KS) t2[k] += (nw.symbols[k] || 0) - (cur.symbols[k] || 0);
      if (dist(t2) <= dist(tot)) { cnt[cur.id]--; cnt[nw.id] = (cnt[nw.id] || 0) + 1; list[i] = nw.id; Object.assign(tot, t2); }
    }
    // 2) améliorations : une par carte, catégories les plus contraintes d'abord
    const free = campShuffle(list.map((_, i) => i));
    for (const kind of ["revive", "atk", "shield", "neutral", "link"]) {
      for (let n = 0; n < up[kind]; n++) {
        const pos = free.findIndex((i) => craftPreview(list[i], kind).ok);
        if (pos < 0) break;
        const i = free.splice(pos, 1)[0];
        list[i] = craftPreview(list[i], kind).newId;
        craftTemplate(list[i]);
      }
    }
    const out = {};
    list.forEach((id) => { out[id] = (out[id] || 0) + 1; });
    return out;
  }
  function buildCampaignOpponentComposition() {
    campEnsure();
    const quota = {};
    campaign.deckIds.forEach((id) => { const r = CARDS_BY_ID[id].rarity || RARITIES.COMMON; quota[r] = (quota[r] || 0) + 1; });
    // Handicap adverse : 2 uncommon, 1 rare et 1 ultra-rare de moins que le joueur (plancher 0), remplacés par des communes.
    for (const [r, less] of Object.entries(CAMP_OPPONENT_LESS)) {
      if (!quota[r]) continue;
      const cut = Math.min(less, quota[r]);
      quota[r] -= cut;
      quota[RARITIES.COMMON] = (quota[RARITIES.COMMON] || 0) + cut;
    }
    const isRevive = (c) => c.trigger === TRIGGERS.ON_COMBO_REVIVE;
    const rars = Object.keys(quota);
    const pools = {}, taken = {};
    rars.forEach((r) => { const pool = campShuffle(campPool(r)); pools[r] = { revive: pool.filter(isRevive), other: pool.filter((c) => !isRevive(c)) }; taken[r] = 0; });
    const comp = {};
    const add = (id) => { comp[id] = (comp[id] || 0) + 1; };
    // 1) les cartes revive, au hasard parmi les raretés qui en ont, dans la limite du quota de chaque rareté
    const cands = campShuffle(rars.flatMap((r) => pools[r].revive.map((c) => ({ r, id: c.id }))));
    let revives = 0;
    for (const c of cands) {
      if (revives >= REVIVE_CARDS_PER_DECK) break;
      if (taken[c.r] < quota[c.r]) { add(c.id); taken[c.r]++; revives++; }
    }
    // 2) le reste de chaque quota avec des cartes non-revive (doublons seulement si le pool est trop petit)
    rars.forEach((r) => {
      const others = pools[r].other;
      for (let k = 0; taken[r] < quota[r] && others.length; k++, taken[r]++) add(others[k % others.length].id);
    });
    // 3) filet de sécurité : rareté sans carte non-revive -> compléter avec ses cartes revive restantes
    rars.forEach((r) => { const rv = pools[r].revive; for (let k = 0; taken[r] < quota[r] && rv.length; k++, taken[r]++) add(rv[k % rv.length].id); });
    return campOpponentUpgrade(comp);
  }
  function buildCampaignOpponentDeck() { return buildBalancedDeck(buildCampaignOpponentComposition(), CARDS_BY_ID, Math.random); }

  // --- Tirages ---
  function campRollRarity() {
    let x = Math.random() * CAMP_RARITIES.reduce((n, r) => n + CAMP_DROP_RATES[r], 0);
    for (const r of CAMP_RARITIES) { if (x < CAMP_DROP_RATES[r]) return r; x -= CAMP_DROP_RATES[r]; }
    return RARITIES.COMMON;
  }
  function campRollCardOfRarity(r) {
    let pool = campPool(r);
    if (!pool.length) pool = campPool(RARITIES.COMMON);
    return pool[Math.floor(Math.random() * pool.length)].id;
  }
  function campRollReward() {
    const offers = [];
    for (let tries = 0; offers.length < CAMP_REWARD_CHOICES && tries < 60; tries++) {
      const id = campRollCardOfRarity(campRollRarity());
      if (!offers.includes(id)) offers.push(id);   // 3 cartes différentes
    }
    while (offers.length < CAMP_REWARD_CHOICES) offers.push(campRollCardOfRarity(campRollRarity()));   // pool minuscule : tant pis
    return offers;
  }

  /** Ajoute une carte à la collection dans la limite de copies (collectionCopiesFor : x3 jusqu'à rare, x1 ultra-rare).
   *  Au-delà, la copie en trop devient 1 token de sa rareté. Retourne "card" ou "token". */
  function campAddCard(id) {
    const r = CARDS_BY_ID[id].rarity || RARITIES.COMMON;
    if (craftOwnedOfBase(id) >= collectionCopiesFor(r)) { campaign.tokens[r]++; return "token"; }   // plafond : copies de base + variantes craftées confondues
    campaign.collection[id] = (campaign.collection[id] || 0) + 1;
    return "card";
  }


  /* ======================= Atelier : crafting & disenchant =======================
     Crafting : UNE SEULE amélioration par exemplaire (+1 lien OU +1 symbole), payée en tokens.
       - L'exemplaire devient une VARIANTE : id « <base>~<liens>-<atk>-<bouclier>-<revive>-<neutre> », enregistrée à la volée dans CARDS_BY_ID
         (propriété NON énumérable : le mode random et les tirages de campagne ne la voient jamais). Une variante n'est plus améliorable.
       - Légalité : validateTemplate (≤ 4 liens, combinaisons valides, ability + 3 symboles = ultra-rare seulement…), ≤ 3 symboles ; seuls les PLANCHERS
         de rareté sont levés (c'est ce que l'on achète).
       - Prix (tokens de la rareté de la carte) : lien CRAFT_LINK_COST[liens après amélioration] (1→2 : 1, 2→3 : 1, 3→4 : 2 : les cartes à 1 lien sont faibles,
         celles à 4 liens se combotent facilement) ; symbole attaque/bouclier 2 (3 si la carte porte déjà un symbole attaque/bouclier), neutre 1, revive 2.
       - Cartes rares et ultra-rares : on peut payer, au choix, le double en tokens de la rareté INFÉRIEURE pour le même bonus.
       - Un exemplaire en deck est amélioré en priorité (il garde sa place dans le deck), sinon un exemplaire libre.
     Disenchant : détruit UN exemplaire hors deck et rend DISENCHANT_YIELD token(s) de sa rareté (+ la moitié, arrondie à l'inférieur, du prix de son
       amélioration). Jamais supérieur au prix d'achat d'une carte aléatoire (CAMP_CARD_PRICE) : pas de boucle d'arbitrage rentable.
     Le plafond de copies d'une carte (campAddCard) compte la base ET ses variantes. */
  const CRAFT_ENABLED = true;             // false : seul le disenchant est exposé dans l'Atelier
  const CRAFT_LINK_COST = Object.freeze({ 2: 1, 3: 1, 4: 2 });   // par nombre de liens APRÈS amélioration
  const CRAFT_ALT_FACTOR = 2;             // rare / ultra-rare : prix alternatif = ×2 en tokens de la rareté inférieure
  const CRAFT_MAX_SYMBOLS = 3;            // comme l'éditeur de cartes (« Symboles (max 3) ») ; validateTemplate plafonne déjà les liens à 4
  const DISENCHANT_YIELD = 1;
  const DISENCHANT_REFUND = 0.5;
  const CRAFT_KINDS = ["link", "atk", "shield", "neutral", "revive"];

  function craftBaseOf(id) { const m = CRAFT_ID_RE.exec(String(id)); return m ? m[1] : id; }
  function craftParse(id) {
    const m = CRAFT_ID_RE.exec(String(id));
    return m ? { base: m[1], dl: +m[2], sym: { atk: +m[3], shield: +m[4], revive: +m[5], neutral: +m[6] } }
             : { base: id, dl: 0, sym: { atk: 0, shield: 0, revive: 0, neutral: 0 } };
  }
  function craftIdOf(base, dl, sym) { return dl || sym.atk || sym.shield || sym.revive || sym.neutral ? `${base}~${dl}-${sym.atk}-${sym.shield}-${sym.revive}-${sym.neutral}` : base; }
  function craftBuild(base, dl, sym, id) {
    return { ...base, id, baseId: base.id, crafted: dl > 0 || SYMBOL_KEYS.some((k) => sym[k] > 0), linkCount: base.linkCount + dl,
      symbols: Object.fromEntries(SYMBOL_KEYS.map((k) => [k, (base.symbols[k] || 0) + sym[k]])), effect: { ...base.effect }, target: { ...base.target } };
  }
  /** Modèle d'un id possédé : modèle de base, ou variante enregistrée à la demande. null si inconnu. */
  function craftTemplate(id) {
    if (CARDS_BY_ID[id]) return CARDS_BY_ID[id];
    const p = craftParse(id), base = CARDS_BY_ID[p.base];
    if (!base || p.base === id) return null;
    const tpl = craftBuild(base, p.dl, p.sym, id);
    Object.defineProperty(CARDS_BY_ID, id, { value: tpl, enumerable: false, configurable: true, writable: true });
    return tpl;
  }
  function craftRegisterAll(c) {
    if (!c || typeof c !== "object") return;
    const ids = new Set([...(c.collection && typeof c.collection === "object" ? Object.keys(c.collection) : []), ...(Array.isArray(c.deckIds) ? c.deckIds : [])]);
    ids.forEach((id) => craftTemplate(id));
  }
  function craftOwnedOfBase(id) {
    const base = craftBaseOf(id);
    return Object.keys(campaign.collection).reduce((n, k) => n + (craftBaseOf(k) === base ? campaign.collection[k] : 0), 0);
  }
  const craftInDeck = (id) => campaign.deckIds.reduce((n, x) => n + (x === id ? 1 : 0), 0);

  const craftLowerRarity = (r) => ({ [RARITIES.RARE]: RARITIES.UNCOMMON, [RARITIES.UNIQUE]: RARITIES.RARE })[r] || null;
  /** Prix natif (en tokens de la rareté de la carte) d'une amélioration unique de `base` : dl = +1 lien, sinon sym = { symbole: 1 }. */
  function craftCostOf(base, dl, sym) {
    if (dl) return CRAFT_LINK_COST[base.linkCount + dl] || 1;
    const k = SYMBOL_KEYS.find((x) => sym[x] > 0);
    if (k === "neutral") return 1;
    if (k === "revive") return 2;
    return (base.symbols.atk || 0) + (base.symbols.shield || 0) > 0 ? 3 : 2;   // atk / shield : le 2e coûte 1 de plus (bonus de tempo du châssis)
  }

  /** Aperçu d'une amélioration de l'exemplaire `id` (une seule par exemplaire) : kind = "link" | "atk" | "shield" | "neutral" | "revive". */
  function craftPreview(id, kind) {
    if (CRAFT_ID_RE.test(String(id))) return { ok: false };   // déjà amélioré : une seule amélioration par exemplaire
    const base = CARDS_BY_ID[id];
    if (!base) return { ok: false };
    const dl = kind === "link" ? 1 : 0, sym = { atk: 0, shield: 0, revive: 0, neutral: 0 };
    if (!dl) sym[kind] = 1;
    const cand = craftBuild(base, dl, sym, id);
    // Garde-fou = règles de design (validateTemplate) SAUF les planchers de rareté : payer des tokens, c'est justement dépasser le plancher d'une carte
    // (une commune sans ability peut monter à 2 symboles). Une ability à 3+ symboles reste réservée aux ultra-rares (règle de design conservée).
    const symbolTotal = SYMBOL_KEYS.reduce((n, k) => n + cand.symbols[k], 0);
    if (symbolTotal > CRAFT_MAX_SYMBOLS) return { ok: false };
    if (cand.trigger !== TRIGGERS.NONE && symbolTotal >= 3 && base.rarity !== RARITIES.UNIQUE) return { ok: false };
    if (validateTemplate({ ...cand, rarity: RARITIES.UNIQUE }).length) return { ok: false };
    const rarity = base.rarity || RARITIES.COMMON, cost = craftCostOf(base, dl, sym), lower = craftLowerRarity(rarity);
    return { ok: true, newId: craftIdOf(id, dl, sym), cost, rarity, alt: lower ? { rarity: lower, cost: cost * CRAFT_ALT_FACTOR } : null };
  }
  /** pay : "native" (tokens de la rareté de la carte) ou "alt" (rare / ultra-rare : le double en tokens de la rareté inférieure). */
  function craftApply(id, kind, pay = "native") {
    const pv = craftPreview(id, kind);
    if (!pv.ok || (campaign.collection[id] || 0) < 1) return false;
    const price = pay === "alt" && pv.alt ? pv.alt : { rarity: pv.rarity, cost: pv.cost };
    if (campaign.tokens[price.rarity] < campPrice(price.cost)) return false;
    campaign.tokens[price.rarity] -= campPrice(price.cost);
    campaign.collection[id]--; if (campaign.collection[id] <= 0) delete campaign.collection[id];
    campaign.collection[pv.newId] = (campaign.collection[pv.newId] || 0) + 1;
    const di = campaign.deckIds.indexOf(id);
    if (di >= 0) campaign.deckIds[di] = pv.newId;   // l'exemplaire du deck est amélioré sur place
    craftTemplate(pv.newId);
    campSave();
    return true;
  }
  function disenchantGain(id) {
    const tpl = craftTemplate(id);
    if (!tpl) return 0;
    const p = craftParse(id);
    const invested = p.base === id ? 0 : craftCostOf(CARDS_BY_ID[p.base], p.dl, p.sym);   // prix natif de l'amélioration
    return DISENCHANT_YIELD + Math.floor(invested * DISENCHANT_REFUND);
  }
  function disenchantApply(id) {
    const tpl = craftTemplate(id);
    if (!tpl || (campaign.collection[id] || 0) - craftInDeck(id) < 1) return false;   // seulement un exemplaire hors deck
    const r = tpl.rarity || RARITIES.COMMON;
    campaign.tokens[r] += disenchantGain(id);
    campaign.collection[id]--; if (campaign.collection[id] <= 0) delete campaign.collection[id];
    campSave();
    return true;
  }

  /** Butin de victoire avec pity dur : les raretés « dues » sont forcées (une carte distincte chacune, en remplaçant d'abord les cartes les moins rares). */
  function campRollRewardWithPity() {
    const offers = campRollReward();
    const rarityOf = (id) => CARDS_BY_ID[id].rarity || RARITIES.COMMON;
    const rank = (id) => CAMP_RARITIES.indexOf(rarityOf(id));
    const locked = new Set();
    for (const r of CAMP_PITY_ORDER) {
      if (campaign.pity.loot[r] < CAMP_PITY[r]) continue;
      const have = offers.findIndex((id, i) => rarityOf(id) === r && !locked.has(i));
      if (have >= 0) { locked.add(have); continue; }
      const slots = offers.map((id, i) => i).filter((i) => !locked.has(i)).sort((a, b) => rank(offers[a]) - rank(offers[b]));
      if (!slots.length) continue;
      let pick = null;
      for (let tries = 0; tries < 40 && !pick; tries++) { const c = campRollCardOfRarity(r); if (!offers.includes(c)) pick = c; }
      if (!pick) continue;
      offers[slots[0]] = pick; locked.add(slots[0]);
    }
    for (const r of CAMP_PITY_ORDER) campaign.pity.loot[r] = offers.some((id) => rarityOf(id) === r) ? 0 : campaign.pity.loot[r] + 1;
    return offers;
  }
  /** Jeton de ténacité (défaite sans abandon) : rareté tirée aux taux standards, sauf pity dur (un seul jeton : la plus haute rareté due). */
  function campRollTenacity() {
    const due = CAMP_PITY_ORDER.find((r) => campaign.pity.tenacity[r] >= CAMP_PITY[r]);
    const r = due || campRollRarity();
    for (const k of CAMP_PITY_ORDER) campaign.pity.tenacity[k] = k === r ? 0 : campaign.pity.tenacity[k] + 1;
    campaign.tokens[r]++;
    return r;
  }

  /** Fin de combat (appelée une seule fois par endGame). Victoire => 3 cartes à choisir (persistées : pas de reroll au rechargement).
   *  Défaite sans abandon => 1 jeton de ténacité. Retourne la rareté du jeton de ténacité accordé, ou null. */
  function campaignResolveFight(winner, reason) {
    campEnsure();
    try { localStorage.removeItem(CAMP_GAME_KEY); } catch (e) { /* ignoré */ }
    let tenacity = null;
    if (winner === "player") {
      campaign.wins++;
      campaign.reward = { offers: campRollRewardWithPity(), comic: comicAddStep() };
    } else if (winner === "ai" && reason !== "forfeit") {
      tenacity = campRollTenacity();
    }
    campSave();
    return tenacity;
  }

  // --- UI de l'Atelier ---
