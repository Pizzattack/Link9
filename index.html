  :root{ --font-ui: "Chakra Petch", "Segoe UI", system-ui, sans-serif; --font-text: Saira, "Segoe UI", system-ui, sans-serif; }
  button, .newgame-btn, .choice-btn, .primary-btn, h1, h2, h3, .hpval, .pile-n, .camp-tok b, .brand-text, .camp-logo-text, .tut-title, .ws-tab, .snd-btn{ font-family:var(--font-ui); }
  .load-screen{ position:fixed; inset:0; z-index:9999; display:none; align-items:center; justify-content:center; background:#0b0c0e; }
  .load-screen.on{ display:flex; }
  .load-screen.fade{ opacity:0; transition:opacity .22s ease; pointer-events:none; }
  .ld-inner{ display:flex; flex-direction:column; align-items:center; gap:18px; width:min(70vw,360px); opacity:0; transition:opacity .25s ease; }
  .load-screen.show .ld-inner{ opacity:1; }
  .ld-logo{ width:100%; height:auto; max-height:30vh; object-fit:contain; filter:drop-shadow(0 0 22px rgba(255,138,31,.35)); }
  .ld-bar{ width:100%; height:6px; border-radius:3px; background:rgba(255,255,255,.12); overflow:hidden; }
  .ld-bar i{ display:block; height:100%; width:0; background:linear-gradient(90deg,#ff8a1f,#ffc46b); transition:width .15s linear; }
  .ld-txt{ font:600 12px var(--font-ui); letter-spacing:.2em; text-transform:uppercase; color:#9a9ea8; }
  .home-screen{ position:fixed; inset:0; z-index:170; display:flex; align-items:center; justify-content:center; padding:24px; box-sizing:border-box; }
  .home-screen[hidden]{ display:none; }
  .home-inner{ display:flex; flex-direction:column; align-items:center; gap: clamp(30px, 7vh, 64px); width:100%; max-width:780px; }
  .home-logo{ width:100%; height:auto; display:block; position:relative; }
  .home-logo-wrap{ position:relative; isolation:isolate; width:min(62vw, 462px); animation: home-logo-in .8s cubic-bezier(.2,.9,.3,1.05) both; }
  .home-logo-wrap::before{ content:""; position:absolute; z-index:-1; inset:-45% -30%; background:var(--logo-halo); pointer-events:none; }
  .home-buttons{ display:flex; flex-direction:column; align-items:center; gap:15px; width:min(62vw, 406px); animation: home-rise .7s ease-out .25s both; }
  .home-screen .home-btn, body.ui-skin .home-screen .home-btn{
    width:100%; box-sizing:border-box; font-size:clamp(16.8px, 3.08vw, 26.6px); font-weight:800; letter-spacing:.09em; text-transform:uppercase;
    padding:.55em .6em; line-height:1.1; text-shadow:0 0 10px rgba(255,150,60,.5); }
  body.ui-skin .home-screen .home-btn{ padding:.4em .6em; }
  .home-screen .home-btn small{ display:block; margin-top:.25em; font-size:.38em; letter-spacing:.16em; opacity:.85; }
  .home-screen .home-btn.home-continue, body.ui-skin .home-screen .home-btn.home-continue{ font-size:clamp(12.6px, 2.1vw, 18.2px); width:78%; }
  .newgame-btn:disabled{ opacity:.5; filter:grayscale(.55); cursor:not-allowed; }
  @keyframes home-logo-in{ from{ opacity:0; transform:scale(.86) translateY(-10px); } to{ opacity:1; transform:none; } }
  @keyframes home-rise{ from{ opacity:0; transform:translateY(22px); } to{ opacity:1; transform:none; } }
  @media (prefers-reduced-motion: reduce){ .home-logo-wrap, .home-buttons{ animation-duration:.01s; } }

  /* ---------- Mode campaign ---------- */
  body.camp-open #app{ visibility:hidden; }
  .camp-screen{ position:fixed; inset:0; z-index:165; display:flex; align-items:center; justify-content:center; padding:24px; box-sizing:border-box; overflow:auto; }
  .camp-screen[hidden]{ display:none !important; }
  .camp-inner{ display:flex; flex-direction:column; align-items:center; gap: clamp(18px, 4.5vh, 38px); width:100%; max-width:780px; margin:auto; }
  .camp-head{ text-align:center; }
  .camp-head h1{ margin:0; font-size:clamp(26px, 5vw, 44px); letter-spacing:.14em; text-transform:uppercase; text-shadow:0 0 14px rgba(255,150,60,.55); }
  .camp-head div{ margin-top:6px; font-size:clamp(13px, 2vw, 16px); letter-spacing:.2em; text-transform:uppercase; color:var(--muted); }
  .camp-tokens{ display:flex; gap:10px; justify-content:center; flex-wrap:wrap; }
  .camp-tokens{ gap:16px; }
  .camp-tokens-box{ display:flex; flex-direction:column; align-items:center; gap:2px; padding:7px 21px 8px; border-radius:14px; border:1px solid var(--line); background:rgba(14,14,15,.62); box-shadow:0 0 14px rgba(0,0,0,.45) inset; }
  .camp-box-title{ font-size:11px; letter-spacing:.24em; text-transform:uppercase; color:var(--muted); }
  .camp-logo-wrap{ position:relative; isolation:isolate; margin-bottom:clamp(8px,2.5vh,22px); }
  .camp-logo-wrap::before{ content:""; position:absolute; z-index:-1; inset:-45% -25%; background:var(--logo-halo); pointer-events:none; }
  .camp-logo{ display:none; height:92px; max-width:80vw; object-fit:contain; width:auto; position:relative; }
  body.ui-skin .camp-logo{ display:block; }
  .camp-logo-text{ font-weight:800; letter-spacing:.16em; font-size:40px; color:var(--accent,#ff8a1f); text-shadow:0 0 14px rgba(255,150,60,.55); }
  body.ui-skin .camp-logo-text{ display:none; }
  #campHome{ position:fixed; top:12px; left:max(14px, 5vw); z-index:2; font-size:13px; padding:.35em 1.1em; }
  .camp-item{ display:flex; flex-direction:column; align-items:center; gap:3px; width:100%; }
  .camp-btn-sub{ font-size:clamp(10.5px,1.7vw,12.5px); letter-spacing:.1em; text-transform:uppercase; color:var(--muted); text-align:center; line-height:1.2; }
  /* Conteneur unique autour de l'ensemble des tokens (écran campaign) */
  #campTokens{ padding:0; }
  .camp-tok{ display:flex; align-items:center; gap:8px; padding:0; background:none; border:0; }
  .camp-tok b{ font-size:clamp(20px, 2.9vw, 25px); font-weight:800; min-width:1.2ch; text-align:left; text-shadow:0 2px 6px rgba(0,0,0,.7); }
  .camp-tok .tok-ico{ width:51px; height:51px; }
  .tok-ico{ position:relative; display:inline-block; flex:none; width:34px; height:34px; border-radius:50%; border:2px solid var(--c);
    background: radial-gradient(circle at 35% 30%, rgba(255,255,255,.55), var(--c) 55%, rgba(0,0,0,.45)); }
  .tok-ico img{ position:absolute; inset:-2px; width:calc(100% + 4px); height:calc(100% + 4px); object-fit:contain; }
  .tok-ico.ok{ background:none; border:none; }
  .tok-ico.sm{ width:24px; height:24px; }
  .camp-buttons{ display:flex; flex-direction:column; align-items:center; gap:11px; width:min(62vw, 406px); }   /* boutons -30 % */
  .camp-screen .camp-btn, body.ui-skin .camp-screen .camp-btn{ width:100%; box-sizing:border-box; font-size:clamp(15.4px, 2.8vw, 23.8px); font-weight:800; letter-spacing:.09em;
    text-transform:uppercase; padding:.55em .6em; line-height:1.1; text-shadow:0 0 10px rgba(255,150,60,.5); }
  body.ui-skin .camp-screen .camp-btn{ padding:.4em .6em; }
  .camp-btn.has-reward{ animation: camp-pulse 1.4s ease-in-out infinite; }
  @keyframes camp-pulse{ 0%,100%{ filter:grayscale(1) brightness(1.05) drop-shadow(0 0 0 rgba(255,138,31,0)); } 50%{ filter:grayscale(1) brightness(1.35) drop-shadow(0 0 12px rgba(255,138,31,.95)); } }
  .camp-foot{ display:flex; gap:12px; flex-wrap:wrap; justify-content:center; }
  /* Panneaux récompense / marchand : mêmes classes que l'écran de log (.log-overlay / .log-panel / .log-head) => même fond et même cadre skin. */
  .log-overlay.camp-ov{ z-index:175; background:rgba(0,0,0,.5); -webkit-backdrop-filter:blur(7px); backdrop-filter:blur(7px); }
  .camp-ov[hidden]{ display:none !important; }
  .log-panel.camp-log{ width:min(1000px, 100%); height:auto; max-height:96vh; display:flex; flex-direction:column; overflow:visible; }
  .camp-scroll{ flex:1 1 auto; min-height:0; overflow-y:auto; overscroll-behavior:contain; display:flex; flex-direction:column; gap:14px; padding:4px 8px 6px; }
  .camp-log .log-head{ justify-content:center; padding:6px 4px 0; }
  .camp-log p.hint{ margin:0; text-align:center; font-size:13px; color:var(--muted); }
  .camp-actions{ display:flex; justify-content:center; gap:10px; }
  .rw-row{ display:flex; gap:12px; justify-content:center; flex-wrap:wrap; }
  .rw-card{ position:relative; width:min(31%, 290px); min-width:150px; padding:12px 12px 10px; border-radius:12px; cursor:pointer; background:rgba(0,0,0,.28);
    border:2px solid var(--c); transition:transform .12s, box-shadow .12s; touch-action:manipulation; }
  .rw-card:hover{ transform:translateY(-3px); }
  .rw-card.sel{ box-shadow:0 0 18px var(--c); transform:translateY(-5px); outline:2px solid #fff; outline-offset:2px; }
  .rw-card .dbg-tile, .got-card .dbg-tile{ margin-top:18%; }   /* les flèches de lien dépassent au-dessus de la tuile : on leur réserve la place sous le bandeau de rareté */
  .rw-card .dbg-info{ font-size:10px; min-height:4.6em; }
  .rw-card .rw-tag{ display:block; width:max-content; max-width:100%; margin:0 auto 10px; padding:3px 12px; border-radius:999px; font-size:11px; font-weight:800;
    letter-spacing:.06em; text-transform:uppercase; background:var(--c); color:#000; white-space:nowrap; }
  .rw-card.done{ cursor:default; transform:none; }
  .rw-card.done.conv{ opacity:.8; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; min-height:140px; text-align:center; font-weight:800; }
  .rw-card.done.conv .tok-ico{ width:56px; height:56px; }
  #campFragments{ margin-top:4px; font-size:clamp(11px, 1.7vw, 13px); letter-spacing:.14em; opacity:.85; }
  /* Atelier (crafting / disenchant) */
  .flt-ico{ width:20px; height:20px; object-fit:contain; vertical-align:middle; } .dbg-chip .flt-ico{ margin-left:2px; } .flt-ico.big{ width:26px; height:26px; }
  .ws-fixed{ flex:none; display:flex; flex-direction:column; gap:8px; padding:4px 10px 8px; border-bottom:1px solid var(--line); }
  .ws-tokens{ gap:22px; }
  .ws-tokens .camp-tok .tok-ico{ width:40px; height:40px; } .ws-tokens .camp-tok b{ font-size:20px; }
  .ws-filters{ justify-content:center; flex:none; }
  .ws-foot{ flex:none; padding:8px 0 2px; }
  .ws-list{ display:flex; flex-direction:column; gap:10px; }
  .ws-row{ display:flex; align-items:flex-start; gap:14px; padding:10px 12px; border:1px solid var(--line); border-radius:12px; background:rgba(0,0,0,.22); }
  .ws-row .dbg-item{ flex:none; width:132px; cursor:default; }
  .ws-side{ flex:1 1 auto; min-width:0; display:flex; flex-direction:column; gap:10px; }
  .ws-name{ font-weight:800; font-size:15px; }
  .ws-name small{ font-weight:600; color:var(--muted); margin-left:8px; font-size:12px; }
  .ws-acts{ display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  .ws-btn{ display:inline-flex; align-items:center; gap:6px; padding:.35em .8em; font-size:13px; }
  .ws-up{ display:inline-flex; align-items:center; gap:6px; padding:3px 8px; border:1px solid var(--line); border-radius:10px; }
  .ws-up-l{ font-weight:800; font-size:13px; }
  .ws-up .ws-btn{ padding:.25em .6em; }
  .ws-btn[disabled]{ opacity:.45; cursor:not-allowed; }
  .ws-cost{ display:inline-flex; align-items:center; gap:3px; font-weight:800; }
  .ws-dis{ margin-left:auto; }
  .ws-none{ color:var(--muted); font-size:13px; }
  .ws-modes{ display:flex; gap:10px; justify-content:center; flex-wrap:wrap; }
  /* Onglets (et non boutons) : barre pleine largeur, onglet actif souligné et relié au contenu */
  .ws-modes{ gap:0; justify-content:stretch; flex-wrap:nowrap; border-bottom:2px solid var(--line); margin:0 -10px; padding:0 10px; }
  .ws-tab{ flex:1 1 0; appearance:none; background:transparent; border:0; border-bottom:4px solid transparent; margin-bottom:-2px; padding:10px 8px 8px; cursor:pointer;
    font:inherit; font-size:clamp(12px,2.2vw,15px); font-weight:800; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); transition:color .12s, background .12s, border-color .12s; }
  .ws-tab:hover{ color:#fff; background:rgba(255,255,255,.05); }
  .ws-tab.on{ color:#ff8a1f; border-bottom-color:#ff8a1f; background:linear-gradient(to top, rgba(255,138,31,.18), transparent); text-shadow:0 0 10px rgba(255,138,31,.6); }
  /* Skin : le filtre gris des boutons ne doit pas désaturer les icônes de jetons -> le gris est appliqué au seul sprite (pseudo-élément) */
  body.ui-skin .ws-btn{ position:relative; isolation:isolate; border-image:none; border-color:transparent; filter:none; }
  body.ui-skin .ws-btn::before{ content:""; position:absolute; inset:-.8em; z-index:-1; pointer-events:none; border:.8em solid transparent;
    border-image: var(--sb) 26 fill / 1 / 0 stretch; filter:grayscale(1) brightness(1.05); transition:filter .12s; }
  body.ui-skin .ws-btn:not(:disabled):hover::before{ filter:grayscale(1) brightness(1.2) drop-shadow(0 0 5px rgba(255,138,31,.8)); }
  body.ui-skin .ws-btn:not(:disabled):active::before{ border-image-source: var(--sb-on); filter:grayscale(1) brightness(1.35) drop-shadow(0 0 9px rgba(255,138,31,1)); }
  body.ui-skin .ws-btn:hover, body.ui-skin .ws-btn:active{ filter:none; }
  .ws-sec{ margin:6px 2px 0; font-size:12px; font-weight:800; letter-spacing:.16em; text-transform:uppercase; color:var(--muted); border-bottom:1px solid var(--line); padding-bottom:4px; }
  .ws-row.has-tok{ border-color:var(--c); } .ws-name .tok-ico{ vertical-align:middle; margin-left:8px; }
  /* Animations de l'Atelier */
  .ws-fx{ position:fixed; inset:0; z-index:230; display:flex; align-items:center; justify-content:center; background:rgba(0,0,0,.72); -webkit-backdrop-filter:blur(5px); backdrop-filter:blur(5px);
    cursor:pointer; animation:wsfx-in .2s ease-out both; }
  .ws-fx.out{ animation:wsfx-out .22s ease-in forwards; }
  @keyframes wsfx-in{ from{ opacity:0; } to{ opacity:1; } } @keyframes wsfx-out{ to{ opacity:0; } }
  .wsfx-box{ display:flex; flex-direction:column; align-items:center; gap:16px; }
  .wsfx-title{ font-size:clamp(16px,3vw,22px); font-weight:900; letter-spacing:.18em; text-transform:uppercase; color:#ff9a3d; text-shadow:0 0 14px rgba(255,138,31,.8); }
  .wsfx-sub{ display:flex; align-items:center; gap:8px; font-weight:800; font-size:16px; opacity:0; animation:wsfx-sub .4s ease-out 1.25s forwards; }
  @keyframes wsfx-sub{ from{ opacity:0; transform:translateY(8px); } to{ opacity:1; transform:none; } }
  .wsfx-stage{ position:relative; width:min(46vw,200px); }
  .wsfx-stage .dbg-tile{ margin-top:18%; }
  .wsfx-tile.after, .wsfx-tile.before{ width:100%; }
  .wsfx-tile.after{ position:absolute; left:0; top:0; }
  /* upgrade : un scanner descend ; au-dessus la carte « après », au-dessous la carte « avant » */
  .wsfx-up .wsfx-tile.before{ animation:wsfx-before 1.9s ease-in-out both; }
  .wsfx-up .wsfx-tile.after{ animation:wsfx-after 1.9s ease-in-out both; }
  .wsfx-beam{ position:absolute; left:-10%; right:-10%; height:3px; top:0; background:#ff8a1f; box-shadow:0 0 14px 4px rgba(255,138,31,.95), 0 0 40px 10px rgba(255,138,31,.5); opacity:0; }
  .wsfx-up .wsfx-beam{ animation:wsfx-beam 1.9s ease-in-out both; }
  @keyframes wsfx-before{ 0%,22%{ clip-path:inset(0 0 0 0); filter:none; } 22%{ filter:none; } 80%{ clip-path:inset(100% 0 0 0); filter:brightness(1.6); } 100%{ clip-path:inset(100% 0 0 0); } }
  @keyframes wsfx-after{ 0%,22%{ clip-path:inset(0 0 100% 0); } 80%{ clip-path:inset(0 0 0 0); filter:brightness(1.5) drop-shadow(0 0 14px #ff8a1f); } 100%{ clip-path:inset(0 0 0 0); filter:drop-shadow(0 0 18px rgba(255,138,31,.9)); } }
  @keyframes wsfx-beam{ 0%,20%{ top:0; opacity:0; } 24%{ opacity:1; } 80%{ top:100%; opacity:1; } 86%,100%{ top:100%; opacity:0; } }
  /* scrap : glitch, écrasement en ligne de scan, puis éclatement en shards qui s'envolent */
  .wsfx-scrap .wsfx-tile.scrap{ animation:wsfx-scrap 1.2s ease-in forwards; transform-origin:center 55%; }
  @keyframes wsfx-scrap{
    0%{ transform:none; filter:none; opacity:1; }
    10%{ transform:translateX(-6px); filter:hue-rotate(70deg) brightness(1.5); }
    18%{ transform:translateX(7px) skewX(-5deg); filter:hue-rotate(-70deg) saturate(2.4); }
    26%{ transform:translateX(-3px); filter:grayscale(1) brightness(2); }
    34%{ transform:none; filter:brightness(1.4); }
    70%{ transform:scaleY(.03) scaleX(1.12); filter:grayscale(1) brightness(3.2); opacity:1; }
    100%{ transform:scaleY(.02) scaleX(0); filter:brightness(4); opacity:0; }
  }

        `Each player has their own 3×3 grid, a ${p.deck}-program deck and a hand of up to ${p.hand} programs.`,
        `On your turn: you draw up to ${p.hand} programs, your start-of-turn abilities fire, you place one program from your hand on an empty cell of your grid, the resulting chains are resolved, then the turn passes to the rival.`,

      ] },
      { id: "combos", title: "Chains and combos", paras: [
        `When a chain holds at least ${p.chain} symbols in total, it triggers a combo. The combo type is the real symbol with the highest count (neutral symbols never decide the type). On a tie, you choose among the tied types.`,
        `Attack: the rival loses one HP per attack symbol in the chain. Shield: you heal one HP per shield symbol. Revive: you reactivate one disabled program of yours per revive symbol.`,
        `Then every program of the chain whose ability is a matching combo ability fires once, and finally all the programs of the chain go to the discard pile.`,
        `A chain made only of neutral symbols has no effect: its programs are simply discarded.`,
        `A single program carrying ${p.chain} symbols or more triggers a combo on its own, as soon as it is placed.`,
      ] },
      { id: "abilities", title: "Abilities and triggers", paras: [

        `A program without an icon has no ability.`,
      ] },
      { id: "rarity", title: "Rarities", paras: [
        `Programs come in four rarities. Rarer programs tend to have more links, more symbols or stronger abilities.`,
      ] },
      { id: "resources", title: "Deck, hand and discard pile", paras: [
        `These three counters are shown next to your grid.`,
        `If you have to draw and your deck is empty, both players lose 1 HP.`,
        `Some effects destroy a cell: it becomes a ruin and can no longer receive programs. Others permanently reduce a hand size (never below 1).`,
      ] },
      { id: "end", title: "How a game ends", paras: [

        `If both players reach 0 HP at the same time, the game is a draw.`,
      ] },
      { id: "random", title: "Random mode", paras: [

        `A game in progress is saved: use "${p.cont}" on the home screen to resume it. Only one game can be in progress at a time across both modes: starting the other mode asks for confirmation and abandons the current game.`,
      ] },
      { id: "campaign", title: "Campaign mode", paras: [
        `Build your own deck fight after fight. You start with a ${p.deck}-program deck, and your collection only holds the programs you own. Your deck always has exactly ${p.deck} programs.`,
        `Each fight is against a new random opponent whose deck is built from yours, slightly weaker. Losing costs nothing: you just fight again.`,
        `You can own at most ${p.copies} copies of a program, up to Rare, and a single copy of an Ultra-rare. Any extra copy is turned into a shard.`,
      ] },
      { id: "rewards", title: "Rewards", paras: [

      ] },

        `Después, cada programa de la cadena cuya habilidad sea una habilidad de combo del mismo tipo se activa una vez y, por último, todos los programas de la cadena van a la pila de descarte.`,

        `Estos tres contadores se muestran junto a tu cuadrícula.`,
        `Si tienes que robar y tu mazo está vacío, ambos jugadores pierden 1 PV.`,
        `Algunos efectos destruyen una casilla: se convierte en ruina y ya no puede recibir programas. Otros reducen de forma permanente el tamaño de una mano (nunca por debajo de 1).`,

        `Si ambos jugadores llegan a 0 PV a la vez, la partida es un empate.`,
      ] },
      { id: "random", title: "Modo aleatorio", paras: [
        `Ambos jugadores reciben un mazo aleatorio de ${p.deck} programas, equilibrado entre rarezas, con como máximo una copia de cada programa y algunos programas de revivir.`,
        `Una partida en curso se guarda: usa "${p.cont}" en la pantalla de inicio para reanudarla. Solo puede haber una partida en curso entre ambos modos: empezar el otro modo pide confirmación y abandona la partida actual.`,
      ] },
      { id: "campaign", title: "Modo campaña", paras: [

        `Cada combate es contra un nuevo oponente aleatorio cuyo mazo se construye a partir del tuyo, algo más débil. Perder no cuesta nada: simplemente vuelves a combatir.`,
        `Puedes tener como máximo ${p.copies} copias de un programa, hasta Rara, y una sola copia de una Ultrarara. Cualquier copia extra se convierte en un shard.`,

      { id: "rewards", title: "Recompensas", paras: [

        `Rarezas garantizadas: tras ${p.pity.unique} recompensas sin Ultrarara, ${p.pity.rare} sin Rara o ${p.pity.uncommon} sin Poco común, la siguiente incluye esa rareza seguro. Los mismos contadores, llevados por separado, valen para los shards de tenacidad.`,

    rulesChapters: (p) => [
      { id: "goal", title: "Ziel und Zugablauf", paras: [
        `Bringe die LP des Rivalen auf 0, bevor deine auf 0 fallen. Beide Spieler starten mit ${p.hp} LP, und LP können nie über ${p.cap} steigen.`,
        `Jeder Spieler hat ein eigenes 3×3-Raster, ein Deck mit ${p.deck} Programmen und eine Hand mit bis zu ${p.hand} Programmen.`,
        `In deinem Zug: Du ziehst bis zu ${p.hand} Programme, deine Fähigkeiten zu Zugbeginn werden ausgelöst, du legst ein Programm aus deiner Hand auf ein leeres Feld deines Rasters, die entstandenen Ketten werden aufgelöst, dann ist der Rivale am Zug.`,
      ] },
      { id: "grid", title: "Das Raster und Verbindungen", paras: [
        `Jedes Programm hat einen bis vier Pfeile an Seiten und Ecken: ihre Verbindungen. Zwei benachbarte Programme sind nur verbunden, wenn ihre Pfeile aufeinander zeigen und beide Programme aktiv sind.`,
        `Eine Gruppe verbundener Programme bildet eine Kette. Deaktivierte Programme (ausgegraut) verbinden sich nie, bis sie reaktiviert werden. Manche Programme kommen gesperrt ins Spiel: Sie werden deaktiviert platziert und erwachen später.`,
        `Beim Platzieren eines Programms wird nur die Kette aufgelöst, zu der dieses Programm gehört. Andere Ketten mit genug Symbolen werden zu Beginn des Zuges ihres Besitzers aufgelöst.`,
      ] },
      { id: "symbols", title: "Symbole", paras: [
        `Jedes Programm trägt ein bis drei Symbole. Ketten bestehen aus Symbolen: Sie entscheiden, ob eine Kombo stattfindet und welche.`,
      ] },
      { id: "combos", title: "Ketten und Kombos", paras: [
        `Enthält eine Kette insgesamt mindestens ${p.chain} Symbole, löst sie eine Kombo aus. Der Kombo-Typ ist das echte Symbol mit der höchsten Anzahl (neutrale Symbole bestimmen nie den Typ). Bei Gleichstand wählst du unter den gleichauf liegenden Typen.`,
        `Angriff: Der Rivale verliert pro Angriffssymbol der Kette 1 LP. Schild: Du heilst pro Schildsymbol 1 LP. Wiederbelebung: Du reaktivierst pro Wiederbelebungssymbol eine deiner deaktivierten Programme.`,
        `Danach wird jedes Programm der Kette, dessen Fähigkeit eine passende Kombo-Fähigkeit ist, einmal ausgelöst, und schließlich kommen alle Programme der Kette auf die Ablage.`,
        `Eine Kette nur aus neutralen Symbolen hat keine Wirkung: Ihre Programme werden einfach abgelegt.`,
        `Ein einzelnes Programm mit ${p.chain} oder mehr Symbolen löst eine Kombo allein aus, sobald es platziert wird.`,
      ] },
      { id: "abilities", title: "Fähigkeiten und Auslöser", paras: [
        `Die Fähigkeit eines Programms hat einen Auslöser (wann sie wirkt), einen Effekt und ein Ziel. Das Symbol unten rechts auf dem Programm zeigt seinen Auslöser; untersuche ein Programm, um den ganzen Satz zu lesen.`,
        `Ein Programm ohne Symbol hat keine Fähigkeit.`,
      ] },
      { id: "rarity", title: "Seltenheiten", paras: [
        `Programme gibt es in vier Seltenheiten. Seltenere Programme haben tendenziell mehr Verbindungen, mehr Symbole oder stärkere Fähigkeiten.`,
      ] },
      { id: "resources", title: "Deck, Hand und Ablage", paras: [
        `Diese drei Zähler werden neben deinem Raster angezeigt.`,
        `Musst du ziehen und dein Deck ist leer, verlieren beide Spieler 1 LP.`,
        `Manche Effekte zerstören ein Feld: Es wird zur Ruine und kann keine Programme mehr aufnehmen. Andere verkleinern dauerhaft eine Hand (nie unter 1).`,
      ] },
      { id: "end", title: "Wie ein Spiel endet", paras: [
        `Du verlierst, wenn deine LP 0 erreichen, wenn dein Raster zu Beginn deines Zuges voll ist oder wenn du aufgibst.`,
        `Erreichen beide Spieler gleichzeitig 0 LP, endet das Spiel unentschieden.`,
      ] },
      { id: "random", title: "Zufallsmodus", paras: [
        `Beide Spieler erhalten ein zufälliges Deck mit ${p.deck} Programmen, über die Seltenheiten ausgewogen, mit höchstens einem Exemplar je Programm und einigen Wiederbelebungsprogramme.`,
        `Ein laufendes Spiel wird gespeichert: Nutze „${p.cont}“ auf dem Startbildschirm, um es fortzusetzen. Es kann nur ein Spiel gleichzeitig laufen, über beide Modi hinweg: Der Start des anderen Modus fragt nach Bestätigung und bricht das laufende Spiel ab.`,
      ] },
      { id: "campaign", title: "Kampagnenmodus", paras: [
        `Baue dein eigenes Deck Kampf für Kampf auf. Du startest mit einem Deck aus ${p.deck} Programmen, und deine Sammlung enthält nur Programme, die du besitzt. Dein Deck hat immer genau ${p.deck} Programme.`,
        `Jeder Kampf findet gegen einen neuen zufälligen Gegner statt, dessen Deck aus deinem gebaut und etwas schwächer ist. Verlieren kostet nichts: Du kämpfst einfach erneut.`,
        `Du kannst höchstens ${p.copies} Exemplare eines Programms besitzen, bis einschließlich Selten, und nur ein Exemplar einer Ultra-seltenen. Jedes weitere Exemplar wird zu einem Shard.`,
      ] },
      { id: "rewards", title: "Belohnungen", paras: [
        `Nach jedem Sieg werden drei verschiedene Programme angeboten. Wähle eines für deine Sammlung: Die beiden anderen werden zu je einem Shard ihrer Seltenheit.`,
        `Die Seltenheit der angebotenen Programme wird mit diesen Wahrscheinlichkeiten gezogen:`,
      ] },
      { id: "tokens", title: "Shards", paras: [
        `Es gibt pro Seltenheit eine Art Shard. Sie werden oben im Kampagnenbildschirm angezeigt und beim Händler ausgegeben.`,
        `Auch wer einen Kampf verliert (ohne aufzugeben), erhält eine Zähigkeitsbelohnung: einen Shard, dessen Seltenheit mit denselben Wahrscheinlichkeiten wie bei Programmbelohnungen gezogen wird.`,
        `Garantierte Seltenheiten: nach ${p.pity.unique} Belohnungen ohne Ultra-selten, ${p.pity.rare} ohne Selten oder ${p.pity.uncommon} ohne Ungewöhnlich enthält die nächste sicher diese Seltenheit. Dieselben Zähler, getrennt geführt, gelten für Zähigkeits-Shards.`,
        `In der Werkstatt kannst du einem Programm, das du besitzt, eine Verbindung oder ein Symbol hinzufügen (eine Verbesserung pro Programm) oder ein überzähliges Exemplar außerhalb deines Decks verschrotten, um Shards zurückzubekommen.`,
      ] },
      { id: "merchant", title: "Händler", paras: [
        `Gib Shards einer Seltenheit aus, um ein zufälliges Programm dieser Seltenheit zu kaufen oder – für 1 Shard mehr – ein Programm aus 5 zufälligen Programmen dieser Seltenheit zu wählen (die anderen 4 verfallen), oder tausche Shards gegen Shards einer höheren Seltenheit:`,
      ] },

      ] },

    tutT_board: "The board", tutX_board: (p) => `Each side has hit points (HP): bring the rival's to 0 before yours reach 0. Both start at ${p.hp} and can never go above ${p.cap}. Each player builds on their own 3×3 grid — yours at the bottom, the rival's at the top — placing one program per turn on an empty square. If your grid is full at the start of your turn, you lose.`,
    tutT_cards: "Deck, hand, discard", tutX_cards: (p) => `Deck: programs not drawn yet. Discard: programs used in a combo or destroyed. The rival has the same piles. Your hand holds the programs you can play: you draw back up to ${p.hand} at the start of each turn. To play, select a program then tap a square — or drag it onto it.`,

// Variantes « craftées » (campagne) : id = <carte de base>~<liens>-<atk>-<bouclier>-<revive>-<neutre> (ajouts par rapport à la base).
const CRAFT_ID_RE = /^(C\d+)~(\d)-(\d)-(\d)-(\d)-(\d)$/;
function cardName(templateId) {
  const m = CRAFT_ID_RE.exec(String(templateId));
  const baseId = m ? m[1] : templateId;
  const names = (STRINGS[LOCALE] || STRINGS.en).cardNames || {};
  const base = names[baseId] || (STRINGS.en.cardNames || {})[baseId] || baseId;
  return m ? `${base} +` : base;   // « + » = carte améliorée (sans préciser l'amélioration)
}

// ---------------------------------------------------------------------------
// Combo vs ability — DEUX cibles distinctes (chacune optionnelle : fixe, tirée au
// hasard, ou sans cible légale -> aucun choix demandé).
//   1/ la cible du COMBO : l'action propre au type de combo (atk -> dégâts sur une
//      carte ennemie OU directement sur l'adversaire ; shield -> soin ; revive ->
//      réactivation d'une carte à soi). Un seul évènement "combo" par chaîne.
//   2/ la cible de l'ABILITY déclenchée par ce combo : une carte `onCombo:<type>` dont
//      l'effet n'est PAS l'effet natif du combo (ou marquée `comboAbility: true`) ne
//      contribue pas au combo : elle déclenche son PROPRE évènement "ability", avec sa
//      PROPRE cible, indépendante de celle du combo.
// Une carte `onCombo:<type>` dont l'effet est l'effet natif (cas des 150 cartes
// actuelles) reste agrégée dans l'évènement de combo, comme avant.
// ---------------------------------------------------------------------------
const COMBO_NATIVE_EFFECT = Object.freeze({
  atk: EFFECT_TYPES.DAMAGE, shield: EFFECT_TYPES.HEAL, revive: EFFECT_TYPES.ACTIVATE,
});
const COMBO_BASE_TARGET = Object.freeze({
  atk: Object.freeze({ scope: TARGET_SCOPES.OPPONENT_PLAYER, mode: TARGET_MODES.FIXED }),
  shield: Object.freeze({ scope: TARGET_SCOPES.SELF_PLAYER, mode: TARGET_MODES.FIXED }),
  revive: Object.freeze({ scope: TARGET_SCOPES.OWN_CARD, mode: TARGET_MODES.CHOSEN }),
});
function comboTypeOfTrigger(trigger) {
  return typeof trigger === "string" && trigger.startsWith("onCombo:") ? trigger.slice("onCombo:".length) : null;
}
/** Vrai si la carte (ou template) `onCombo:<type>` porte une ABILITY (cible propre) plutôt que l'effet natif du combo. */
function isComboAbilityCard(card, type) {
  return !!card.comboAbility || card.effect.type !== COMBO_NATIVE_EFFECT[type];
}
/** Sépare les cases d'une chaîne portant `onCombo:<type>` en contributeurs du combo et abilities. */
function splitComboCarriers(grid, chainIndices, type) {
  const triggerName = "onCombo:" + type;
  const carriers = chainIndices.filter((cell) => grid[cell] && grid[cell].trigger === triggerName);
  return {
    natives: carriers.filter((cell) => !isComboAbilityCard(grid[cell], type)),
    abilities: carriers.filter((cell) => isComboAbilityCard(grid[cell], type)),
  };
}

/** Plafond de main du joueur (5 par défaut ; baissé DÉFINITIVEMENT par handToDeck). */
function handCapOf(side) {
  return side && side.handCap != null ? side.handCap : HAND_SIZE;
}

/**
 * Taille du deck d'un côté. Dans la vraie partie `side.deck` est un tableau ; dans les états
 * clonés pour la recherche (cloneSideState) il n'existe pas, seul `deckCount` est porté.
 */
function deckSizeOf(side) {
  if (!side) return 0;
  return Array.isArray(side.deck) ? side.deck.length : (side.deckCount || 0);
}

/** Remet une carte dans le deck à une position aléatoire (pioche = pop() depuis la fin). */
function addCardToDeck(side, card, rng = defaultRng) {
  if (Array.isArray(side.deck)) {
    const pos = Math.floor(rng() * (side.deck.length + 1));
    side.deck.splice(pos, 0, card);
  } else {
    side.deckCount = (side.deckCount || 0) + 1; // état cloné : on ne compte que la taille
  }
}

/** Remise à neuf d'une carte retournée au deck : symboles du modèle, réactivée, charges pleines. Directions conservées. */
function resetCardForDeck(card) {
  const tpl = CARDS_BY_ID && CARDS_BY_ID[card.templateId];
  if (tpl) {
    card.symbols = { ...tpl.symbols };
    card.charges = tpl.trigger === TRIGGERS.START_OF_TURN ? tpl.charges : null;
  }
  card.disabled = false;
  return card;
}

/** Case détruite : objet non nul (la grille pleine la compte comme occupée), inerte et désactivé (les chaînes l'ignorent). */
function makeRuin() {
  return {
    ruin: true, templateId: null, dirs: [], symbols: { atk: 0, shield: 0, revive: 0, neutral: 0 },
    trigger: TRIGGERS.NONE, effect: { type: EFFECT_TYPES.NONE, magnitude: 0 },
    target: { scope: TARGET_SCOPES.SELF_CARD, mode: TARGET_MODES.FIXED },
    disabled: true, lockOnPlacement: false, charges: null,
  };
}

const RARITIES = Object.freeze({
  COMMON: "common",
  UNCOMMON: "uncommon",
  RARE: "rare",
  UNIQUE: "unique",
});

// ---------------------------------------------------------------------------
// Instanciation d'un chassis : nombre de liens fixé, directions tirées au hasard
// ---------------------------------------------------------------------------

function defaultRng() {
  return Math.random();
}

/**
 * Tire un ensemble de `linkCount` directions distinctes parmi les 8 possibles.
 * Pour linkCount >= 2, impose au moins une direction orthogonale ET une
 * diagonale (règle de mélange +/X), par rejet-échantillonnage.
 */
function drawDirections(linkCount, rng = defaultRng) {
  if (linkCount < 1 || linkCount > 4) {
    throw new Error(`linkCount doit être entre 1 et 4 (reçu ${linkCount})`);
  }
  for (let attempt = 0; attempt < 200; attempt++) {
    const pool = [...DIRS];
    const picked = [];
    for (let i = 0; i < linkCount; i++) {
      const idx = Math.floor(rng() * pool.length);
      picked.push(pool.splice(idx, 1)[0]);
    }
    if (linkCount === 1) return picked;
    const hasOrth = picked.some((d) => ORTH.includes(d));
    const hasDiag = picked.some((d) => DIAG.includes(d));
    if (hasOrth && hasDiag) return picked;
    // sinon on retire l'échantillon (silo +/X) et on retire
  }
  throw new Error("drawDirections: impossible de satisfaire la règle de mélange après 200 essais");
}

/**
 * Construit une instance de carte concrète (avec ses flèches tirées) à partir
 * d'un template abstrait. Appelé une fois PAR EXEMPLAIRE au moment de la
 * construction du deck — deux copies de la même carte template auront très
 * probablement des directions différentes.
 */
function instantiateCard(template, rng = defaultRng, presetDirs = null) {
  return {
    templateId: template.id,
    dirs: presetDirs || drawDirections(template.linkCount, rng),
    symbols: { ...template.symbols },
    trigger: template.trigger,
    effect: { ...template.effect },
    target: { ...template.target },
    disabled: false,
    // Auto-lock : la carte se BLOQUE en arrivant sur la grille (case perdue tant qu'elle
    // n'est pas réactivée), en échange d'un effet `onActivation` puissant. Un seul trigger
    // par carte : le verrou est donc une propriété du châssis, pas un second trigger.
    lockOnPlacement: !!template.lockOnPlacement,
    // Ability posée sur un combo : cible propre, distincte de celle du combo (cf. COMBO_NATIVE_EFFECT).
    comboAbility: !!template.comboAbility,
    // Effets récurrents (startOfTurn) : nombre de déclenchements restants (1 à 3), jamais infini.
    charges: template.trigger === TRIGGERS.START_OF_TURN ? template.charges : null,
  };
}

// ---------------------------------------------------------------------------
// Réciprocité des liens — équilibre des directions au niveau du DECK
// ---------------------------------------------------------------------------
// Constat (RESTART.md) : drawDirections() tire les directions d'une carte
// indépendamment de tout le reste du deck. Rien ne garantit qu'une direction
// posée trouve sa contrepartie (OPPOSITE[dir]) ailleurs dans le deck : le
// joueur peut être bloqué sans avoir fait d'erreur ni pioché une carte faible.
//
// On NE touche PAS à la réciprocité stricte à la pose (OPPOSITE[dir] reste une
// règle de jeu, cf. getActiveLinkDirs). On agit uniquement sur la
// CONSTRUCTION du deck : chaque paire de directions opposées (N/S, E/W,
// NE/SW, NW/SE) a un nombre d'occurrences ÉGAL sur l'ensemble du deck (à 1
// près si le total de la paire est impair, auquel cas le "+1" est attribué au
// hasard à l'un des deux côtés — non biaisé en espérance sur plusieurs decks).
// Cela ne garantit RIEN pour un tirage individuel : deux cartes en main
// peuvent très bien ne pas se répondre ce tour-là. Ça garantit seulement
// qu'à l'échelle du deck entier, chaque direction a une contrepartie qui
// existe quelque part — le blocage n'est alors plus un défaut structurel du
// deck, seulement une question de timing.

const DIR_PAIRS = [["N", "S"], ["E", "W"], ["NE", "SW"], ["NW", "SE"]];

/** Sac de `totalSlots` directions, rééquilibré exactement (±1) sur chaque paire opposée. */
function buildDirectionBag(totalSlots, rng = defaultRng) {
  const bag = [];
  for (let i = 0; i < totalSlots; i++) bag.push(DIRS[Math.floor(rng() * DIRS.length)]);
  for (const [a, b] of DIR_PAIRS) {
    const idx = [];
    bag.forEach((d, i) => { if (d === a || d === b) idx.push(i); });
    const half = Math.floor(idx.length / 2);
    const targetA = rng() < 0.5 ? idx.length - half : half; // le +1 (total impair) va au hasard à A ou B
    const pool = shuffleCopy(idx, rng);
    for (let k = 0; k < pool.length; k++) bag[pool[k]] = k < targetA ? a : b;
  }
  return bag;
}

/**
 * Une tentative de distribution du sac aux cartes (une entrée par exemplaire
 * physique, avec son linkCount). Respecte, PAR CARTE : directions distinctes,
 * et pour linkCount >= 2, mélange +/X (>=1 orthogonale ET >=1 diagonale).
 * Ne modifie jamais un jeton déjà attribué à une autre carte (préserve
 * l'équilibre pair-à-pair construit dans le sac) : en cas d'impasse locale
 * (plus de direction inédite disponible pour cette carte, ou aucun échange
 * possible pour le mélange +/X), la tentative entière est rejetée (renvoie
 * null) plutôt que de produire une carte invalide — l'appelant retente avec
 * un nouveau sac.
 */
function tryAssignDirections(templates, rng) {
  const totalSlots = templates.reduce((s, t) => s + t.linkCount, 0);
  const bag = buildDirectionBag(totalSlots, rng);
  const used = new Array(bag.length).fill(false);
  const result = new Array(templates.length);

  // Les cartes les plus exigeantes (linkCount élevé) piochent en premier,
  // pendant que le sac est le plus divers ; ordre aléatoire à linkCount égal.
  const order = templates.map((_, i) => i);
  shuffleCopy(order, rng).sort((a, b) => templates[b].linkCount - templates[a].linkCount);

  function takeNext(excludeDirs) {
    for (let i = 0; i < bag.length; i++) if (!used[i] && !excludeDirs.has(bag[i])) return i;
    return -1;
  }
  function findSwapCandidate(need, excludeDirs) {
    const set = need === "orth" ? ORTH : DIAG;
    for (let i = 0; i < bag.length; i++) if (!used[i] && set.includes(bag[i]) && !excludeDirs.has(bag[i])) return i;
    return -1;
  }

  for (const cardIdx of order) {
    const linkCount = templates[cardIdx].linkCount;
    const picked = [];
    const dirsUsed = new Set();
    for (let k = 0; k < linkCount; k++) {
      const idx = takeNext(dirsUsed);
      if (idx === -1) return null; // impasse -> toute la tentative est rejetée
      used[idx] = true; picked.push(idx); dirsUsed.add(bag[idx]);
    }
    if (linkCount >= 2) {
      const hasOrth = picked.some((i) => ORTH.includes(bag[i]));
      const hasDiag = picked.some((i) => DIAG.includes(bag[i]));
      if (!hasOrth || !hasDiag) {
        const need = hasOrth ? "diag" : "orth";
        const over = hasOrth ? "orth" : "diag";
        const swapIdx = findSwapCandidate(need, dirsUsed);
        if (swapIdx === -1) return null; // pas d'échange possible -> rejeter
        const giveBack = picked.find((i) => (over === "orth" ? ORTH : DIAG).includes(bag[i]));
        used[giveBack] = false; used[swapIdx] = true;
        picked[picked.indexOf(giveBack)] = swapIdx;
      }
    }
    result[cardIdx] = picked.map((i) => bag[i]);
  }
  return result;
}

/**
 * Distribue les directions à une liste de templates (un par exemplaire
 * physique) avec équilibre pair-à-pair garanti sur tout le deck. Rejette et
 * retente une distribution invalide (calcul pur, coût négligeable — mesuré à
 * ~5 tentatives en moyenne sur le deck de 25 cartes / 55 flèches, jamais plus
 * de quelques dizaines sur 3000 essais). Si vraiment aucune tentative ne
 * fonctionne (situation non observée en pratique), on se rabat sur l'ancien
 * tirage indépendant par carte plutôt que de bloquer la partie.
 */
function assignDirectionsToTemplates(templates, rng = defaultRng, maxAttempts = 300) {
  for (let a = 0; a < maxAttempts; a++) {
    const r = tryAssignDirections(templates, rng);
    if (r) return r;
  }
  console.warn("assignDirectionsToTemplates: repli sur tirage indépendant (sac non résolu après", maxAttempts, "tentatives)");
  return templates.map((t) => drawDirections(t.linkCount, rng));
}

/**
 * Construit un deck complet (composition {templateId: quantité}) avec
 * équilibre pair-à-pair des directions sur l'ensemble du deck — cf. RESTART.md,
 * "réciprocité des liens". À utiliser à la place d'un tirage indépendant par
 * carte partout où un DECK entier est construit (partie réelle, simulateMatch).
 */
function buildBalancedDeck(compositionMap, templatesById, rng = defaultRng) {
  const templates = [];
  for (const id in compositionMap) {
    for (let i = 0; i < compositionMap[id]; i++) templates.push(templatesById[id]);
  }
  const dirsList = assignDirectionsToTemplates(templates, rng);
  return templates.map((template, i) => instantiateCard(template, rng, dirsList[i]));
}

/**
 * Deck ALÉATOIRE pondéré par rareté, piochant dans TOUT le pool de cartes
 * (Phase 7, 150 cartes) — utilisé par la vraie partie (buildDeckList), PAS
 * par le harnais de calibration ni par DECK_COMPOSITION, qui restent la
 * référence fixe du harnais (cf. RESTART.md §5/§6 : les décks de test du
 * harnais dépendent d'une composition STABLE, ne jamais la faire dépendre
 * du pool complet). Pondération type "booster" : commun très probable,
 * ultra-rare rare. Copies plafonnées par carte pour éviter un deck dégénéré.
 */
const RARITY_WEIGHT = Object.freeze({
  [RARITIES.COMMON]: 1, [RARITIES.UNCOMMON]: 0.4, [RARITIES.RARE]: 0.12, [RARITIES.UNIQUE]: 0.03,
});
const MAX_COPIES_PER_CARD = 1; // UNE seule copie par type de carte dans un deck
const REVIVE_CARDS_PER_DECK = 4; // un deck contient exactement 4 cartes de type revive (trigger onCombo:revive)
function buildRandomComposition(templatesById, size = 25, rng = defaultRng) {
  // Deck ÉQUILIBRÉ par rareté (même quantité par rareté, le reste de la division réparti au hasard),
  // tirage uniforme SANS remise (au plus MAX_COPIES_PER_CARD par type), dont EXACTEMENT
  // REVIVE_CARDS_PER_DECK cartes de type revive, comptées dans le quota de leur rareté.
  // (RARITY_WEIGHT n'est plus utilisé ici.)
  const isRevive = (id) => templatesById[id].trigger === TRIGGERS.ON_COMBO_REVIVE;
  const byRarity = new Map();
  for (const id of Object.keys(templatesById)) {
    const r = templatesById[id].rarity;
    if (!byRarity.has(r)) byRarity.set(r, { revive: [], other: [] });
    byRarity.get(r)[isRevive(id) ? "revive" : "other"].push(id);
  }
  const groups = [...byRarity.values()];
  const shuffle = (a) => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rng() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  groups.forEach((g) => { shuffle(g.revive); shuffle(g.other); });
  const cap = (g) => (g.revive.length + g.other.length) * MAX_COPIES_PER_CARD;
  const quota = groups.map(() => 0);
  let left = Math.min(size, groups.reduce((n, g) => n + cap(g), 0));
  while (left > 0) {
    const open = shuffle(groups.map((g, i) => i).filter((i) => quota[i] < cap(groups[i])));
    if (open.length === 0) break;
    const share = Math.floor(left / open.length);
    if (share > 0) {
      for (const i of open) { const add = Math.min(share, cap(groups[i]) - quota[i]); quota[i] += add; left -= add; }
    } else {
      for (const i of open.slice(0, left)) { quota[i]++; left--; } // reste : une carte de plus pour quelques raretés au hasard
    }
  }
  const counts = {};
  const taken = groups.map(() => 0);
  let revivePicked = 0;
  // 1) les cartes revive, réparties au hasard entre les raretés qui en ont, dans la limite de leur quota
  const reviveCands = shuffle(groups.flatMap((g, i) => g.revive.map((id) => ({ id, i }))));
  for (const c of reviveCands) {
    if (revivePicked >= REVIVE_CARDS_PER_DECK) break;
    if (taken[c.i] < quota[c.i]) { counts[c.id] = 1; taken[c.i]++; revivePicked++; }
  }
  // 2) le reste de chaque quota, hors revive (pour garder EXACTEMENT 4 cartes revive)
  groups.forEach((g, i) => { for (let k = 0; taken[i] < quota[i] && k < g.other.length; k++) { counts[g.other[k]] = 1; taken[i]++; } });
  // 3) filet de sécurité : une rareté trop pauvre en cartes non-revive -> compléter avec n'importe quelle autre carte non-revive
  let total = Object.keys(counts).length;
  if (total < Math.min(size, Object.keys(templatesById).length)) {
    for (const id of shuffle(Object.keys(templatesById).filter((x) => !isRevive(x) && !counts[x]))) {
      if (total >= size) break;
      counts[id] = 1; total++;
    }
  }
  return counts;
}

/**
 * Collection de cartes d'une partie : nombre MAX de copies utilisables de chaque carte dans le deck.
 * Mode random : toutes les cartes, x3 (commune -> rare) ou x1 (ultra-rare). Les futurs modes (campagne)
 * feront grandir cette table au fil des combats.
 */
const COLLECTION_COPIES = Object.freeze({
  [RARITIES.COMMON]: 3, [RARITIES.UNCOMMON]: 3, [RARITIES.RARE]: 3, [RARITIES.UNIQUE]: 1,
});
function collectionCopiesFor(rarity) { return COLLECTION_COPIES[rarity] != null ? COLLECTION_COPIES[rarity] : 1; }
function buildRandomCollection(templatesById) {
  const c = {};
  for (const id of Object.keys(templatesById)) c[id] = collectionCopiesFor(templatesById[id].rarity);
  return c;
}

/** À appeler chaque fois qu'une carte quitte la main pour la grille (joueur, IA, simulation). */
function arriveOnGrid(card) {
  card.disabled = !!card.lockOnPlacement;
}

// ---------------------------------------------------------------------------
// Formule de budget de puissance (v1 — à recalibrer empiriquement en phase 6)
// ---------------------------------------------------------------------------

const TRIGGER_CONTROL = Object.freeze({
  [TRIGGERS.ON_PLACEMENT]: 1.0,
  [TRIGGERS.START_OF_TURN]: 1.0,
  [TRIGGERS.ON_COMBO_ATK]: 0.8,
  [TRIGGERS.ON_COMBO_SHIELD]: 0.8,
  [TRIGGERS.ON_COMBO_REVIVE]: 0.8,
  [TRIGGERS.ON_ACTIVATION]: 0.4,
  [TRIGGERS.ON_DISABLE]: 0.4,
  [TRIGGERS.NONE]: 0,
});

const TARGET_CONTROL = Object.freeze({
  [TARGET_MODES.CHOSEN]: 1.0,
  [TARGET_MODES.FIXED]: 1.0,
  [TARGET_MODES.RANDOM]: 0.6,
});

// Table de signe : pour un type d'effet donné, le signe (favorable=+1 /
// défavorable=-1) selon le scope de la cible. C'est la partie que la
// roadmap identifie comme la plus facile à mal spécifier — d'où les tests
// dédiés ci-dessous.
const EFFECT_SIGN_BY_SCOPE = Object.freeze({
  [EFFECT_TYPES.DAMAGE]: {
    // Les dégâts ne visent plus que des JOUEURS (plus de dégât sur une carte ennemie : voir DISABLE / DESTROY_CARD).
    [TARGET_SCOPES.OPPONENT_PLAYER]: +1,
    [TARGET_SCOPES.SELF_PLAYER]: -1,
  },
  [EFFECT_TYPES.HEAL]: {
    // Pas de PV de carte dans le modèle : HEAL n'a de sens que sur un JOUEUR.
    // (Avant : la table autorisait HEAL sur carte alors que resolveEffect levait
    // une exception en pleine partie. Une combinaison sans sémantique doit être
    // refusée à la conception — cf validateTemplate — pas découverte en match.)
    [TARGET_SCOPES.SELF_PLAYER]: +1,
    [TARGET_SCOPES.OPPONENT_PLAYER]: -1,
  },
  [EFFECT_TYPES.DISABLE]: {
    [TARGET_SCOPES.ENEMY_CARD]: +1,
    [TARGET_SCOPES.SELF_CARD]: -1,
    [TARGET_SCOPES.OWN_CARD]: -1,
  },
  [EFFECT_TYPES.ACTIVATE]: {
    [TARGET_SCOPES.SELF_CARD]: +1,
    [TARGET_SCOPES.OWN_CARD]: +1,
    [TARGET_SCOPES.ENEMY_CARD]: -1,
  },
  [EFFECT_TYPES.ADD_LINK]: {
    [TARGET_SCOPES.SELF_CARD]: +1,
    [TARGET_SCOPES.OWN_CARD]: +1,
    [TARGET_SCOPES.ENEMY_CARD]: -1,
  },
  [EFFECT_TYPES.SYMBOL_BONUS]: {
    [TARGET_SCOPES.SELF_CARD]: +1,
    [TARGET_SCOPES.OWN_CARD]: +1,
    [TARGET_SCOPES.ENEMY_CARD]: -1,
  },
  [EFFECT_TYPES.ROTATE_90]: {
    // rotation déterministe de 90° : casse un alignement adverse (favorable),
    // ou dérègle son propre alignement si retournée contre soi (compensateur).
    // Signe théorique seulement — la calibration tranchera si retourner une
    // carte ALLIÉE peut être positive (repositionnement) plutôt que négative.
    [TARGET_SCOPES.ENEMY_CARD]: +1,
    [TARGET_SCOPES.SELF_CARD]: -1,
    [TARGET_SCOPES.OWN_CARD]: -1,
  },
  [EFFECT_TYPES.ROTATE_180]: {
    // comme ROTATE_90 mais demi-tour : casse un alignement adverse (favorable) ou réoriente une carte alliée.
    [TARGET_SCOPES.ENEMY_CARD]: +1,
    [TARGET_SCOPES.SELF_CARD]: -1,
    [TARGET_SCOPES.OWN_CARD]: -1,
  },
  [EFFECT_TYPES.REMOVE_LINK]: {
    [TARGET_SCOPES.ENEMY_CARD]: +1,   // uniquement contre une carte adverse à 3+ liens
  },
  [EFFECT_TYPES.TRIGGER_ABILITY]: {
    [TARGET_SCOPES.OWN_CARD]: +1,     // uniquement sur une carte alliée active qui a une ability rejouable
  },
  [EFFECT_TYPES.DESTROY_SLOT]: {
    [TARGET_SCOPES.ENEMY_CARD]: +1,   // uniquement une carte adverse inactive (verrouillée / bloquée) : elle ET sa case disparaissent
  },
  [EFFECT_TYPES.DESTROY_LOCKED]: {
    [TARGET_SCOPES.OWN_CARD]: -1,     // sacrifie une carte alliée verrouillée (libère la case)
  },
  [EFFECT_TYPES.DISCARD]: {
    // défausse aléatoire d'une carte de la main. Contre l'adversaire : ralentit d'un tour (main reconstituée
    // au tour suivant) ET réduit son deck de façon définitive. Contre soi-même (coût assumé) : signe négatif.
    [TARGET_SCOPES.OPPONENT_PLAYER]: +1,
    [TARGET_SCOPES.SELF_PLAYER]: -1,
  },
  [EFFECT_TYPES.SWAP_CARD]: {
    // échange la carte qui porte l'effet contre une carte ennemie choisie
    // (positions ET contrôle échangés). Signe théorique par défaut : la
    // calibration dira si le marché est réellement favorable en moyenne.
    [TARGET_SCOPES.ENEMY_CARD]: +1,
  },
  [EFFECT_TYPES.SWAP_ALLY]: {
    // réorganisation de SON plateau (positions échangées, contrôle inchangé) : on ne perd rien, on gagne de la
    // flexibilité (relier une chaîne, sortir une carte d'un mauvais emplacement). Signe positif, pas de variante ennemie.
    [TARGET_SCOPES.OWN_CARD]: +1,
  },
  [EFFECT_TYPES.CONVERT_SYMBOLS]: {
    // uniquement sur SON plateau (décision actée : pas de conversion du plateau adverse)
    [TARGET_SCOPES.SELF_PLAYER]: +1,
  },
  [EFFECT_TYPES.RETURN_TO_DECK]: {
    // signes théoriques : recycler sa propre tuile libère une case et rend un tour de deck ;
    // renvoyer une tuile adverse casse ses liens mais lui libère la case — la calibration tranchera.
    [TARGET_SCOPES.OWN_CARD]: +1,
    [TARGET_SCOPES.ENEMY_CARD]: +1,
  },
  [EFFECT_TYPES.HAND_TO_DECK]: {
    // contre l'adversaire uniquement : plafond de main définitivement réduit
    [TARGET_SCOPES.OPPONENT_PLAYER]: +1,
  },
  [EFFECT_TYPES.DESTROY_CELL]: {
    // case VIDE adverse uniquement (décision actée) ; cible OBLIGATOIREMENT aléatoire (cf validateTemplate)
    [TARGET_SCOPES.ENEMY_CELL]: +1,
  },
  [EFFECT_TYPES.DESTROY_CARD]: {
    // détruit une tuile ADVERSE posée (cimetière) ; la case redevient libre.
    // Sur une carte ALLIÉE (sacrifice d'une carte gênante, déblocage d'une case) : signe négatif (coût).
    [TARGET_SCOPES.ENEMY_CARD]: +1,
    [TARGET_SCOPES.OWN_CARD]: -1,
  },
  [EFFECT_TYPES.NONE]: {},
});

function effectSign(effectType, targetScope) {
  if (effectType === EFFECT_TYPES.NONE) return 0; // effet nul : pas de signe à spécifier
  const table = EFFECT_SIGN_BY_SCOPE[effectType] || {};
  if (!(targetScope in table)) {
    throw new Error(`Combinaison effet/cible non spécifiée : ${effectType} + ${targetScope}. ` +
      `Ajouter le signe explicitement plutôt que de deviner.`);
  }
  return table[targetScope];
}

/** Coût de châssis d'un auto-lock : une case perdue jusqu'à réactivation (~ poids IA d'une carte désactivée). */
const LOCK_ON_PLACEMENT_PENALTY = 3;

// Barème des liens (RESTART.md, "économie de tours") — mesuré par simulation sur 142 546
// poses / 3000 parties (deck réel, Reliquaire retiré) : falaise nette entre 1 et 2 liens
// (poses mortes 4,33 % -> 0,06 % ; résolution en combo 42,05 % -> 86,45 %), puis PLATEAU
// quasi plat de 2 à 4 liens sur le seul risque structurel mesuré (coût de risque
// 3×%mort + 3×%jamais-résolu : 1,87 / 0,41 / 0,47 / 0,37 — liens 2/3/4 statistiquement
// indiscernables entre eux). Barème retenu malgré tout légèrement progressif (1/3/4/5) :
// décision actée de valoriser un peu la flexibilité stratégique d'un chassis à liens
// multiples au-delà du seul risque mesuré, que l'IA gloutonne utilisée pour la mesure
// (sans recherche) pourrait sous-évaluer.
const LINK_CHASSIS_POINTS = { 1: 1, 2: 3, 3: 4, 4: 5 };

function chassisBudget(template) {
  const arrowPts = LINK_CHASSIS_POINTS[template.linkCount] ?? template.linkCount; // repli si linkCount hors 1..4 (de toute façon rejeté par validateTemplate)
  const s = template.symbols;
  // Bonus de tempo pour le SECOND symbole atk/shield sur une même carte : un second
  // symbole économise un tour de combo entier, pas seulement double la magnitude
  // (RESTART.md). 1er symbole atk/shield = 2pts (comme avant) ; chaque symbole
  // atk/shield supplémentaire = 3pts (2 de base + 1 de bonus tempo).
  const atkShieldUnits = (s.atk || 0) + (s.shield || 0);
  const atkShieldPts = atkShieldUnits > 0 ? 2 + (atkShieldUnits - 1) * 3 : 0;
  // Exception revive (RESTART.md) : une chaîne revive se nettoie même sans cible valide,
  // sa valeur plafonne par rareté des cibles plutôt que par la magnitude — pas de bonus
  // de tempo pour un second symbole revive, reste à 2pts fixes par unité.
  const revivePts = (s.revive || 0) * 2;
  const neutralPts = (s.neutral || 0) * 1;
  return arrowPts + atkShieldPts + revivePts + neutralPts - (template.lockOnPlacement ? LOCK_ON_PLACEMENT_PENALTY : 0);
}

/**
 * Combo à traiter avec prudence (RESTART.md) : désactivation adverse portée par une carte
 * qui a AUSSI un symbole atk/shield actif — cumule le gain de combo normal ET la taxe
 * infligée à l'adversaire à partir d'une seule pose, probablement très puissant. Ne bloque
 * PAS la génération (contrairement à validateTemplate) : la Phase 5 doit consulter ce flag
 * et refuser d'attribuer une rareté commune/peu commune à un template qui le déclenche,
 * plutôt que de le calibrer par le budget théorique standard.
 */
function requiresRareRarity(template) {
  const disablesEnemy = template.effect.type === EFFECT_TYPES.DISABLE && template.target.scope === TARGET_SCOPES.ENEMY_CARD;
  const hasAtkOrShield = (template.symbols.atk || 0) > 0 || (template.symbols.shield || 0) > 0;
  return disablesEnemy && hasAtkOrShield;
}

function effectPower(template) {
  if (template.trigger === TRIGGERS.NONE || template.effect.type === EFFECT_TYPES.NONE) {
    return 0;
  }
  const sign = effectSign(template.effect.type, template.target.scope);
  const trigCtrl = TRIGGER_CONTROL[template.trigger];
  const tgtCtrl = TARGET_CONTROL[template.target.mode];
  if (trigCtrl === undefined) throw new Error(`Trigger inconnu: ${template.trigger}`);
  if (tgtCtrl === undefined) throw new Error(`Target mode inconnu: ${template.target.mode}`);
  const firings = template.trigger === TRIGGERS.START_OF_TURN ? (template.charges || 1) : 1; // effet récurrent = puissance × nb de tours
  return trigCtrl * tgtCtrl * template.effect.magnitude * sign * firings;
}

/**
 * Budget total d'une carte : chassis + puissance d'effet (signée). Une carte
 * dont le chassis dépasse déjà la fourchette de sa rareté doit se voir
 * attribuer un effet à `effectPower` négatif pour redescendre dans la cible
 * — c'est le mécanisme de compensation demandé, rendu mesurable plutôt que
 * laissé au jugé.
 */
function computeBudget(template) {
  return chassisBudget(template) + effectPower(template);
}

// ---------------------------------------------------------------------------
// Validation de conception — refuse à la CONSTRUCTION les combinaisons qui
// planteraient ou bloqueraient la partie plus tard. À appeler par le
// générateur de la Phase 5 (et au chargement du pool de cartes du jeu).
// ---------------------------------------------------------------------------

const SYMBOL_KEYS = ["atk", "shield", "revive", "neutral"];
const CARD_SCOPES = [TARGET_SCOPES.SELF_CARD, TARGET_SCOPES.OWN_CARD, TARGET_SCOPES.ENEMY_CARD];
const SINGLE_TARGET_SCOPES = [TARGET_SCOPES.SELF_PLAYER, TARGET_SCOPES.SELF_CARD, TARGET_SCOPES.OPPONENT_PLAYER];

/** Retourne la liste des erreurs de conception d'un template (vide = valide). */
function validateTemplate(t) {
  const errs = [];
  const id = t && t.id !== undefined ? t.id : "?";
  const err = (m) => errs.push(`[${id}] ${m}`);
  if (!t) return ["template manquant"];
  if (!(t.linkCount >= 1 && t.linkCount <= 4)) err(`linkCount hors 1..4 (${t.linkCount})`);
  for (const k of SYMBOL_KEYS) {
    const v = (t.symbols || {})[k] || 0;
    if (!Number.isInteger(v) || v < 0) err(`symbols.${k} invalide (${v})`);
  }
  if (!Object.values(TRIGGERS).includes(t.trigger)) err(`trigger inconnu: ${t.trigger}`);
  if (!t.effect || !Object.values(EFFECT_TYPES).includes(t.effect.type)) err(`effect.type inconnu`);
  if (!t.target || !Object.values(TARGET_SCOPES).includes(t.target.scope)) err(`target.scope inconnu`);
  if (!t.target || !Object.values(TARGET_MODES).includes(t.target.mode)) err(`target.mode inconnu`);
  if (errs.length) return errs;

  if ((t.trigger === TRIGGERS.NONE) !== (t.effect.type === EFFECT_TYPES.NONE)) {
    err(`trigger \"none\" et effet \"none\" vont ensemble (trigger=${t.trigger}, effet=${t.effect.type})`);
  }
  if (t.effect.type !== EFFECT_TYPES.NONE) {
    try { effectSign(t.effect.type, t.target.scope); }
    catch (e) { err(`combinaison effet/cible sans sémantique: ${t.effect.type} + ${t.target.scope}`); }
  }
  if (t.effect.type === EFFECT_TYPES.SYMBOL_BONUS && !SYMBOL_KEYS.includes(t.effect.symbol)) {
    err(`symbolBonus exige effect.symbol dans ${SYMBOL_KEYS.join("/")}`);
  }
  if (t.effect.type === EFFECT_TYPES.CONVERT_SYMBOLS && !["atk", "shield"].includes(t.effect.symbol)) {
    err(`convertSymbols exige effect.symbol = atk ou shield`);
  }
  if (t.trigger === TRIGGERS.START_OF_TURN) {
    if (!Number.isInteger(t.charges) || t.charges < 1 || t.charges > 3) err(`startOfTurn doit être limité à 1–3 déclenchements (charges=${t.charges}) : pas d'effet infini`);
  } else if (t.charges !== undefined && t.charges !== null) {
    err(`charges n'a de sens que pour startOfTurn`);
  }
  if (t.trigger === TRIGGERS.ON_DISABLE) err(`onDisable abandonné (rare, déclenchement non maîtrisé et esquivable) : ne pas générer`);
  if (t.lockOnPlacement && t.trigger !== TRIGGERS.ON_ACTIVATION) {
    err(`lockOnPlacement exige le trigger onActivation (sans contrepartie, la carte ne serait qu'un poids mort)`);
  }
  if (t.comboAbility && !t.trigger.startsWith("onCombo:")) {
    err(`comboAbility n'a de sens qu'avec un trigger onCombo:*`);
  }
  if (t.trigger.startsWith("onCombo:") && t.target.scope === TARGET_SCOPES.SELF_CARD && !isComboAbilityCard(t, comboTypeOfTrigger(t.trigger))) {
    err(`un trigger de combo ne peut pas viser selfCard (cible ambiguë entre les cartes agrégées) — sauf une ability de combo (effet non natif)`);
  }
  if (t.effect.type === EFFECT_TYPES.DAMAGE && ![TARGET_SCOPES.OPPONENT_PLAYER, TARGET_SCOPES.SELF_PLAYER].includes(t.target.scope)) {
    err(`damage ne peut viser qu'un JOUEUR (opponentPlayer / selfPlayer), plus une carte (scope=${t.target.scope})`);
  }
  if (t.effect.type === EFFECT_TYPES.DESTROY_CELL && t.target.mode !== TARGET_MODES.RANDOM) {
    err(`destroyCell exige target.mode = "random" (reçu: ${t.target.mode})`);
  }
  if (t.effect.type === EFFECT_TYPES.ACTIVATE && ((t.symbols || {}).revive || 0) > 0) {
    err(`une carte à symboles revive ne peut pas avoir d'ability de réactivation (et inversement) : abilities d'un AUTRE type`);
  }
  if (t.effect.type === EFFECT_TYPES.SWAP_CARD && t.linkCount !== 2) {
    err(`une carte à ability d'échange (swap) a exactement 2 liens (linkCount=${t.linkCount})`);
  }
  const symbolTotal = SYMBOL_KEYS.reduce((n, k) => n + ((t.symbols || {})[k] || 0), 0);
  if (t.trigger === TRIGGERS.NONE) {
    // Carte sans ability : 2 symboles = uncommon, 3 symboles = rare.
    // La rareté est un PLANCHER (réglage manuel assumé : une carte peut être plus rare que le minimum).
    const rankOf = (r) => [RARITIES.COMMON, RARITIES.UNCOMMON, RARITIES.RARE, RARITIES.UNIQUE].indexOf(r);
    if (symbolTotal === 2 && rankOf(t.rarity) < rankOf(RARITIES.UNCOMMON)) err(`carte sans ability à 2 symboles : uncommon ou plus (rareté=${t.rarity})`);
    if (symbolTotal === 3 && rankOf(t.rarity) < rankOf(RARITIES.RARE)) err(`carte sans ability à 3 symboles : rare ou plus (rareté=${t.rarity})`);
  } else if (symbolTotal >= 3) {
    if (t.rarity !== RARITIES.UNIQUE) err(`une carte à ability et 3 symboles ou plus doit être ultra-rare (rareté=${t.rarity})`);
    if (t.effect.type === EFFECT_TYPES.DAMAGE) err(`une carte à ability et 3 symboles ou plus ne doit pas avoir de dégâts supplémentaires comme ability`);
  }
  if (t.target.mode === TARGET_MODES.FIXED && !SINGLE_TARGET_SCOPES.includes(t.target.scope)) {
    err(`mode \"fixed\" impossible sur ${t.target.scope} (plusieurs cibles légales : utiliser chosen ou random)`);
  }
  return errs;
}

/**
 * Validation d'un POOL de cartes. Ajoute la contrainte que la Phase 2 avait
 * identifiée sans l'automatiser : toutes les cartes qui portent un même
 * trigger de combo doivent être agrégeables (même effect.type/symbol, même
 * target scope+mode) — sinon deux cartes légitimes prises séparément peuvent
 * se retrouver dans une même chaîne et lever une exception en partie.
 */
function validateCardPool(templates) {
  const errs = [];
  for (const t of templates) errs.push(...validateTemplate(t));
  for (const trig of [TRIGGERS.ON_COMBO_ATK, TRIGGERS.ON_COMBO_SHIELD, TRIGGERS.ON_COMBO_REVIVE]) {
    const group = templates.filter((t) => t.trigger === trig && t.effect && t.target && !isComboAbilityCard(t, comboTypeOfTrigger(trig)));
    if (group.length < 2) continue;
    const ref = group[0];
    for (const t of group.slice(1)) {
      const sameEffect = t.effect.type === ref.effect.type && (t.effect.symbol || null) === (ref.effect.symbol || null);
      const sameTarget = t.target.scope === ref.target.scope && t.target.mode === ref.target.mode;
      if (!sameEffect || !sameTarget) {
        errs.push(`[${t.id}] non agrégeable avec [${ref.id}] sous ${trig} (effet/cible différents) — une chaîne qui les réunit lèverait une exception`);
      }
    }
  }
  return errs;
}

function assertValidCardPool(templates) {
  const errs = validateCardPool(templates);
  if (errs.length) throw new Error("Pool de cartes invalide :\n - " + errs.join("\n - "));
}


  /* ======================= MOTEUR — PHASE 2 (interpréteur d'effets générique) ======================= */
/**
 * PHASE 2 — Moteur d'effets générique (voir ROADMAP.md)
 *
 * Module autonome, headless, sans dépendance au prototype index.html.
 * Un seul moteur de résolution capable d'exécuter N'IMPORTE QUELLE combinaison
 * trigger/effet/cible du modèle de la Phase 1, sans jamais lire un id de
 * carte ni faire de `switch` par carte. C'est la brique dont la Phase 3 (IA
 * générique) a besoin pour rester générique.
 *
 * Décision de conception clé (à documenter, pas évidente) :
 * -----------------------------------------------------------------------
 * Dans le prototype actuel, un combo (atk/shield/revive) est une propriété
 * de la CHAÎNE entière : on somme les symboles de toutes les cartes reliées
 * et on applique UN SEUL effet, avec UN SEUL choix de cible, sur cette somme.
 * Dans le modèle de la Phase 1, trigger/effet/cible sont des propriétés de
 * la CARTE, pas de la chaîne. Deux granularités de résolution coexistent
 * donc dans le jeu final, et ce moteur les traite différemment :
 *
 *   - Un COMBO (`onCombo:atk|shield|revive`) reste résolu comme dans
 *     l'ancien moteur : UN SEUL évènement par chaîne, dont la magnitude est
 *     la somme des `effect.magnitude` de toutes les cartes de la chaîne qui
 *     portent ce trigger, résolu avec UN SEUL choix de cible.
 *   - L'ACTIVATION D'UNE ABILITY individuelle (`onPlacement`, `startOfTurn`,
 *     `onDisable`, `onActivation`) reste ce qu'elle a toujours été dans le
 *     modèle de la Phase 1 : un évènement par carte, une cible par
 *     évènement.
 *
 * `enumerateTriggerEvents` applique cette règle GÉNÉRIQUEMENT par nature du
 * trigger (combo vs ability), jamais par carte : aucune carte n'est traitée
 * différemment d'une autre de même trigger.
 *
 * Pour agréger plusieurs cartes de combo en un seul évènement, leurs
 * `effect.type` et `target` (scope+mode, +`symbol` le cas échéant) doivent
 * être identiques — sinon le moteur lève une erreur explicite plutôt que de
 * deviner laquelle "gagne" (cf. philosophie de la Phase 1 sur les signes non
 * spécifiés).
 *
 * Chaque évènement retourné par `enumerateTriggerEvents` est directement
 * exploitable : `{ trigger, owner, effect, target, context }` où `context`
 * est prêt à être passé tel quel à `getLegalTargets`.
 * -----------------------------------------------------------------------
 */

// ---------------------------------------------------------------------------
// Topologie du plateau (indépendante du modèle de carte, propriété du board)
// ---------------------------------------------------------------------------

/**
 * Règle anti-verrou : une chaîne qui atteint le seuil de 3 symboles mais dont
 * aucune carte ne peut produire d'effet (chaîne 100 % neutre, ou type dominant
 * sans carte porteuse du trigger correspondant) SE DISSIPE : ses cartes partent
 * au cimetière, sans effet. Avant cette règle, ces cartes occupaient leurs cases
 * pour toujours (aucun autre moyen de retirer une carte de la grille).
 * Mettre à false pour retrouver l'ancien comportement.
 */
const DISSIPATE_UNRESOLVABLE_CHAINS = true;

/** Garde-fou contre une cascade de triggers infinie (A désactive B qui réactive A...). */
const MAX_TRIGGER_EVENTS_PER_RESOLUTION = 32;
// PV : départ à 7 (MAX_HP côté UI), plafond ABSOLU à 10 (= départ + 3). Les soins au-delà sont perdus.
const HP_CAP = 10;

const DIR_VECTORS = {
  N: [-1, 0], NE: [-1, 1], E: [0, 1], SE: [1, 1],
  S: [1, 0], SW: [1, -1], W: [0, -1], NW: [-1, -1],
};
const OPPOSITE = { N: "S", NE: "SW", E: "W", SE: "NW", S: "N", SW: "NE", W: "E", NW: "SE" };
const ROTATE_90_MAP = { N: "E", NE: "SE", E: "S", SE: "SW", S: "W", SW: "NW", W: "N", NW: "NE" }; // rotation horaire

function opponentOf(ownerId) {
  return ownerId === "player" ? "ai" : "player";
}

function idx(r, c) { return r * 3 + c; }
function rowOf(i) { return Math.floor(i / 3); }
function colOf(i) { return i % 3; }

// ---------------------------------------------------------------------------
// Détection de chaînes / combos — générique, lit card.symbols directement
// ---------------------------------------------------------------------------

function getLinkedNeighbors(grid, i) {
  const linked = [];
  const card = grid[i];
  if (!card || card.disabled) return linked;
  const r = rowOf(i), c = colOf(i);
  for (const dir of card.dirs) {
    const [dr, dc] = DIR_VECTORS[dir];
    const nr = r + dr, nc = c + dc;
    if (nr < 0 || nr > 2 || nc < 0 || nc > 2) continue;
    const ni = idx(nr, nc);
    const neighbor = grid[ni];
    if (!neighbor || neighbor.disabled) continue;
    if (neighbor.dirs.includes(OPPOSITE[dir])) linked.push(ni);
  }
  return linked;
}

/**
 * Comme `getLinkedNeighbors`, mais renvoie l'ensemble des DIRECTIONS actives
 * (flèche avec réciproque côté voisin) plutôt que les index voisins. Sert de
 * brique topologique générique au potentiel de reconnexion d'une carte
 * (repris de l'ancien `getActiveLinkDirs`, indépendant du contenu de carte).
 */
function getActiveLinkDirs(grid, i) {
  const linkedDirs = new Set();
  const card = grid[i];
  if (!card || card.disabled) return linkedDirs;
  const r = rowOf(i), c = colOf(i);
  for (const dir of card.dirs) {
    const [dr, dc] = DIR_VECTORS[dir];
    const nr = r + dr, nc = c + dc;
    if (nr < 0 || nr > 2 || nc < 0 || nc > 2) continue;
    const ni = idx(nr, nc);
    const neighbor = grid[ni];
    if (!neighbor || neighbor.disabled) continue;
    if (neighbor.dirs.includes(OPPOSITE[dir])) linkedDirs.add(dir);
  }
  return linkedDirs;
}

function findChains(grid) {
  const visited = new Array(9).fill(false);
  const chains = [];
  for (let i = 0; i < 9; i++) {
    if (visited[i] || !grid[i] || grid[i].disabled) continue;
    const queue = [i]; const comp = []; visited[i] = true;
    while (queue.length) {
      const cur = queue.shift();
      comp.push(cur);
      for (const n of getLinkedNeighbors(grid, cur)) {
        if (!visited[n]) { visited[n] = true; queue.push(n); }
      }
    }
    chains.push(comp);
  }
  return chains;
}

/**
 * Règle de déclenchement générique (inchangée dans l'esprit du prototype) :
 * seuil de 3 symboles reliés (tous types confondus, y compris neutres), le
 * type réel (atk/shield/revive) le plus représenté détermine le combo. Les
 * pips neutres comptent pour le seuil mais ne peuvent jamais être dominants.
 */
function evaluateChain(grid, chainIndices) {
  // Une chaîne d'UNE seule carte compte aussi : une carte portant à elle seule >= 3 symboles déclenche
  // son combo/effet dès sa pose, sans aucun lien (le seuil de 3 symboles ci-dessous suffit).
  let atk = 0, shield = 0, revive = 0, neutral = 0;
  for (const i of chainIndices) {
    const s = grid[i].symbols;
    atk += s.atk || 0;
    shield += s.shield || 0;
    revive += s.revive || 0;
    neutral += s.neutral || 0;
  }
  const totalSymbols = atk + shield + revive + neutral;
  if (totalSymbols < 3) return null;

  const cands = [];
  if (atk > 0) cands.push({ type: "atk", value: atk });
  if (shield > 0) cands.push({ type: "shield", value: shield });
  if (revive > 0) cands.push({ type: "revive", value: revive });
  if (cands.length === 0) return null;
  const maxV = Math.max(...cands.map((c) => c.value));
  const dominant = cands.filter((c) => c.value === maxV);
  // Ex-aequo : le choix porte sur les types RÉELS à égalité (les neutres n'entrent jamais dans la désignation du type).
  return { chainIndices, candidates: dominant, needsChoice: dominant.length > 1 };
}

function findActiveCombos(grid) {
  return findChains(grid).map((ch) => evaluateChain(grid, ch)).filter((r) => r !== null);
}

/**
 * Chaînes qui ont atteint le seuil (>= 3 symboles) mais ne portent AUCUN symbole
 * réel (atk/shield/revive) : evaluateChain les ignore (rien ne peut dominer).
 * Ex. trois connecteurs neutres reliés.
 */
function findDormantChains(grid) {
  return findChains(grid).filter((ch) => {
    let real = 0, total = 0;
    for (const i of ch) {
      const s = grid[i].symbols;
      real += (s.atk || 0) + (s.shield || 0) + (s.revive || 0);
      total += (s.atk || 0) + (s.shield || 0) + (s.revive || 0) + (s.neutral || 0);
    }
    return total >= 3 && real === 0;
  });
}

/**
 * Combos actifs sur la grille de `owner` qui nécessitent encore un choix de
 * type (égalité entre candidats). Permet à un appelant (UI ou IA) de
 * résoudre ce choix AVANT d'appeler `enumerateTriggerEvents`, en lui passant
 * le résultat via `context.comboChoices`.
 */
function getPendingComboChoices(gameState, owner) {
  const grid = gameState.players[owner].grid;
  const la = gameState.lastAction;
  const placed = la && la.type === "placement" && la.owner === owner ? la.cellIndex : null;
  return findActiveCombos(grid).filter((c) => c.needsChoice && (placed === null || c.chainIndices.includes(placed)));
}

function chainKeyOf(chainIndices) {
  return chainIndices.slice().sort((a, b) => a - b).join(",");
}

// ---------------------------------------------------------------------------
// getLegalTargets — généralise getValidAttackTargets / getValidReviveTargets
// ---------------------------------------------------------------------------

/**
 * Filtre générique d'éligibilité d'une case de grille pour un type d'effet
 * donné : ACTIVATE ne peut viser qu'une carte désactivée, tout le reste ne
 * peut viser qu'une carte active. Pas de cas particulier par carte.
 */
function eligibleCardIndices(grid, effectType, excludeCells) {
  const exclude = new Set(excludeCells || []);
  const out = [];
  for (let i = 0; i < grid.length; i++) {
    const card = grid[i];
    if (!card || card.ruin) continue; // une case détruite n'est jamais une carte ciblable
    if (exclude.has(i)) continue;
    if (effectType === EFFECT_TYPES.DESTROY_CARD) { out.push(i); continue; } // détruire : actives ET désactivées
    if (effectType === EFFECT_TYPES.SWAP_ALLY) { out.push(i); continue; }                          // échange de place : n'importe quelle autre carte alliée (active ou verrouillée)
    if (effectType === EFFECT_TYPES.DESTROY_LOCKED) { if (card.disabled) out.push(i); continue; } // seulement les cartes verrouillées
    if (effectType === EFFECT_TYPES.DESTROY_SLOT) { if (card.disabled) out.push(i); continue; }    // seulement les cartes inactives
    if (effectType === EFFECT_TYPES.REMOVE_LINK) { if (!card.disabled && card.dirs.length >= 3) out.push(i); continue; }
    if (effectType === EFFECT_TYPES.TRIGGER_ABILITY) {
      const rejouable = card.trigger === TRIGGERS.ON_PLACEMENT || card.trigger === TRIGGERS.START_OF_TURN || card.trigger === TRIGGERS.ON_ACTIVATION;
      if (!card.disabled && rejouable && card.effect.type !== EFFECT_TYPES.NONE && card.effect.type !== EFFECT_TYPES.TRIGGER_ABILITY) out.push(i);
      continue;
    }
    const wantsDisabled = effectType === EFFECT_TYPES.ACTIVATE;
    if (wantsDisabled ? card.disabled : !card.disabled) out.push(i);
  }
  return out;
}

/**
 * Retourne la liste des cibles légales pour un `effect`/`target` donnés,
 * dans un `gameState` donné, pour le joueur `ownerId` qui porte l'effet.
 *
 * Chaque cible retournée est un descripteur auto-suffisant (pas besoin de
 * connaître `ownerId` pour l'interpréter plus tard) :
 *   - { kind: "player", playerId }
 *   - { kind: "card", owner, cellIndex }
 *
 * `context` optionnel :
 *   - `sourceCell` : case de la carte qui porte l'effet (requis pour
 *     `selfCard`).
 *   - `excludeCells` : cases à exclure (typiquement la chaîne en cours de
 *     résolution, qui va être vidée juste après).
 */
function getLegalTargets(effect, target, gameState, ownerId, context = {}) {
  const opponentId = opponentOf(ownerId);
  const excludeCells = context.excludeCells || [];

  switch (target.scope) {
    case TARGET_SCOPES.SELF_PLAYER:
      return [{ kind: "player", playerId: ownerId }];

    case TARGET_SCOPES.OPPONENT_PLAYER:
      return [{ kind: "player", playerId: opponentId }];

    case TARGET_SCOPES.SELF_CARD: {
      const cell = context.sourceCell;
      if (cell === undefined || cell === null) return [];
      const card = gameState.players[ownerId].grid[cell];
      if (!card) return [];
      return [{ kind: "card", owner: ownerId, cellIndex: cell }];
    }

    case TARGET_SCOPES.OWN_CARD: {
      const grid = gameState.players[ownerId].grid;
      // "ownCard" désigne UNE AUTRE carte de son propre plateau (cf Phase 1) :
      // la carte source s'exclut donc toujours elle-même, indépendamment de
      // ce que l'appelant passe dans excludeCells.
      const selfExclude = context.sourceCell !== undefined && context.sourceCell !== null
        ? [context.sourceCell] : [];
      return eligibleCardIndices(grid, effect.type, [...excludeCells, ...selfExclude])
        .map((i) => ({ kind: "card", owner: ownerId, cellIndex: i }));
    }

    case TARGET_SCOPES.ENEMY_CARD: {
      const grid = gameState.players[opponentId].grid;
      // `excludeCells` (la chaîne en cours de résolution) vit sur le plateau du
      // PROPRIÉTAIRE de l'effet — elle n'a aucun sens appliquée au plateau
      // adverse : une carte adverse ne doit JAMAIS être exclue au seul motif
      // que sa position coïncide par hasard avec une case de ta propre chaîne.
      const cardTargets = eligibleCardIndices(grid, effect.type, [])
        .map((i) => ({ kind: "card", owner: opponentId, cellIndex: i }));
      // Règle héritée du prototype : un effet de dégâts visant une carte
      // ennemie peut TOUJOURS, en plus, viser directement le visage adverse
      // (choix "FACE"). Générique par TYPE d'effet, pas par carte.
      // (Règle supprimée : les dégâts ne visent plus de cartes, donc plus de choix "FACE" injecté ici —
      // un effet de dégâts passe par la cible opponentPlayer.)
      return cardTargets;
    }

    case TARGET_SCOPES.ENEMY_CELL: {
      // Cases VIDES adverses (null strict : ni carte, ni ruine déjà posée).
      const grid = gameState.players[opponentId].grid;
      const out = [];
      for (let i = 0; i < grid.length; i++) if (grid[i] === null) out.push({ kind: "cell", owner: opponentId, cellIndex: i });
      return out;
    }

    default:
      throw new Error(`getLegalTargets: scope de cible inconnu: ${target.scope}`);
  }
}

/**
 * Sélectionne une cible parmi une liste légale selon le `mode` de la cible.
 * Utile pour `fixed`/`random` (résolution automatique). Pour `chosen`,
 * l'appelant (joueur ou heuristique IA) doit choisir explicitement — cette
 * fonction ne fait que renvoyer un choix par défaut (premier élément) qui ne
 * doit pas être utilisé en pratique pour du `chosen` réel.
 */
function pickTarget(target, legalTargets, rng = Math.random) {
  if (legalTargets.length === 0) return null;
  if (target.mode === TARGET_MODES.RANDOM) {
    return legalTargets[Math.floor(rng() * legalTargets.length)];
  }
  return legalTargets[0];
}

// ---------------------------------------------------------------------------
// resolveEffect — exécute un effet contre une cible déjà choisie
// ---------------------------------------------------------------------------

function requireCardTarget(effectType, chosenTarget) {
  if (!chosenTarget || chosenTarget.kind !== "card") {
    throw new Error(`resolveEffect: l'effet "${effectType}" nécessite une cible de type carte, reçu: ${JSON.stringify(chosenTarget)}`);
  }
}

/**
 * Choisit, pour ADD_LINK en mode "chosen", la direction la plus utile à ajouter
 * plutôt que d'en tirer une au hasard. Priorité : (1) crée un lien ACTIF
 * immédiat (voisin occupé, non désactivé, portant déjà la réciproque) — la
 * carte rejoint une chaîne existante sur-le-champ ; (2) pointe au moins vers
 * un voisin occupé (potentiel de lien plus tard) ; (3) repli aléatoire parmi
 * les directions disponibles (aucun voisin utile nulle part).
 */
function pickBestDirectionToAdd(grid, cellIndex, available, rng = Math.random) {
  const r = rowOf(cellIndex), c = colOf(cellIndex);
  const immediate = [], potential = [];
  for (const dir of available) {
    const [dr, dc] = DIR_VECTORS[dir];
    const nr = r + dr, nc = c + dc;
    if (nr < 0 || nr > 2 || nc < 0 || nc > 2) continue; // hors grille : jamais utile
    const neighbor = grid[idx(nr, nc)];
    if (!neighbor || neighbor.disabled) continue;
    if (neighbor.dirs.includes(OPPOSITE[dir])) immediate.push(dir); else potential.push(dir);
  }
  const pool = immediate.length ? immediate : (potential.length ? potential : available);
  return pool[Math.floor(rng() * pool.length)];
}

/**
 * Résout `effect` contre `chosenTarget` (un descripteur renvoyé par
 * `getLegalTargets`) et mute `gameState` en place. Ne contient AUCUNE
 * branche sur un id de carte ou un template — uniquement sur `effect.type`
