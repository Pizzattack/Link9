 * et la NATURE de la cible (joueur vs carte), ce qui est le contrat de la
 * Phase 2.
 *
 * Retourne `gameState` (mutation en place, pratique pour chaîner).
 */
function resolveEffect(effect, target, chosenTarget, gameState, rng = Math.random, sourceOwner, sourceCell, context = {}) {
  if (!chosenTarget) return gameState; // cible perdue (ex: plus rien à réactiver) : effet sans effet

  switch (effect.type) {
    case EFFECT_TYPES.NONE:
      return gameState;

    case EFFECT_TYPES.DAMAGE: {
      if (chosenTarget.kind === "player") {
        const p = gameState.players[chosenTarget.playerId];
        p.hp = Math.max(0, p.hp - effect.magnitude);
      } else {
        // Pas de PV de carte dans ce modèle : "endommager" une carte la
        // désactive, exactement le comportement de l'ancien moteur
        // (applyAttackToCard).
        const card = gameState.players[chosenTarget.owner].grid[chosenTarget.cellIndex];
        if (card && !card.disabled) { card.disabled = true; noteTransition(gameState, "disable", chosenTarget.owner, chosenTarget.cellIndex); }
      }
      return gameState;
    }

    case EFFECT_TYPES.HEAL: {
      if (chosenTarget.kind === "player") {
        const p = gameState.players[chosenTarget.playerId];
        p.hp = Math.max(p.hp, Math.min(HP_CAP, p.hp + effect.magnitude)); // plafond absolu HP_CAP : le surplus est perdu
      } else {
        throw new Error("resolveEffect: HEAL sur une carte n'est pas supporté (pas de PV de carte dans le modèle actuel) — ajouter la mécanique explicitement plutôt que deviner.");
      }
      return gameState;
    }

    case EFFECT_TYPES.ACTIVATE: {
      requireCardTarget(effect.type, chosenTarget);
      const grid = gameState.players[chosenTarget.owner].grid;
      const activateAt = (cellIndex) => {
        const c = grid[cellIndex];
        if (c && c.disabled) { c.disabled = false; noteTransition(gameState, "activation", chosenTarget.owner, cellIndex); return true; }
        return false;
      };
      activateAt(chosenTarget.cellIndex);
      // magnitude > 1 (mode "random" uniquement — un "chosen" à cibles multiples
      // demanderait une sélection interactive hors-scope ici) : réactive en plus
      // (magnitude-1) AUTRES cartes désactivées prises au hasard chez le même
      // propriétaire, une seule à la fois pour ne jamais recibler celle qui vient
      // d'être réactivée (elle n'est plus éligible : elle n'est plus "disabled").
      const extra = Math.max(0, (effect.magnitude || 1) - 1);
      if (extra > 0 && target.mode === TARGET_MODES.RANDOM) {
        for (let k = 0; k < extra; k++) {
          const eligible = grid.map((c, i) => (c && !c.ruin && c.disabled ? i : -1)).filter((i) => i >= 0);
          if (eligible.length === 0) break;
          activateAt(eligible[Math.floor(rng() * eligible.length)]);
        }
      }
      return gameState;
    }

    case EFFECT_TYPES.DISABLE: {
      requireCardTarget(effect.type, chosenTarget);
      const card = gameState.players[chosenTarget.owner].grid[chosenTarget.cellIndex];
      if (card && !card.disabled) { card.disabled = true; noteTransition(gameState, "disable", chosenTarget.owner, chosenTarget.cellIndex); }
      return gameState;
    }

    case EFFECT_TYPES.ADD_LINK: {
      requireCardTarget(effect.type, chosenTarget);
      const grid = gameState.players[chosenTarget.owner].grid;
      const card = grid[chosenTarget.cellIndex];
      if (!card) return gameState;
      // magnitude = nombre de flèches ajoutées (magnitude=2 ajoute réellement 2 directions, jusqu'à 8 liens au total).
      const reps = Math.max(1, effect.magnitude || 1);
      for (let k = 0; k < reps; k++) {
        if (card.dirs.length >= DIRS.length) break; // les 8 directions sont prises (la limite de 4 ne vaut que pour la CONCEPTION des cartes, pas pour les abilities)
        const available = DIRS.filter((d) => !card.dirs.includes(d));
        // mode "random" : direction tirée au hasard (comportement d'origine).
        // mode "chosen" : cible la direction la plus utile plutôt que le hasard —
        // priorité à une direction qui crée un lien ACTIF immédiat (voisin occupé
        // portant déjà la réciproque), puis à une direction qui pointe au moins
        // vers un voisin occupé (potentiel de lien futur), repli aléatoire sinon.
        const picked = target.mode === TARGET_MODES.RANDOM
          ? available[Math.floor(rng() * available.length)]
          : pickBestDirectionToAdd(grid, chosenTarget.cellIndex, available, rng);
        card.dirs = [...card.dirs, picked];
      }
      return gameState;
    }

    case EFFECT_TYPES.SYMBOL_BONUS: {
      requireCardTarget(effect.type, chosenTarget);
      if (!effect.symbol) {
        throw new Error("resolveEffect: SYMBOL_BONUS requiert effect.symbol explicite (atk/shield/revive/neutral) — pas de valeur par défaut devinée.");
      }
      const card = gameState.players[chosenTarget.owner].grid[chosenTarget.cellIndex];
      if (!card) return gameState;
      card.symbols[effect.symbol] = (card.symbols[effect.symbol] || 0) + effect.magnitude;
      return gameState;
    }

    case EFFECT_TYPES.ROTATE_90: {
      // Rotation DÉTERMINISTE de 90° (horaire) : chaque direction de la carte
      // cible est remplacée par sa voisine à 90°, linkCount inchangé. Contrairement
      // à l'ancien rotateSelf/rotateRandomEnemy (redistribution aléatoire complète,
      // retiré), l'effet est prévisible — la valeur vient de casser un alignement
      // existant (embryon de combo) de façon fiable, pas du hasard.
      requireCardTarget(effect.type, chosenTarget);
      const card = gameState.players[chosenTarget.owner].grid[chosenTarget.cellIndex];
      if (!card) return gameState;
      card.dirs = card.dirs.map((d) => ROTATE_90_MAP[d]);
      return gameState;
    }

    case EFFECT_TYPES.ROTATE_180: {
      requireCardTarget(effect.type, chosenTarget);
      const card = gameState.players[chosenTarget.owner].grid[chosenTarget.cellIndex];
      if (!card) return gameState;
      card.dirs = card.dirs.map((d) => OPPOSITE[d]);
      return gameState;
    }

    case EFFECT_TYPES.REMOVE_LINK: {
      requireCardTarget(effect.type, chosenTarget);
      const card = gameState.players[chosenTarget.owner].grid[chosenTarget.cellIndex];
      if (!card || card.dirs.length < 3) return gameState;
      const n = Math.min(Math.max(1, effect.magnitude || 1), card.dirs.length - 1); // il reste toujours au moins 1 lien
      const dirs = card.dirs.slice();
      for (let k = 0; k < n; k++) dirs.splice(Math.floor(rng() * dirs.length), 1);
      card.dirs = dirs;
      return gameState;
    }

    case EFFECT_TYPES.TRIGGER_ABILITY: {
      requireCardTarget(effect.type, chosenTarget);
      noteTransition(gameState, "retrigger", chosenTarget.owner, chosenTarget.cellIndex); // l'ability est émise par drainTransitionEvents
      return gameState;
    }

    case EFFECT_TYPES.DESTROY_SLOT: {
      requireCardTarget(effect.type, chosenTarget);
      const owner = gameState.players[chosenTarget.owner];
      const card = owner.grid[chosenTarget.cellIndex];
      if (!card || card.ruin || !card.disabled) return gameState;   // redevenue active entre-temps : rien à détruire
      owner.graveyard.push(card.templateId);
      owner.grid[chosenTarget.cellIndex] = makeRuin();              // la carte ET sa case sont détruites pour de bon
      return gameState;
    }

    case EFFECT_TYPES.DESTROY_LOCKED: {
      requireCardTarget(effect.type, chosenTarget);
      const owner = gameState.players[chosenTarget.owner];
      const card = owner.grid[chosenTarget.cellIndex];
      if (!card || card.ruin || !card.disabled) return gameState;   // plus verrouillée : rien à détruire
      owner.grid[chosenTarget.cellIndex] = null;                    // la case est LIBÉRÉE
      owner.graveyard.push(card.templateId);
      return gameState;
    }

    case EFFECT_TYPES.DISCARD: {
      // Toujours aléatoire (jamais "chosen" : la main adverse est cachée en
      // partie réelle, choisir une carte précise n'aurait pas de sens).
      // Cible de scope joueur (SELF_PLAYER/OPPONENT_PLAYER) : champ `playerId`,
      // pas `owner` (réservé aux cibles de type carte) — cf getLegalTargets.
      const hand = gameState.players[chosenTarget.playerId].hand;
      if (hand.length === 0) return gameState;
      const idx = Math.floor(rng() * hand.length);
      const [discarded] = hand.splice(idx, 1);
      gameState.players[chosenTarget.playerId].graveyard.push(discarded.templateId); // templateId, comme clearChain (computeUnseenPool le lit ainsi)
      return gameState;
    }

    case EFFECT_TYPES.SWAP_CARD: {
      // Échange la carte qui PORTE l'effet (sourceOwner/sourceCell, toujours
      // "soi-même" — pas de second ciblage nécessaire) avec la carte ennemie
      // choisie : positions ET contrôle échangés. Si sourceCell est absent
      // (contexte sans porteur identifiable) ou si aucune carte ennemie
      // n'est éligible, l'effet est ignoré (on ne fabrique jamais d'échange
      // à partir de rien).
      requireCardTarget(effect.type, chosenTarget);
      if (sourceCell == null || sourceOwner == null) return gameState;
      const ownGrid = gameState.players[sourceOwner].grid;
      const enemyGrid = gameState.players[chosenTarget.owner].grid;
      const ownCard = ownGrid[sourceCell];
      const enemyCard = enemyGrid[chosenTarget.cellIndex];
      if (!ownCard || !enemyCard) return gameState; // rien à échanger -> skip
      ownGrid[sourceCell] = enemyCard;
      enemyGrid[chosenTarget.cellIndex] = ownCard;
      // Un échange ne déclenche AUCUN combo sur le moment : les chaînes formées par les cartes échangées
      // (des deux côtés) sont évaluées au DÉBUT DE TOUR de leur propriétaire (cf. enumerateTriggerEvents).
      return gameState;
    }

    case EFFECT_TYPES.SWAP_ALLY: {
      // Échange, sur le plateau du PORTEUR, la case de la carte qui porte l'effet (sourceCell) et celle de la carte
      // alliée choisie. Seules les positions changent (directions, symboles, état actif/verrouillé conservés).
      // Si le porteur a quitté sa case (ex. déjà déplacé) ou si la cible a disparu, l'effet est ignoré.
      // Comme SWAP_CARD : aucune chaîne n'est résolue sur le moment pour la carte posée qui a bougé
      // (cf. placedCellAfterAbility) ; elles sont évaluées au début du tour de leur propriétaire.
      requireCardTarget(effect.type, chosenTarget);
      if (sourceCell == null || sourceOwner == null || chosenTarget.owner !== sourceOwner) return gameState;
      if (chosenTarget.cellIndex === sourceCell) return gameState;
      const grid = gameState.players[sourceOwner].grid;
      const a = grid[sourceCell], b = grid[chosenTarget.cellIndex];
      if (!a || a.ruin || !b || b.ruin) return gameState;
      grid[sourceCell] = b;
      grid[chosenTarget.cellIndex] = a;
      return gameState;
    }

    case EFFECT_TYPES.CONVERT_SYMBOLS: {
      // Cible de scope joueur (selfPlayer) : TOUT le plateau de ce joueur. Le total de
      // symboles de chaque carte est conservé, seul le TYPE change (tout devient effect.symbol).
      if (chosenTarget.kind !== "player") throw new Error("resolveEffect: CONVERT_SYMBOLS exige une cible joueur (plateau entier)");
      const to = effect.symbol;
      if (to !== "atk" && to !== "shield") throw new Error("resolveEffect: CONVERT_SYMBOLS requiert effect.symbol = atk|shield");
      for (const card of gameState.players[chosenTarget.playerId].grid) {
        if (!card || card.ruin) continue;
        const sy = card.symbols;
        const total = (sy.atk || 0) + (sy.shield || 0) + (sy.revive || 0) + (sy.neutral || 0);
        card.symbols = { atk: 0, shield: 0, revive: 0, neutral: 0 };
        card.symbols[to] = total;
      }
      return gameState;
    }

    case EFFECT_TYPES.RETURN_TO_DECK: {
      requireCardTarget(effect.type, chosenTarget);
      const owner = gameState.players[chosenTarget.owner];
      const card = owner.grid[chosenTarget.cellIndex];
      if (!card || card.ruin) return gameState;
      owner.grid[chosenTarget.cellIndex] = null; // la case est libérée
      addCardToDeck(owner, resetCardForDeck(card), rng);
      return gameState;
    }

    case EFFECT_TYPES.HAND_TO_DECK: {
      if (chosenTarget.kind !== "player") throw new Error("resolveEffect: HAND_TO_DECK exige une cible joueur");
      const p = gameState.players[chosenTarget.playerId];
      if (p.hand.length > 0) {
        const [moved] = p.hand.splice(Math.floor(rng() * p.hand.length), 1);
        addCardToDeck(p, moved, rng);
      }
      p.handCap = Math.max(MIN_HAND_CAP, handCapOf(p) - Math.max(1, effect.magnitude || 1)); // permanent
      return gameState;
    }

    case EFFECT_TYPES.DESTROY_CARD: {
      requireCardTarget(effect.type, chosenTarget);
      const owner = gameState.players[chosenTarget.owner];
      const card = owner.grid[chosenTarget.cellIndex];
      if (!card || card.ruin) return gameState;
      owner.grid[chosenTarget.cellIndex] = null; // la tuile est détruite, sa case est LIBÉRÉE
      owner.graveyard.push(card.templateId);
      // magnitude > 1 (mode "random" uniquement, comme activate) : détruit en plus (magnitude-1) AUTRES cartes au hasard
      // chez le même propriétaire. Sur son propre plateau, la carte source et la chaîne en cours sont épargnées.
      const extraKills = Math.max(0, (effect.magnitude || 1) - 1);
      if (extraKills > 0 && target.mode === TARGET_MODES.RANDOM) {
        const protect = new Set();
        if (chosenTarget.owner === sourceOwner) {
          if (sourceCell !== undefined && sourceCell !== null) protect.add(sourceCell);
          (context.excludeCells || []).forEach((i) => protect.add(i));
        }
        for (let k = 0; k < extraKills; k++) {
          const eligible = owner.grid.map((c, i) => (c && !c.ruin && !protect.has(i) ? i : -1)).filter((i) => i >= 0);
          if (eligible.length === 0) break;
          const j = eligible[Math.floor(rng() * eligible.length)];
          owner.graveyard.push(owner.grid[j].templateId);
          owner.grid[j] = null;
        }
      }
      return gameState;
    }

    case EFFECT_TYPES.DESTROY_CELL: {
      if (chosenTarget.kind !== "cell") throw new Error("resolveEffect: DESTROY_CELL exige une cible de type case");
      const grid = gameState.players[chosenTarget.owner].grid;
      if (grid[chosenTarget.cellIndex] === null) grid[chosenTarget.cellIndex] = makeRuin(); // case vide seulement
      return gameState;
    }

    default:
      throw new Error(`resolveEffect: type d'effet inconnu: ${effect.type}`);
  }
}

// ---------------------------------------------------------------------------
// enumerateTriggerEvents — quels triggers s'activent, avec leur carte source
// ---------------------------------------------------------------------------

function targetsEqual(a, b) {
  return a.scope === b.scope && a.mode === b.mode;
}

function effectsCompatibleForAggregation(a, b) {
  return a.type === b.type && (a.symbol || null) === (b.symbol || null);
}

/**
 * `gameState.lastAction` décrit ce qui vient de se passer et sert de source
 * unique de vérité pour savoir quels triggers évaluer :
 *   { type: "placement" | "turnStart" | "disable" | "activation",
 *     owner, cellIndex? }
 *
 * `context.comboChoices` (optionnel) : { [chainKey]: "atk"|"shield"|"revive" }
 * pour les chaînes en égalité (`needsChoice`) déjà résolues par
 * l'appelant — voir `getPendingComboChoices`.
 *
 * Retourne un tableau plat d'évènements directement exploitables :
 *   { trigger, owner, effect, target, context }
 * où `context` est prêt à être passé tel quel à `getLegalTargets`
 * (`{ sourceCell }` pour une ability individuelle, `{ excludeCells }` pour
 * un combo agrégé).
 *
 * Règle générique (par NATURE du trigger, jamais par carte) :
 *   - `onCombo:*` → UN SEUL évènement par chaîne, magnitude = somme des
 *     `effect.magnitude` de toutes les cartes de la chaîne qui portent ce
 *     trigger. Nécessite que ces cartes partagent le même `effect.type`
 *     (+`symbol`) et le même `target` (scope+mode) — sinon erreur explicite.
 *   - toute autre trigger (`onPlacement`, `startOfTurn`, `onDisable`,
 *     `onActivation`) → un évènement par carte, comme dans le modèle de
 *     base de la Phase 1.
 */
function enumerateTriggerEvents(gameState, context = {}) {
  const events = [];
  const la = gameState.lastAction;
  if (!la) return events;

  const grid = gameState.players[la.owner] && gameState.players[la.owner].grid;
  if (!grid) return events;

  function pushSingleCardEvent(trigger, cellIndex) {
    const card = grid[cellIndex];
    if (card && card.trigger === trigger) {
      events.push({
        kind: "ability",
        trigger,
        owner: la.owner,
        effect: card.effect,
        target: card.target,
        context: { sourceCell: cellIndex },
      });
    }
  }

  // context.phase : "placement" = seulement l'ability de pose ; "chains" = seulement combos/dissipation ;
  // absent = les deux (comportement historique). Les appelants de jeu résolvent d'abord la pose, PUIS
  // évaluent les chaînes sur la grille mise à jour (une ability de pose peut ajouter un symbole, etc.).
  const phase = context.phase || "all";
  if (la.type === "placement" && phase !== "chains") pushSingleCardEvent(TRIGGERS.ON_PLACEMENT, la.cellIndex);

  if (la.type === "turnStart") {
    grid.forEach((card, i) => {
      if (card && !card.disabled && card.trigger === TRIGGERS.START_OF_TURN && card.charges !== 0) {
        events.push({
          kind: "ability",
          trigger: TRIGGERS.START_OF_TURN,
          owner: la.owner,
          effect: card.effect,
          target: card.target,
          context: { sourceCell: i },
        });
      }
    });
  }

  if (la.type === "retrigger") {   // TRIGGER_ABILITY : rejoue l'ability de la carte alliée visée (sans consommer de charge)
    const card = grid[la.cellIndex];
    const rejouable = card && (card.trigger === TRIGGERS.ON_PLACEMENT || card.trigger === TRIGGERS.START_OF_TURN || card.trigger === TRIGGERS.ON_ACTIVATION);
    if (rejouable && !card.disabled && card.effect.type !== EFFECT_TYPES.NONE && card.effect.type !== EFFECT_TYPES.TRIGGER_ABILITY) {
      events.push({ kind: "ability", trigger: card.trigger, owner: la.owner, effect: card.effect, target: card.target, context: { sourceCell: la.cellIndex } });
    }
  }
  if (la.type === "disable") pushSingleCardEvent(TRIGGERS.ON_DISABLE, la.cellIndex);
  if (la.type === "activation") pushSingleCardEvent(TRIGGERS.ON_ACTIVATION, la.cellIndex);

  // Les combos ne sont évalués que sur la grille du joueur qui vient d'agir
  // (une pose), exactement comme processCombosAfterPlacement dans l'ancien
  // moteur. Contrairement aux abilities individuelles ci-dessus, TOUTES les
  // cartes de la chaîne qui portent le trigger de combo actif sont agrégées
  // en UN SEUL évènement — une seule cible, comme l'ancien moteur.
  // RÈGLE : une carte posée ne résout QUE la chaîne qui la contient. Une chaîne déjà au seuil
  // ailleurs (ex. reformée par une réactivation) attend le DÉBUT DE TOUR de son propriétaire
  // (jamais bloquée, mais jamais en même temps que la pose : une pose = un effet visible).
  if ((la.type === "placement" && phase !== "placement") || la.type === "turnStart") {
    const inScope = (chain) => la.type === "turnStart" || chain.includes(la.cellIndex);
    const combos = findActiveCombos(grid).filter((c) => inScope(c.chainIndices));
    for (const combo of combos) {
      const key = chainKeyOf(combo.chainIndices);
      const resolvedType = !combo.needsChoice
        ? combo.candidates[0].type
        : (context.comboChoices && context.comboChoices[key]) || (la.type === "turnStart" ? combo.candidates[0].type : null);
      if (!resolvedType) continue; // choix en attente : pas d'évènement tant que non résolu
      const triggerName = "onCombo:" + resolvedType;

      // Un combo = DEUX choses séparées :
      //  1/ son IMPACT propre, toujours appliqué : atk = 1 dégât par symbole atk, shield = 1 soin par symbole
      //     shield, revive = 1 réactivation par symbole revive (les symboles neutres comptent pour le seuil de 3
      //     mais jamais pour le type ni pour l'impact) ;
      //  2/ les TRIGGERS de combo des cartes de la chaîne dont le trigger correspond au type (onCombo:<type>),
      //     testés successivement APRÈS l'impact. Un trigger qui ne correspond pas au type fizzle seul : le combo,
      //     lui, a déjà eu lieu.
      const comboSymbolTotal = combo.candidates.find((c) => c.type === resolvedType).value;
      const { natives, abilities } = splitComboCarriers(grid, combo.chainIndices, resolvedType);
      const impactCount = resolvedType === "revive" ? comboSymbolTotal : 1;
      for (let k = 0; k < impactCount; k++) {
        events.push({
          kind: "combo",
          trigger: triggerName,
          owner: la.owner,
          effect: { type: COMBO_NATIVE_EFFECT[resolvedType], magnitude: resolvedType === "revive" ? 1 : comboSymbolTotal },
          target: { ...COMBO_BASE_TARGET[resolvedType] },
          context: { excludeCells: combo.chainIndices },
          activation: { index: k + 1, count: impactCount },
          chainIndices: combo.chainIndices,
          chainCards: combo.chainIndices.map((i) => grid[i]),
          sourceCells: [],
          comboSymbolTotal,
        });
      }

      // Chaque carte porteuse se déclenche SÉPARÉMENT et UNE SEULE FOIS par combo (quel que soit son nombre
      // de symboles), avec SA cible : choisie, aléatoire ou fixe.
      for (const cell of [...natives, ...abilities].sort((x, y) => x - y)) {
        const card = grid[cell];
        const count = 1;
        for (let k = 0; k < count; k++) {
          events.push({
            kind: "ability",
            viaCombo: triggerName,
            trigger: triggerName,
            owner: la.owner,
            effect: { ...card.effect },
            target: card.target,
            context: { sourceCell: cell, excludeCells: combo.chainIndices },
            activation: { index: k + 1, count },
            chainIndices: combo.chainIndices,
          chainCards: combo.chainIndices.map((i) => grid[i]),
            sourceCells: [cell],
            comboSymbolTotal,
          });
        }
      }
    }

    // Chaînes au seuil sans aucun symbole réel (ex. 3 connecteurs neutres).
    if (DISSIPATE_UNRESOLVABLE_CHAINS) {
      for (const chain of findDormantChains(grid).filter(inScope)) events.push(dissipationEvent(la.owner, chain, grid));
    }
  }

  return events;
}

/**
 * Vide une chaîne résolue de la grille de `owner` et envoie les cartes au
 * cimetière. Pur bookkeeping de plateau, aucune connaissance du contenu des
 * cartes — générique par construction, reprise directe de l'ancien moteur.
 */
// Cartes d'une chaîne INDEXÉES PAR NUMÉRO DE CASE (et non par position dans la liste : la clé de chaîne est triée,
// chainIndices ne l'est pas — les aligner par position laissait des cartes « zombies » après un combo).
function chainCardsByIndex(event) {
  if (!event.chainCards) return null;
  const byIndex = {};
  event.chainIndices.forEach((i, k) => { byIndex[i] = event.chainCards[k]; });
  return byIndex;
}

function clearChain(gameState, owner, chainIndices, chainCardsByIdx) {
  const p = gameState.players[owner];
  chainIndices.forEach((i) => {
    // Si une ability (ex. échange) a remplacé la carte de cette case pendant la résolution, la carte
    // arrivée ne faisait pas partie de la chaîne : on ne la détruit pas.
    const expected = chainCardsByIdx ? chainCardsByIdx[i] : undefined;
    if (expected !== undefined && p.grid[i] !== expected) return;
    if (p.grid[i]) p.graveyard.push(p.grid[i].templateId);
    p.grid[i] = null;
  });
}


/**
 * Évènement synthétique : la chaîne se dissipe (aucun effet, cartes au cimetière).
 * Passe par le même pipeline que les autres évènements : cible légale vide ->
 * resolveEffect no-op -> la chaîne est nettoyée avec les autres à la fin.
 */
function dissipationEvent(owner, chainIndices, grid) {
  return {
    kind: "dissipate",
    trigger: "dissipate",
    owner,
    effect: { type: EFFECT_TYPES.NONE, magnitude: 0 },
    target: { scope: TARGET_SCOPES.SELF_CARD, mode: TARGET_MODES.FIXED }, // sans sourceCell -> aucune cible légale
    context: { excludeCells: chainIndices },
    chainIndices,
    chainCards: grid ? chainIndices.map((i) => grid[i]) : undefined,
    sourceCells: [],
  };
}

/** Enregistre qu'une carte vient de passer désactivée/active (voir drainTransitionEvents). */
function noteTransition(gameState, kind, owner, cellIndex) {
  if (!gameState.transitions) gameState.transitions = [];
  gameState.transitions.push({ kind, owner, cellIndex });
}

/**
 * Vide la file des transitions d'état de cartes (désactivée / réactivée) survenues
 * pendant la résolution et retourne les évènements qu'elles déclenchent :
 *   - carte désactivée  -> son ability `onDisable`
 *   - carte réactivée   -> son ability `onActivation`
 * Le propriétaire de l'évènement est celui de la CARTE touchée (c'est lui qui
 * décide de la cible si mode=chosen), pas celui de l'attaquant.
 * N'altère pas gameState.lastAction (on passe par une vue superficielle).
 */
function drainTransitionEvents(gameState) {
  const list = gameState.transitions || [];
  gameState.transitions = [];
  const events = [];
  for (const t of list) {
    const view = { players: gameState.players, lastAction: { type: t.kind, owner: t.owner, cellIndex: t.cellIndex } };
    events.push(...enumerateTriggerEvents(view));
  }
  return events;
}

/** Évènements de début de tour pour `owner` : toutes ses cartes actives à trigger startOfTurn. */
function enumerateTurnStartEvents(gameState, owner) {
  const view = { players: gameState.players, lastAction: { type: "turnStart", owner } };
  const events = enumerateTriggerEvents(view);
  // Chaque déclenchement consomme une charge ; à 0 l'effet est éteint (la carte reste sur la grille).
  for (const e of events) {
    if (e.trigger !== TRIGGERS.START_OF_TURN) continue;
    const c = gameState.players[owner].grid[e.context.sourceCell];
    if (c && c.charges > 0) c.charges--;
  }
  return events;
}

/**
 * Applique le MODE de la cible (jusqu'ici ignoré : `pickTarget` n'était jamais appelé,
 * donc "random" se comportait comme "chosen" alors que le budget lui applique 0,6).
 *   - aucune cible légale        -> l'effet fizzle (auto, cible null)
 *   - mode random                -> tirage au hasard parmi les cibles légales (auto)
 *   - mode fixed / une seule cible -> pas de choix à faire (auto)
 *   - sinon (chosen, plusieurs)  -> auto=false : l'appelant (joueur/IA) doit choisir
 */
function autoResolveTarget(target, legal, rng = Math.random) {
  if (legal.length === 0) return { auto: true, target: null };
  if (target.mode === TARGET_MODES.RANDOM) return { auto: true, target: pickTarget(target, legal, rng) };
  if (target.mode === TARGET_MODES.FIXED || legal.length === 1) return { auto: true, target: legal[0] };
  return { auto: false, target: null };
}

  /* ======================= MOTEUR — PHASE 3 (IA générique) ======================= */
/**
 * PHASE 3 — IA générique headless (voir ROADMAP.md)
 *
 * Aucune ligne de ce fichier ne doit lire un `templateId`/`cardId` pour
 * décider quoi que ce soit. Tout passe par la structure générique posée en
 * Phase 1 (trigger/effect/target/symbols/dirs) et le moteur de résolution de
 * la Phase 2 (getLegalTargets/resolveEffect/enumerateTriggerEvents).
 *
 * Trois briques, chacune testable isolément (cf ROADMAP) :
 *   1. playRandomLegalMove   — baseline, plancher de comparaison.
 *   2. playHeuristicMove     — heuristique pure (glouton, sans recherche).
 *   3. chooseMoveWithSearch  — minimax + élagage + décimation + budget de
 *      temps, décimé et évalué par la même heuristique que (2).
 *
 * Ce qui a été repris tel quel du prototype (déjà générique dans les faits) :
 * la structure de recherche elle-même (minimax alpha-bêta, approfondissement
 * itératif, décimation top-K, détermination Monte-Carlo sur le pool de
 * cartes adverses inconnues) et l'évaluation statique de position
 * (`evaluateStaticPosition`, ex-`evaluateSimState`). Seul `scoreMoveForAi`
 * devait changer : c'était le seul endroit avec un `if(type==="atk")` en dur.
 */

/**
 * Réglages de l'heuristique dynamique — des CONSTANTES DE JEU globales
 * (échelle de PV, à quel point l'urgence défensive doit peser), pas des
 * branches par carte. Modifiables librement en Phase 6 (calibrage) sans
 * toucher à la logique.
 */
const DEFAULT_TUNING = {
  maxHpReference: 7,        // échelle de "PV bas" utilisée pour moduler l'urgence défensive
  dangerWeight: 0.35,       // poids de l'urgence de soin par PV manquant
  disabledRecoveryWeight: 0.5, // poids de l'urgence de réactivation par carte désactivée chez soi
  disruptionThreshold: 2,   // somme de symboles dans la chaîne adverse à partir de laquelle la neutraliser est urgent
  disruptionBonus: 4,       // bonus par symbole de menace neutralisée
  // --- Gestion des emplacements (la grille pleine est la principale cause de défaite) ---
  lockedCellWeight: 3,      // poids par case "verrouillée" (composante sans flèche libre, sous le seuil)
  deadCardExtra: 3,         // surcoût d'une carte MORTE (toutes flèches hors grille : verrou définitif)
  deckCardWeight: 1,        // valeur d'une carte de deck d'écart (1 carte = 1 tour avant la fatigue)
  handCapWeight: 3,         // valeur d'un cran de plafond de main d'écart (taille du choix à chaque tour)
  ruinWeight: 4,            // valeur d'une case définitivement détruite chez l'adversaire (capacité de plateau)
  cellDestroyBase: 3,       // score de base (tri des coups) de la destruction d'une case vide adverse
  slotFreedWeight: 1,       // bonus par case libérée par une chaîne résolue ou dissipée
};

// ---------------------------------------------------------------------------
// Utilitaires d'état (clonage, coups légaux)
// ---------------------------------------------------------------------------

function cloneCard(card) {
  if (!card) return null;
  return { ...card, dirs: [...card.dirs], symbols: { ...card.symbols } };
}

function cloneSideState(side) {
  return {
    hp: side.hp,
    grid: side.grid.map(cloneCard),
    hand: side.hand.map(cloneCard),
    graveyard: [...(side.graveyard || [])],
    // La recherche ne porte pas le deck lui-même, seulement sa taille (horloge de la partie) et le plafond de main.
    deckCount: deckSizeOf(side),
    handCap: handCapOf(side),
  };
}

function cloneGameState(gameState) {
  return {
    players: {
      player: cloneSideState(gameState.players.player),
      ai: cloneSideState(gameState.players.ai),
    },
    lastAction: null,
    transitions: [],
  };
}

/**
 * Coups légaux pour `owner` : où poser laquelle des cartes en main.
 * Générique par construction : ne regarde que `hand.length` et les cases
 * vides de la grille, jamais le contenu des cartes.
 */
function generateLegalMoves(gameState, owner) {
  const side = gameState.players[owner];
  const empties = side.grid.map((c, i) => (c === null ? i : null)).filter((i) => i !== null);
  if (empties.length === 0) return [{ loseImmediately: true }];
  if (side.hand.length === 0) return [{ pass: true }];
  const moves = [];
  for (let h = 0; h < side.hand.length; h++) {
    for (const cell of empties) moves.push({ hIdx: h, cellIndex: cell });
  }
  return moves;
}

// ---------------------------------------------------------------------------
// Valeur dynamique d'une résolution d'effet — la "même formule" que le budget
// de la Phase 1 (effectSign × magnitude), étendue avec le contexte réel de
// la partie (potentiel de reconnexion de la cible, coup fatal).
// ---------------------------------------------------------------------------

/**
 * Potentiel de reconnexion d'une carte : nb de flèches + 2 par lien déjà
 * actif. Générique (topologie pure), reprend l'esprit de l'ancien
 * `chooseAiAttackChoice` / `chooseAiReviveTarget` sans jamais lire l'id de
 * la carte.
 */
function reconnectionPotential(grid, cellIndex) {
  const card = grid[cellIndex];
  if (!card) return 0;
  return card.dirs.length + getActiveLinkDirs(grid, cellIndex).size * 2;
}

/**
 * Score dynamique (point de vue de `ownerId`, positif = bon pour lui) de la
 * résolution de `effect`/`target` contre `chosenTarget`, DANS `gameState`
 * (avant résolution). Ne dispatch que sur `effect.type`, la nature (`kind`)
 * de la cible et sa propriété (soi/adversaire) — jamais sur un id de carte.
 *
 * Trois renforcements dynamiques ajoutés suite au retour "l'IA ne fait que
 * de l'attaque directe et se laisse bloquer" :
 *   - un SOIN sur soi vaut d'autant plus qu'on est bas en PV (urgence
 *     défensive proportionnelle au danger réel, pas un simple bonus fixe) ;
 *   - une RÉACTIVATION d'une carte à soi vaut d'autant plus qu'on a déjà
 *     beaucoup de cartes désactivées (reconstruction de plateau prioritaire
 *     quand on est en train de se faire déborder) ;
 *   - désactiver/endommager une carte adverse qui appartient à une chaîne
 *     déjà à 2 symboles reliés (à un pas du seuil de combo) rapporte un
 *     bonus de perturbation — défendre en cassant une menace imminente peut
 *     valoir mieux que taper directement le visage.
 * Ces trois règles sont posées sur la STRUCTURE (scope/kind/somme de la
 * chaîne), jamais sur quelle carte précise est en jeu.
 */
/**
 * Valeur d'une conversion de symboles sur le plateau de `ownerId` (type visé = effect.symbol).
 * Le total de symboles ne change pas : seul le type dominant bascule. Une chaîne qui PORTE le
 * trigger du type visé gagne (elle devient dominante et résolvable) ; une chaîne qui ne le porte
 * pas perd (symboles tournés vers un type qu'elle ne sait pas déclencher).
 */
function scoreConvertSymbols(effect, gameState, ownerId) {
  const grid = gameState.players[ownerId].grid;
  const to = effect.symbol;
  let score = 0;
  for (const chain of findChains(grid)) {
    let moved = 0, total = 0;
    for (const i of chain) {
      const sy = grid[i].symbols;
      const t = (sy.atk || 0) + (sy.shield || 0) + (sy.revive || 0) + (sy.neutral || 0);
      total += t;
      moved += t - (sy[to] || 0);
    }
    if (moved === 0) continue;
    const hasCarrier = chain.some((i) => grid[i].trigger === "onCombo:" + to);
    if (hasCarrier) score += moved * 0.5 + (chain.length >= 2 && total >= 2 ? 1.5 : 0);
    else score -= moved * 0.25;
  }
  return score;
}

/** Valeur de remettre au deck la carte posée en `chosenTarget` (propre : recyclage ; adverse : perturbation). */
function scoreReturnToDeck(chosenTarget, gameState, ownerId, tuning) {
  const grid = gameState.players[chosenTarget.owner].grid;
  const card = grid[chosenTarget.cellIndex];
  if (!card) return 0;
  const potential = reconnectionPotential(grid, chosenTarget.cellIndex);
  if (chosenTarget.owner === ownerId) {
    // Retirer SA PROPRE tuile : case libérée + un tour de deck regagné ; vaut surtout pour un poids mort.
    let v = 1 + tuning.deckCardWeight - 0.5 * potential;
    if (card.disabled) v += 3;
    if (isDeadCardAt(card, chosenTarget.cellIndex)) v += tuning.deadCardExtra;
    return v;
  }
  // Renvoyer une tuile ADVERSE : casse ses liens, mais lui libère la case et lui rend une carte.
  let v = 0.5 * potential - 1 - tuning.deckCardWeight;
  if (card.disabled) v -= 3; // lui retirer un poids mort est un service rendu
  const chain = findChains(grid).find((c) => c.includes(chosenTarget.cellIndex));
  if (chain) {
    let symbolSum = 0;
    for (const i of chain) { const sy = grid[i].symbols; symbolSum += (sy.atk || 0) + (sy.shield || 0) + (sy.revive || 0) + (sy.neutral || 0); }
    if (symbolSum >= tuning.disruptionThreshold) v += tuning.disruptionBonus * symbolSum;
  }
  return v;
}

/**
 * Valeur d'un échange de place avec une carte alliée : on compare la « valeur de chaînes » du plateau avant / après
 * (somme, par chaîne de 2+ cartes reliées, du carré de ses symboles : une chaîne proche du seuil de combo vaut beaucoup).
 * Un échange qui ne relie rien de plus vaut 0 (jamais négatif : l'IA peut toujours choisir une cible neutre).
 */
function chainBoardValue(grid) {
  let v = 0;
  for (const chain of findChains(grid)) {
    if (chain.length < 2) continue;
    let sum = 0;
    for (const i of chain) { const sy = grid[i].symbols; sum += (sy.atk || 0) + (sy.shield || 0) + (sy.revive || 0) + (sy.neutral || 0); }
    v += sum * sum;
  }
  return v;
}
function scoreSwapAlly(chosenTarget, gameState, ownerId, sourceCell) {
  if (sourceCell == null || chosenTarget.owner !== ownerId) return 0;
  const grid = gameState.players[ownerId].grid;
  const after = grid.slice();
  after[sourceCell] = grid[chosenTarget.cellIndex];
  after[chosenTarget.cellIndex] = grid[sourceCell];
  return chainBoardValue(after) - chainBoardValue(grid);
}

/** Valeur de détruire la case VIDE `chosenTarget` : d'autant plus haute que des flèches adverses y pointent et que son plateau est plein. */
function scoreDestroyCell(chosenTarget, gameState, tuning) {
  const grid = gameState.players[chosenTarget.owner].grid;
  const r = rowOf(chosenTarget.cellIndex), c = colOf(chosenTarget.cellIndex);
  let pointing = 0;
  for (const d of DIRS) {
    const nr = r + DIR_VECTORS[d][0], nc = c + DIR_VECTORS[d][1];
    if (!inGrid(nr, nc)) continue;
    const n = grid[idx(nr, nc)];
    if (n && !n.disabled && n.dirs.includes(OPPOSITE[d])) pointing++;
  }
  const empties = grid.filter((x) => x === null).length;
  return tuning.cellDestroyBase + pointing * 1.5 + Math.max(0, 4 - empties) * 2;
}

let payoffDepth = 0; // garde-fou : valeur de réactivation imbriquée (A réveille B qui réveille A...)
function scoreEffectApplication(effect, target, chosenTarget, gameState, ownerId, tuning = DEFAULT_TUNING, context = {}) {
  if (!chosenTarget) return 0; // cible perdue : contribution nulle
  const sign = effectSign(effect.type, target.scope); // même formule que la Phase 1

  // Nouveaux effets : valeur propre (le modèle générique "magnitude × potentiel" ne s'applique pas).
  switch (effect.type) {
    case EFFECT_TYPES.CONVERT_SYMBOLS: return sign * scoreConvertSymbols(effect, gameState, ownerId);
    case EFFECT_TYPES.SWAP_ALLY: return sign * scoreSwapAlly(chosenTarget, gameState, ownerId, context.sourceCell);
    case EFFECT_TYPES.RETURN_TO_DECK: return sign * scoreReturnToDeck(chosenTarget, gameState, ownerId, tuning);
    case EFFECT_TYPES.HAND_TO_DECK: return sign * (tuning.handCapWeight * Math.max(1, effect.magnitude) - tuning.deckCardWeight);
    case EFFECT_TYPES.DESTROY_CELL: return sign * scoreDestroyCell(chosenTarget, gameState, tuning);
    default: break;
  }

  if (chosenTarget.kind === "player") {
    let score = sign * effect.magnitude;
    if (effect.type === EFFECT_TYPES.DAMAGE && chosenTarget.playerId !== ownerId) {
      const hp = gameState.players[chosenTarget.playerId].hp;
      if (hp - effect.magnitude <= 0) score += 1000; // coup fatal : priorité absolue
    }
    if (effect.type === EFFECT_TYPES.HEAL && chosenTarget.playerId === ownerId) {
      const hp = gameState.players[ownerId].hp;
      const missingHp = Math.max(0, tuning.maxHpReference - hp);
      score *= 1 + missingHp * tuning.dangerWeight; // se soigner urge d'autant plus qu'on est bas
    }
    return score;
  }

  // kind === "card" : la magnitude déclarée (souvent 0 pour activate/disable)
  // ne reflète pas l'impact réel -> pondération par le potentiel de
  // reconnexion de la carte visée, générique quel que soit effect.type.
  const grid = gameState.players[chosenTarget.owner].grid;
  const potential = reconnectionPotential(grid, chosenTarget.cellIndex);
  let score = sign * Math.max(1, effect.magnitude) * Math.max(1, potential);

  if (effect.type === EFFECT_TYPES.ACTIVATE && chosenTarget.owner === ownerId) {
    const ownDisabledCount = grid.filter((c) => c && !c.ruin && c.disabled).length;
    score *= 1 + ownDisabledCount * tuning.disabledRecoveryWeight; // reconstruire son plateau devient prioritaire
    // La réactivation déclenche l'onActivation de la carte réveillée : on ajoute la valeur de ce gain.
    const woken = grid[chosenTarget.cellIndex];
    if (woken && woken.trigger === TRIGGERS.ON_ACTIVATION && payoffDepth < 2) {
      payoffDepth++;
      try { score += bestAchievableTarget(woken.effect, woken.target, gameState, ownerId, { sourceCell: chosenTarget.cellIndex }).score; }
      finally { payoffDepth--; }
    }
  }

  if (chosenTarget.owner !== ownerId) {
    // Perturbation d'une chaîne adverse déjà avancée : on regarde la
    // composante connexe (au sens topologique, pas au sens "carte") à
    // laquelle appartient la cible, indépendamment du fait qu'on la
    // désactive via DAMAGE ou DISABLE.
    const chains = findChains(grid);
    const chain = chains.find((c) => c.includes(chosenTarget.cellIndex));
    if (chain) {
      let symbolSum = 0;
      for (const i of chain) {
        const s = grid[i].symbols;
        symbolSum += (s.atk || 0) + (s.shield || 0) + (s.revive || 0) + (s.neutral || 0);
      }
      if (symbolSum >= tuning.disruptionThreshold) score += tuning.disruptionBonus * symbolSum;
    }
  }

  return score;
}

/**
 * Balaie toutes les cibles légales pour `effect`/`target` et renvoie la
 * meilleure (score max) du point de vue de `ownerId`. `null` si aucune
 * cible légale (effet qui fizzle).
 */
function bestAchievableTarget(effect, target, gameState, ownerId, context) {
  const legal = getLegalTargets(effect, target, gameState, ownerId, context);
  let best = null, bestScore = -Infinity;
  for (const t of legal) {
    const s = scoreEffectApplication(effect, target, t, gameState, ownerId, undefined, context || {});
    if (s > bestScore) { bestScore = s; best = t; }
  }
  return { target: best, score: legal.length ? bestScore : 0 };
}

// ---------------------------------------------------------------------------
// Agrégation "best-effort" d'un combo pour le SCORING rapide (décimation).
// Contrairement à enumerateTriggerEvents (Phase 2, strict, lève une erreur
// sur combo hétérogène), ce chemin ne doit jamais lever d'exception : il ne
// sert qu'à classer des coups candidats, pas à les résoudre pour de vrai.
// En cas d'hétérogénéité on retient simplement le premier effet/target
// rencontré (sous-estimation acceptable pour un tri).
// ---------------------------------------------------------------------------

function aggregateComboBestEffort(grid, combo, type) {
  const { natives, abilities } = splitComboCarriers(grid, combo.chainIndices, type);
  // Même découpage que enumerateTriggerEvents : 1/ l'IMPACT propre du combo (toujours là), 2/ une activation
  // par carte porteuse ET par symbole du type, chacune avec sa cible.
  const activations = [];
  const total = combo.candidates.find((c) => c.type === type).value;
  if (type === "revive") {
    for (let k = 0; k < total; k++) activations.push({ effect: { type: COMBO_NATIVE_EFFECT[type], magnitude: 1 }, target: COMBO_BASE_TARGET[type], cell: null });
  } else {
    activations.push({ effect: { type: COMBO_NATIVE_EFFECT[type], magnitude: total }, target: COMBO_BASE_TARGET[type], cell: null });
  }
  for (const cell of [...natives, ...abilities]) {
    activations.push({ effect: grid[cell].effect, target: grid[cell].target, cell }); // une fois par combo
  }
  return { activations, matching: [...natives, ...abilities] };
}

/**
 * Valeur atteignable pour un combo (une chaîne donnée), en supposant qu'on
 * choisira le meilleur type candidat et, pour CHAQUE activation, la meilleure cible.
 * Utilisé à la fois pour le scoring rapide (décimation) ET, séparément, pour
 * décider quel type choisir en cas d'égalité (`needsChoice`).
 */
function bestComboOutcome(gameState, owner, grid, combo) {
  let best = { score: 0, type: null, target: null, aggregated: null };
  for (const cand of combo.candidates) {
    const aggregated = aggregateComboBestEffort(grid, combo, cand.type);
    let score = 0, firstTarget = null;
    for (const act of aggregated.activations) {
      const ctx = act.cell === null ? { excludeCells: combo.chainIndices } : { sourceCell: act.cell, excludeCells: combo.chainIndices };
      const r = bestAchievableTarget(act.effect, act.target, gameState, owner, ctx);
      score += r.score;
      if (firstTarget === null) firstTarget = r.target;
    }
    if (score > best.score || best.type === null) {
      best = { score, type: cand.type, target: firstTarget, aggregated };
    }
  }
  return best;
}

// ---------------------------------------------------------------------------
// Gestion des emplacements — topologie pure, aucune lecture d'id de carte.
//
// Le seul moyen de retirer une carte de la grille est la résolution d'une
// chaîne : toute carte qui ne pourra jamais être reliée est donc un
// emplacement PERDU pour le reste de la partie. Constat mesuré : sur les 20
// cartes de base, ~98 % des parties finissent par grille pleine, et l'IA
// posait 5 à 10 % de cartes mortes (dont la plupart évitables) parce que
// ni quickScoreMove ni evaluateStaticPosition ne les voyaient.
// ---------------------------------------------------------------------------

function inGrid(r, c) { return r >= 0 && r < 3 && c >= 0 && c < 3; }

/** Carte MORTE en `cell` : aucune de ses flèches ne pointe dans la grille -> ne pourra jamais être reliée. */
function isDeadCardAt(card, cell) {
  const r = rowOf(cell), c = colOf(cell);
  return !card.dirs.some((d) => inGrid(r + DIR_VECTORS[d][0], c + DIR_VECTORS[d][1]));
}

/**
 * Nombre de cases "verrouillées" : composantes de cartes actives qui n'ont plus
 * AUCUNE flèche vers une case vide (elles ne peuvent plus grandir) et restent
 * sous le seuil de résolution. Une composante au seuil n'est pas verrouillée :
 * elle se résout (ou se dissipe) à la prochaine pose. Le verrou peut encore se
 * lever si une voisine est nettoyée ; une carte morte, jamais.
 */
function countLockedCells(grid) {
  let locked = 0;
  for (const chain of findChains(grid)) {
    let total = 0, open = 0;
    for (const i of chain) {
      const s = grid[i].symbols;
      total += (s.atk || 0) + (s.shield || 0) + (s.revive || 0) + (s.neutral || 0);
      const r = rowOf(i), c = colOf(i);
      for (const d of grid[i].dirs) {
        const nr = r + DIR_VECTORS[d][0], nc = c + DIR_VECTORS[d][1];
        if (inGrid(nr, nc) && !grid[idx(nr, nc)]) open++;
      }
    }
    if (total >= 3) continue; // se résout / se dissipe (y compris une carte seule à 3 symboles) : pas un verrou
    if (open === 0) locked += chain.length;
  }
  return locked;
}

// ---------------------------------------------------------------------------
// Heuristique rapide de tri d'un coup — remplace scoreMoveForAi. Générique :
// simule la pose, énumère ce qu'elle déclencherait (combo ET/OU ability
// onPlacement de la carte elle-même), somme la meilleure valeur atteignable.
// ---------------------------------------------------------------------------

function quickScoreMove(gameState, owner, move) {
  if (move.pass || move.loseImmediately) return -Infinity; // jamais préféré à un vrai coup
  const opponent = opponentOf(owner);
  const side = gameState.players[owner];
  const card = side.hand[move.hIdx];

  // Simulation locale : on ne clone que ce qui est nécessaire pour scorer.
  const lockedBefore = countLockedCells(gameState.players[owner].grid);
  const simState = cloneGameState(gameState);
  simState.players[owner].grid[move.cellIndex] = cloneCard(card);
  arriveOnGrid(simState.players[owner].grid[move.cellIndex]);
  simState.players[owner].hand.splice(move.hIdx, 1);
  const grid = simState.players[owner].grid;

  let score = 0;
  // Carte auto-verrouillée : la case est perdue jusqu'à réactivation (même poids que dans evaluateStaticPosition).
  if (card.lockOnPlacement) score -= 4.5;

  // Ability onPlacement propre à la carte posée (généralisation : l'ancien
  // scoreMoveForAi ne connaissait que les combos, pas les abilities isolées).
  if (card.trigger && card.trigger !== "none" && !card.trigger.startsWith("onCombo:")) {
    // On ne sait évaluer génériquement que les triggers pilotés par
    // enumerateTriggerEvents ; onPlacement est déclenché par CE coup précisément.
    if (card.trigger === "onPlacement") {
      const { score: s } = bestAchievableTarget(card.effect, card.target, simState, owner, { sourceCell: move.cellIndex });
      score += s;
    } else if (card.trigger === "startOfTurn") {
      // Ne se déclenche PAS par ce coup (seulement aux futurs débuts de tour de
      // ce joueur) — mais l'ignorer complètement biaiserait la présélection de
      // coups (topKMoves) contre toute carte à effet différé/récurrent, qui ne
      // serait alors jamais retenue pour l'exploration en profondeur, même si
      // la recherche l'aurait ensuite correctement valorisée (RESTART.md : l'IA
      // ne doit pas sous-utiliser les pouvoirs à moyen/long terme). Pondéré par
      // le nombre de charges restantes ; la recherche en profondeur affinera
      // via la vraie simulation tour par tour (resolveTurnStart dans minimax).
      const { score: s } = bestAchievableTarget(card.effect, card.target, simState, owner, { sourceCell: move.cellIndex });
      score += s * (card.charges || 1);
    }
  }

  const combos = findActiveCombos(grid).filter((c) => c.chainIndices.includes(move.cellIndex));
  for (const combo of combos) {
    const outcome = bestComboOutcome(simState, owner, grid, combo);
    score += outcome.score;
    score += combo.chainIndices.length * DEFAULT_TUNING.slotFreedWeight; // la chaîne libère ses cases
  }
  if (DISSIPATE_UNRESOLVABLE_CHAINS) {
    for (const chain of findDormantChains(grid)) {
      if (chain.includes(move.cellIndex)) score += chain.length * DEFAULT_TUNING.slotFreedWeight;
    }
  }

  // Emplacements : ne pas se créer de verrous (carte morte, voisines aveuglées).
  // Le delta est mesuré AVANT résolution : les chaînes qui se résolvent sont exclues du compte (cf countLockedCells).
  score -= DEFAULT_TUNING.lockedCellWeight * (countLockedCells(grid) - lockedBefore);
  if (isDeadCardAt(card, move.cellIndex)) score -= DEFAULT_TUNING.deadCardExtra;

  const linksFormed = getActiveLinkDirs(grid, move.cellIndex).size;
  score += linksFormed * 1.5;
  if (card.dirs.length <= 1 && linksFormed === 0) score -= 2; // anti-gâchis carte peu connectée

  return score;
}

// ---------------------------------------------------------------------------
// Résolution AUTHORITATIVE des triggers après une pose (utilisée pour de
// vrai, pas juste pour scorer) — s'appuie sur le moteur strict de la Phase 2.
// ---------------------------------------------------------------------------

function chainKeyOf(chainIndices) {
  return chainIndices.slice().sort((a, b) => a - b).join(",");
}

/**
 * `chooseComboType(pendingCombo, gameState, owner) -> \"atk\"|\"shield\"|\"revive\"`
 * `chooseTarget(legalTargets, event, gameState) -> descripteur de cible`
 */

/**
 * Résout une file d'évènements (combos, abilities, dissipations) puis nettoie les
 * chaînes résolues. Générique : mode de la cible (fixed/random/chosen) appliqué ici,
 * et les désactivations / réactivations survenues en cours de route ajoutent à la
 * file les abilities onDisable / onActivation des cartes touchées (cascade bornée
 * par MAX_TRIGGER_EVENTS_PER_RESOLUTION). Retourne la liste des évènements résolus.
 */
function resolveEventQueue(gameState, initialEvents, { chooseTarget }, rng = Math.random) {
  const queue = [...initialEvents];
  const resolved = [];
  const chains = new Map(); // chainKey -> owner (pour le nettoyage final)
  let budget = MAX_TRIGGER_EVENTS_PER_RESOLUTION;

  while (queue.length > 0 && budget-- > 0) {
    const event = queue.shift();
    resolved.push(event);
    if (event.chainIndices) {
      const co = event.chainOwner || event.owner;
      const k = co + "|" + chainKeyOf(event.chainIndices);
      if (!chains.has(k)) chains.set(k, { owner: co, cards: chainCardsByIndex(event) });
    }

    const legal = getLegalTargets(event.effect, event.target, gameState, event.owner, event.context);
    const auto = autoResolveTarget(event.target, legal, rng);
    const chosen = auto.auto ? auto.target : chooseTarget(legal, event, gameState);
    resolveEffect(event.effect, event.target, chosen, gameState, rng, event.owner, event.context && event.context.sourceCell, event.context || {});

    for (const follow of drainTransitionEvents(gameState)) queue.push(follow);
    if (gameState.players.player.hp <= 0 || gameState.players.ai.hp <= 0) break; // partie décidée
  }
  gameState.transitions = [];
  if (triggerLogSink) triggerLogSink(resolved, gameState); // harnais Phase 4 (cartes encore sur la grille)

  for (const [key, { owner, cards }] of chains) {
    clearChain(gameState, owner, key.split("|")[1].split(",").map(Number), cards);
  }
  return resolved;
}

// Après l'ability de pose : si la carte posée a été remplacée (échange), la case contient une carte REÇUE.
// Les chaînes qu'elle forme n'ont pas à se résoudre ce tour-ci -> -1 (aucune chaîne ne contient -1) ;
// elles seront évaluées au début du tour de leur propriétaire.
function placedCellAfterAbility(gameState, owner, cellIndex, placedCard) {
  return gameState.players[owner].grid[cellIndex] === placedCard ? cellIndex : -1;
}

function resolveTriggersAfterPlacement(gameState, owner, cellIndex, { chooseComboType, chooseTarget }, rng = Math.random) {
  gameState.lastAction = { type: "placement", owner, cellIndex };
  const placedCard = gameState.players[owner].grid[cellIndex];

  // Phase 1 : ability de pose. Phase 2 : chaînes évaluées sur la grille APRÈS cette ability.
  let resolved = [];
  const placementEvents = enumerateTriggerEvents(gameState, { phase: "placement" });
  if (placementEvents.length) resolved = resolveEventQueue(gameState, placementEvents, { chooseTarget }, rng);
  if (gameState.players.player.hp <= 0 || gameState.players.ai.hp <= 0) return resolved;
  gameState.lastAction = { type: "placement", owner, cellIndex: placedCellAfterAbility(gameState, owner, cellIndex, placedCard) };

  const pending = getPendingComboChoices(gameState, owner);
  const comboChoices = {};
  for (const combo of pending) {
    comboChoices[chainKeyOf(combo.chainIndices)] = chooseComboType(combo, gameState, owner);
  }

  const events = enumerateTriggerEvents(gameState, { comboChoices, phase: "chains" });
  return resolved.concat(resolveEventQueue(gameState, events, { chooseTarget }, rng));
}

/** Début de tour de `owner` : résout les abilities startOfTurn de ses cartes actives. */
function resolveTurnStart(gameState, owner, { chooseTarget }, rng = Math.random) {
  gameState.lastAction = { type: "turnStart", owner };
  const events = enumerateTurnStartEvents(gameState, owner);
  if (events.length === 0) return events;
  return resolveEventQueue(gameState, events, { chooseTarget }, rng);
}

function hasStartOfTurnAbilities(grid) {
  return grid.some((c) => c && !c.disabled && c.trigger === TRIGGERS.START_OF_TURN);
}

function applyMove(gameState, owner, move, strategies) {
  if (move.loseImmediately) {
    gameState.players[owner].hp = 0;
    return;
  }
  if (move.pass) {
    for (const k of ["player", "ai"]) gameState.players[k].hp = Math.max(0, gameState.players[k].hp - 1); // pioche impossible : le timeout frappe les DEUX joueurs
    return;
  }
  const side = gameState.players[owner];
  const card = side.hand[move.hIdx];
  side.grid[move.cellIndex] = card;
  arriveOnGrid(card);
  side.hand.splice(move.hIdx, 1);
  resolveTriggersAfterPlacement(gameState, owner, move.cellIndex, strategies);
}

// ---------------------------------------------------------------------------
// Stratégies de choix (aléatoire vs heuristique) — injectées dans applyMove.
// ---------------------------------------------------------------------------

function randomChooseComboType(combo, gameState, owner, rng = Math.random) {
  return combo.candidates[Math.floor(rng() * combo.candidates.length)].type;
}
function randomChooseTarget(legal, event, gameState, rng = Math.random) {
  return legal[Math.floor(rng() * legal.length)];
}
const RANDOM_STRATEGIES = { chooseComboType: randomChooseComboType, chooseTarget: randomChooseTarget };

function heuristicChooseComboType(combo, gameState, owner) {
  const grid = gameState.players[owner].grid;
  const outcome = bestComboOutcome(gameState, owner, grid, combo);
  return outcome.type || combo.candidates[0].type;
}
function heuristicChooseTarget(legal, event, gameState) {
  let best = legal[0], bestScore = -Infinity;
  for (const t of legal) {
    const s = scoreEffectApplication(event.effect, event.target, t, gameState, event.owner, undefined, event.context || {});
    if (s > bestScore) { bestScore = s; best = t; }
  }
  return best;
}
const HEURISTIC_STRATEGIES = { chooseComboType: heuristicChooseComboType, chooseTarget: heuristicChooseTarget };

// ---------------------------------------------------------------------------
// Étape 1 — baseline aléatoire légale
// ---------------------------------------------------------------------------

function playRandomLegalMove(gameState, owner, rng = Math.random) {
  const moves = generateLegalMoves(gameState, owner);
  const move = moves[Math.floor(rng() * moves.length)];
  applyMove(gameState, owner, move, {
    chooseComboType: (c, s, o) => randomChooseComboType(c, s, o, rng),
    chooseTarget: (l, e, s) => randomChooseTarget(l, e, s, rng),
  });
  return move;
}

// ---------------------------------------------------------------------------
// Étape 2 — heuristique pure (glouton, sans recherche)
// ---------------------------------------------------------------------------

function playHeuristicMove(gameState, owner, rng = Math.random) {
  const moves = generateLegalMoves(gameState, owner);
  let best = moves[0], bestScore = -Infinity;
  for (const m of moves) {
    const s = quickScoreMove(gameState, owner, m);
    if (s > bestScore || (s === bestScore && rng() < 0.5)) { bestScore = s; best = m; }
  }
  applyMove(gameState, owner, best, HEURISTIC_STRATEGIES);
  return best;
}

// ---------------------------------------------------------------------------
// Étape 3 — recherche minimax + décimation + budget de temps
// ---------------------------------------------------------------------------

const SEARCH_TIMEOUT = Symbol("search-timeout");

/**
 * Évaluation statique d'une position, du point de vue de `forOwner`.
 * Générique : écart de PV, connectivité, cartes désactivées, risque de
 * plateau plein, main vide — jamais de référence à un id de carte. Reprend
 * `evaluateSimState` de l'ancien moteur presque à l'identique (il l'était
 * déjà), paramétré par le joueur plutôt que codé en dur sur "ai"/"player".
 */
function evaluateStaticPosition(gameState, forOwner) {
  const opp = opponentOf(forOwner);
  const self = gameState.players[forOwner], other = gameState.players[opp];
  if (self.hp <= 0 && other.hp <= 0) return 0;
  if (self.hp <= 0) return -1000;
  if (other.hp <= 0) return 1000;

  let score = (self.hp - other.hp) * 8;

  let selfLinks = 0, otherLinks = 0;
  for (let i = 0; i < 9; i++) {
    if (self.grid[i]) selfLinks += getActiveLinkDirs(self.grid, i).size;
    if (other.grid[i]) otherLinks += getActiveLinkDirs(other.grid, i).size;
  }
  score += (selfLinks - otherLinks) * 1.2;

  const selfDisabled = self.grid.filter((c) => c && !c.ruin && c.disabled).length;
  const otherDisabled = other.grid.filter((c) => c && !c.ruin && c.disabled).length;
  score += (otherDisabled - selfDisabled) * 4.5;

  // Emplacements verrouillés : chaque case perdue rapproche de la défaite par grille pleine.
  score += (countLockedCells(other.grid) - countLockedCells(self.grid)) * DEFAULT_TUNING.lockedCellWeight;

  const selfEmpty = self.grid.filter((c) => c === null).length;
  const otherEmpty = other.grid.filter((c) => c === null).length;
  score -= Math.max(0, 3 - selfEmpty) * 3;
  score += Math.max(0, 3 - otherEmpty) * 3;

  if (self.hand.length === 0) score -= 2;
  if (other.hand.length === 0) score += 2;

  // Le deck est l'horloge de la partie (pioche impossible = -1 PV par tour) : chaque carte d'écart compte.
  score += (deckSizeOf(self) - deckSizeOf(other)) * DEFAULT_TUNING.deckCardWeight;
  // Plafond de main : taille du choix disponible à chaque tour (baissé définitivement par handToDeck).
  score += (handCapOf(self) - handCapOf(other)) * DEFAULT_TUNING.handCapWeight;
  // Cases détruites : capacité de plateau perdue pour de bon.
  const selfRuins = self.grid.filter((c) => c && c.ruin).length;
  const otherRuins = other.grid.filter((c) => c && c.ruin).length;
  score += (otherRuins - selfRuins) * DEFAULT_TUNING.ruinWeight;

  return score;
}

/**
 * Ne garde que les K meilleurs coups d'un nœud (décimation), triés par
 * `quickScoreMove` — même fonction que l'heuristique pure de l'étape 2.
 */
function topKMoves(gameState, owner, k) {
  const moves = generateLegalMoves(gameState, owner);
  if (moves.length <= 1 || moves[0].pass || moves[0].loseImmediately) return moves;
  const scored = moves.map((m) => ({ m, s: quickScoreMove(gameState, owner, m) }));
  scored.sort((a, b) => b.s - a.s);
  return scored.slice(0, k).map((x) => x.m);
}

function minimax(gameState, depth, alpha, beta, maximizingOwner, currentOwner, topK, deadline) {
  if (Date.now() > deadline) throw SEARCH_TIMEOUT;
  if (depth === 0 || gameState.players.ai.hp <= 0 || gameState.players.player.hp <= 0) {
    return evaluateStaticPosition(gameState, maximizingOwner);
  }
  const maximizing = currentOwner === maximizingOwner;
  // Le début de tour de currentOwner se joue avant son coup (les abilities startOfTurn
  // bougent la position). Le tour du joueur racine est déjà résolu dans la vraie partie.
  if (hasStartOfTurnAbilities(gameState.players[currentOwner].grid)) {
    resolveTurnStart(gameState, currentOwner, HEURISTIC_STRATEGIES);
    if (gameState.players.ai.hp <= 0 || gameState.players.player.hp <= 0) return evaluateStaticPosition(gameState, maximizingOwner);
  }
  const moves = topKMoves(gameState, currentOwner, topK);

  let best = maximizing ? -Infinity : Infinity;
  for (const move of moves) {
    if (Date.now() > deadline) throw SEARCH_TIMEOUT;
    const next = cloneGameState(gameState);
    applyMove(next, currentOwner, move, HEURISTIC_STRATEGIES);
    const val = minimax(next, depth - 1, alpha, beta, maximizingOwner, opponentOf(currentOwner), topK, deadline);
    if (maximizing) { best = Math.max(best, val); alpha = Math.max(alpha, val); }
    else { best = Math.min(best, val); beta = Math.min(beta, val); }
    if (beta <= alpha) break;
  }
  return best;
}

/**
 * Recherche complète à la racine, sous budget de temps, avec
 * approfondissement itératif : on augmente la profondeur tant qu'il reste du
 * temps, et on retient le dernier résultat COMPLET (une profondeur entamée
 * puis interrompue par le budget est jetée, pas gardée à moitié).
 *
 * `topK` : largeur de décimation par nœud. `timeBudgetMs` : budget total.
 * `maxPlies` : plafond théorique de profondeur (typiquement 2× taille de main).
 */
function chooseMoveWithSearch(gameState, owner, { topK = 12, timeBudgetMs = 1000, maxPlies = 8 } = {}) {
  const rootMoves = topKMoves(gameState, owner, topK);
  if (rootMoves.length === 0 || rootMoves[0].pass || rootMoves[0].loseImmediately) return rootMoves[0] || null;

  const deadline = Date.now() + timeBudgetMs;
  let bestMove = rootMoves[0];

  for (let plies = 1; plies <= maxPlies; plies++) {
    let results;
    try {
      results = rootMoves.map((move) => {
        const next = cloneGameState(gameState);
        applyMove(next, owner, move, HEURISTIC_STRATEGIES);
        const val = minimax(next, plies - 1, -Infinity, Infinity, owner, opponentOf(owner), topK, deadline);
        return { move, value: val };
      });
    } catch (e) {
      if (e === SEARCH_TIMEOUT) break; // profondeur en cours abandonnée, on garde le dernier résultat complet
      throw e;
    }
    results.sort((a, b) => b.value - a.value);
    bestMove = results[0].move;
    if (Date.now() > deadline) break;
  }

  return bestMove;
}

/**
 * Joue un coup en utilisant la recherche, puis résout ses effets avec la
 * stratégie heuristique (choix de cible/type "pour de vrai", cohérent avec
 * ce que la recherche a supposé pendant l'exploration).
 */
function playSearchMove(gameState, owner, searchOptions) {
  const move = chooseMoveWithSearch(gameState, owner, searchOptions);
  applyMove(gameState, owner, move, HEURISTIC_STRATEGIES);
  return move;
}

// ---------------------------------------------------------------------------
// Détermination Monte-Carlo sur le pool adverse inconnu (portage générique de
// computeOpponentUnseenPool / sampleHandFromPool — déjà génériques dans
// l'ancien moteur, seule la construction des instances change : on utilise
// `instantiateCard` de la Phase 1 pour fabriquer des mains plausibles avec de
// nouvelles directions tirées au hasard, puisqu'on ne connaît pas les
// vraies).
// ---------------------------------------------------------------------------

function computeUnseenPool(deckComposition, opponentSide) {
  const counts = { ...deckComposition };
  for (const cell of opponentSide.grid) {
    if (cell && counts[cell.templateId] !== undefined) counts[cell.templateId]--;
  }
  for (const templateId of opponentSide.graveyard || []) {
    if (counts[templateId] !== undefined) counts[templateId]--;
  }
  const pool = [];
  for (const id in counts) for (let i = 0; i < Math.max(0, counts[id]); i++) pool.push(id);
  return pool;
}

function shuffleCopy(arr, rng) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(rng() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function sampleHandFromPool(pool, size, templatesById, rng = Math.random) {
  const ids = shuffleCopy(pool, rng).slice(0, Math.min(size, pool.length));
  return ids.map((id) => instantiateCard(templatesById[id], rng));
}


  /* ======================= CARTES DE BASE (modèle générique) ======================= */
  // 20 cartes. Chaque carte est un TEMPLATE : trigger + effect + target génériques
  // (Phase 1/2), plus linkCount/symbols/rarity pour l'affichage et l'équilibrage.
  // Les FLÈCHES CONCRÈTES ne sont plus fixées ici (rupture volontaire avec l'ancien
  // prototype) : chaque exemplaire tire ses directions au moment de la construction du
  // deck via instantiateCard (Phase 1), donc deux copies de "C3" dans une même partie
  // auront très probablement des flèches différentes. Seul le NOMBRE de flèches
  // (linkCount) est fixé par carte.
  //
  // Raretés imposées (inchangées depuis le prototype d'origine) :
  // - une seule carte à 4 flèches dans tout le jeu (très rare) ;
  // - les cartes multi-symboles attaque/défense sont rares (une seule hybride atk+shield) ;
  // - le revive est rare (3 cartes) — CORRECTIF DEMANDÉ : les 3 cartes revive portent
  //   désormais SYSTÉMATIQUEMENT 2 symboles revive (plus d'hybride atk+revive ou
  //   shield+revive comme dans une version antérieure) ; elles ne se distinguent plus
  //   que par leur linkCount.
  //
  // Note de modélisation sur C9 (hybride atk+shield) : une carte ne porte qu'UN SEUL
  // trigger dans ce modèle. C9 porte "onCombo:atk" : elle compte dans les DEUX sommes
  // (atk et shield) pour la détection de seuil/dominance d'une chaîne (evaluateChain lit
  // directement ses symboles), mais ne déclenche son propre effet que si "atk" domine.
  // Si une chaîne où elle participe résout "shield", elle a contribué au total sans agir
  // elle-même — comportement générique (dépend du trigger de CHAQUE carte), pas un cas

  const MAX_HP = 7;

  /* ======================= MOTEUR — PHASE 4 (harnais de simulation, headless) =======================
   * Aucune dépendance au DOM. Règles de partie recopiées de l'UI (pioche, pénalité de deck vide,
   * défaite par grille pleine, début de tour). Batch 1 : simulateMatch / simulateBatch, places
   * alternées, graine reproductible, erreurs capturées, fréquence de déclenchement par carte. */

  let triggerLogSink = null;

  /** Exécute fn() avec Math.random remplacé par un PRNG à graine (restauré ensuite) : parties reproductibles. */
  function withSeed(seed, fn) {
    const orig = Math.random;
    let a = seed >>> 0;
    Math.random = () => {
      a = (a + 0x6D2B79F5) >>> 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
    try { return fn(); } finally { Math.random = orig; }
  }

  function simShuffle(list) {
    const a = list.slice();
    for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
    return a;
  }

  function simBuildSide(deck) {
    // Deck équilibré (réciprocité des liens, cf. RESTART.md) plutôt qu'un tirage
    // indépendant par carte, pour que le harnais de simulation reste représentatif
    // de la construction réelle du deck en partie.
    const cards = buildBalancedDeck(deck, CARDS_BY_ID, Math.random);
    return { hp: MAX_HP, grid: Array(9).fill(null), hand: [], deck: simShuffle(cards), graveyard: [], handCap: HAND_SIZE };
  }

  /** aiConfig : { kind: "random" | "greedy" | "search", budgetMs } (search : budget en ms => non reproductible). */
  function simMakePicker(cfg) {
    const kind = (cfg && cfg.kind) || "greedy";
    if (kind === "random") return (st, w) => { const ms = generateLegalMoves(st, w); return ms[Math.floor(Math.random() * ms.length)]; };
    if (kind === "search") return (st, w) => chooseMoveWithSearch(st, w, { topK: (cfg && cfg.topK) || 12, timeBudgetMs: (cfg && cfg.budgetMs) || 60, maxPlies: 10 }) || { pass: true };
    return (st, w) => {
      const ms = generateLegalMoves(st, w);
      let best = ms[0], bs = -Infinity;
      for (const m of ms) { const sc = quickScoreMove(st, w, m); if (sc > bs || (sc === bs && Math.random() < 0.5)) { bs = sc; best = m; } }
      return best;
    };
  }

  /**
   * Une partie complète. A joue en premier. Retourne
   * { winner: "A"|"B"|null, turns, reason: "grille pleine"|"PV"|"plafond de tours"|"erreur", hp:[A,B], fired:{id:n}, error? }.
   */
  function simulateMatch(deckA, deckB, aiConfig = {}, opts = {}) {
    const maxTurns = opts.maxTurns || 120;
    const fired = {};
    const run = () => {
      const st = { players: { player: simBuildSide(deckA), ai: simBuildSide(deckB) }, lastAction: null };
      const pick = { player: simMakePicker(aiConfig.A || aiConfig), ai: simMakePicker(aiConfig.B || aiConfig) };
      triggerLogSink = (events, gs) => {
        for (const e of events) {
          const cells = e.sourceCells && e.sourceCells.length ? e.sourceCells : (e.context && e.context.sourceCell != null ? [e.context.sourceCell] : []);
          if (e.trigger === "dissipate") fired.dissipate = (fired.dissipate || 0) + 1;
          for (const c of cells) { const card = gs.players[e.owner].grid[c]; if (card) fired[card.templateId] = (fired[card.templateId] || 0) + 1; }
        }
      };
      const draw = (w) => { const p = st.players[w], b = p.hand.length, cap = handCapOf(p); while (p.hand.length < cap && p.deck.length) p.hand.push(p.deck.pop()); if (b < cap && p.hand.length < cap) { for (const k of ["player", "ai"]) st.players[k].hp = Math.max(0, st.players[k].hp - 1); } };
      for (const w of ["player", "ai"]) { const p = st.players[w]; while (p.hand.length < handCapOf(p) && p.deck.length) p.hand.push(p.deck.pop()); }
      const loser = () => (st.players.player.hp <= 0 && st.players.ai.hp <= 0 ? "draw" : st.players.player.hp <= 0 ? "player" : st.players.ai.hp <= 0 ? "ai" : null);
      const full = (w) => st.players[w].grid.every(Boolean);
      let over = null, reason = "", w = "player", first = true, turns = 0;
      while (!over && turns < maxTurns * 2) {
        if (full(w)) { over = w; reason = "grille pleine"; break; }
        if (!first) {
          draw(w); if ((over = loser())) { reason = "PV"; break; }
          resolveTurnStart(st, w, HEURISTIC_STRATEGIES); if ((over = loser())) { reason = "PV"; break; }
        }
        first = false;
        if (st.players[w].hand.length) {
          applyMove(st, w, pick[w](st, w), HEURISTIC_STRATEGIES);
          if (full(w)) { over = w; reason = "grille pleine"; break; }
          if ((over = loser())) { reason = "PV"; break; }
        }
        w = opponentOf(w); turns++;
      }
      const side = (x) => (x === "player" ? "A" : "B");
      return { winner: over && over !== "draw" ? (over === "player" ? "B" : "A") : null, turns: Math.ceil(turns / 2), reason: over ? (over === "draw" ? "égalité" : reason) : "plafond de tours",
               hp: [st.players.player.hp, st.players.ai.hp], fired };
    };
    try { return opts.seed !== undefined ? withSeed(opts.seed, run) : run(); }
    catch (e) { return { winner: null, turns: 0, reason: "erreur", hp: [0, 0], fired, error: String(e && e.message || e) }; }
    finally { triggerLogSink = null; }
  }

  function simulateBatch(deckA, deckB, n, aiConfig = {}, opts = {}) {

  /* ======================= PRÉCHARGEMENT =======================
     loadAssets(urls, then) : charge les images (et polices "font:...") pas encore connues, puis appelle then().
     Si tout est déjà en cache : then() est appelé tout de suite. Si le chargement dépasse LOADER_DELAY_MS, un écran (logo + barre) s'affiche
     jusqu'à la fin, puis then() est appelé sous l'écran qui se fond. Un seul chargement à la fois (les clics répétés sont ignorés). */
  const LOADER_DELAY_MS = 500, ASSET_TIMEOUT_MS = 12000;
  const assetDone = new Set();
  let loadBusy = false;
  const ldEl = (id) => document.getElementById(id);
  function loaderShow() { ldEl("ldTxt").textContent = t("loading"); ldEl("loadScreen").classList.remove("fade"); ldEl("loadScreen").classList.add("on", "show"); }
  function loaderSet(r) { ldEl("ldFill").style.width = Math.round(Math.max(0, Math.min(1, r)) * 100) + "%"; }

  }
  function loadAssets(urls, then, opts = {}) {
    const todo = [...new Set(urls)].filter((u) => !assetDone.has(u));
    if (!todo.length) { if (opts.boot) loaderHide(); then(); return; }
    if (loadBusy && !opts.boot) return;
    loadBusy = true;

    const finish = () => {
      if (over) return; over = true; clearTimeout(timer); loadBusy = false;
      try { then(); } finally { if (shown) loaderHide(); }
    };

      const f = () => step(u);
      setTimeout(f, ASSET_TIMEOUT_MS);

  /* ======================= RESOLUTION D'UN TOUR JOUEUR : POSE + COMBOS ======================= */
  // Version interactive (modale de choix de type, clic pour choisir une cible) du même
  // pipeline générique que résolveTriggersAfterPlacement (Phase 3) : getPendingComboChoices
  // -> enumerateTriggerEvents -> getLegalTargets -> resolveEffect -> clearChain. Le tour de
  // l'IA, lui, n'a pas besoin d'être interactif : il passe directement par applyMove (Phase 3).
  // Deux phases : 1/ ability de pose, 2/ chaînes évaluées sur la grille mise à jour par cette ability.
  function runPlacementPhases(owner, cellIndex, resolveChains, onAllResolved) {
    state.lastAction = { type: "placement", owner, cellIndex };
    const placedCard = state.players[owner].grid[cellIndex];
    const placementEvents = enumerateTriggerEvents(state, { phase: "placement" });
    const phase2 = () => {
      if (state.players.player.hp <= 0 || state.players.ai.hp <= 0) { onAllResolved(); return; }
      state.lastAction = { type: "placement", owner, cellIndex: placedCellAfterAbility(state, owner, cellIndex, placedCard) };
      resolveChains();
    };
    if (placementEvents.length === 0) phase2();
    else resolveEventQueueWithAnimation(owner, placementEvents, new Set(), chooseTargetForEvent, phase2);
  }

  function processPlayerCombosAfterPlacement(cellIndex, onAllResolved) {
    runPlacementPhases("player", cellIndex, () => {
      collectComboTypeChoices({}, (comboChoices) => {
        const events = enumerateTriggerEvents(state, { comboChoices, phase: "chains" });
        resolveEventQueueWithAnimation("player", events, new Set(), chooseTargetForEvent, onAllResolved);
      });
    }, onAllResolved);
  }

  function collectComboTypeChoices(comboChoices, onDone) {
    const pending = getPendingComboChoices(state, "player")
      .filter((c) => !(chainKeyOf(c.chainIndices) in comboChoices));
    if (pending.length === 0) { onDone(comboChoices); return; }
    const combo = pending[0];
    showTypeChoiceModal(combo.candidates, (chosenType) => {
      comboChoices[chainKeyOf(combo.chainIndices)] = chosenType;
      collectComboTypeChoices(comboChoices, onDone);
    });

  /**
   * Pipeline de résolution PARTAGÉ entre le joueur et l'IA (voir
   * processAiCombosAfterPlacement plus bas) : seule la façon de CHOISIR une
   * cible diffère (`chooseTarget`, callback-style dans les deux cas — clic
   * pour le joueur, heuristique appelée immédiatement pour l'IA), la
   * mécanique de résolution et l'animation sont identiques pour les deux.
   * `chooseTarget(legal, event, cb)` doit appeler `cb(cible choisie)`.

  function resolveEventQueueWithAnimation(owner, queue, resolvedChains, chooseTarget, onAllResolved, eventBudget = { left: MAX_TRIGGER_EVENTS_PER_RESOLUTION }) {
    if (queue.length === 0 || eventBudget.left <= 0) {
      for (const key of resolvedChains) {
        const [chainOwner, idxs] = key.split("|");
        clearChain(state, chainOwner, idxs.split(",").map(Number), resolvedChains.cards && resolvedChains.cards.get(key));
      }
      onAllResolved();
      return;
    }
    const event = queue.shift();
    if (event.chainIndices) {
      const ck = (event.chainOwner || event.owner) + "|" + chainKeyOf(event.chainIndices);
      if (!resolvedChains.has(ck) && event.chainCards) {
        if (!resolvedChains.cards) resolvedChains.cards = new Map();
        resolvedChains.cards.set(ck, chainCardsByIndex(event));
      }
      resolvedChains.add(ck);
    }
    const legal = getLegalTargets(event.effect, event.target, state, event.owner, event.context);
    // Mise en scène (symbole qui voyage) réservée à l'évènement de COMBO ; l'ability qu'il déclenche
    // (event.kind === "ability") se résout ensuite, avec sa propre cible, sans animation de combo.
    const symbolKey = event.kind === "combo" ? comboSymbolKeyFromTrigger(event.trigger) : null;
    eventBudget.left--;

    const applyAndContinue = (chosen) => {
      const proceed = () => {
        logEvent(event, chosen);
        const hpBefore = chosen && chosen.kind === "player" ? state.players[chosen.playerId].hp : null;
        resolveEffect(event.effect, event.target, chosen, state, Math.random, event.owner, event.context && event.context.sourceCell, event.context || {});
        sfxEffect(event.effect, chosen);
        if (hpBefore !== null && event.effect.type === EFFECT_TYPES.HEAL) {
          const lost = hpBefore + event.effect.magnitude - state.players[chosen.playerId].hp;   // soin rogné par le plafond de PV
          if (lost > 0) playShieldOverflowAnimation(chosen.playerId, lost);
        }
        // Cascade : cartes désactivées / réactivées par cet effet -> leurs abilities onDisable / onActivation.
        for (const follow of drainTransitionEvents(state)) queue.push(follow);
        // Partie décidée : on ne fait plus choisir de cibles, on laisse l'appelant conclure.
        if (state.players.player.hp <= 0 || state.players.ai.hp <= 0) queue.length = 0;
        render();
        resolveEventQueueWithAnimation(owner, queue, resolvedChains, chooseTarget, onAllResolved, eventBudget);
      };
      // L'animation ne concerne QUE les combos (onCombo:atk/shield/revive) avec
