      // une cible réelle — une ability sans rapport (future) ou un effet sans
      // cible légale (fizzle) se résolvent directement, sans mise en scène.
      const animSource = state.lastAction && state.lastAction.type === "placement" && (!event.chainIndices || event.chainIndices.includes(state.lastAction.cellIndex)) ? state.lastAction.cellIndex
        : (event.chainIndices ? event.chainIndices[0] : null);
      const srcCell = event.context && event.context.sourceCell;
      if (event.kind === "ability" && chosen && srcCell !== null && srcCell !== undefined) {
        // Effet de CARTE : zoom-in de la carte, puis le symbole de l'effet voyage jusqu'à la cible.
        playCardEffectAnimation(cellElementFor(event.owner, srcCell), effectSymbolKey(event.effect), targetElementFor(chosen), proceed, burstCountFor(event, chosen));
      } else if (symbolKey && chosen && animSource !== null && animSource !== undefined) {
        const sourceCellEl = cellElementFor(event.chainOwner || event.owner, (event.chainOwner || event.owner) === owner ? animSource : event.chainIndices[0]);
        const targetEl = targetElementFor(chosen);
        playComboSymbolAnimation(sourceCellEl, symbolKey, targetEl, proceed, burstCountFor(event, chosen));
      } else {
        proceed();
      }
    };

    // Mode de la cible (fixed / random / une seule cible légale) : aucun choix à faire.
    const auto = autoResolveTarget(event.target, legal);
    if (auto.auto) { applyAndContinue(auto.target); return; }
    chooseTarget(legal, event, applyAndContinue);
  }

  // Qui choisit la cible : le propriétaire de l'évènement, quel que soit le tour en cours
  // (ex. l'IA désactive une carte du joueur -> c'est LE JOUEUR qui choisit la cible de son onDisable).
  function chooseTargetForEvent(legal, event, cb) {
    if (event.owner === "player") promptPlayerTarget(event, legal, cb);
    else cb(HEURISTIC_STRATEGIES.chooseTarget(legal, event, state)); // IA : décision immédiate
  }

  // Début de tour : abilities startOfTurn des cartes actives de `owner`, avant sa pose.
  function runTurnStart(owner, onDone) {
    state.lastAction = { type: "turnStart", owner, cellIndex: null };
    const events = enumerateTurnStartEvents(state, owner);
    if (events.length === 0) { onDone(); return; }
    setStatus(owner === "player" ? t("statusTurnStartYou") : t("statusTurnStartRival"));
    resolveEventQueueWithAnimation(owner, events, new Set(), chooseTargetForEvent, onDone);
  }

  // Prompt générique : dispatché sur target.scope (jamais sur un id de carte ni sur le
  // "type" de combo). enemyCard -> carte adverse surlignée ou portrait RIVAL (cible "FACE"
  // injectée automatiquement par getLegalTargets pour tout effet DAMAGE) ; ownCard -> une de
  // ses propres cartes surlignées.
  function promptPlayerTarget(event, legal, resolve) {
    pendingTarget = { scope: event.target.scope, legal, resolve };
    // Deux invites distinctes pour un combo avec ability : 1/ « Combo! » (cible du combo), 2/ « <carte> : ability! »
    // (cible de l'ability, qui peut être tout autre chose que la cible du combo).
    const act = event.activation && event.activation.count > 1 ? ` ${event.activation.index}/${event.activation.count}` : "";
    let lead;
    const src = event.context && event.context.sourceCell != null ? state.players[event.owner].grid[event.context.sourceCell] : null;
    const srcName = src && src.templateId ? cardName(src.templateId) : "";
    if (event.kind === "combo") lead = t("leadCombo", act);
    else if (event.viaCombo) lead = t("leadComboAbility", srcName, act);
    else lead = t("leadCardEffect", srcName);
    // Ce que l'effet va faire (même formulation que le panneau d'inspection) : on cible CETTE carte pour CET effet.
    const fx = sentenceEffect(event.effect, event.target);
    if (fx && fx.verb) {
      const tg = fx.noTarget ? "" : sentenceTarget(event.target);
      lead += " " + t("statusEffectLine", fx.verb + (tg ? ` ${fx.prep ? fx.prep + " " : ""}${tg}` : "") + (fx.tail || "") + ".");
    }
    if (event.target.scope === TARGET_SCOPES.ENEMY_CARD) {
      setStatus(t(legal.some((l) => l.kind === "player") ? "statusTargetEnemyCard" : "statusTargetEnemyCardOnly", lead));
    } else if (event.target.scope === TARGET_SCOPES.OWN_CARD) {
      setStatus(t("statusTargetOwnCard", lead));
    } else if (event.target.scope === TARGET_SCOPES.ENEMY_CELL) {
      setStatus(t("statusTargetEnemyCell", lead));
    } else {
      // Scope à choix multiple imprévu pour les cartes de base actuelles : on ne bloque
      // pas la partie, on prend la première option plutôt que de planter.
      pendingTarget = null;
      resolve(legal[0]);
      return;
    }
    render();
  }

  /* ======================= ANIMATION DE COMBO =======================
     Quand un combo se forme : 1) le symbole concerné (atk/shield/revive)
     grossit et le reste de la carte s'efface, IN PLACE sur la case qui
     vient d'être posée (source unique et simple, même si plusieurs cartes
     de la chaîne contribuent à l'effet) ; 2) une fois la cible connue, ce
     même symbole quitte la case et voyage en arc jusqu'à la cible, puis
     disparaît. L'état de jeu réel (resolveEffect + render) n'est appliqué
     qu'APRÈS la fin de l'animation, pour ne jamais désynchroniser ce qui
     est montré de ce qui est vrai. */
  function comboSymbolKeyFromTrigger(trigger) {
    return trigger && trigger.startsWith("onCombo:") ? trigger.slice("onCombo:".length) : null;
  }

  function comboFlashIconHtml(symbolKey) {
    if (skinEnabled) return `<img src="${SKIN_TYPE_ICON_SRC[symbolKey]}" alt="">`;
    const map = { atk: "⚔", shield: "🛡", revive: "✚", neutral: "●" };
    return `<span class="sym ${symbolKey}">${map[symbolKey] || "●"}</span>`;
  }

  function cellElementFor(owner, cellIndex) {
    return document.querySelector(`.cell[data-owner="${owner}"][data-index="${cellIndex}"]`);
  }

  function targetElementFor(target) {
    if (target.kind === "player") {
      return document.getElementById(target.playerId === "ai" ? "aiHpRow" : "playerHpRow");
    }
    return cellElementFor(target.owner, target.cellIndex);
  }

  // Symbole animé selon l'effet : atk = dégâts / désactivation / destruction ; shield = soin ; revive = réactivation ;
  // neutral = liens, rotation, défausse et le reste (échange, retour au deck, conversion de symboles).
  function effectSymbolKey(effect) {
    switch (effect && effect.type) {
      case EFFECT_TYPES.DAMAGE: case EFFECT_TYPES.DISABLE: case EFFECT_TYPES.DESTROY_CARD: case EFFECT_TYPES.DESTROY_CELL: case EFFECT_TYPES.DESTROY_LOCKED: case EFFECT_TYPES.DESTROY_SLOT: return "atk";
      case EFFECT_TYPES.HEAL: return "shield";
      case EFFECT_TYPES.ACTIVATE: return "revive";
      case EFFECT_TYPES.SYMBOL_BONUS: return effect.symbol || "neutral";
      default: return "neutral";
    }
  }

  // Effet de carte : 1/ zoom-in de la carte source, 2/ animation du symbole (voir playComboSymbolAnimation).
  function playCardEffectAnimation(sourceCellEl, symbolKey, targetEl, onDone, count = 1) {
    if (!sourceCellEl) { onDone(); return; }
    sourceCellEl.classList.add("effect-zoom");
    setTimeout(() => {
      playComboSymbolAnimation(sourceCellEl, symbolKey, targetEl || sourceCellEl, () => {
        sourceCellEl.classList.remove("effect-zoom");
        onDone();
      }, count);
    }, 280);
  }

  // Nombre de symboles de la rafale : 1 par point de dégâts / de soin infligé à un JOUEUR (plafonné à 8), sinon 1.
  function burstCountFor(event, chosen) {
    const e = event.effect;
    if (chosen && chosen.kind === "player" && (e.type === EFFECT_TYPES.DAMAGE || e.type === EFFECT_TYPES.HEAL)) return Math.max(1, Math.min(8, e.magnitude || 1));
    return 1;
  }

  // Soin perdu au plafond de PV : boucliers qui se fissurent et retombent + éclair sur la barre.
  function playShieldOverflowAnimation(playerId, lost) {
    const el = targetElementFor({ kind: "player", playerId });
    if (!el) return;
    const r = el.getBoundingClientRect();
    el.classList.add("hp-capped");
    setTimeout(() => el.classList.remove("hp-capped"), 900);
    const n = Math.max(1, Math.min(6, lost));
    for (let i = 0; i < n; i++) {
      const sh = document.createElement("div");
      sh.className = "shield-lost";
      sh.innerHTML = comboFlashIconHtml("shield");
      sh.style.left = (r.left + r.width / 2 + (Math.random() - 0.5) * Math.min(80, r.width)) + "px";
      sh.style.top = (r.top + r.height / 2 - 14) + "px";
      sh.style.setProperty("--dx", ((Math.random() - 0.5) * 70).toFixed(0) + "px");
      sh.style.setProperty("--dy", (40 + Math.random() * 40).toFixed(0) + "px");
      sh.style.setProperty("--rot", ((Math.random() - 0.5) * 90).toFixed(0) + "deg");
      sh.style.animationDelay = (i * 90) + "ms";
      document.body.appendChild(sh);
      setTimeout(() => sh.remove(), 1300 + i * 90);
    }
    const tag = document.createElement("div");
    tag.className = "hp-max-tag";
    tag.textContent = t("maxTag");
    tag.style.left = (r.left + r.width / 2) + "px";
    tag.style.top = (r.top - 4) + "px";
    document.body.appendChild(tag);
    setTimeout(() => tag.remove(), 1300);
  }

  function playComboSymbolAnimation(sourceCellEl, symbolKey, targetEl, onDone, count = 1) {
    // Sécurité : élément introuvable (mise en page inattendue) -> ne jamais
    // bloquer la partie pour un problème purement visuel.
    if (!sourceCellEl || !targetEl) { onDone(); return; }

    // Phase 1 : le reste de la carte s'efface, le symbole grossit, sur place.
    const cardInner = sourceCellEl.firstElementChild; // .tile (CSS) ou .skin-card (skin)
    if (cardInner) cardInner.classList.add("combo-fade-out");

    const flash = document.createElement("div");
    flash.className = "combo-flash";
    flash.innerHTML = comboFlashIconHtml(symbolKey);
    sourceCellEl.appendChild(flash);
    // Double rAF : force le navigateur à peindre l'état initial avant d'activer
    // la transition, sinon l'insertion + l'activation dans le même tick sautent
    // l'animation (le navigateur ne voit qu'un seul état final).
    requestAnimationFrame(() => requestAnimationFrame(() => flash.classList.add("active")));

    setTimeout(() => {
      // Phase 2 : le symbole quitte la case, devient flottant, et voyage en
      // arc vers la cible (calcul JS image par image, pas de keyframes CSS —
      // la trajectoire dépend de positions connues seulement à l'exécution).
      const startRect = flash.getBoundingClientRect();
      const endRect = targetEl.getBoundingClientRect();
      const size = Math.max(startRect.width, startRect.height);

      const iconHtml = flash.innerHTML;
      flash.remove();
      if (cardInner) cardInner.classList.remove("combo-fade-out"); // render() régénère la case juste après de toute façon

      // Rafale : `count` symboles (1 par point de dégât / de soin), décalés de 110 ms, légèrement dispersés.
      const n = Math.max(1, Math.min(8, count | 0));
      const sz = n > 1 ? size * 0.78 : size;
      const x0 = startRect.left + startRect.width / 2 - sz / 2;
      const y0 = startRect.top + startRect.height / 2 - sz / 2;
      const x1 = endRect.left + endRect.width / 2 - sz / 2;
      const y1 = endRect.top + endRect.height / 2 - sz / 2;
      const dist = Math.hypot(x1 - x0, y1 - y0);
      let landed = 0;
      const fly = () => {
        const floater = document.createElement("div");
        floater.className = "combo-flash-floating";
        floater.innerHTML = iconHtml;
        floater.style.width = sz + "px";
        floater.style.height = sz + "px";
        document.body.appendChild(floater);
        const jx = n > 1 ? (Math.random() - 0.5) * sz * 1.1 : 0;
        const jy = n > 1 ? (Math.random() - 0.5) * sz * 0.7 : 0;
        const arcHeight = Math.min(140, dist * 0.35) * (n > 1 ? 0.7 + Math.random() * 0.6 : 1);
        const duration = 420;
        const start = performance.now();
        function frame(now) {
          const t = Math.min(1, (now - start) / duration);
          const ease = t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2; // easeInOutQuad
          const spread = 1 - ease;                                         // la dispersion se résorbe à l'arrivée
          const x = x0 + (x1 - x0) * ease + jx * spread;
          const yLinear = y0 + (y1 - y0) * ease;
          const y = yLinear - arcHeight * Math.sin(Math.PI * ease) + jy * spread; // bombe vers le haut au milieu du trajet
          floater.style.left = x + "px";
          floater.style.top = y + "px";
          if (t >= 0.75) floater.style.opacity = String(1 - (t - 0.75) / 0.25); // s'efface sur le dernier quart
          if (t < 1) { requestAnimationFrame(frame); }
          else { floater.remove(); landed++; if (landed === n) onDone(); }
        }
        requestAnimationFrame(frame);
      };
      for (let k = 0; k < n; k++) setTimeout(fly, k * 110);
    }, 320); // durée de la phase 1 (cf. transition CSS de .combo-flash)
  }

  /* ======================= TOUR DU JOUEUR ======================= */
  function selectHandCard(index) {
    if (justDragged) { justDragged = false; return; } // le clic qui suit naturellement un drop ne doit pas ré-ouvrir/fermer la sélection
    if (state.active !== "player" || state.winner || pendingTarget) return;
    if (tutBlocked("select", index)) return;
    sfx(state.ui.selectedHandIndex === index ? "error" : "selectS");   // désélection = annulation
    state.ui.selectedHandIndex = (state.ui.selectedHandIndex === index) ? null : index;
    render();
  }

  /* ======================= DRAG'N'DROP (en plus du clic carte + clic arène) =======================
     Basé sur les Pointer Events (souris, tactile ET stylet en un seul jeu d'écouteurs), pas sur l'API
     HTML5 drag-and-drop native qui n'est pas fiable sur Safari iOS pour des éléments arbitraires.
     Le drag ne fait que RÉUTILISER placeSelectedCard : il ne duplique aucune règle de jeu, il choisit
     juste (handIdx, cellIndex) autrement qu'avec deux clics successifs. */
  let justDragged = false; // évite qu'un clic de souris déclenché juste après un drop ne rouvre la sélection
  const dragState = { active: false, handIdx: null, moved: false, startX: 0, startY: 0, width: 0, height: 0, ghost: null };
  const DRAG_MOVE_THRESHOLD = 6; // px avant de considérer que c'est un drag et pas un simple tap

  function onHandCardPointerDown(e, index, div) {
    if (state.active !== "player" || state.winner || pendingTarget) return;
    if (e.pointerType === "mouse" && e.button !== 0) return; // clic droit/milieu : pas de drag
    if (tutBlocked("select", index)) return;
    const rect = div.getBoundingClientRect();
    dragState.active = true;
    dragState.handIdx = index;
    dragState.moved = false;
    dragState.pointerId = e.pointerId;
    dragState.startX = e.clientX;
    dragState.startY = e.clientY;
    dragState.width = rect.width;
    dragState.height = rect.height;

    // Le fantôme est créé et positionné TOUT DE SUITE (mais invisible) plutôt
    // qu'au premier pointermove qui dépasse le seuil : ça évite tout souci
    // d'ordre/perte d'évènements tactiles entre le pointerdown et la
    // première détection de mouvement — le nœud existe déjà, on n'a plus
    // qu'à le révéler.
    const ghost = div.cloneNode(true);
    ghost.classList.remove("selected"); // évite un conflit de spécificité avec .hand-card.selected (transform)
    ghost.classList.add("drag-ghost");
    ghost.style.width = rect.width + "px";
    ghost.style.height = rect.height + "px";
    ghost.style.left = rect.left + "px";
    ghost.style.top = rect.top + "px";
    ghost.style.opacity = "0";
    document.body.appendChild(ghost);
    dragState.ghost = ghost;

    try { div.setPointerCapture(e.pointerId); } catch (err) { /* pas critique si indisponible */ }
    // Empêche Safari iOS d'interpréter le geste comme une sélection de texte
    // ou un scroll natif avant que touch-action:none n'ait pris effet.
    e.preventDefault();
  }

  function clearDragOverHighlights() {
    document.querySelectorAll(".cell.drag-over").forEach((c) => c.classList.remove("drag-over"));
  }

  function cellUnderPoint(x, y) {
    const el = document.elementFromPoint(x, y);
    return el && el.closest ? el.closest(".cell") : null;
  }

  function onDocPointerMove(e) {
    if (!dragState.active) return;
    const dx = e.clientX - dragState.startX;
    const dy = e.clientY - dragState.startY;

    if (!dragState.moved) {
      if (Math.hypot(dx, dy) < DRAG_MOVE_THRESHOLD) return; // encore un simple tap potentiel, on ne fait rien
      // Seuil franchi : c'est bien un drag. Le fantôme existe déjà (posé au
      // pointerdown) — on le révèle simplement.
      dragState.moved = true;
      dragState.ghost.style.opacity = "0.92";
      state.ui.selectedHandIndex = dragState.handIdx; // même surbrillance .placeable que le clic
      render();
    }

    dragState.ghost.style.left = (e.clientX - dragState.width / 2) + "px";
    dragState.ghost.style.top = (e.clientY - dragState.height / 2) + "px";

    clearDragOverHighlights();
    const cell = cellUnderPoint(e.clientX, e.clientY);
    if (cell && cell.dataset.owner === "player" && state.players.player.grid[Number(cell.dataset.index)] === null) {
      cell.classList.add("drag-over");
    }
  }

  function endDrag() {
    if (dragState.ghost) { dragState.ghost.remove(); dragState.ghost = null; }
    clearDragOverHighlights();
    dragState.active = false;
  }

  function onDocPointerUp(e) {
    if (!dragState.active) return;
    const handIdx = dragState.handIdx;
    const wasMoved = dragState.moved;
    endDrag();
    if (!wasMoved) return; // simple tap : le click natif qui suit gère déjà la sélection

    justDragged = true;
    const cell = cellUnderPoint(e.clientX, e.clientY);
    if (cell && cell.dataset.owner === "player" && state.players.player.grid[Number(cell.dataset.index)] === null) {
      state.ui.selectedHandIndex = handIdx;
      placeSelectedCard(Number(cell.dataset.index));
    } else {
      state.ui.selectedHandIndex = null; // lâché en dehors d'une case valide : on annule juste la sélection
      render();
    }
  }

  function onDocPointerCancel() {
    if (!dragState.active) return;
    const wasMoved = dragState.moved;
    endDrag();
    if (wasMoved) { justDragged = true; state.ui.selectedHandIndex = null; render(); }
  }

  document.addEventListener("pointermove", onDocPointerMove);
  document.addEventListener("pointerup", onDocPointerUp);
  document.addEventListener("pointercancel", onDocPointerCancel);

  function placeSelectedCard(cellIndex) {
    if (state.active !== "player" || state.winner || pendingTarget) return;
    if (tutBlocked("place", cellIndex)) return;
    if (state.ui.selectedHandIndex === null) return;
    const p = state.players.player;
    if (p.grid[cellIndex] !== null) { sfx("error"); return; }

    const handIdx = state.ui.selectedHandIndex;
    const card = p.hand[handIdx];
    p.grid[cellIndex] = card;
    arriveOnGrid(card);
    p.hand.splice(handIdx, 1);
    state.ui.selectedHandIndex = null;
    sfx("selectM");
    logPlacement("player", cellIndex);
    setStatus(t("statusCardPlaced"));
    render();

    processPlayerCombosAfterPlacement(cellIndex, () => {
      if (checkGridFullLoss("player")) return;
      endPlayerTurn();
    });
  }

  function endPlayerTurn() {
    if (state.mode === "tutorial") { tutTurnEnded(); return; }   // tutoriel : le script reprend la main (pas d'IA)
    state.active = "ai";
    saveGame();
    render();
    setStatus(t("statusRivalTurn"));
    setTimeout(playAiTurn, 700);
  }

  /* ======================= CIBLAGE : clic sur une case / portrait ======================= */
  function onCellClick(owner, cellIndex) {
    if (pendingTarget) {
      const match = pendingTarget.legal.find((t) => (t.kind === "card" || t.kind === "cell") && t.owner === owner && t.cellIndex === cellIndex);
      if (match) {
        const resolve = pendingTarget.resolve;
        pendingTarget = null;
        resolve(match);
      } else sfx("error");
      return;
    }
    if (owner === "player") placeSelectedCard(cellIndex);
  }

  function onAiFaceClick() {
    if (pendingTarget) {
      const match = pendingTarget.legal.find((t) => t.kind === "player" && t.playerId === "ai");
      if (match) {
        const resolve = pendingTarget.resolve;
        pendingTarget = null;
        resolve(match);
      }
    }
  }

  /* ======================= TOUR DE L'IA ======================= */
  // Détermination Monte-Carlo (Phase 3) : l'IA ne voit jamais la vraie main adverse pendant
  // sa recherche, seulement la composition totale du deck moins ce qui est visible/consommé.
  // Elle tire AI_DETERMINIZATIONS mains plausibles, cherche sur chacune, et moyenne.
  function chooseAiMoveWithDeterminization() {
    const rootMoves = topKMoves(state, "ai", AI_TOPK);
    if (rootMoves.length === 0 || rootMoves[0].pass || rootMoves[0].loseImmediately) return rootMoves[0] || null;

    const deadline = Date.now() + AI_TIME_BUDGET_MS;
    const unseenPool = computeUnseenPool(DECK_COMPOSITION, state.players.player);
    const playerHandSize = state.players.player.hand.length;

    const totals = new Map(rootMoves.map((m) => [m, { sum: 0, count: 0 }]));
    let samplesLeft = AI_DETERMINIZATIONS;

    for (let s = 0; s < AI_DETERMINIZATIONS; s++) {
      if (Date.now() > deadline) break;
      const sampledHand = sampleHandFromPool(unseenPool, playerHandSize, CARDS_BY_ID, Math.random);
      const rootState = cloneGameState(state);
      rootState.players.player.hand = sampledHand;
      const sampleDeadline = Math.min(deadline, Date.now() + (deadline - Date.now()) / Math.max(1, samplesLeft));
      samplesLeft--;

      let lastComplete = null;
      for (let plies = 1; plies <= AI_MAX_PLIES; plies++) {
        try {
          lastComplete = rootMoves.map((move) => {
            const next = cloneGameState(rootState);
            applyMove(next, "ai", move, HEURISTIC_STRATEGIES);
            const val = minimax(next, plies - 1, -Infinity, Infinity, "ai", "player", AI_TOPK, sampleDeadline);
            return { move, value: val };
          });
        } catch (e) {
          if (e === SEARCH_TIMEOUT) break;
          throw e;
        }
        if (Date.now() > sampleDeadline) break;
      }
      if (lastComplete) {
        for (const { move, value } of lastComplete) {
          const t = totals.get(move);
          t.sum += value; t.count += 1;
        }
      }
    }

    let bestMove = rootMoves[0], bestAvg = -Infinity;
    for (const [move, t] of totals) {
      if (t.count === 0) continue;
      const avg = t.sum / t.count;
      if (avg > bestAvg || (avg === bestAvg && Math.random() < 0.3)) { bestAvg = avg; bestMove = move; }
    }
    return bestMove;
  }

  function processAiCombosAfterPlacement(cellIndex, onAllResolved) {
    runPlacementPhases("ai", cellIndex, () => {
      const pending = getPendingComboChoices(state, "ai");
      const comboChoices = {};
      for (const combo of pending) {
        comboChoices[chainKeyOf(combo.chainIndices)] = HEURISTIC_STRATEGIES.chooseComboType(combo, state, "ai");
      }
      const events = enumerateTriggerEvents(state, { comboChoices, phase: "chains" });
      resolveEventQueueWithAnimation("ai", events, new Set(), chooseTargetForEvent, onAllResolved);
    }, onAllResolved);
  }

  function playAiTurn() {
    if (checkGridFullLoss("ai")) return;
    drawWithPenalty("ai");
    if (checkGameOverAndContinue()) return;
    runTurnStart("ai", () => {
      if (checkGameOverAndContinue()) return;
      playAiMove();
    });
  }

  function playAiMove() {
    const ai = state.players.ai;
    if (ai.hand.length === 0) { backToPlayer(); return; }

    const move = chooseAiMoveWithDeterminization();
    if (!move || move.pass || move.loseImmediately) {
      // Rien à animer (pas de pose de carte) : applyMove (Phase 3) suffit.
      applyMove(state, "ai", move || { pass: true }, HEURISTIC_STRATEGIES);
      render();
      if (checkGridFullLoss("ai")) return;
      if (checkGameOverAndContinue()) return;
      backToPlayer();
      return;
    }

    // Pose la carte manuellement (comme le joueur) puis passe par le MÊME
    // pipeline animé que lui, plutôt que applyMove synchrone d'un bloc — les
    // combos de l'IA doivent être aussi visibles/mis en scène que les siens.
    const card = ai.hand[move.hIdx];
    ai.grid[move.cellIndex] = card;
    arriveOnGrid(card);
    sfx("selectM");
    ai.hand.splice(move.hIdx, 1);
    logPlacement("ai", move.cellIndex);
    render();

    processAiCombosAfterPlacement(move.cellIndex, () => {
      if (checkGridFullLoss("ai")) return;
      if (checkGameOverAndContinue()) return;
      backToPlayer();
    });
  }

  function backToPlayer() {
    state.active = "player";
    if (checkGridFullLoss("player")) return;
    drawWithPenalty("player");
    if (checkGameOverAndContinue()) return;
    runTurnStart("player", () => {
      if (checkGameOverAndContinue()) return;
      continuePlayerTurn();
    });
  }

  function continuePlayerTurn() {
    if (state.players.player.hand.length === 0) {
      setStatus(t("statusNoCardsInHand"));
      saveGame();
      render();
      setTimeout(playAiTurn, 900);
      return;
    }

    setStatus(t("statusYourTurn"));
    saveGame();
    render();
  }

  /* ======================= SAUVEGARDE localStorage ======================= */
  function saveGame() {
    if (!state || state.mode === "tutorial") return;
    try { localStorage.setItem(saveKeyFor(state.mode), JSON.stringify(state)); } catch (e) { /* stockage indisponible */ }
  }

  function loadGame(mode = "random") {
    try {
      const raw = localStorage.getItem(saveKeyFor(mode));
      if (!raw) return null;
      const parsed = JSON.parse(raw);
      if (!parsed || !parsed.players || !parsed.players.player || !parsed.players.ai) return null;
      parsed.mode = mode;   // anciennes sauvegardes (sans champ mode) = random
      if (!parsed.collection) parsed.collection = { player: buildRandomCollection(CARDS_BY_ID) };
      if (!parsed.players.player.graveyard) parsed.players.player.graveyard = [];
      if (!parsed.players.ai.graveyard) parsed.players.ai.graveyard = [];
      if (parsed.players.player.handCap == null) parsed.players.player.handCap = HAND_SIZE;
      if (parsed.players.ai.handCap == null) parsed.players.ai.handCap = HAND_SIZE;
      return parsed;
    } catch (e) { return null; }
  }

  function initSimPanel() {
    const el = (id) => document.getElementById(id);
    el("simRun").addEventListener("click", () => {
      const n = Math.max(2, +el("simN").value || 200), seed = +el("simSeed").value || 1;
      const cfg = { A: { kind: el("simAiA").value }, B: { kind: el("simAiB").value } };
      const acc = newBatchAcc(); let i = 0; el("simRun").disabled = true;
      const step = () => {
        const t0 = Date.now();
        while (i < n && Date.now() - t0 < 40) { batchStep(acc, DECK_COMPOSITION, DECK_COMPOSITION, i, cfg, { seed: seed + i * 7919 }); i++; }
        const r = batchSummary(acc);
        el("simOut").textContent = [
          t("simProgress", i, n),
          t("simLineA", (100 * r.winRateA).toFixed(1), (100 * r.ci95).toFixed(1), r.winsA, r.winsB, r.undecided, r.errors, r.firstError),
          t("simLineFirst", (100 * r.firstPlayerWinRate).toFixed(1), r.meanTurns.toFixed(1)),
          t("simLineEnds", JSON.stringify(Object.fromEntries(Object.entries(r.reasons).map(([k, v]) => [STRINGS[LOCALE].simReasons[k] || k, v])))),
          t("simLineFired", JSON.stringify(r.firedPerMatch)),
        ].join("\n");
        if (i < n) setTimeout(step, 0); else el("simRun").disabled = false;
      };
      step();
    });
  }

  function startNewGame(mode = "random") {
    const st = createNewState(mode);   // decks tirés d'avance : on précharge leurs illustrations avant d'afficher le combat
    loadAssets(stateAssets(st), () => startNewGameNow(mode, st));
  }
  function startNewGameNow(mode, st) {
    sfx("enter");
    closeEndScreen();
    // Un seul combat en cours à la fois (random OU campaign) : en lancer un nouveau abandonne celui de l'autre mode.
    try { const other = mode === "campaign" ? "random" : "campaign"; localStorage.removeItem(saveKeyFor(other)); localStorage.removeItem(logKeyFor(other)); } catch (e) { /* ignoré */ }
    state = st;
    drawUpTo(state.players.player, handCapOf(state.players.player));
    drawUpTo(state.players.ai, handCapOf(state.players.ai));
    pendingTarget = null;
    resetLog();
    setStatus(t("statusNewGame"));
    saveGame();
    render();
  }


  /* ======================= LOG DE PARTIE =======================
     Une entrée par : pose de carte, combo, effet de carte (onPlacement / startOfTurn / onActivation /
     onDisable / ability déclenchée par un combo), dissipation de chaîne. Chaque entrée embarque un
     instantané de l'arène du joueur qui agit, pris au moment de l'action (avant la résolution de
     l'effet, pour qu'on voie encore la chaîne). Le log vit HORS de `state` : l'IA clone `state` en
     profondeur pendant sa recherche, on ne veut pas y traîner des dizaines d'instantanés. Persisté
     séparément dans localStorage. */
  const LOG_STORAGE_KEY = "ccn_game_log_v1";
  const CAMP_LOG_STORAGE_KEY = "ccn_campaign_log_v1";
  const logKeyFor = (mode) => (mode === "campaign" ? CAMP_LOG_STORAGE_KEY : LOG_STORAGE_KEY);
  const LOG_MAX_ENTRIES = 80;
  let gameLog = [];

  function loadLog(mode = "random") {
    try { const raw = localStorage.getItem(logKeyFor(mode)); const a = raw ? JSON.parse(raw) : []; return Array.isArray(a) ? a : []; }
    catch (e) { return []; }
  }
  function saveLog() {
    if (state && state.mode === "tutorial") return;
    try { localStorage.setItem(logKeyFor(state && state.mode), JSON.stringify(gameLog)); } catch (e) { /* stockage indisponible */ }
  }
  function resetLog() { gameLog = []; saveLog(); renderLogIfOpen(); }

  const cellLabel = (i) => "ABC"[Math.floor(i / 3)] + (i % 3 + 1);

  // Instantané minimal, suffisant pour redessiner la carte (illustration/rareté via templateId, liens, symboles, trigger).
  function snapshotArena(owner) {
    return state.players[owner].grid.map((c) => !c ? null : c.ruin ? { ruin: true, dirs: [], symbols: {}, disabled: true } : {
      templateId: c.templateId, trigger: c.trigger, charges: c.charges, dirs: [...c.dirs], symbols: { ...c.symbols }, disabled: !!c.disabled,
    });
  }

  function pushLog(entry) {
    gameLog.push(entry);
    if (gameLog.length > LOG_MAX_ENTRIES) gameLog.splice(0, gameLog.length - LOG_MAX_ENTRIES);
    saveLog();
    appendLogEntryIfOpen(entry);
  }

  function logPlacement(owner, cellIndex) {
    const c = state.players[owner].grid[cellIndex];
    pushLog({ kind: "place", owner, cell: cellIndex, symbols: c ? { ...c.symbols } : {}, grid: snapshotArena(owner) });
  }

  // Appelé juste AVANT resolveEffect : `chosen` = cible choisie (ou null si l'effet n'a plus de cible).
  function logEvent(event, chosen) {
    const comboSymbol = event.kind === "combo" ? comboSymbolKeyFromTrigger(event.trigger) : null;
    pushLog({
      kind: event.trigger === "dissipate" ? "dissipate" : (comboSymbol ? "combo" : "effect"),
      owner: event.owner, trigger: event.trigger, viaCombo: !!event.viaCombo, symbol: comboSymbol,
      chain: event.chainIndices ? [...event.chainIndices] : null,
      cell: event.context && event.context.sourceCell !== undefined ? event.context.sourceCell : null,
      effect: { type: event.effect.type, magnitude: event.effect.magnitude, symbol: event.effect.symbol || null },
      target: chosen ? (chosen.kind === "player" ? { kind: "player", playerId: chosen.playerId }
        : { kind: chosen.kind, owner: chosen.owner, cellIndex: chosen.cellIndex }) : null,
      grid: snapshotArena(event.owner),
    });
  }

  function logTargetText(target) {
    if (!target) return t("logTargetNone");
    if (target.kind === "player") return t(target.playerId === "player" ? "logTargetYou" : "logTargetRival");
    if (target.kind === "cell") return t("logTargetCellEnemy", cellLabel(target.cellIndex));
    return t(target.owner === "player" ? "logTargetCardOwn" : "logTargetCardEnemy", cellLabel(target.cellIndex));
  }

  function logSymbolHtml(key) {
    if (skinEnabled && SKIN_TYPE_ICON_SRC[key]) return `<img src="${SKIN_TYPE_ICON_SRC[key]}" alt="">`;
    const map = { atk: "⚔", shield: "🛡", revive: "✚", neutral: "●" };
    return `<span class="sym ${key}">${map[key] || "●"}</span>`;
  }

  function logEffectText(e, target) {
    const label = t("logEffect" + capitalize1(e.type), e.magnitude);
    const sym = e.type === "symbolBonus" && e.symbol ? " " + logSymbolHtml(e.symbol) : "";
    return `${label}${sym} ${t("logArrow")} ${logTargetText(target)}`;
  }

  function logEntryTextHtml(en) {
    if (en.kind === "place") {
      const icons = Object.entries(en.symbols || {}).flatMap(([k, n]) => Array(n || 0).fill(logSymbolHtml(k))).join("");
      return `<b>${t("logPlace", cellLabel(en.cell))}</b> ${icons}`;
    }
    if (en.kind === "dissipate") {
      return `<b>${t("logDissipate", (en.chain || []).map(cellLabel).join("·"))}</b>`;
    }
    if (en.kind === "combo") {
      return `<b>${t("logCombo", (en.chain || []).length)}</b> ${logSymbolHtml(en.symbol)}`
        + `<span class="log-effect">${logEffectText(en.effect, en.target)}</span>`;
    }
    const trig = en.viaCombo ? t("logTriggerComboAbility")
      : t(["onPlacement", "startOfTurn", "onActivation", "onDisable"].includes(en.trigger) ? "logTrigger" + capitalize1(en.trigger) : "logTriggerOther");
    return `<b>${t("logEffectHeader", trig, en.cell !== null ? cellLabel(en.cell) : "—")}</b>`
      + `<span class="log-effect">${logEffectText(en.effect, en.target)}</span>`;
  }

  // Miniature 3×3 de l'arène du joueur qui a agi. Cases sources (cyan) et cible (rouge, si dans la même arène).
  function miniArenaHtml(en) {
    const src = new Set(en.kind === "place" ? [en.cell] : (en.chain || (en.cell !== null ? [en.cell] : [])));
    const tgt = en.target && (en.target.kind === "card" || en.target.kind === "cell") && en.target.owner === en.owner ? en.target.cellIndex : -1;
    const grid = en.grid;
    let html = '<div class="mini-arena">';
    for (let i = 0; i < 9; i++) {
      const c = grid[i];
      let inner = "", extra = "";
      if (c && c.ruin) { inner = ""; extra = " ruin-mini"; }
      else if (c) {
        const linked = getActiveLinkDirs(grid, i);
        inner = skinEnabled
          ? renderCardVisual(c, { disabled: c.disabled, linkedDirs: linked })
          : `<div class="tile${c.disabled ? " disabled" : ""}${linked.size ? " tile-linked" : ""} ${cardRootClasses(c)}">${renderCardVisual(c, { linkedDirs: linked })}</div>`;
      }
      html += `<div class="mini-cell${extra}${src.has(i) ? " src" : ""}${i === tgt ? " tgt" : ""}"${c && !c.ruin ? ` data-card="${i}"` : ""}>${inner}</div>`;
    }
    return html + "</div>";
  }

  function logEntryEl(en) {
    const el = document.createElement("div");
    el.className = "log-entry " + en.owner;
    el._en = en; // pour l'inspection des cartes de la miniature (voir logListEl, délégation d'évènements)
    el.innerHTML = miniArenaHtml(en)
      + `<div><div class="log-meta">${t(en.owner === "player" ? "logYou" : "logRival")}</div><div class="log-text">${logEntryTextHtml(en)}</div></div>`;
    return el;
  }

  const logOverlayEl = document.getElementById("logOverlay");
  const logListEl = document.getElementById("logList");
  const logIsOpen = () => logOverlayEl.style.display !== "none";

  // Inspection d'une carte de la miniature : survol (souris) ou toucher/clic (tactile) -> même panneau que sur le plateau,
  // reconstruit depuis l'instantané pris au moment de l'action (symboles, charges et trigger d'alors).
  function logCardInstance(cellEl) {
    const entryEl = cellEl.closest(".log-entry");
    const snap = entryEl && entryEl._en && entryEl._en.grid ? entryEl._en.grid[+cellEl.dataset.card] : null;
    if (!snap || snap.ruin) return null;
    const tpl = CARDS_BY_ID[snap.templateId] || {};
    return { templateId: snap.templateId, trigger: snap.trigger, charges: snap.charges, symbols: snap.symbols, dirs: snap.dirs,
      effect: tpl.effect, target: tpl.target, disabled: snap.disabled };
  }
  const logCellOf = (e) => (e.target.closest ? e.target.closest(".mini-cell[data-card]") : null);
  logListEl.addEventListener("pointerover", (e) => {
    if (e.pointerType !== "mouse") return;
    const cell = logCellOf(e);
    if (cell && detail.anchor !== cell) showDetail(cell, () => logCardInstance(cell), true);
  });
  logListEl.addEventListener("pointerout", (e) => {
    if (e.pointerType !== "mouse") return;
    const cell = logCellOf(e);
    if (cell && detail.anchor === cell && !(e.relatedTarget && cell.contains(e.relatedTarget))) hideDetail();
  });
  // Tactile / stylet : l'ouverture se fait au pointerdown (fiable partout, y compris iPad/Safari où un « click »
  // peut ne pas arriver), et le panneau reste ouvert après le relâchement (voir endDetailTouch). Un second appui
  // sur la même carte, ailleurs dans le log, ou un défilement le referme.
  logListEl.addEventListener("pointerdown", (e) => {
    if (e.pointerType === "mouse") return; // souris : déjà géré par le survol
    const cell = logCellOf(e);
    if (!cell) { hideDetail(); return; }
    if (detail.open && detail.anchor === cell) hideDetail(); else showDetail(cell, () => logCardInstance(cell), true);
  });
  let logTouching = false;
  logListEl.addEventListener("pointerdown", (e) => { logTouching = e.pointerType !== "mouse"; }, true);
  logListEl.addEventListener("scroll", () => { if (logTouching && detail.open) hideDetail(); });

  function renderLog() {
    logListEl.innerHTML = "";
    if (gameLog.length === 0) {
      logListEl.innerHTML = `<div class="log-empty">${t("logEmpty")}</div>`;
      return;
    }
    const frag = document.createDocumentFragment();
    gameLog.forEach((en) => frag.appendChild(logEntryEl(en)));
    logListEl.appendChild(frag);
    logListEl.scrollTop = logListEl.scrollHeight;
  }
  function renderLogIfOpen() { if (logIsOpen()) renderLog(); }
  function appendLogEntryIfOpen(en) {
    if (!logIsOpen()) return;
    const empty = logListEl.querySelector(".log-empty");
    if (empty) empty.remove();
    const atBottom = logListEl.scrollHeight - logListEl.scrollTop - logListEl.clientHeight < 40;
    logListEl.appendChild(logEntryEl(en));
    while (logListEl.children.length > LOG_MAX_ENTRIES) logListEl.removeChild(logListEl.firstChild);
    if (atBottom) logListEl.scrollTop = logListEl.scrollHeight;
  }
  function openLog() { sfx("windowOpen"); hideDetail(); logOverlayEl.style.display = "flex"; renderLog(); queueFitSkinButtons(); }
  function closeLog() { logOverlayEl.style.display = "none"; }
  document.getElementById("logBtn").addEventListener("click", openLog);
  document.getElementById("logClose").addEventListener("click", closeLog);
  logOverlayEl.addEventListener("click", (e) => { if (e.target === logOverlayEl) closeLog(); });
  window.addEventListener("keydown", (e) => { if (e.key === "Escape" && logIsOpen()) closeLog(); });

  /* ======================= RENDU ======================= */
  function setStatus(msg) { document.getElementById("statusLine").textContent = msg; }

  function symbolsHtmlFor(symbols) {
    return Array(symbols.atk || 0).fill(`<span class="sym atk">⚔</span>`).join("")
      + Array(symbols.shield || 0).fill(`<span class="sym shield">🛡</span>`).join("")
      + Array(symbols.revive || 0).fill(`<span class="sym revive">✚</span>`).join("")
      + Array(symbols.neutral || 0).fill(`<span class="sym neutral">●</span>`).join("");
  }

  /* ---------- Skin graphique (toggle) ----------
     Remplace entièrement les conteneurs/décorateurs CSS (.tile/.arrow/
     .symbols) par le système image du prototype fourni, quand le toggle est
     ON. Chemins relatifs : le fichier HTML est destiné à être placé dans le
     même dossier que ./ui/, ./illustrations/ et ./abilities/ du prototype
     d'origine — pas d'encodage base64. */
  const SKIN_STORAGE_KEY = "ccn_skin_enabled_v1";
  const SKIN_FRAME_SRC = "./ui/ui051.webp";
  const SKIN_ARROW_SRC = "./ui/ui045.webp"; // néons allumés (connexion active)
  const SKIN_ARROW_OFF_SRC = "./ui/ui045c.webp"; // même flèche, néons éteints (connexion inactive)
  // 4 icônes de type à fournir séparément (une par symbole de jeu, distinctes
  // des icônes d'ability numérotées du dossier ./abilities/).
  const SKIN_TYPE_ICON_SRC = {
    atk: "./abilities/type-atk.webp",
    shield: "./abilities/type-shield.webp",
    revive: "./abilities/type-revive.webp",
    neutral: "./abilities/type-neutral.webp",
  };
  const SKIN_ILLUSTRATION_MAX = 162; // pool commun à toutes les cartes, purement décoratif

  // Icône de trigger (bas droite, .skin-ability) — même emplacement que le
  // prototype fourni (test_8.html, slot .ability-bottom), mais nomenclature
  // par NOM plutôt que numérotée : trigger_xxx.webp, où xxx est la valeur du
  // trigger (":" remplacé par "_" pour les combos, invalide dans un nom de
  // fichier). Dérivé directement de l'enum TRIGGERS, pas de table à
  // maintenir à la main.
  const TRIGGER_ICON_EXCLUDED = new Set([TRIGGERS.NONE, TRIGGERS.ON_DISABLE]); // pas d'icône : aucune ability / abandonné
  function triggerIconSrc(trigger) {
    if (!trigger || TRIGGER_ICON_EXCLUDED.has(trigger)) return null;
    return `./abilities/trigger_${trigger.replace(":", "_")}.webp`;
  }
  function triggerIconImgHtml(trigger, index) {
    const src = triggerIconSrc(trigger);
    if (!src) return "";
    const info = triggerBadgeInfo(trigger);
    return `<img src="${src}" style="--i:${index || 0}" alt="${info ? t(info.labelKey) : ""}" title="${info ? t(info.labelKey) : ""}">`;
  }
  // Nombre d'icônes d'ability : un effet « début de tour » en affiche AUTANT que de tours où il s'active encore
  // (charges restantes) ; chaque déclenchement en consomme une, et à 0 l'icône disparaît. Les autres triggers : une icône.
  function abilityRepeatCount(instance) {
    if (instance.trigger === TRIGGERS.START_OF_TURN) return Math.max(0, instance.charges == null ? 1 : instance.charges);
    return 1;
  }
  function abilityIconsHtml(instance) {
    let html = "";
    for (let i = 0; i < abilityRepeatCount(instance); i++) html += triggerIconImgHtml(instance.trigger, i);
    return html;
  }
  function abilityBadgesPlainHtml(instance) {
    const info = triggerBadgeInfo(instance.trigger);
    if (!info) return "";
    let html = "";
    for (let i = 0; i < abilityRepeatCount(instance); i++) {
      html += `<div class="trigger-badge ${info.cls} trigger-badge-plain" style="--i:${i}" title="${t(info.labelKey)}">${info.glyph}</div>`;
    }
    return html;
  }

  const skinEnabled = true;   // le skin est permanent (plus de bascule)

  // L'illustration est FIXE pour chaque type de carte (indépendante des liens tirés à la
  // construction du deck) : numéro d'illustration = numéro de la carte (C12 -> illustration012.webp).
  // Un id sans numéro exploitable retombe sur un hash stable ; au-delà du pool d'images, on boucle.
  function hashTemplateId(id) {
    let h = 0;
    for (let i = 0; i < id.length; i++) { h = (h * 31 + id.charCodeAt(i)) | 0; }
    return Math.abs(h);
  }
  function illustrationIdForTemplate(templateId) {
    const baseId = String(templateId).split("~")[0];   // variante craftée « C67~1-0-0-0-0 » : l'illustration est celle de la carte d'origine
    const m = /(\d+)\s*$/.exec(baseId);
    const n = m ? parseInt(m[1], 10) : hashTemplateId(baseId);
    return ((Math.max(1, n) - 1) % SKIN_ILLUSTRATION_MAX) + 1;
  }
  function ensureIllustrationId(card) {
    return illustrationIdForTemplate(card.templateId); // jamais mis en cache sur l'instance (anciennes sauvegardes incluses)
  }

  function skinIllustrationSrc(card) {
    const padded = String(ensureIllustrationId(card)).padStart(3, "0");
    return `./illustrations/illustration${padded}.webp`;
  }

  // ---------------------------------------------------------------------------
  // Icône de trigger (bas-droite) — un glyphe + une couleur par catégorie de
  // déclenchement, pour différencier visuellement onPlacement / startOfTurn /
  // les 3 combos / onActivation d'un coup d'œil, sans dépendre d'assets externes
  // (CSS/texte uniquement, comme convenu tant qu'aucune icône dessinée n'existe).
  // ---------------------------------------------------------------------------
  const TRIGGER_BADGE = {
    [TRIGGERS.ON_PLACEMENT]:   { glyph: "✦", cls: "tb-placement", labelKey: "triggerOnPlacement" },
    [TRIGGERS.START_OF_TURN]:  { glyph: "⟳", cls: "tb-startofturn", labelKey: "triggerStartOfTurn" },
    [TRIGGERS.ON_COMBO_ATK]:   { glyph: "⚔", cls: "tb-combo-atk", labelKey: "triggerOnComboAtk" },
    [TRIGGERS.ON_COMBO_SHIELD]:{ glyph: "🛡", cls: "tb-combo-shield", labelKey: "triggerOnComboShield" },
    [TRIGGERS.ON_COMBO_REVIVE]:{ glyph: "✚", cls: "tb-combo-revive", labelKey: "triggerOnComboRevive" },
    [TRIGGERS.ON_ACTIVATION]:  { glyph: "🔓", cls: "tb-activation", labelKey: "triggerOnActivation" },
    [TRIGGERS.ON_DISABLE]:     { glyph: "⛔", cls: "tb-disable", labelKey: "triggerOnDisable" },
  };
  function triggerBadgeInfo(trigger) { return TRIGGER_BADGE[trigger] || null; }
  // Rendu générique (indépendant skin/plain) : un petit badge rond, glyphe centré.
  // Vide pour trigger NONE (une carte sans ability n'affiche aucune icône).
  function triggerBadgeHtml(trigger, extraClass) {
    const info = triggerBadgeInfo(trigger);
    if (!info) return "";
    return `<div class="trigger-badge ${info.cls}${extraClass ? " " + extraClass : ""}" title="${t(info.labelKey)}">${info.glyph}</div>`;
  }

  // ---------------------------------------------------------------------------
  // Indicateur de rareté — discret, en CSS uniquement pour l'instant (pas
  // d'asset dessiné) : une classe sur la racine de la carte pilote à la fois
  // une légère teinte de cadre et un petit repère en coin (cf. règles CSS).
  // ---------------------------------------------------------------------------
  function rarityClass(rarity) {
    switch (rarity) {
      case RARITIES.UNCOMMON: return "rarity-uncommon";
      case RARITIES.RARE: return "rarity-rare";
      case RARITIES.UNIQUE: return "rarity-unique";
      case "crafted": return "rarity-crafted"; // prévu, pas encore utilisé
      default: return "rarity-common";
    }
  }
  function rarityLabelKey(rarity) {
    switch (rarity) {
      case RARITIES.UNCOMMON: return "rarityUncommon";
      case RARITIES.RARE: return "rarityRare";
      case RARITIES.UNIQUE: return "rarityUnique";
      default: return "rarityCommon";
    }
  }
  function templateOf(instance) { return CARDS_BY_ID[instance.templateId] || null; }

  // ---------------------------------------------------------------------------
  // Panneau d'inspection — contenu : nom (+ rareté si > commune) puis UNE phrase
  // en trois morceaux : déclencheur / effet / cible. Tout passe par t().
  // Reconstruit à chaque ouverture à partir de l'instance courante (le DOM est
  // régénéré à chaque render(), jamais de référence mise en cache).
  // ---------------------------------------------------------------------------
  function capitalize1(s) { return s ? s[0].toUpperCase() + s.slice(1) : s; }
  const SENT_TRIGGER_KEY = {
    [TRIGGERS.ON_PLACEMENT]: "sentTriggerOnPlacement", [TRIGGERS.START_OF_TURN]: "sentTriggerStartOfTurn",
    [TRIGGERS.ON_COMBO_ATK]: "sentTriggerOnComboAtk", [TRIGGERS.ON_COMBO_SHIELD]: "sentTriggerOnComboShield",
    [TRIGGERS.ON_COMBO_REVIVE]: "sentTriggerOnComboRevive", [TRIGGERS.ON_ACTIVATION]: "sentTriggerOnActivation",
    [TRIGGERS.ON_DISABLE]: "sentTriggerOnDisable",
  };
  function symbolWord(sym) { return t("symbol" + capitalize1(sym)).toLowerCase(); }
  /** { verb, prep, tail, noTarget } pour un effet, ou null si pas d'effet. */
  function sentenceEffect(eff, target) {
    if (!eff) return null;
    switch (eff.type) {
      case EFFECT_TYPES.DAMAGE: return t("sentEffectDamage", eff.magnitude);
      case EFFECT_TYPES.HEAL: return t("sentEffectHeal", eff.magnitude);
      case EFFECT_TYPES.ROTATE_90: return t("sentEffectRotate90");
      case EFFECT_TYPES.ROTATE_180: return t("sentEffectRotate180");
      case EFFECT_TYPES.REMOVE_LINK: return t("sentEffectRemoveLink", eff.magnitude);
      case EFFECT_TYPES.TRIGGER_ABILITY: return t("sentEffectTriggerAbility");
      case EFFECT_TYPES.DESTROY_LOCKED: return t("sentEffectDestroyLocked");
      case EFFECT_TYPES.DESTROY_SLOT: return t("sentEffectDestroySlot");
      case EFFECT_TYPES.DISABLE: return t("sentEffectDisable");
      case EFFECT_TYPES.ADD_LINK: return t("sentEffectAddLink", eff.magnitude);
      case EFFECT_TYPES.ACTIVATE: return t("sentEffectActivate", eff.magnitude);
      case EFFECT_TYPES.SYMBOL_BONUS: return t("sentEffectSymbolBonus", eff.magnitude, symbolWord(eff.symbol));
      case EFFECT_TYPES.DISCARD: return t(target && target.scope === TARGET_SCOPES.SELF_PLAYER ? "sentEffectDiscardSelf" : "sentEffectDiscard");
      case EFFECT_TYPES.SWAP_CARD: case EFFECT_TYPES.SWAP_ALLY: return t("sentEffectSwapCard");   // « échange sa place avec » + « carte alliée / ennemie » selon la cible
      case EFFECT_TYPES.CONVERT_SYMBOLS: return t("sentEffectConvertSymbols", symbolWord(eff.symbol));
      case EFFECT_TYPES.RETURN_TO_DECK: return t("sentEffectReturnToDeck");
      case EFFECT_TYPES.HAND_TO_DECK: return t("sentEffectHandToDeck", eff.magnitude);
      case EFFECT_TYPES.DESTROY_CELL: return t("sentEffectDestroyCell");
      case EFFECT_TYPES.DESTROY_CARD: return t("sentEffectDestroyCard", eff.magnitude);
      default: return null;
    }
  }
  const SENT_SCOPE_KEY = {
    [TARGET_SCOPES.SELF_PLAYER]: "sentScopeSelfPlayer", [TARGET_SCOPES.OPPONENT_PLAYER]: "sentScopeOpponentPlayer",
    [TARGET_SCOPES.SELF_CARD]: "sentScopeSelfCard", [TARGET_SCOPES.OWN_CARD]: "sentScopeOwnCard",
    [TARGET_SCOPES.ENEMY_CARD]: "sentScopeEnemyCard", [TARGET_SCOPES.ENEMY_CELL]: "sentScopeEnemyCell",
  };
  const PLAYER_SCOPES = new Set([TARGET_SCOPES.SELF_PLAYER, TARGET_SCOPES.OPPONENT_PLAYER, TARGET_SCOPES.SELF_CARD]);
  function sentenceTarget(target) {
    if (!target) return "";
    const noun = t(SENT_SCOPE_KEY[target.scope] || "sentScopeSelfCard");
    if (PLAYER_SCOPES.has(target.scope)) return noun; // pas de "target"/"random" pour un joueur ou la carte elle-même
    if (target.mode === TARGET_MODES.CHOSEN) return `${t("sentModeChosen")} ${noun}`;
    if (target.mode === TARGET_MODES.RANDOM) return `${t("sentModeRandom")} ${noun}`;
    return noun;
  }
  function esc(s) { return String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
  function cardDetailHtml(instance, mine) {
    const tpl = templateOf(instance) || {};
    const trigKey = SENT_TRIGGER_KEY[instance.trigger];
    const fx = trigKey ? sentenceEffect(instance.effect, instance.target) : null;
    const showRarity = tpl.rarity && tpl.rarity !== "common";
    let body;
    if (!trigKey || !fx) {
      body = `<span class="cd-none">${t("sentNoAbility")}</span>`;
    } else {
      const target = fx.noTarget ? "" : sentenceTarget(instance.target);
      const targetPart = target ? `${fx.prep ? fx.prep + " " : ""}${target}${fx.tail || ""}.` : (fx.noTarget ? "" : (fx.tail ? fx.tail.trim() + "." : "")) ;
      const effectPart = fx.noTarget ? `${fx.verb}.` : fx.verb;
      body = `<span class="cd-trigger">${esc(t(trigKey))}</span> `
           + `<span class="cd-effect">${esc(effectPart)}</span>`
           + (targetPart ? ` <span class="cd-target">${esc(targetPart)}</span>` : "");
    }
    const meta = (instance.charges != null ? `<div class="cd-meta">${t("sentChargesLeft", instance.charges)}</div>` : "")
;
    return `
      <div class="cd-head">
        <span class="cd-name">${esc(cardName(instance.templateId))}</span>
        ${showRarity ? `<span class="cd-rarity ${rarityClass(tpl.rarity)}">${t(rarityLabelKey(tpl.rarity))}</span>` : ""}
      </div>
      <p class="cd-sentence">${body}</p>${meta}
    `;
  }

  // --- Positionnement : autour de la tuile ET de ses flèches, jamais dessus ---
  const DETAIL_GAP = 8, DETAIL_MARGIN = 6;
  const detail = { anchor: null, getInstance: null, mine: true, open: false, dragging: false };
  const detailPanel = () => document.getElementById("cardDetailPanel");

  /** Rectangle englobant l'élément ET tous ses descendants (les flèches de lien débordent de la tuile). */
  function detailUnionRect(el) {
    const r = el.getBoundingClientRect();
    let l = r.left, tp = r.top, rt = r.right, bt = r.bottom;
    el.querySelectorAll("*").forEach((n) => {
      const q = n.getBoundingClientRect();
      if (!q.width && !q.height) return;
      if (q.left < l) l = q.left; if (q.top < tp) tp = q.top;
      if (q.right > rt) rt = q.right; if (q.bottom > bt) bt = q.bottom;
    });
    return { l, t: tp, r: rt, b: bt, cx: (r.left + r.right) / 2, cy: (r.top + r.bottom) / 2 };
  }
  function placeDetail() {
    const panel = detailPanel();
    if (!detail.anchor || !detail.anchor.isConnected) return false;
    const u = detailUnionRect(detail.anchor);
    const vw = document.documentElement.clientWidth, vh = document.documentElement.clientHeight;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    const space = {
      above: u.t - DETAIL_MARGIN - DETAIL_GAP, below: vh - u.b - DETAIL_MARGIN - DETAIL_GAP,
      left: u.l - DETAIL_MARGIN - DETAIL_GAP, right: vw - u.r - DETAIL_MARGIN - DETAIL_GAP,
    };
    const need = { above: h, below: h, left: w, right: w };
    const order = u.cy > vh / 2 ? ["above", "below", "right", "left"] : ["below", "above", "right", "left"];
    let side = order.find((k) => space[k] >= need[k]);
    if (!side) side = order.slice().sort((a, b) => (space[b] - need[b]) - (space[a] - need[a]))[0]; // faute de mieux : le moins mauvais
    const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
    let x, y;
    if (side === "above" || side === "below") {
      x = clamp(u.cx - w / 2, DETAIL_MARGIN, vw - w - DETAIL_MARGIN);
      y = side === "above" ? u.t - DETAIL_GAP - h : u.b + DETAIL_GAP;
    } else {
      y = clamp(u.cy - h / 2, DETAIL_MARGIN, vh - h - DETAIL_MARGIN);
      x = side === "left" ? u.l - DETAIL_GAP - w : u.r + DETAIL_GAP;
    }
    x = clamp(x, DETAIL_MARGIN, Math.max(DETAIL_MARGIN, vw - w - DETAIL_MARGIN));
    y = clamp(y, DETAIL_MARGIN, Math.max(DETAIL_MARGIN, vh - h - DETAIL_MARGIN));
    panel.style.left = x + "px";
    panel.style.top = y + "px";
    panel.style.transformOrigin = (u.cx - x) + "px " + (u.cy - y) + "px"; // le dépliement part du centre de la tuile
    return true;
  }
  function showDetail(anchor, getInstance, mine, animate) {
    const instance = getInstance();
    if (!instance) { hideDetail(); return; }
    const panel = detailPanel();
    detail.anchor = anchor; detail.getInstance = getInstance; detail.mine = mine;
    panel.innerHTML = cardDetailHtml(instance, mine);
    if (!placeDetail()) { hideDetail(); return; }
    if (animate !== false || !detail.open) {
      // (ré)ouverture : repartir de scale(0) même si le panneau était déjà ouvert (changement de tuile)
      panel.style.transition = "none";
      panel.classList.remove("open");
      void panel.offsetWidth;
      panel.style.transition = "";
    }
    panel.classList.add("open");
    detail.open = true;
    tutOnDetail();
  }
  function hideDetail() {
    detail.open = false; detail.anchor = null; detail.dragging = false;
    detailPanel().classList.remove("open");
  }
  /** Appelé en fin de render() : le DOM vient d'être régénéré, l'ancre survolée n'existe plus. */
  function refreshDetailAfterRender() {
    if (detail.open && !detail.dragging && detail.anchor && !detail.anchor.isConnected) hideDetail();
  }

  /**
   * Attache l'inspection à un élément de carte rendu : survol souris/stylet
   * (pointerenter/leave) et TOUCHER immédiat (pointerdown, sans appui long).
   * `getInstance` est relu à chaque ouverture. Ne fait jamais
   * preventDefault/stopPropagation : n'interfère ni avec le clic de ciblage
   * ni avec le glisser-déposer. La fermeture tactile, le suivi pendant le
   * drag et le nettoyage sont gérés plus bas par des écouteurs document.
   */
  function attachCardDetailHandlers(el, getInstance, mine) {
    el.addEventListener("pointerenter", (e) => {
      if (e.pointerType === "touch" || (dragState.active && dragState.moved)) return;
      showDetail(el, getInstance, mine);
    });
    el.addEventListener("pointerleave", (e) => {
      if (e.pointerType === "touch" || (dragState.active && dragState.moved)) return;
      if (detail.anchor === el) hideDetail();
    });
    el.addEventListener("pointerdown", (e) => {
      if (e.pointerType === "mouse") return; // déjà ouvert par pointerenter
      showDetail(el, getInstance, mine);
    });
  }
  // Pendant un glisser-déposer, la carte d'origine disparaît (render) : le panneau
  // suit alors le fantôme sous le doigt/curseur, sans se rouvrir en animation.
  document.addEventListener("pointermove", (e) => {
    if (dragState.active && dragState.moved && dragState.ghost) {
      if (!captionsOn() && detail.anchor !== dragState.ghost) {
        const idx = dragState.handIdx;
        showDetail(dragState.ghost, () => state.players.player.hand[idx], true, false);
      }
      if (detail.open) { detail.dragging = true; placeDetail(); }
    } else if (detail.open && detail.anchor && !detail.anchor.isConnected) {
      hideDetail();
    }
  });
  const endDetailTouch = (e) => {
    if (detail.anchor && detail.anchor.closest && detail.anchor.closest("#logList")) return; // log : panneau persistant
    if (detail.dragging || e.pointerType !== "mouse") hideDetail();
    else setTimeout(refreshDetailAfterRender, 0);
  };
  document.addEventListener("pointerup", endDetailTouch);
  document.addEventListener("pointercancel", endDetailTouch);

  // Une icône par symbole porté par la carte — générique, dépend uniquement
  // des compteurs symbols.*, jamais d'un id de carte. Avec les 20 cartes de
  // base, aucune n'a plus de 2 symboles au total (tient dans le slot du
  // prototype, prévu pour 2 icônes).
  function skinTypeIconsHtml(symbols) {
    let html = "";
    for (const key of ["atk", "shield", "revive", "neutral"]) {
      const count = symbols[key] || 0;
      for (let i = 0; i < count; i++) html += `<img src="${SKIN_TYPE_ICON_SRC[key]}" alt="">`;
    }
    return html;
  }

  const SKIN_FACET_DIRS = new Set(["N", "E", "S", "W"]);
  function skinArrowsHtml(dirs, linkedDirs) {
    const linked = linkedDirs || new Set();
    return dirs.map((d) => {
      const isLinked = linked.has(d);
      const kind = SKIN_FACET_DIRS.has(d) ? "facet" : "diag";
      // Image opaque dans les deux cas — c'est l'illustration (néons allumés
      // vs éteints) qui porte l'état, plus une atténuation CSS artificielle.
      const src = isLinked ? SKIN_ARROW_SRC : SKIN_ARROW_OFF_SRC;
      return `<div class="skin-anchor ${kind} skin-a-${d.toLowerCase()}${isLinked ? " linked" : ""}"><img src="${src}" alt=""></div>`;
    }).join("");
  }

  /**
   * Rendu générique d'une carte (case de grille OU carte en main) : bascule
   * entre l'affichage CSS existant et le skin graphique selon `skinEnabled`.
   * Les deux partagent la même information (dirs/symbols/disabled/
   * linkedDirs) — seul le DOM/CSS produit change, jamais la logique de jeu.
   * Ajoute désormais l'icône de trigger (bas droite, les deux modes). La
   * classe de rareté est exposée séparément via cardRootClasses() : en mode
   * plain, l'appelant possède déjà le conteneur racine (.tile/.hand-card) et
   * doit y ajouter la classe lui-même (pas de wrapper ici, pour ne pas casser
   * le positionnement absolu existant des flèches/symboles).
   */
  function cardRootClasses(instance) {
    const tpl = templateOf(instance);
    if (tpl && tpl.crafted) return "rarity-crafted";   // carte craftée : halo rouge à la place de la couleur de sa rareté d'origine
    return rarityClass(tpl ? tpl.rarity : RARITIES.COMMON);
  }
  function renderCardVisual(instance, { disabled = false, linkedDirs } = {}) {
    if (!skinEnabled) {
      const linked = linkedDirs || new Set();
      const arrowsHtml = DIRS.map((d) => instance.dirs.includes(d)
        ? `<span class="arrow arrow-${d} ${linked.has(d) ? "linked" : ""}"></span>`
        : "").join("");
      return `${arrowsHtml}<div class="symbols">${symbolsHtmlFor(instance.symbols)}</div>${abilityBadgesPlainHtml(instance)}`;
    }
    return `
      <div class="skin-card ${cardRootClasses(instance)}${disabled ? " disabled" : ""}">
        <img class="skin-illus" src="${skinIllustrationSrc(instance)}" alt="">
        <img class="skin-frame" src="${SKIN_FRAME_SRC}" alt="">
        <div class="skin-types">${skinTypeIconsHtml(instance.symbols)}</div>
        <div class="skin-ability">${abilityIconsHtml(instance)}</div>
        ${skinArrowsHtml(instance.dirs, linkedDirs)}
      </div>
    `;
  }

  function renderGrid(containerId, owner) {
    const container = document.getElementById(containerId);
    container.innerHTML = "";
    const grid = state.players[owner].grid;
    const highlightPlaceable = (owner === "player" && state.active === "player" && !pendingTarget && state.ui.selectedHandIndex !== null);

    for (let i = 0; i < 9; i++) {
      const cell = document.createElement("div");
      cell.className = "cell";
      cell.dataset.owner = owner;
      cell.dataset.index = String(i);
      if (highlightPlaceable && grid[i] === null) cell.classList.add("placeable");
      if (pendingTarget) {
        const isLegalCard = pendingTarget.legal.some((t) => (t.kind === "card" || t.kind === "cell") && t.owner === owner && t.cellIndex === i);
        if (isLegalCard) cell.classList.add(owner === "player" ? "targetable-revive" : "targetable-card");
      }

      if (grid[i] && grid[i].ruin) {
        cell.classList.add("ruin-cell");
        cell.title = t("ruinTitle");
      } else if (grid[i]) {
        const linkedDirs = getActiveLinkDirs(grid, i);
        if (skinEnabled) {
          // Skin ON : .skin-card remplace ENTIÈREMENT le conteneur .tile —
          // pas de wrapper CSS intermédiaire, le cadre image joue ce rôle.
          // La classe de rareté est déjà posée par renderCardVisual sur .skin-card.
          cell.innerHTML = renderCardVisual(grid[i], { disabled: grid[i].disabled, linkedDirs });
        } else {
          const tile = document.createElement("div");
          tile.className = "tile" + (grid[i].disabled ? " disabled" : "") + (linkedDirs.size > 0 ? " tile-linked" : "") + " " + cardRootClasses(grid[i]);
          tile.innerHTML = renderCardVisual(grid[i], { linkedDirs });
          cell.appendChild(tile);
        }
        attachCardDetailHandlers(cell, () => state.players[owner].grid[i], owner === "player");
      }
      cell.addEventListener("click", () => onCellClick(owner, i));
      container.appendChild(cell);
    }
  }

  // Écran « assez grand » (pas un téléphone) : texte d'ability sous les cartes de la main, pas de panneau d'inspection sur la main.
  const BIG_SCREEN_MQ = "(min-width: 700px) and (min-height: 600px)";
  const bigScreen = () => (typeof window.matchMedia === "function" ? window.matchMedia(BIG_SCREEN_MQ).matches : false);
  // Source unique de vérité : la classe body.hand-captions pilote À LA FOIS l'affichage du texte (CSS) et la désactivation de
  // l'inspection de la main (JS). Texte non affiché => inspection active, toujours.
  const captionsOn = () => document.body.classList.contains("hand-captions");
  function applyCaptionMode() { document.body.classList.toggle("hand-captions", bigScreen()); }
  applyCaptionMode();
  // Phrase descriptive (celle du panneau d'inspection) d'une carte : trigger / effet / cible.
  function cardSentenceText(card) {
    const box = document.createElement("div");
    box.innerHTML = cardDetailHtml(card, false);
    const sentence = box.querySelector(".cd-sentence");
    return sentence ? sentence.textContent.trim() : "";
  }
  let lastHandCards = null, lastHandState = null, suppressDrawAnim = false;

  function renderHand() {
    const container = document.getElementById("playerHand");
    container.innerHTML = "";
    applyCaptionMode();
    const big = captionsOn();
    state.players.player.hand.forEach((card, i) => {
      const div = document.createElement("div");
      div.className = "hand-card" + (state.ui.selectedHandIndex === i ? " selected" : "") + (skinEnabled ? " skinned" : "") + (skinEnabled ? "" : " " + cardRootClasses(card));
      div.innerHTML = renderCardVisual(card, {}) + (card.lockOnPlacement ? `<span class="lock-badge" title="${t("lockBadgeTitle")}">🔒</span>` : "");
      div.addEventListener("click", () => selectHandCard(i));
      div.addEventListener("pointerdown", (e) => onHandCardPointerDown(e, i, div));
      if (big) div.insertAdjacentHTML("beforeend", `<div class="hand-desc">${esc(cardSentenceText(card))}</div>`);
      else attachCardDetailHandlers(div, () => state.players.player.hand[i], true);
      container.appendChild(div);
    });
    sizeHandCards();
    // Pioche : les cartes NOUVELLES de la main (objets absents du rendu précédent) arrivent en zoom-in depuis la zone de pioche.
    const hand = state.players.player.hand;
    const prev = lastHandState === state ? lastHandCards : null;
    const animate = !suppressDrawAnim;
    suppressDrawAnim = false;
    lastHandCards = hand.slice();
    lastHandState = state;
    if (animate) animateDraws(hand.map((c, i) => (!prev || prev.indexOf(c) < 0 ? i : -1)).filter((i) => i >= 0));
  }

  function rectCenter(el) { const r = el.getBoundingClientRect(); return { x: r.left + r.width / 2, y: r.top + r.height / 2 }; }
  function animateDraws(indices) {
    const container = document.getElementById("playerHand");
    const deck = document.getElementById("deckZone");
    if (!indices.length || !deck) return;
    const from = rectCenter(deck);
    indices.forEach((idx, k) => {
      const el = container.children[idx];
      if (!el || !el.animate) return;
      const c = rectCenter(el);
      el.animate([
        { transform: `translate(${from.x - c.x}px, ${from.y - c.y}px) scale(0.2) rotate(-14deg)`, opacity: 0 },
        { transform: "translate(0,0) scale(1) rotate(0deg)", opacity: 1 },
      ], { duration: 460, delay: k * 120, easing: "cubic-bezier(.2,.9,.25,1.08)", fill: "backwards" });
    });
  }

  /**
   * Calcule et pose en style inline une taille EXACTE (carrée) pour chaque
   * carte de la main, en JS plutôt qu'en CSS pur : l'interaction flexbox +
   * aspect-ratio pour "N cartes qui se partagent l'espace dispo en restant
   * carrées, quel que soit le sens (colonne en portrait, ligne en paysage)"
   * s'est révélée peu fiable suivant les navigateurs. Ici on lit juste le
   * SENS actuellement appliqué par le CSS (`flex-direction`, via
   * getComputedStyle) — le JS n'a donc pas à connaître le mode d'affichage
   * actif, seulement à réagir à ce que le CSS a déjà décidé.
   */
  // Meilleure répartition de n cartes (carré de côté s, légende de hauteur capH dessous) dans availW x availH :
  // pour chaque nombre de colonnes c, hauteur nécessaire = 1.4 r s + r capH + 6 (r-1)  (r rangées ; 0.2 s de flèche au-dessus, 0.2 s en dessous).
  function fitHandGrid(availW, availH, n, capH, maxCap, K) {
    const gapX = 16;
    let best = { size: 0, cols: 1 };
    for (let c = 1; c <= n; c++) {
      const r = Math.ceil(n / c);
      const sW = (availW - gapX * (c - 1)) / c;
      const sH = (availH - r * capH - 6 * (r - 1)) / ((1 + 2 * K) * r);
      const s = Math.min(sW, sH, maxCap);
      if (s > best.size + 0.5) best = { size: s, cols: c };
    }
    const size = Math.max(24, Math.floor(best.size));
    return { size, cols: best.cols, gapX, rowGap: Math.round(2 * K * size + capH + 6) };
  }

  function sizeHandCards() {
    const wrap = document.getElementById("playerHand");
    const cards = wrap.children;
    if (!cards.length) return;
    // Remise à zéro AVANT toute mesure : sinon le padding/gap posés au rendu précédent
    // sont relus comme "base" et la main rétrécit à chaque appel (idempotence).
    wrap.style.gap = ""; wrap.style.columnGap = ""; wrap.style.rowGap = "";
    wrap.style.paddingTop = ""; wrap.style.paddingBottom = "";
    const cs = getComputedStyle(wrap);
    const isRow = cs.flexDirection === "row" || cs.flexDirection === "row-reverse";
    const gap = parseFloat(cs.columnGap || cs.rowGap || cs.gap) || 0;
    const padX = parseFloat(cs.paddingLeft || 0) + parseFloat(cs.paddingRight || 0);
    const padTop = parseFloat(cs.paddingTop || 0), padBottom = parseFloat(cs.paddingBottom || 0);
    const padY = padTop + padBottom;
    const rect = wrap.getBoundingClientRect();
    const availW = Math.max(0, rect.width - padX);
    const availH = Math.max(0, rect.height - padY);
    const n = cards.length;
    // --hand-card-max est défini sur :root (portrait) ou sur .hand-wrap (paysage) ;
    // dans les deux cas il est hérité par #playerHand comme n'importe quelle
    // variable CSS, pas besoin d'aller le chercher ailleurs.
    const maxCap = parseFloat(cs.getPropertyValue("--hand-card-max")) || 999;

    const capH = parseFloat(cs.getPropertyValue("--hand-cap-h")) || 0;   // hauteur du texte sous chaque carte (écran assez grand)
    // Les flèches de liens dépassent d'environ K x la taille de la carte ; la légende commence SOUS la flèche du bas (cf. .hand-desc).
    const K = 0.2;
    let size;
    if (capH) {
      // Avec légendes : on teste 1..n colonnes et on garde celle qui donne les PLUS GRANDES cartes (1 rangée en paysage, 2 colonnes en portrait, ...).
      const fit = fitHandGrid(availW, availH, n, capH, maxCap, K);
      size = fit.size;
      wrap.style.columnGap = fit.gapX + "px";
      wrap.style.rowGap = fit.rowGap + "px";
      wrap.style.paddingTop = Math.round(padTop + K * size) + "px";               // la flèche du haut de la 1re rangée dépasse
      wrap.style.paddingBottom = Math.round(padBottom + K * size + capH) + "px";  // flèche du bas + légende de la dernière rangée
    } else if (isRow) {
      size = Math.min((availW - gap * (n - 1)) / n, availH, maxCap);
    } else {
      size = Math.min((availH - gap * (n - 1)) / n, availW, maxCap);
    }
    size = Math.max(24, Math.floor(size)); // jamais en dessous d'une taille utilisable

    for (const card of cards) {
      card.style.width = size + "px";
      card.style.height = size + "px";
    }
  }

  function renderHp() {
    const pFill = document.getElementById("playerHpFill");
    const aFill = document.getElementById("aiHpFill");
    // On pose un simple ratio 0..1 en variable CSS ; c'est le CSS (via les
    // media queries) qui décide si le remplissage se lit en largeur (mode
    // paysage, barre horizontale) ou en hauteur (mode portrait, barre
    // verticale) — le JS n'a pas à connaître le mode d'affichage actif.
    pFill.style.setProperty("--hp-ratio", Math.max(0, Math.min(1, state.players.player.hp / HP_CAP)));
    aFill.style.setProperty("--hp-ratio", Math.max(0, Math.min(1, state.players.ai.hp / HP_CAP)));
    ["player", "ai"].forEach((who) => { const hp = state.players[who].hp, row = document.getElementById(who === "ai" ? "aiHpRow" : "playerHpRow"); if (hp > 0 && hp <= 3) row.dataset.low = hp; else delete row.dataset.low; });   // pulsation PV bas (3 : discrète, 2 : plus forte, 1 : maximale)
    document.getElementById("playerHpVal").textContent = state.players.player.hp;
    document.getElementById("aiHpVal").textContent = state.players.ai.hp;

    const aiRow = document.getElementById("aiHpRow");
    const canFaceTarget = pendingTarget && pendingTarget.legal.some((t) => t.kind === "player" && t.playerId === "ai");
    aiRow.classList.toggle("targetable", !!canFaceTarget);
  }

  /* ---- Zones pioche / défausse / main adverse + cartes qui partent vers la défausse ---- */
  let lastPileCounts = {};
  function setPile(id, n) {
    const el = document.getElementById(id);
    if (!el) return;
    el.textContent = n;
    if (lastPileCounts[id] !== undefined && lastPileCounts[id] !== n) { el.classList.remove("bump"); void el.offsetWidth; el.classList.add("bump"); }
    lastPileCounts[id] = n;
  }
  // Épaisseur de la pile dessinée : 1 couche par `per` cartes (max 6) ; vide = contour pointillé.
  function drawPileArt(zone, n, per) {
    const art = zone.querySelector(".pile-art");
    if (!art) return;
    const layers = n <= 0 ? 0 : Math.min(6, Math.ceil(n / per));
    const html = Array.from({ length: layers }, (_, k) => `<i style="--k:${k}"></i>`).join("");
    if (art.innerHTML !== html) art.innerHTML = html;
    art.classList.toggle("empty", layers === 0);
  }
  // Toutes les zones (pioche / défausse / main) de CHAQUE joueur, repérées par data-owner / data-pile.
  function renderPiles() {
    const labels = { deck: t("pileDeck"), discard: t("pileDiscard"), hand: t("pileHand") };
    document.querySelectorAll(".pile[data-pile]").forEach((zone) => {
      const p = state.players[zone.dataset.owner], kind = zone.dataset.pile;
      const n = kind === "deck" ? p.deck.length : kind === "discard" ? p.graveyard.length : p.hand.length;
      setPile(zone.querySelector(".pile-n").id, n);
      drawPileArt(zone, n, kind === "deck" ? 5 : kind === "discard" ? 4 : 1);
      zone.querySelector(".pile-label").textContent = labels[kind];
    });
  }

  // Instantané du rendu précédent : cartes en jeu / en main + position à l'écran + HTML, pour pouvoir les « rejouer » en fantôme.
  let renderTrack = { state: null, cells: { player: [], ai: [] }, hand: [], gy: { player: 0, ai: 0 } };
  function snapshotRender() {
    const cells = { player: [], ai: [] };
    for (const owner of ["player", "ai"]) {
      for (let i = 0; i < 9; i++) {
        const card = state.players[owner].grid[i];
        const el = document.querySelector(`#${owner}Grid .cell[data-index="${i}"]`);
        cells[owner][i] = card && !card.ruin && el ? { card, rect: el.getBoundingClientRect(), html: el.innerHTML, cls: el.className } : null;
      }
    }
    const hand = Array.from(document.getElementById("playerHand").children).map((el, i) => ({
      card: state.players.player.hand[i], rect: el.getBoundingClientRect(), html: el.innerHTML, cls: el.className.replace(/\bselected\b/, "").trim(),
    }));
    renderTrack = { state, cells, hand, gy: { player: state.players.player.graveyard.length, ai: state.players.ai.graveyard.length } };
  }
  // Cartes disparues depuis le rendu précédent ET réellement détruites / défaussées (cimetière en hausse, carte introuvable ailleurs).
  function collectDepartures() {
    if (renderTrack.state !== state) return [];
    const present = new Set();
    for (const o of ["player", "ai"]) { const p = state.players[o]; p.grid.forEach((c) => c && present.add(c)); p.hand.forEach((c) => present.add(c)); p.deck.forEach((c) => present.add(c)); }
    const gone = { player: [], ai: [] };
    for (const owner of ["player", "ai"]) {
      renderTrack.cells[owner].forEach((old, i) => { if (old && !present.has(old.card)) gone[owner].push({ owner, ...old }); });
    }
    renderTrack.hand.forEach((old) => { if (old.card && !present.has(old.card)) gone.player.push({ owner: "player", hand: true, ...old }); });
    const out = [];
    for (const owner of ["player", "ai"]) {
      const quota = Math.max(0, state.players[owner].graveyard.length - renderTrack.gy[owner]);   // une carte qui retourne en pioche n'entre pas au cimetière
      out.push(...gone[owner].slice(0, quota));
    }
    return out;
  }
  function launchGhosts(list) {
    if (!list.length) return;
    list.forEach((g, k) => {
      // chaque joueur a sa propre défausse : la carte part vers la zone de SON propriétaire
      const dest = document.getElementById(g.owner === "player" ? "discardZone" : "rivalDiscardZone");
      const to = dest ? rectCenter(dest) : null;
      const el = document.createElement("div");
      el.className = g.cls + " card-ghost";
      el.innerHTML = g.html;
      el.style.left = g.rect.left + "px"; el.style.top = g.rect.top + "px";
      el.style.width = g.rect.width + "px"; el.style.height = g.rect.height + "px";
      document.body.appendChild(el);
      const done = () => el.remove();
      if (!el.animate) { setTimeout(done, 560); return; }
      const c = { x: g.rect.left + g.rect.width / 2, y: g.rect.top + g.rect.height / 2 };
      // Carte du joueur : file vers la zone de défausse (inverse de la pioche). Carte adverse : se résorbe sur place.
      const end = to
        ? { transform: `translate(${to.x - c.x}px, ${to.y - c.y}px) scale(0.18) rotate(12deg)`, opacity: 0.1 }
        : { transform: "translate(0,-18px) scale(0.55)", opacity: 0 };
      const anim = el.animate([{ transform: "translate(0,0) scale(1) rotate(0deg)", opacity: 1 }, end],
        { duration: 540, delay: k * 90, easing: "cubic-bezier(.55,0,.85,.35)", fill: "both" });
      anim.onfinish = done;
      setTimeout(done, 1400 + k * 90);   // filet de sécurité
    });
  }

  function render() {
    const departures = collectDepartures();
    renderGrid("aiGrid", "ai");
    renderGrid("playerGrid", "player");
    renderHand();
    renderHp();
    renderPiles();
    document.getElementById("forfeitBtn").disabled = !!state.winner;
    snapshotRender();
    launchGhosts(departures);
    document.getElementById("statusLine").classList.toggle("target-prompt", !!pendingTarget);
    refreshDetailAfterRender();
    tutAfterRender();
  }

  /* ======================= MODE DEBUG CACHÉ =======================
     ON  : double-clic sur le logo (arme 10 s) puis double-clic sur le bouton invisible en bas à gauche.
     OFF : simple clic sur le logo.
     ON  => micro-boutons à droite du logo + appui long sur une carte (en jeu ou en main) = mini menu debug. */
  let debugMode = false;
  const dbg = { armedUntil: 0, menuTarget: null, swapTarget: null };
  const dbgEl = (id) => document.getElementById(id);

  // Double clic / double tap fiable (souris ET tactile) : ne dépend pas de l'évènement dblclick (peu fiable sur iPad).
  function onDouble(el, fn, maxDelay = 400) {
    let last = 0, lx = 0, ly = 0;
    el.addEventListener("pointerup", (e) => {
      if (e.pointerType === "mouse" && e.button !== 0) return;
      if (last && e.timeStamp - last < maxDelay && Math.hypot(e.clientX - lx, e.clientY - ly) < 30) { last = 0; fn(e); }
      else { last = e.timeStamp; lx = e.clientX; ly = e.clientY; }
    });
  }

  const DBG_ARM_MS = 10000;
  function dbgSetArmed(on) {
    dbg.armedUntil = on ? Date.now() + DBG_ARM_MS : 0;
    dbgEl("dbgSecret").classList.toggle("armed", on);
    if (on) setTimeout(() => { if (Date.now() >= dbg.armedUntil) dbgEl("dbgSecret").classList.remove("armed"); }, DBG_ARM_MS + 50);
  }
  function dbgSetMode(on) {
    debugMode = on;
    document.body.classList.toggle("dbg-on", on);
    dbgEl("dbgBar").hidden = !on;
    dbgSetArmed(false); dbgCloseMenu(); dbgCloseSwap(); dbgCloseEditor(); dkClose(); dbgCancelPress();
  }
  dbgEl("brandHit").addEventListener("click", () => { if (debugMode) dbgSetMode(false); });
  onDouble(dbgEl("brandHit"), () => { if (!debugMode) dbgSetArmed(true); });
  onDouble(dbgEl("dbgSecret"), () => { if (Date.now() < dbg.armedUntil) dbgSetMode(true); });
  // Partout dans le jeu : logo de l'accueil, logo de la campagne (même geste) ; l'icône 🐞 en haut à gauche signale le mode et le coupe d'un clic.
  [".home-logo-wrap", ".camp-logo-wrap"].forEach((sel) => {
    const el = document.querySelector(sel); if (!el) return;
    el.addEventListener("click", () => { if (debugMode) dbgSetMode(false); });
    onDouble(el, () => { if (!debugMode) dbgSetArmed(true); });
  });
